[package]
name = "finx-docs"
description = "Documents opened beside a conversation (docs/desktop/document-editor-design.md): the shared model, DocStore and the PDF backend on PDFium, run in a worker process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_7881", "thread_safe"] }
base64.workspace = true
finx-protocol.workspace = true
parking_lot.workspace = true
png.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
md-5.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
