packages:
  - apps/*
  - packages/*

# Electron downloads its binary in a postinstall script.
onlyBuiltDependencies:
  - electron
  - esbuild
# BetterOffice comes from our fork (github.com/Eliseowzy/betteroffice, branch finx/0.5), built and
# published as release tarballs; see docs/desktop/betteroffice-fork.md. Overrides also catch
# pptx-react's own dependency on pptx and pptx-i18n.
overrides:
  '@betteroffice/fonts-latin': https://github.com/Eliseowzy/betteroffice/releases/download/v0.5.1-finx.gaed8ad6c/betteroffice-fonts-latin-0.5.1-finx.gaed8ad6c.tgz
  '@betteroffice/fonts': https://github.com/Eliseowzy/betteroffice/releases/download/v0.5.1-finx.gaed8ad6c/betteroffice-fonts-0.5.1-finx.gaed8ad6c.tgz
  '@betteroffice/pptx': https://github.com/Eliseowzy/betteroffice/releases/download/v0.5.1-finx.gaed8ad6c/betteroffice-pptx-0.5.1-finx.gaed8ad6c.tgz
  '@betteroffice/pptx-i18n': https://github.com/Eliseowzy/betteroffice/releases/download/v0.5.1-finx.gaed8ad6c/betteroffice-pptx-i18n-0.5.1-finx.gaed8ad6c.tgz
  '@betteroffice/pptx-react': https://github.com/Eliseowzy/betteroffice/releases/download/v0.5.1-finx.gaed8ad6c/betteroffice-pptx-react-0.5.1-finx.gaed8ad6c.tgz
  '@betteroffice/docx': https://github.com/Eliseowzy/betteroffice/releases/download/v0.5.1-finx.gaed8ad6c/betteroffice-docx-0.5.1-finx.gaed8ad6c.tgz
  '@betteroffice/docx-i18n': https://github.com/Eliseowzy/betteroffice/releases/download/v0.5.1-finx.gaed8ad6c/betteroffice-docx-i18n-0.5.1-finx.gaed8ad6c.tgz
  '@betteroffice/docx-react': https://github.com/Eliseowzy/betteroffice/releases/download/v0.5.1-finx.gaed8ad6c/betteroffice-docx-react-0.5.1-finx.gaed8ad6c.tgz
