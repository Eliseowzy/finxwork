packages:
  - apps/*
  - packages/*

# Electron downloads its binary in a postinstall script.
onlyBuiltDependencies:
  - electron
  - esbuild
# BetterOffice comes from our fork (github.com/Eliseowzy/betteroffice, branch finx/0.5), built and
# published as release tarballs; see docs/desktop/betteroffice-fork.md. Overrides also catch
# pptx-react's own dependency on pptx and pptx-i18n.
overrides:
  '@betteroffice/pptx': file:/tmp/bo-finx/betteroffice-pptx-0.5.1-finx.g05cccb78.tgz
  '@betteroffice/pptx-i18n': file:/tmp/bo-finx/betteroffice-pptx-i18n-0.5.1-finx.g05cccb78.tgz
  '@betteroffice/pptx-react': file:/tmp/bo-finx/betteroffice-pptx-react-0.5.1-finx.g05cccb78.tgz
