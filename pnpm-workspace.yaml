packages:
  - apps/*
  - packages/*

# Electron downloads its binary in a postinstall script.
onlyBuiltDependencies:
  - electron
  - esbuild
# BetterOffice comes from our fork (github.com/Eliseowzy/betteroffice, branch finx/0.5), built and
# published as release tarballs; see docs/desktop/betteroffice-fork.md. Overrides also catch
# pptx-react's own dependency on pptx and pptx-i18n.
overrides:
  '@betteroffice/pptx': https://github.com/Eliseowzy/betteroffice/releases/download/v0.5.1-finx.g330266fb/betteroffice-pptx-0.5.1-finx.g330266fb.tgz
  '@betteroffice/pptx-i18n': https://github.com/Eliseowzy/betteroffice/releases/download/v0.5.1-finx.g330266fb/betteroffice-pptx-i18n-0.5.1-finx.g330266fb.tgz
  '@betteroffice/pptx-react': https://github.com/Eliseowzy/betteroffice/releases/download/v0.5.1-finx.g330266fb/betteroffice-pptx-react-0.5.1-finx.g330266fb.tgz
