.md pre{background:var(--code);border-radius:var(--r-md);padding:10px 12px;overflow-x:auto;box-shadow:inset 0 0 0 .5px var(--sep)}
.md pre code{background:none;padding:0;font-size:12.5px;line-height:1.55;white-space:pre}
/* Shiki's tokens carry both themes' colours; the app's colour scheme picks one. */
.hl span{color:light-dark(var(--shiki-light),var(--shiki-dark))}
.md a{color:var(--accent-t);text-decoration:none}
.md a:hover{text-decoration:underline}
/* What a reply points at (content-actions-design). A web page: its site's icon (or a globe, a laptop for this machine) before its words, kept on one line with their start. */
.wl-g{white-space:nowrap}
.wl-i{display:inline-flex;vertical-align:-2px;margin-right:3px;color:var(--l2)}
.wl-i .site-ic{display:inline-flex}
.wl-i .ic,.wl-i img{width:14px;height:14px}
.md a.wl code{color:inherit}
/* A file or folder: a quiet tag in the link's colour, the lines in grey; greyed when nothing is there. Inline and
   unbroken, so punctuation after it never starts a line on its own. */
.md .fref{display:inline;white-space:nowrap;padding:1px 5px;border-radius:var(--r-xs);background:var(--fill);box-shadow:inset 0 0 0 .5px var(--sep);color:var(--accent-t);font-size:14px;cursor:pointer}
.md .fref:hover{background:var(--fill2)}
.md .fref:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.md .fref .ic{display:inline-block;width:13px;height:13px;margin-right:4px;vertical-align:-2px;color:var(--l2)}
.md .fref.mono .fref-n{font-family:var(--mono);font-size:13px}
.md .fref-l{font-family:var(--mono);font-size:12px;color:var(--l2)}
.md .fref.gone{color:var(--l3);cursor:default}
.md .fref.gone .ic{color:var(--l3)}
/* A code block: a bar with its language and buttons over the code, in one box. */
.md .cblock{background:var(--code);border-radius:var(--r-md);box-shadow:inset 0 0 0 .5px var(--sep);overflow:hidden}
.md .cblock pre{margin:0;background:none;box-shadow:none;border-radius:0;padding:8px 12px 10px}
.cb-h{display:flex;align-items:center;gap:8px;height:30px;padding:0 5px 0 12px;border-bottom:.5px solid var(--sep);font-size:12px;color:var(--l2)}
.cb-lang{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px}
.cb-lang .ic,.cb-warn .ic{width:13px;height:13px}
.cb-warn{display:inline-flex;align-items:center;gap:4px;color:var(--orange)}
.cb-acts{margin-left:auto;display:flex;gap:2px}
.cb-b{height:22px;padding:0 7px;border:0;border-radius:var(--r-sm);background:none;display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:12px;color:var(--l2);cursor:pointer}
.cb-b:hover{background:var(--fill2);color:var(--l1)}
.cb-b .ic{width:13px;height:13px}
/* Steps: a grey line in the body's size, no icon; a small caret after it opens it. */
.tool{border-radius:var(--r-md);font-size:14px}
.tool .th{display:flex;align-items:center;gap:6px;padding:2px 0;border-radius:var(--r-sm);border:0;background:none;max-width:100%;text-align:left;color:var(--l2)}
.tool .th:hover{color:var(--l1)}
.tool-shots{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.tool-shot{padding:0;border:.5px solid var(--sep);border-radius:var(--r-sm);background:none;overflow:hidden;cursor:zoom-in;line-height:0}
.tool-shot img{display:block;max-width:240px;max-height:150px;object-fit:contain}
.tool .th .vb{flex:none}
.tool .th .sm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* A command reads as code: the mono face a size down, a little quieter until hovered. */
.tool .th .cmd{font-family:var(--mono);font-size:12.5px;opacity:.9}
.tool .th:hover .cmd{opacity:1}
.tool .th .chev{flex:none}
.tgroup{font-size:14px}
.tg-h{display:flex;align-items:center;gap:6px;padding:2px 0;border:0;background:none;color:var(--l2);text-align:left}
.tg-h:hover{color:var(--l1)}
/* While a task runs, the last line of the conversation: the mark written over and over, beside the calls
   that run (centred on the first one's line, each with how long it has run) or what the model is at, how
   long the task has run and its tokens. */
.working{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--l2)}
.working canvas{margin-top:2px}
.wk-now{flex:1;min-width:0;display:flex;flex-direction:column}
.wk-line{display:flex;align-items:baseline;gap:4px;padding:2px 0;line-height:19px}
.wk-meta,.wk-time{flex:none;font-size:12.5px;color:var(--l3);font-variant-numeric:tabular-nums}
.wk-time{margin-left:2px}
/* The thinking in progress, under the working line: its last three lines in the face of opened thinking (.tool.think .out), new words coming in at the bottom and the oldest fading out at the top; opened, the whole of it. */
.wk-line.tk-h{border:0;background:none;color:inherit;text-align:left;width:max-content;max-width:100%}
.wk-line.tk-h:hover{color:var(--l1)}
.wk-line.tk-h .chev{width:14px;height:14px;margin-left:-3px;align-self:center;color:var(--l3);transform:rotate(-90deg);transition:transform .15s}
.wk-line.tk-h[aria-expanded="true"] .chev{transform:none}
.tk-peek{margin-top:2px;max-height:60px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;font-size:13px;line-height:20px;color:var(--l2);white-space:pre-wrap;overflow-wrap:anywhere}
.tk-peek.over{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 24px);mask-image:linear-gradient(to bottom,transparent,#000 24px)}
.tk-peek.open{display:block;max-height:320px;overflow-y:auto}
.tg-h .chev,.tool .th .chev{width:14px;height:14px;margin-left:-3px;color:var(--l3);transform:rotate(-90deg);transition:transform .15s}
.tgroup.open .tg-h .chev,.tool.open .th .chev{transform:none}
.tool .out{display:none;margin:4px 0 6px;background:var(--code);border-radius:var(--r-md);padding:8px 10px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;color:var(--l2);line-height:1.5;max-height:360px;overflow:auto}
.tool.open .out{display:block}
/* Thinking reads as the model's own quieter voice, not as code. */
.tool.think .out{font-family:var(--font);font-size:13px;line-height:1.6;white-space:pre-wrap}
/* Opened, a group is a hairline card a size down: one row per step, its output opening inside the card. */
.tg-b{display:flex;flex-direction:column;margin:var(--sp-1) 0 2px;border:1px solid var(--sep);border-radius:var(--r-md);overflow:hidden}
.tg-b .tool{border-radius:0;font-size:13px}
.tg-b .tool+.tool{border-top:1px solid var(--sep)}
.tg-b .tool .th{width:100%;gap:5px;padding:var(--sp-1) var(--sp-2);border-radius:0}
.tg-b .tool .th[aria-expanded]:hover,.tg-b .tool.open .th{background:var(--fill)}
.tg-b .tool .out{margin:0;border-radius:0;padding:var(--sp-1) var(--sp-2) 10px;background:var(--fill);color:var(--l2);max-height:320px;overflow:auto}
.tool.err .th .vb{color:var(--red)}
.tool.denied .th .vb{color:var(--orange)}
.tnote{align-self:center;font-size:12px;color:var(--l2);background:var(--fill);padding:5px 12px;border-radius:var(--r-sm);text-align:center;max-width:100%}
.tnote.warn{color:var(--orange);background:var(--orange-bg)}
.add-anim{animation:fadein .4s cubic-bezier(.2,0,0,1)}
/* A failure as one row: the provider's mark with a badge in the tone of what it asks (set
   something up, wait it out, change the request), what happened, one way out, the rest in a
   menu. While finx retries by itself the row drains a line along its bottom. */
.fail-wrap{display:flex;flex-direction:column;gap:6px;margin-top:6px;max-width:560px}
.f-setup{--tc:var(--accent-t)}.f-wait{--tc:var(--orange)}.f-fail{--tc:var(--red)}
.fcard{position:relative;display:flex;align-items:center;gap:12px;padding:11px 10px 11px 12px;border:1px solid var(--sep);border-radius:var(--r-xl);animation:fadein .3s cubic-bezier(.2,0,0,1)}
.fc-av{position:relative;flex:none;width:36px;height:36px;border-radius:var(--r-md);background:var(--fill);display:grid;place-items:center;color:var(--l2)}
.fc-av .provider-brand{width:22px;height:22px}
.fc-av .brand-initial{width:36px;height:36px;border-radius:var(--r-md);font-size:15px}
.fc-badge{position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border-radius:50%;background:var(--win);display:grid;place-items:center}
.fc-badge i{width:13px;height:13px;border-radius:50%;background:var(--tc);color:var(--win);display:grid;place-items:center}
.fc-badge .ic{width:9px;height:9px;stroke-width:2.2}
.fc-tx{flex:1;min-width:0}
.fc-tx b{display:block;font-size:13.5px;font-weight:600;line-height:19px}
.fc-tx span{display:block;font-size:12px;line-height:17px;color:var(--l2);margin-top:1px}
.fc-side{display:flex;align-items:center;gap:4px;flex:none}
.fc-more{width:24px;height:24px;border-radius:var(--r-sm);border:0;background:none;color:var(--l2);display:grid;place-items:center}
.fc-more:hover,.fc-more[aria-expanded=true]{background:var(--fill);color:var(--l1)}
.fc-clip{position:absolute;inset:-1px;border-radius:inherit;overflow:hidden;pointer-events:none}
.fc-clip i{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--tc);transform-origin:left;animation:fcdrain linear forwards}
@keyframes fcdrain{from{transform:scaleX(var(--from,1))}to{transform:scaleX(0)}}
.fc-raw{font-family:var(--mono);font-size:11.5px;color:var(--l2);background:var(--code);border-radius:var(--r-md);padding:8px 10px;box-shadow:inset 0 0 0 .5px var(--sep);white-space:pre-wrap;overflow-wrap:anywhere}
.fpast{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--l3);border:0;background:none;padding:2px 0;text-align:left}
.fpast:hover{color:var(--l2)}
.fpast>i{width:6px;height:6px;border-radius:50%;background:var(--tc);flex:none}
.fpast .chev{width:12px;height:12px;transition:transform .15s}
.fpast .chev.open{transform:rotate(90deg)}
.livebar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--l2);padding:8px 2px 0}
.donebar{align-self:center;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--l3);margin:-4px 0 6px}
.donebar .ic{color:var(--green)}
/* Sub-agents in the conversation (session/Agents.tsx). What spawn_agent started: a hairline card, one live row per agent. */
.agc{border:1px solid var(--sep);border-radius:var(--r-lg);overflow:hidden;margin:2px 0 6px}
.agc-h{display:flex;align-items:center;gap:7px;padding:8px 13px;font-size:12.5px;color:var(--l2);border-bottom:1px solid var(--sep);background:var(--fill)}
.agc-h .ic{width:14px;height:14px}
.agc-r{display:flex;align-items:center;gap:10px;width:100%;padding:9px 13px;border:0;background:none;text-align:left;font-size:13.5px;line-height:19px}
.agc-r+.agc-r{border-top:1px solid var(--sep)}
.agc-r:hover{background:var(--fill)}
.agc-n{flex:none;font-weight:500;font-family:var(--mono);font-size:12.5px}
.agc-g{flex:1;min-width:0;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agc-d{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agc-k{flex:1;min-width:0;font-family:var(--mono);font-size:12px;color:var(--l3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agc-s{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--l2);font-variant-numeric:tabular-nums}
.agc-s.ok{color:var(--green)}.agc-s.int{color:var(--orange)}.agc-s.bad{color:var(--red)}
.agc-s .tm{color:var(--l3)}
.agc-r .go{color:var(--l3);width:14px;height:14px;opacity:0;transition:opacity .12s}
.agc-r:hover .go{opacity:1}
/* An agent's state: a spinner while it works, a check when done, a pause when stopped. */
.gl{width:16px;height:16px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.gl.ok{color:var(--green)}.gl.int{color:var(--orange)}.gl.bad{color:var(--red)}
/* A report: who sent it and how it went, its first lines, the rest on request. */
.rpc{border:1px solid var(--sep);border-radius:var(--r-lg);margin:2px 0 4px}
.rpc-h{display:flex;align-items:center;gap:8px;padding:10px 14px 0;font-size:13px;color:var(--l2)}
.rpc-h .who{color:var(--l1);font-weight:500;font-family:var(--mono);font-size:12.5px}
.rpc-h .who.label{font-family:inherit;font-size:13px}
.rpc-h .meta{margin-left:auto;font-size:12px;color:var(--l3);font-variant-numeric:tabular-nums}
.chip{height:18px;padding:0 7px;border-radius:var(--r-xs);font-size:11px;font-weight:500;display:inline-flex;align-items:center;flex:none}
.chip.ok{color:var(--green);background:var(--green-bg)}.chip.int{color:var(--orange);background:var(--orange-bg)}.chip.bad{color:var(--red);background:var(--red-bg)}
.rpc-b{padding:6px 14px 0;color:var(--msg)}
.rpc-b .md{font-size:14px;line-height:21px}
.rpc-b .md :is(h1,h2,h3,h4,h5,h6){font-size:14px;line-height:21px}
.rpc-none{margin:0;font-size:14px;line-height:21px;color:var(--l3)}
.rpc-b .md>*+*{margin-top:6px}
.rpc-b.clamp{max-height:52px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 40%,transparent);mask-image:linear-gradient(to bottom,#000 40%,transparent)}
.rpc-f{display:flex;align-items:center;gap:16px;padding:6px 14px 10px;font-size:12.5px}
.rpc-f .link{display:inline-flex;align-items:center;gap:2px}
.rpc-f .link.quiet{color:var(--l2)}
.rpc-f .link .ic{width:12px;height:12px}
/* At the conversation's end: how many background tasks still work, as a link that opens the panel. */
/* On the conversation's left edge (its padding hangs out), flush with the working line's mark, close under it. */
.bgind{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;margin-left:-8px;border:0;background:none;padding:4px 8px;border-radius:var(--r-sm);font-size:13px;color:var(--accent-t);cursor:pointer}
.bgind:hover{text-decoration:underline;text-underline-offset:3px}
.bgind .ic{width:13px;height:13px}
.bgind.int{color:var(--orange)}
.bgind.on{background:var(--accent-bg);text-decoration:none}
.working+.bgind{margin-top:-9px}
.tb{position:relative}
.tb-badge{position:absolute;top:1px;right:0;min-width:15px;height:15px;padding:0 4px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;line-height:15px;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--win)}
/* A session page: the conversation's column, and the browser's panel beside it when open. */
.spage{flex:1;min-height:0;display:flex;position:relative}
.scol{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
/* On a session page the bar floats over the conversation as liquid glass (glass.tsx): the conversation
   scrolls under it and shows through, blurred, bending at the bar's bottom edge; a hairline closes it.
   The bending is its inline backdrop-filter once measured; until then, and where SVG backdrops don't
   work, it is frosted. */
.scol>.ctool{position:absolute;top:0;left:0;right:0;z-index:5;background:var(--bar-tint);box-shadow:inset 0 -.5px 0 var(--sep);
  backdrop-filter:blur(18px) saturate(1.8);-webkit-backdrop-filter:blur(18px) saturate(1.8)}
.glass-defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.scol .dwrap{border-top:0}
.scol .dbody{padding-top:calc(var(--top) + var(--sp-3))}
.scol .insp-stack{top:calc(var(--top) + var(--sp-3))}
/* Reduce transparency (System Settings › Accessibility › Display): a solid bar. */
@media (prefers-reduced-transparency:reduce){.scol>.ctool{backdrop-filter:none !important;background:var(--win)}}
/* The system's window buttons sit over the panel's top then, not the conversation's. */
.spage.bgopen .ctool{padding-right:14px}
/* A panel of the window on the right (the browser's, session/Browser.tsx), flush with its top, on the content's own ground. */
.bgp{flex:none;display:flex;flex-direction:column;min-height:0;background:var(--win);border-left:.5px solid var(--sep)}
.qb{height:24px;border:0;border-radius:var(--r-sm);background:none;padding:0 8px;font-size:12px;color:var(--l2);display:inline-flex;align-items:center;white-space:nowrap}
.qb:hover{background:var(--fill2);color:var(--l1)}
.qb.danger:hover{color:var(--red)}
/* The embedded browser's panel; the tab's own view is laid over .brp-view by the main process. */
.bgp.brp{position:relative;width:clamp(380px,44%,760px)}
.bgp.brp.sized{width:var(--brp-w)}
/* Taking the window: the conversation's column stays mounted, out of sight; the strip starts a step from the edge, as the conversation's bar does. */
.spage.brmax>.scol{display:none}
.bgp.brp.max{flex:1;width:auto;min-width:0;border-left:0}
.brp.max .brp-strip{padding-left:22px}
/* Drag to resize; while dragging the page's own view steps aside (it would take the pointer). */
.brp-grip{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:2}
.brp-grip:hover,.brp.resizing .brp-grip{background:var(--sel)}
/* Under the tab's view: the window's own ground, so nothing flashes white in the dark. */
.brp-view{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--win)}
/* The tab's picture while a dialog is over the window. */
.brp-still{position:absolute;left:0;top:0;display:block;max-width:none;height:auto;pointer-events:none;user-select:none}
/* A blank tab's page: the web servers on this machine, as cards. */
.ntp{position:absolute;inset:0;overflow:auto;padding:48px 32px}
.ntp-sec{max-width:640px;margin:0 auto}
.ntp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ntp-head h2{margin:0;font-size:12px;font-weight:500;color:var(--l3);letter-spacing:.02em}
.ntp-rescan{height:22px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:12px;color:var(--l3);cursor:default}
.ntp-rescan:hover:not(:disabled){background:var(--fill);color:var(--l1)}
.ntp-rescan:disabled{opacity:.5}
.ntp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.ntp-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;height:76px;padding:10px 12px;border:1px solid var(--sep);border-radius:var(--r-lg);background:var(--fill);color:var(--l1);text-align:left;cursor:default}
.ntp-card:hover{background:var(--fill2)}
.ntp-card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ntp-card.ghost{border-color:transparent;animation:ntp-pulse 1.2s ease-in-out infinite alternate}
@keyframes ntp-pulse{from{opacity:.4}to{opacity:.8}}
.ntp-port{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--l2)}
.ntp-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.ntp-title,.ntp-meta{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntp-title{font-size:13px}
.ntp-meta{font-size:11px;color:var(--l3)}
.ntp-empty{margin:0;font-size:13px;color:var(--l3)}
/* Tabs on top, like a browser's: the shown one raised; a tab's close button shows on hover and on the shown one. */
.brp-strip{height:var(--top);flex:none;display:flex;align-items:center;gap:4px;padding:0 calc(8px + var(--caption)) 0 10px;min-width:0}
.brp-more{margin-left:auto}
.brp-tabs{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.brp-tab{flex:0 1 180px;min-width:72px;height:30px;display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;border-radius:8px;font-size:13px;color:var(--l2);cursor:default;user-select:none}
.brp-tab:hover{background:var(--fill);color:var(--l1)}
.brp-tab.on{background:var(--fill2);color:var(--l1)}
.brp-tab .mini-spin{flex:none}
.brp-tab-ic{flex:none;display:flex;color:var(--l3)}.brp-tab-ic img,.brp-tab-ic svg{width:16px;height:16px}
.brp-tab-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brp-tab-x{flex:none;width:20px;height:20px;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:none;color:var(--l2);opacity:0}
.brp-tab:hover .brp-tab-x,.brp-tab.on .brp-tab-x,.brp-tab-x:focus-visible{opacity:1}
.brp-tab-x:hover{background:var(--l4);color:var(--l1)}
.brp-tab-x .ic{width:12px;height:12px}
/* Back, forward, reload and the address, under a line. */
.brp-bar{flex:none;display:flex;align-items:center;gap:2px;padding:6px 10px;border-top:.5px solid var(--sep);border-bottom:.5px solid var(--sep)}
.brp-bar .tb:disabled{opacity:.35}
.brp-annotate{display:grid;place-items:center;flex:none;width:30px;height:30px;padding:0;border:0;border-radius:15px;background:transparent;color:var(--l2);cursor:pointer}
.brp-annotate.on{background:color-mix(in srgb,#3294ff 18%,transparent);color:#3294ff}
.brp-annotate:hover:not(:disabled){color:#3294ff}
.brp-annotate:focus-visible{outline:2px solid #3294ff;outline-offset:2px}
.brp-annotate:disabled{opacity:.35;cursor:default}
.brp-addr{flex:1;min-width:0;margin-left:6px;position:relative;display:flex;align-items:center;height:30px;border-radius:8px;background:var(--fill2)}
.brp-addr:focus-within{box-shadow:0 0 0 2px var(--sel)}
.brp-addr .brp-url,.brp-addr .brp-url:focus{background:none;box-shadow:none}
.engine-icon{width:20px;height:20px;flex:none;border-radius:5px;object-fit:contain}
.engine-initial{display:grid;place-items:center;background:var(--fill2);color:var(--l2);font-size:11px;font-weight:600}
.brp-keyword{display:inline-flex;align-items:center;gap:6px;flex:none;height:22px;margin-left:4px;padding:0 8px 0 5px;border-radius:6px;background:var(--accent-bg);color:var(--accent-t);font-size:12px;white-space:nowrap}
.brp-keyword .engine-icon{width:14px;height:14px;border-radius:3px}
.brp-keyword .engine-initial{font-size:9px}
.brp-keyword+.brp-url{padding-left:8px}
.brp-hint{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:11.5px;color:var(--l3);padding-left:8px;white-space:nowrap}
.brp-url{width:100%;height:30px;padding:0 12px;border:0;border-radius:8px;background:var(--fill2);color:var(--l1);font:inherit;font-size:13px;outline:none}
.brp-url::placeholder{color:var(--l3)}
.brp-url:focus{box-shadow:0 0 0 2px var(--sel)}
/* The background card (session/Background.tsx): in the info card's place, of its glass and width, so the
   tasks read as the session's own. It runs no lower than the column's foot; its list, or the selected
   agent's work in the list's place, scrolls inside. The heading and its line as the info card's, then
   rows like the sidebar's sessions. */
.scol .bgc-stack{bottom:var(--sp-3);pointer-events:none}
.bgc{pointer-events:auto;flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
.bgc-h{flex:none;display:flex;align-items:center;gap:2px;min-height:28px}
.bgc-h h3{flex:1;min-width:0}
.insp .bgc-name{padding-left:2px;font-size:13px;font-weight:600;color:var(--l1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The heading's icon buttons: back to the list on the left, the agent's stop on the right. */
.bgc-btn{flex:none;width:24px;height:24px;margin:0 3px;border:0;border-radius:var(--r-sm);background:none;color:var(--l2);display:flex;align-items:center;justify-content:center}
.bgc-btn:hover{background:var(--fill2);color:var(--l1)}
/* Stop: the composer's square, small; red as it is pointed at. */
.bgc :is(.bgc-btn,.rowact).stop .ic{width:10px;height:10px}
.bgc :is(.bgc-btn,.rowact).stop:hover{color:var(--red)}
.bgc .rowact.stop{margin:-2px -3px -2px 0}
/* Stop all: words, its text ending where the rows' times do. */
.bgc-h .qb{margin-right:1px}
.bgc-sub{flex:none;display:flex;align-items:center;gap:8px;padding:0 9px 6px;font-size:11.5px;color:var(--l3);font-variant-numeric:tabular-nums}
.bgc-sub>:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgc-sub .k{font-family:var(--mono)}
.bgc-list{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.bgc .srow{align-items:center;padding:7px 9px}
.bgc .sl2{font-size:12px;color:var(--l2)}
.bgc .sl2t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgc .sl2t.k{font-family:var(--mono);font-size:11.5px;color:var(--l3)}
.bgc .smeta.w{color:var(--orange)}
.bgc .smeta.c{color:var(--red)}
/* The selected agent's work: its own conversation, read-only, following its end while it works. */
.bgc-log{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 9px 6px}
.bgc-said{margin:0 0 6px}
.bgc-cap{display:block;font-size:11px;color:var(--l3);margin-bottom:3px}
.bgc-said p{margin:0;font-size:13px;line-height:19px;color:var(--l2);white-space:pre-wrap;overflow-wrap:anywhere}
.bgc-said p.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.bgc-said .link{font-size:12px;margin-top:3px}
.bgc-log .tool{font-size:13px}
.bgc-log .tool .th .cmd{font-size:11.5px}
.bgc-log .am{font-size:13.5px;line-height:20px;margin:2px 0 0;overflow-wrap:anywhere}
.bgc-log .am .md{font-size:13.5px;line-height:20px}
.bgc-log .am .md :is(h1,h2,h3,h4,h5,h6){font-size:13.5px;line-height:20px}
.bgc-log .am .md>*+*{margin-top:6px}
.bgc-done{margin:4px 0 0;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--l3);font-variant-numeric:tabular-nums}
.bgc-done .ic{color:var(--green)}
.bgc-note{margin:4px 0 0;font-size:12px;color:var(--l2)}
.bgc-note.int{color:var(--orange)}
.bgc-note.bad{color:var(--red)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--l2);height:100%;text-align:center;padding:40px}
.empty b{color:var(--l1);font-size:15px}
/* forms */
.form{display:flex;flex-direction:column;gap:18px}
.fgroup{background:var(--win2);border-radius:var(--r-lg)}
.frow{display:flex;align-items:center;gap:16px;padding:9px 14px;min-height:38px;border-top:.5px solid var(--sep)}
.frow:first-child{border-top:0}
.frow>label,.frow>.fl{flex:none;width:120px;color:var(--l1)}
.frow>.fv{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:flex-end;color:var(--l2);text-align:right;flex-wrap:wrap}
.frow .fdesc{font-size:11.5px;color:var(--l2);margin-top:2px}
.fhead{font-size:12px;font-weight:600;color:var(--l2);margin:0 0 6px 4px}
/* palette */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:40;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.pal{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:min(660px,calc(100% - 48px));background:var(--menu);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);border-radius:var(--r-xl);box-shadow:0 0 0 .5px var(--menu-bd),0 24px 70px rgba(0,0,0,.35);z-index:41;overflow:hidden;animation:pop .16s cubic-bezier(.2,0,0,1)}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.97)}}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-bottom:.5px solid var(--sep)}
.pal-in .ic{width:18px;height:18px;color:var(--l2)}
.pal-in input{flex:1;border:0;background:none;outline:none;font-size:17px;color:var(--l1)}
.pal-f{display:flex;gap:6px;padding:8px 12px;border-bottom:.5px solid var(--sep);flex-wrap:wrap;align-items:center}
.pal-f select{appearance:none;-webkit-appearance:none;border:0;background:var(--fill2);color:var(--l1);height:24px;border-radius:var(--r-sm);padding:0 24px 0 10px;font:inherit;font-size:12px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) 10px,calc(100% - 8px) 10px;background-size:4px 4px;background-repeat:no-repeat}
.pal-f select.on{background-color:var(--accent-bg);color:var(--accent-t)}
.pal-r{max-height:420px;overflow-y:auto;padding:6px}
.pal-h{font-size:11.5px;font-weight:600;color:var(--l2);padding:8px 10px 4px}
.pr{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);border:0;background:none;width:100%;text-align:left}
.pr.on{background:var(--accent);color:#fff}
.pr.on .muted,.pr.on .kbd{color:rgba(255,255,255,.8)}
.pr .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .muted{font-size:12px;flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-foot{display:flex;gap:14px;padding:8px 16px;border-top:.5px solid var(--sep);font-size:11.5px;color:var(--l3)}
/* toast */
.toast{position:absolute;left:50%;top:calc(var(--top) + 12px);transform:translateX(-50%);background:var(--menu);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 0 0 .5px var(--menu-bd),0 10px 30px rgba(0,0,0,.2);border-radius:var(--r-xl);padding:8px 10px 8px 16px;display:flex;align-items:center;gap:12px;font-size:13px;z-index:60;animation:pop2 .25s cubic-bezier(.2,0,0,1);width:max-content;max-width:min(560px,calc(100% - 32px))}
/* A long message wraps inside the content, three lines at most; the icon and the button keep their size. */
.toast>span{min-width:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.toast>.ic,.toast>.btn{flex:none}
@keyframes pop2{from{opacity:0;transform:translate(-50%,-8px)}}
.toast .ic{color:var(--green)}
.toast.bad .ic{color:var(--red)}
/* sheets */
.sheet{margin:auto;border:0;padding:0;max-width:calc(100vw - 48px);max-height:calc(100vh - 80px);overflow-y:auto;color:var(--l1);background:var(--win);border-radius:var(--r-xl);box-shadow:0 0 0 .5px var(--menu-bd),0 20px 60px rgba(0,0,0,.35);animation:sheet .22s cubic-bezier(.2,0,0,1)}
/* The main window while the settings window is open: dimmed as under a dialog. */
.settings-dim{position:fixed;inset:0;z-index:100;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.sheet:focus-visible{outline:none}
.sheet::backdrop{background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.sheet-in{padding:22px 24px 18px}
@keyframes sheet{from{opacity:0;transform:scale(.97)}}
.sheet h3{margin:0 0 4px;font-size:15px;font-weight:600}
.sheet .sub{margin:0 0 14px;color:var(--l2);font-size:12.5px;line-height:1.55}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;align-items:center}
.sheet-foot .left{margin-right:auto}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* A found version, above the sidebar's foot (renderer/src/updates.tsx). */
.upd{flex:none;display:grid;grid-template-columns:16px minmax(0,1fr) auto;align-items:center;gap:3px 8px;margin:4px 8px 6px;padding:9px 8px 9px 11px;border-radius:var(--r-lg);background:var(--accent-bg);color:var(--accent-t)}
.upd>.ic{width:15px;height:15px}
.upd b{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upd-x{grid-column:3;justify-self:end;width:20px;height:20px;border:0;border-radius:var(--r-sm);background:none;color:var(--l2);display:flex;align-items:center;justify-content:center;padding:0}
.upd-x:hover{background:var(--fill)}
.upd-x .ic{width:12px;height:12px}
.upd-h{grid-column:2;font-size:11.5px;line-height:1.35;color:var(--l2)}
.upd .btn{grid-column:3}
.upd-busy{display:inline-flex;align-items:center;gap:6px}
.upd-details{margin-top:4px}
.upd-details summary{cursor:pointer;color:var(--l2)}
.upd-raw{margin-top:6px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--l2)}

/* The document column (document-editor-design §7): the shell around pdf.js's pages. */
.dcp-viewer{flex:1;min-height:0;display:flex;flex-direction:column}
.dcp-viewer[hidden]{display:none}
.dcp-in{flex:1;min-height:0;display:flex;flex-direction:column}
.dcp-bar{height:36px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 8px;min-width:0;border-bottom:.5px solid var(--sep)}
.dcp-sep{flex:none;width:.5px;height:16px;margin:0 6px;background:var(--sep)}
.dcp-bar-start,.dcp-bar-end{display:flex;align-items:center;gap:2px;min-width:0}
.dcp-bar-end{justify-content:flex-end}
.dcp-bar .tb{height:28px;min-width:28px;padding:0}
.dcp-page{flex:none;display:flex;align-items:center;height:28px;padding:0 8px 0 2px;font-size:12.5px;color:var(--l3);white-space:nowrap;font-variant-numeric:tabular-nums;border-radius:var(--r-sm)}
.dcp-page:hover{background:var(--fill)}
.dcp-page input{width:26px;height:22px;margin-right:3px;text-align:right;font:inherit;color:var(--l1);background:transparent;border:0;border-radius:var(--r-xs);outline:none}
.dcp-page input:focus{text-align:center;background:var(--field);box-shadow:0 0 0 1.5px var(--accent)}
.dcp-zoom{display:flex;align-items:center;gap:2px}
.dcp-zoom button{height:28px;min-width:28px;display:grid;place-items:center;padding:0;border:0;border-radius:var(--r-sm);background:none;color:var(--tb-fg)}
.dcp-zoom button:hover{background:var(--fill2);color:var(--l1)}
.dcp-zoom .ic{width:14px;height:14px;stroke-width:1.45}
.dcp-zoom .dcp-scale{min-width:48px;padding:0 6px;font-size:12.5px;color:var(--l2);font-variant-numeric:tabular-nums}
.dcp-find{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:.5px solid var(--sep);color:var(--l3)}
.dcp-find input{flex:1;min-width:0;height:26px;font:inherit;font-size:13px;color:var(--l1);background:var(--field);border:0;border-radius:var(--r-xs);padding:0 8px;outline:none}
.dcp-find input:focus{box-shadow:0 0 0 1.5px var(--accent)}
.dcp-count{font-size:12px;color:var(--l2);font-variant-numeric:tabular-nums}
.dcp-note{flex:none;padding:6px 12px;font-size:12px;color:var(--l2);background:var(--fill);border-bottom:.5px solid var(--sep)}
.dcp-body{position:relative;flex:1;min-height:0;display:flex}
.dcp-view{position:relative;flex:1;min-width:0;background:var(--fill)}
.dcp-scroll{position:absolute;inset:0;overflow:auto;outline:none}
.dcp-scroll .pdfViewer{padding:0 0 12px}
.dcp-scroll .pdfViewer .page{margin:0 auto 12px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.dcp-view.regioning .dcp-scroll{cursor:crosshair}
.dcp-view.regioning .textLayer{pointer-events:none}
.dcp-wait,.dcp-error{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--l2);padding:24px;text-align:center}
.dcp-bar .brp-annotate{width:28px;height:28px;margin:0 2px}
.dcp-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:4;padding:5px 12px;border-radius:999px;background:#3294ff;color:#fff;font-size:12px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none}
.dcp-band{position:absolute;border:1.5px solid var(--accent);background:var(--accent-bg);pointer-events:none;z-index:3}
.dcp-flash{position:absolute;inset:0;pointer-events:none;z-index:5}
.dcp-flash>div{position:absolute;border-radius:3px;background:rgba(255,196,0,.32);box-shadow:0 0 0 1.5px rgba(255,170,0,.8);animation:dcp-flash 2.4s ease-out forwards}
@keyframes dcp-flash{0%,60%{opacity:1}100%{opacity:0}}
.dcp-mark>div{position:absolute;border-radius:2px;background:rgba(50,148,255,.22);box-shadow:0 0 0 1.5px rgba(50,148,255,.75)}
.dcp-card{position:absolute;z-index:6;width:296px;max-width:calc(100% - 24px);padding:12px;border-radius:12px;background:var(--win);color:var(--l1);box-shadow:0 10px 32px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.1),0 0 0 .5px var(--sep);animation:dcp-card .12s ease-out;cursor:default}
@keyframes dcp-card{from{opacity:0;translate:0 3px}to{opacity:1;translate:0 0}}
.dcp-card-head{display:flex;align-items:flex-start;gap:8px}
.dcp-card-kind{flex:none;font-size:11px;font-weight:600;line-height:18px;padding:0 6px;border-radius:4px;color:#3294ff;background:rgba(50,148,255,.12)}
.dcp-card-quote{flex:1;min-width:0;font-size:12.5px;line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.dcp-card-x{flex:none;display:grid;place-items:center;width:20px;height:20px;margin:-1px -3px 0 0;padding:0;border:0;border-radius:5px;background:none;color:var(--l3)}
.dcp-card-x:hover{background:var(--fill2);color:var(--l1)}
.dcp-card-x .ic{width:12px;height:12px}
.dcp-card textarea{display:block;width:100%;min-height:56px;max-height:40vh;margin:10px 0 8px;padding:7px 9px;resize:none;border:1px solid var(--sep);border-radius:8px;background:var(--fill);color:var(--l1);font:inherit;font-size:13px;line-height:1.55;outline:none}
.dcp-card textarea::placeholder{color:var(--l3)}
.dcp-card textarea:focus{border-color:#3294ff;background:var(--win)}
.dcp-card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--l3)}
.dcp-card-foot span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcp-card-add{padding:4px 12px;border:0;border-radius:7px;background:#3294ff;color:#fff;font-size:12.5px;font-weight:600;line-height:18px}
.dcp-card-add:hover{background:#1f7ae0}
.dcp-card-add:disabled{opacity:.5}
.dcp-side{flex:none;width:172px;display:flex;flex-direction:column;border-right:.5px solid var(--sep);background:var(--win)}
.dcp-side-tabs{flex:none;display:flex;gap:2px;padding:6px}
.dcp-side-tabs button{flex:1;height:24px;border:0;border-radius:var(--r-xs);background:none;font-size:12px;color:var(--l2)}
.dcp-side-tabs button.on{background:var(--fill2);color:var(--l1)}
.dcp-side-list{flex:1;min-height:0;overflow:auto;padding:0 6px 8px}
.dcp-ol{width:100%;display:flex;gap:6px;align-items:baseline;text-align:left;padding:4px 8px;border:0;border-radius:var(--r-xs);background:none;font-size:12px;color:var(--l1)}
.dcp-ol:hover:not(:disabled){background:var(--fill)}
.dcp-ol span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dcp-ol-p{flex:none;color:var(--l3);font-variant-numeric:tabular-nums}
.dcp-thumb{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:6px 0;border:0;border-radius:var(--r-xs);background:none;font-size:11px;color:var(--l2)}
.dcp-thumb canvas{width:110px;min-height:40px;background:#fff;box-shadow:0 0 0 .5px var(--sep)}
.dcp-thumb.on canvas{box-shadow:0 0 0 2px var(--accent)}
.dcp-thumb.on{color:var(--accent-t)}
/* A citation of a document in a reply: a small raised mark that opens the source. */
.md .cite{display:inline-flex;align-items:center;height:16px;padding:0 5px;margin:0 1px;vertical-align:super;font-size:10.5px;line-height:1;font-weight:600;border:0;border-radius:8px;background:var(--accent-bg);color:var(--accent-t);cursor:pointer}
.md .cite:hover{background:var(--accent);color:#fff}
.md .cite.gone,.md .cite:disabled{background:var(--fill);color:var(--l3);cursor:default}
.dcp-unlock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:32px;text-align:center;font-size:13px;color:var(--l2)}
.dcp-unlock-badge{display:grid;place-items:center;width:52px;height:52px;margin-bottom:8px;border-radius:50%;background:var(--fill2);color:var(--l2)}
.dcp-unlock-badge .ic{width:24px;height:24px}
.dcp-unlock b{font-size:15px;font-weight:600;color:var(--l1)}
.dcp-unlock p{margin:0 0 12px;max-width:300px;line-height:1.5;overflow-wrap:anywhere;color:var(--l2)}
.dcp-unlock-field{display:flex;align-items:center;width:260px;height:34px;padding:0 4px 0 12px;border-radius:9px;background:var(--field);box-shadow:inset 0 0 0 .5px var(--field-bd);transition:box-shadow .15s}
.dcp-unlock-field:focus-within{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--accent-bg)}
.dcp-unlock-field.bad{box-shadow:inset 0 0 0 1px #e5484d,0 0 0 3px rgba(229,72,77,.18);animation:dcp-shake .32s}
@keyframes dcp-shake{20%,60%{translate:-5px 0}40%,80%{translate:5px 0}}
.dcp-unlock-field input{flex:1;min-width:0;height:100%;padding:0;border:0;background:none;font:inherit;font-size:13px;color:var(--l1);outline:none}
.dcp-unlock-field input::placeholder{color:var(--l3)}
.dcp-unlock-eye,.dcp-unlock-go{flex:none;display:grid;place-items:center;width:26px;height:26px;padding:0;border:0;border-radius:7px;background:none;color:var(--l3)}
.dcp-unlock-eye:hover{background:var(--fill2);color:var(--l1)}
.dcp-unlock-eye .ic{width:15px;height:15px}
.dcp-unlock-go{margin-left:2px;background:var(--accent);color:#fff;animation:dcp-card .12s ease-out}
.dcp-unlock-go:hover:not(:disabled){filter:brightness(1.1)}
.dcp-unlock-go .ic{width:14px;height:14px;stroke-width:2}
.dcp-unlock-bad{min-height:18px;margin-top:4px;color:#e5484d;font-size:12px}

/* composer.css */
/* The composer's zone: the bottom of a session's page, as wide as the
   conversation's column. The conversation scrolls under it and fades out
   above it; the composer, the row of what the message goes with, and an
   approval when one waits sit there. (Not ".dock": that is the session
   page's state with the info card shown, .dwrap.dock.) The composer stands
   12 px out past the column on each side: a filled box as wide as the text
   above it reads narrower than the text. */
.cmp-zone{position:absolute;left:0;right:0;bottom:0;z-index:4;pointer-events:none;padding:28px calc(var(--sp-4) - 12px) 12px;background:linear-gradient(to bottom,transparent,var(--win) 28px)}
.cmp-col{pointer-events:auto;max-width:754px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

/* An approval (session/Approval.tsx), above the composer and in its shape:
   a line on what and why, the command or change itself, the answers as
   buttons on one row. */
.appr{background:var(--pill);border-radius:var(--r-lg);box-shadow:0 0 0 .5px var(--pill-bd),0 10px 30px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.06);padding:14px 14px 12px 16px;display:flex;flex-direction:column;gap:10px;animation:cbarup .32s cubic-bezier(.2,0,0,1)}
.appr-h{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;line-height:20px}
.appr-h b{font-weight:600;flex:none;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appr-h .why{flex:1;min-width:0;color:var(--l2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appr-h .qx-tag{margin-left:auto;flex:none}
.appr-app{flex:none;display:inline-flex;align-items:center;gap:5px;max-width:30%;padding:1px 8px 1px 4px;border-radius:999px;background:var(--code);box-shadow:inset 0 0 0 .5px var(--sep);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appr-app img{width:16px;height:16px;flex:none}
/* A website's question: why it asks, when the mode would not, and the address, under the title. */
.appr-site{display:flex;flex-direction:column;gap:2px;margin:-4px 0 0 24px;min-width:0;font-size:12.5px;line-height:18px;color:var(--l2)}
.appr-site code{font-family:var(--mono);font-size:12px;color:var(--l3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The address with its site's icon (browser-design §10.2). */
.appr-url{display:flex;align-items:center;gap:6px;min-width:0}
.appr-url .site-ic{flex:none;display:flex;color:var(--l3)}.appr-url .site-ic img,.appr-url .site-ic svg{width:14px;height:14px}
.appr-warn{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 11px;border-radius:var(--r-md);background:var(--orange-bg);color:var(--l1);font-size:12.5px;line-height:18px}
.appr-warn span{flex:1;min-width:0}
.appr-warn .btn{height:26px;padding:0 12px;flex:none}
.appr-pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--l1);background:var(--code);box-shadow:inset 0 0 0 .5px var(--sep);border-radius:var(--r-md);padding:8px 11px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:132px;overflow-y:auto}
.appr-pre.diff{padding:6px 0}
.appr-pre.diff>span{display:block;padding:0 11px}
.appr-pre .add{background:var(--add-bg);color:var(--add-fg)}
.appr-pre .del{background:var(--del-bg);color:var(--del-fg)}
.appr-pre .more{display:block;color:var(--l3)}
.appr-f{display:flex;align-items:center;gap:8px}
.appr-f .btn{height:30px;padding:0 14px}
.appr-f .field{flex:1;height:30px;border-radius:var(--r-sm)}
.appr-sp{flex:1}
.appr-keep{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--l2);cursor:pointer}

/* A key notice (session/Notice.tsx), above the composer in an approval's shape: a warning sign and
   what holds now, a few lines on why it matters, the answers on one row. */
.knote{background:var(--pill);border-radius:var(--r-lg);box-shadow:0 0 0 .5px var(--pill-bd),0 10px 30px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.06);padding:14px 14px 12px 16px;display:flex;flex-direction:column;gap:6px;animation:cbarup .32s cubic-bezier(.2,0,0,1)}
.knote-h{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;line-height:20px}
.knote-h b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.knote-i{width:16px;height:16px;flex:none;color:var(--orange)}
.knote-b{margin:0 0 4px 24px;font-size:12.5px;line-height:19px;color:var(--l2)}

/* The composer: one line while empty ("+", the text, Send), growing with
   what is written; what is attached shows as tiles above the text. Its
   corners a little tighter than the window's; its buttons' corners follow
   them, 6 px in. The I-beam over all of it but its buttons and tiles. */
.cmp{cursor:text;background:var(--pill);border-radius:var(--r-xl);box-shadow:0 0 0 .5px var(--pill-bd),0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);padding:6px;display:flex;flex-direction:column;gap:6px}
.cmp-row{display:flex;align-items:flex-end;gap:4px}
.cmp button,.cmp .tile{cursor:default}
/* The text (composer/PromptEditor.tsx, Lexical): plain text that grows to
   ten lines, the placeholder laid over it while it is empty. */
.cmp-ed{position:relative;flex:1;min-width:0}
.cmp-in{border:0;outline:none;background:none;font:inherit;font-size:15px;line-height:21px;color:var(--l1);padding:5.5px 4px;min-height:32px;max-height:220px;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere;caret-color:var(--l1)}
.cmp-ph{position:absolute;top:5.5px;left:4px;right:4px;font-size:15px;line-height:21px;color:var(--l3);pointer-events:none;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-p{margin:0}
/* A skill mentioned as /skill:name: a tag with its name, in the composer and
   in the conversation. The text stays /skill:name for copying. */
.skill-tag-host{display:inline}
.skill-tag{display:inline-flex;align-items:center;gap:3px;padding:0 6px 0 4px;margin:0 1px;border-radius:var(--r-sm);background:var(--accent-bg);color:var(--accent-t);font-size:.92em;line-height:1.45;vertical-align:baseline;user-select:none;white-space:nowrap;cursor:default}
.skill-tag .ic{width:12px;height:12px;stroke-width:1.8}
.skill-tag-text{font-size:0}
/* The `/` menu above the caret: a skill's name and description, its argument hint at the right. */
.cmd-menu{width:360px;max-height:300px}
.cmd-menu .mi .two{flex:1}
.cmd-menu .mi .two span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-plus{width:32px;height:32px;border-radius:var(--r-sm);border:0;background:none;color:var(--l2);display:flex;align-items:center;justify-content:center;flex:none}
.cmp-plus:hover,.cmp-plus[aria-expanded="true"]{background:var(--fill2);color:var(--l1)}
.cmp-plus .ic{width:18px;height:18px;stroke-width:1.5}
.send{width:32px;height:32px;border-radius:var(--r-sm);border:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 1px 2px rgba(40,60,200,.3);transition:background .15s}
.send:disabled{background:var(--fill3);color:var(--win);box-shadow:none}
/* A task runs and nothing is typed: Stop, in red, where Send was. */
.send.stop{background:var(--red);color:#fff;box-shadow:0 1px 2px rgba(200,40,60,.3)}
.send.stop:hover{filter:brightness(.95)}
.send .ic{width:16px;height:16px;stroke-width:1.9}
.send.stop .ic{width:12px;height:12px}
/* An attachment (composer/Tile.tsx), the same in the composer and the
   conversation: a 96 px square. An image fills it; a file or folder shows
   its name (four lines at most) and its type. × shows on hover. */
.cmp-att{display:flex;flex-wrap:wrap;gap:8px;padding:4px 4px 0}
.tile{position:relative;width:96px;height:96px;flex:none}
.tile-open{width:100%;height:100%;padding:0;border:0;border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;background:var(--fill);box-shadow:inset 0 0 0 .5px var(--sep);color:var(--l1);font:inherit;text-align:left}
.tile-open:hover{background:var(--fill2)}
.tile.img .tile-open{box-shadow:0 0 0 .5px var(--sep)}
.tile.img .tile-open img{display:block;width:100%;height:100%;object-fit:cover}
.tile.img .tile-open:hover img{opacity:.88}
/* An image opens large: the pointer says so before the click, and closing it is a click anywhere. */
.tile.img .tile-open{cursor:zoom-in}
.tile.doc .tile-open{padding:9px 9px 8px;gap:5px}
.tile-name{flex:1;min-height:0;width:100%;font-size:11.5px;line-height:15px;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.tile-web{flex:none;display:flex;align-items:center;gap:3px;font-size:9.5px;font-weight:600;line-height:13px;color:#3294ff}.tile-web svg,.tile-web img{width:11px;height:11px}.tile-web .site-ic{display:flex}
.tile.web .tile-name{-webkit-line-clamp:3}
.tile-kind{flex:none;max-width:100%;overflow:hidden;font-size:9.5px;font-weight:600;line-height:15px;letter-spacing:.03em;color:var(--l2);padding:0 5px;border-radius:var(--r-xs);box-shadow:inset 0 0 0 .5px var(--l4)}
/* A file or folder: a row card, a badge in its type's colour, its name on one line and its type. */
.tile.file{width:200px;height:52px}
.tile.file .tile-open{flex-direction:row;align-items:center;gap:10px;padding:0 12px 0 9px;border-radius:var(--r-lg,12px)}
.tile-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tile.file .tile-name{flex:none;font-size:12.5px;font-weight:500;line-height:16px;white-space:nowrap;text-overflow:ellipsis;display:block}
.tile.file .tile-kind{padding:0;box-shadow:none;font-size:10.5px;font-weight:500;line-height:13px;letter-spacing:.02em;color:var(--l2)}
.tile-badge{--c:#8e8e93;position:relative;flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:color-mix(in srgb,var(--c) 16%,transparent)}
.tile-badge svg{width:28px;height:28px}
.tile-badge .pg{fill:var(--c);opacity:.9}
.tile-badge .ear{fill:color-mix(in srgb,var(--c) 55%,#fff);stroke:none}
.tile-badge.f-folder svg path{fill:var(--c)}
.tile-badge b{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:5.5px;font-weight:700;line-height:7px;letter-spacing:0;color:#fff;text-transform:uppercase}
.f-pdf{--c:#f2564a}.f-word{--c:#3d7cf5}.f-sheet{--c:#27a55c}.f-slide{--c:#f08a24}.f-image{--c:#a35cf0}.f-media{--c:#e8478f}.f-archive{--c:#9b7b52}.f-text{--c:#7d8796}.f-code{--c:#14a3b8}.f-folder{--c:#4aa3f5}
.tile-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;padding:0;border:0;border-radius:50%;background:var(--l1);color:var(--win);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--pill);opacity:0;transition:opacity .12s}
.tile:hover .tile-x,.tile-x:focus-visible{opacity:1}
.tile-x .ic{width:10px;height:10px;stroke-width:2.2}
/* An image over the window, on a dark veil. */
.lightbox{position:fixed;inset:0;z-index:100;cursor:zoom-out;display:flex;align-items:center;justify-content:center;padding:40px;background:rgba(0,0,0,.72);animation:fade .15s;-webkit-app-region:no-drag}
.lightbox img{max-width:100%;max-height:100%;border-radius:var(--r-md);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:zoomin .2s cubic-bezier(.2,0,0,1)}
@keyframes zoomin{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}

/* Under the composer, outside it: what the message goes with, as quiet buttons. */
.cmp-meta{display:flex;align-items:center;gap:2px;padding:0 12px;margin-top:-4px;min-width:0}
.cmp-meta .sp{flex:1}

/* Messages sent while the task runs, waiting for it (session/Queue.tsx): a
   tray that comes out from behind the composer, as wide as it, its lower
   edge 12 px under it (the composer sits on top). On the composer's grid: a
   row's icon in a column as wide as "+", its words where the composer's text
   starts. Its colour is a step below the window's in both schemes, a well
   the composer floats over. */
.cmp{position:relative;z-index:1}
.cq{margin-bottom:-22px;padding:4px 6px 16px;border-radius:var(--r-xl) var(--r-xl) 0 0;background:var(--tray);box-shadow:0 0 0 .5px var(--pill-bd);max-height:184px;overflow-y:auto;scrollbar-width:thin;animation:cqup .3s var(--ease-out)}
@keyframes cqup{from{opacity:0;transform:translateY(14px)}}
.cq-row{display:flex;align-items:center;gap:4px;height:30px;border-radius:var(--r-md);animation:cqrow .22s var(--ease-out)}
@keyframes cqrow{from{opacity:0;height:0}}
.cq-row:hover,.cq-row:focus-within{background:var(--fill)}
.cq-i{width:32px;flex:none;display:flex;justify-content:center;color:var(--l3)}
.cq-i .ic{width:15px;height:15px}
.cq-t{flex:1;min-width:0;padding:0 4px;font-size:14px;color:var(--l1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cq-n{flex:none;font-size:12px;color:var(--l3);white-space:nowrap}
/* When it goes in; on hover, what can be done with it. */
.cq-when{flex:none;padding:0 10px 0 6px;font-size:12px;color:var(--l3);white-space:nowrap}
.cq-acts{display:none;flex:none;align-items:center;gap:2px;padding-right:4px}
.cq-row:hover .cq-when,.cq-row:focus-within .cq-when{display:none}
.cq-row:hover .cq-acts,.cq-row:focus-within .cq-acts{display:flex}
.cq-b{height:24px;padding:0 8px;border:0;border-radius:var(--r-sm);background:none;font-size:12.5px;color:var(--l1);white-space:nowrap}
.cq-b:hover{background:var(--fill2)}
.cq-b.off{opacity:.42}
.cq-b.off:hover{background:none}
.cq-ib{width:24px;height:24px;border:0;border-radius:var(--r-sm);background:none;color:var(--l2);display:inline-flex;align-items:center;justify-content:center}
.cq-ib:hover{background:var(--fill2);color:var(--l1)}
.cq-ib .ic{width:14px;height:14px}
@media (prefers-reduced-motion:reduce){.cq,.cq-row{animation:none}}
.mb{height:26px;border:0;border-radius:var(--r-sm);background:none;padding:0 7px;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--l2);white-space:nowrap;min-width:0}
.mb:hover,.mb[aria-expanded="true"]{background:var(--fill);color:var(--l1)}
.mb:disabled{opacity:.5}
.mb .ic{width:14px;height:14px;flex:none}
.mb .lbl{overflow:hidden;text-overflow:ellipsis;max-width:200px}
.mb .strong{color:var(--l1)}
.mb .sub{color:var(--l3)}
.vmenu .mi .kbd{margin-left:auto;padding-left:18px}

/* A new session: the mark and a line in the middle, the composer at the bottom as on a session's page. */
.newpage{flex:1;min-height:0;display:flex;flex-direction:column;border-top:.5px solid var(--sep)}
.new-hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-2);padding:0 var(--sp-4) 2vh;text-align:center}
.new-hero .btn{margin-top:4px}
.new-hero h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;color:var(--l1);text-wrap:balance}
.cmp-zone.new{position:static;background:none;padding-top:0}

/* Connecting a model service (composer/KeySetup.tsx): the first-use card in
   the new session page's middle, and the same form in a sheet and in
   settings. */
.keyform{display:flex;flex-direction:column;gap:10px}
.keyform label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--l2)}
.keyform .field{height:30px;border-radius:var(--r-sm);font-size:13px}
.keyform select.field{appearance:auto}
.keyform .note{margin:0;font-size:11.5px;line-height:1.5;color:var(--l3)}
.keyform .err{margin:0;font-size:12px;color:var(--red)}
.keyform .sheet-foot{margin-top:4px}
.keyform .btn{height:28px}
.keyrow{display:block}
.keyrow .keyform{padding:4px 0}

/* "+" › 连接器 (composer/ConnectorsMenu.tsx, connectors-entry-design §7): browse and manage, a
   line, then the connectors, eight rows high before they scroll; each row is its connector's
   switch, the system ones offer to connect until they are. */
.cn-sub{width:296px}
/* Eight rows, fewer when the window is short (the two rows and line above stay on screen); it scrolls on its own, not the page under it. */
.cn-list{max-height:min(calc(8 * 32px),calc(100vh - 140px));overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:0 4px;scroll-padding-block:24px;--fu:0px;--fd:0px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 var(--fu),#000 calc(100% - var(--fd)),transparent);mask-image:linear-gradient(to bottom,transparent,#000 var(--fu),#000 calc(100% - var(--fd)),transparent)}
.cn-list.more-up{--fu:24px}
.cn-list.more-down{--fd:24px}
.cn-row{height:32px;min-height:32px;gap:9px;cursor:default}
.cn-row .cz-tile{width:18px;height:18px;border-radius:var(--r-xs);font-size:7.5px;font-weight:650;letter-spacing:0}
.cn-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cn-row.off .nm,.cn-row.off .cz-tile,.cn-row.quick.off>.ic{opacity:.5}
.cn-none-row{color:var(--l3);cursor:default}
.cn-none-row:hover{background:none}
.cn-row[aria-disabled=true]{color:var(--l3)}
.cn-row .cn-st{border:0;background:none;padding:2px 0;font-size:11.5px;color:var(--orange)}
.cn-row .cn-st.bad{color:var(--red)}
.cn-row .cn-st:hover{text-decoration:underline;text-underline-offset:2px}
.cn-row .btn.sm{margin-right:-2px;pointer-events:none}
.sw.sm{width:26px;height:16px;pointer-events:none}
.sw.sm::after{width:12px;height:12px}
.sw.sm.on::after{transform:translateX(10px)}

/* A part of a page, opened from its tile: its picture and what it is. */
.wdt{position:fixed;z-index:60;width:340px;max-height:min(520px,calc(100vh - 24px));overflow:auto;padding:10px 12px 8px;border-radius:var(--r-md);background:var(--win);box-shadow:0 8px 28px rgba(0,0,0,.28),0 0 0 .5px var(--sep);color:var(--l1);font-size:12.5px;cursor:default}
.wdt-head{display:flex;align-items:center;gap:6px;height:22px;margin-bottom:8px}
.wdt-head .ic{color:#3294ff}
.wdt-head svg,.wdt-head img{width:14px;height:14px;flex:none}
.wdt-head .site-ic{display:flex}
.wdt-kind{font-weight:600;color:#3294ff;white-space:nowrap}
.wdt-host{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--l3)}
.wdt-x{display:grid;place-items:center;width:22px;height:22px;padding:0;border:0;border-radius:var(--r-xs);background:none;color:var(--l2)}
.wdt-x:hover{background:var(--fill2);color:var(--l1)}
.wdt-x .ic{width:13px;height:13px}
.wdt-shot{display:block;width:100%;padding:0;border:0;border-radius:var(--r-sm);overflow:hidden;background:#fff;box-shadow:0 0 0 .5px var(--sep);cursor:zoom-in}
.wdt-shot img{display:block;width:100%;max-height:220px;object-fit:contain;object-position:top left}
.wdt-comment{margin:10px 0 0;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.wdt-rows{margin:8px 0 0;display:grid;gap:6px}
.wdt-rows>div{display:grid;grid-template-columns:56px 1fr;gap:10px}
.wdt-rows dt{color:var(--l3)}
.wdt-rows dd{margin:0;line-height:1.45;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.wdt-rows dd.mono{font-family:var(--mono);font-size:11px}
.wdt-more{margin-top:8px}
.wdt-more summary{padding:2px 0;color:var(--l2);cursor:pointer;user-select:none}
.wdt-more summary:hover{color:var(--l1)}
.wdt-go{display:block;width:100%;height:28px;margin-top:10px;border:0;border-radius:var(--r-sm);background:var(--fill2);color:var(--l1);font:inherit;font-size:12.5px}
.wdt-go:hover{background:var(--fill3)}

/* Files dragged over the window: the composer lifts and glows, and says it takes them. */
.cmp{transition:box-shadow .18s ease,transform .18s ease}
.cmp.dropping{transform:translateY(-3px);box-shadow:0 0 0 1.5px #3294ff,0 0 0 6px rgba(50,148,255,.16),0 14px 40px rgba(50,148,255,.28);animation:cmp-drop-glow 1.6s ease-in-out infinite}
@keyframes cmp-drop-glow{50%{box-shadow:0 0 0 1.5px #3294ff,0 0 0 10px rgba(50,148,255,.08),0 18px 48px rgba(50,148,255,.34)}}
.cmp-drop{position:absolute;inset:4px;z-index:5;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;border-radius:calc(var(--r-xl) - 4px);border:1.5px dashed rgba(50,148,255,.75);background:color-mix(in srgb,var(--pill) 80%,#3294ff);backdrop-filter:blur(8px);color:var(--l1);font-size:13.5px;pointer-events:none;animation:cmp-drop-in .16s ease-out}
.cmp-drop b{font-weight:600}
.cmp-drop-hint{color:var(--l2);font-size:12px}
.cmp-drop-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#3294ff;color:#fff;box-shadow:0 4px 12px rgba(50,148,255,.45);animation:cmp-drop-bob 1.1s ease-in-out infinite}
.cmp-drop-ic .ic{width:16px;height:16px;stroke-width:1.8}
@keyframes cmp-drop-in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes cmp-drop-bob{50%{transform:translateY(-3px)}}
.drop-veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 100%,rgba(50,148,255,.16),transparent 60%);animation:cmp-drop-in .2s ease-out}
@media (prefers-reduced-motion:reduce){.cmp.dropping,.cmp-drop,.cmp-drop-ic,.drop-veil{animation:none}.cmp.dropping{transform:none}}


/* ─────────────── 原型的外壳（不是产品的一部分） ─────────────── */
.d-page{display:flex;flex-direction:column;height:100%;background:var(--win)}
.d-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 13px;padding:8px 21px;border-bottom:.5px solid var(--sep);flex:none}
.d-bar h1{margin:0;font-size:14px;font-weight:500;flex:none}
.d-sp{flex:1}
.d-note{display:flex;align-items:center;flex-wrap:wrap;gap:6px 13px;padding:8px 21px;min-height:36px;border-bottom:.5px solid var(--sep);font-size:12.5px;line-height:18px;color:var(--l2);flex:none}
.d-note p{margin:0;flex:1 1 420px;min-width:0}
.d-note b{font-weight:500;color:var(--l1)}
.d-wrap{flex:1;min-height:0;position:relative;overflow:hidden;background:linear-gradient(140deg,#c6cedb,#e6e2da)}
html[data-theme="dark"] .d-wrap{background:linear-gradient(140deg,#111317,#24272e)}
.d-stage{position:absolute;left:0;top:0;width:1400px;height:850px;transform-origin:0 0}
.d-win{position:absolute;border-radius:11px;overflow:hidden;background:var(--win);box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.2);z-index:1}
html[data-theme="dark"] .d-win{box-shadow:0 0 0 .5px rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.5)}
.d-win.front{z-index:3;box-shadow:0 0 0 .5px rgba(0,0,0,.32),0 26px 70px rgba(0,0,0,.34)}
html[data-theme="dark"] .d-win.front{box-shadow:0 0 0 .5px rgba(255,255,255,.18),0 26px 70px rgba(0,0,0,.66)}
.d-win.off{display:none}
.d-fw{left:24px;top:20px;width:1120px;height:780px}
.d-fw.narrow{width:880px}
.d-gc{left:270px;top:62px;width:1110px;height:770px}
.d-raise{animation:d-raise .28s var(--ease-out)}
@keyframes d-raise{from{transform:scale(.988)}to{transform:none}}
.d-appear{animation:d-appear .35s var(--ease-out)}
@keyframes d-appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.d-lights{position:absolute;left:14px;top:16px;display:flex;gap:8px;z-index:30;pointer-events:none}
.d-lights i{width:12px;height:12px;border-radius:50%;background:var(--fill3);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.front>.d-lights i:nth-child(1){background:#ff5f57}.front>.d-lights i:nth-child(2){background:#febc2e}.front>.d-lights i:nth-child(3){background:#28c840}
.d-fw .cmp-ed{min-height:32px}
.d-fw .cmp-ph{position:static;padding:5.5px 4px}
.d-fw .tgroup:not(.open) .tg-b{display:none}
.d-fw .glassbar{-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}
.d-fav{display:block;flex:none;width:16px;height:16px;color:#24292f;--fav-in:#fff}
html[data-theme="dark"] .d-fav{color:#e6e8eb;--fav-in:#202124}
/* 标出改动：点"标出改动"后，新增的部分带一圈虚线。 */
.marks .mk-new{outline:1.5px dashed var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

/* ─────────────── 新增：环境卡里的一行 ─────────────── */
.yr{position:relative}
.yr-mark{display:block;flex:none;width:18px;height:18px}
.yr .insp-row .sdot{flex:none;width:7px;height:7px;margin-left:auto}
.yr .insp-row .sdot+.yr-go{margin-left:0}
.insp-row .ic.yr-go{flex:none;width:13px;height:13px;margin-left:auto;color:var(--l3)}
.yr:hover .insp-row .ic.yr-go{color:var(--l2)}
.yr .insp-where{min-width:0}
.yr .insp-sub.shimmer{flex-shrink:1000}
.yr.acting .insp-row{padding-right:9px}
.yr-more{position:absolute;right:26px;top:5px;width:22px;height:22px;display:none;align-items:center;justify-content:center;padding:0;border:0;border-radius:var(--r-sm);background:var(--fill2);color:var(--l1)}
.yr-more .ic{width:14px;height:14px}
.yr:hover .yr-more,.yr-more[aria-expanded="true"]{display:flex}
.yr-act{position:absolute;right:4px;top:4px;background:var(--fill2);color:var(--l1)}
.insp:has(.yr-menu){position:relative;z-index:5}
.yr-menu{position:absolute;top:34px;right:0;z-index:40;width:286px}
.yr-menu .mi:hover{background:var(--fill2)}
.yr-menu .mi>span:not(.ck){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.yr-menu .mi .d-fav{width:14px;height:14px;margin:0 1px}

/* ─────────────── 新增：卡片放不下时，顶栏的按钮 ─────────────── */
.tb .yb-mark{display:block;width:17px;height:17px}
.tb-dot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 1.5px var(--win)}

/* ─────────────── 模拟的 Chrome 窗口 ─────────────── */
.gc{--gc-strip:#dee1e6;--gc-bar:#fff;--gc-line:#dadce0;--gc-omni:#f1f3f4;--gc-fg:#1f1f1f;--gc-fg2:#5f6368;--gc-page:#fff;--gc-hover:rgba(0,0,0,.07);--gc-soft:#f6f8fa;display:flex;flex-direction:column;background:var(--gc-strip);color:var(--gc-fg)}
html[data-theme="dark"] .gc{--gc-strip:#1c1d1f;--gc-bar:#35363a;--gc-line:#44464a;--gc-omni:#202124;--gc-fg:#e8eaed;--gc-fg2:#9aa0a6;--gc-page:#202124;--gc-hover:rgba(255,255,255,.09);--gc-soft:#292a2d}
.gc .ic{stroke-width:1.4}
.gc-strip{height:44px;flex:none;display:flex;align-items:flex-end;gap:2px;padding:0 8px 0 78px}
.gc-chip{align-self:center;margin:8px 3px 0 5px;height:20px;padding:0 8px;border-radius:5px;display:inline-flex;align-items:center;color:#fff;font-size:11.5px;font-weight:500;white-space:nowrap;flex:none;background:var(--g)}
.gc-tab{position:relative;flex:0 1 196px;min-width:60px;height:34px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;border-radius:8px 8px 0 0;font-size:12px;color:var(--gc-fg2);white-space:nowrap}
.gc-tab:hover{background:var(--gc-hover)}
.gc-tab.on{background:var(--gc-bar);color:var(--gc-fg)}
.gc-tab.grp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--g)}
.gc-tab .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.gc-tab .ic{width:12px;height:12px;flex:none;color:var(--gc-fg2)}
.gc-tab .mini-spin{width:13px;height:13px}
.gc-new{align-self:center;margin:8px 0 0 4px;width:26px;height:26px;border:0;border-radius:50%;background:none;color:var(--gc-fg2);display:grid;place-items:center;flex:none}
.gc-new .ic{width:14px;height:14px}
.gc-bar{height:40px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--gc-bar)}
.gc-b{width:28px;height:28px;border:0;border-radius:50%;background:none;color:var(--gc-fg2);display:grid;place-items:center;flex:none;position:relative}
.gc-b:hover{background:var(--gc-hover)}
.gc-b .ic{width:15px;height:15px}
.gc-b img{display:block;width:16px;height:16px}
.gc-omni{flex:1;min-width:0;height:28px;margin:0 4px;border-radius:14px;background:var(--gc-omni);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;color:var(--gc-fg)}
.gc-omni .ic{width:13px;height:13px;color:var(--gc-fg2);flex:none}
.gc-omni span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc-av{width:22px;height:22px;border-radius:50%;background:#7a8ca3;color:#fff;font-size:11px;display:grid;place-items:center;margin:0 3px;flex:none}
.gc-badge{position:absolute;right:0;top:1px;min-width:13px;height:13px;padding:0 3px;border-radius:7px;font-size:9.5px;line-height:13px;font-weight:600;color:#fff;background:#e8710a;text-align:center}
.gc-badge.grey{background:#80868b}
.gc-info{flex:none;height:34px;display:flex;align-items:center;gap:13px;padding:0 13px;background:var(--gc-bar);border-top:1px solid var(--gc-line);font-size:12px;color:var(--gc-fg)}
.gc-info button{height:24px;padding:0 13px;border:1px solid var(--gc-line);border-radius:12px;background:none;font-size:12px;color:#1a73e8}
html[data-theme="dark"] .gc-info button{color:#8ab4f8}
.gc-page{flex:1;min-height:0;overflow:hidden;background:var(--gc-page);border-top:1px solid var(--gc-line);font-size:14px}
.gc-tip{position:absolute;right:46px;top:80px;z-index:6;max-width:430px;padding:6px 9px;border-radius:4px;background:var(--gc-bar);box-shadow:0 0 0 .5px var(--gc-line),0 3px 12px rgba(0,0,0,.2);font-size:11.5px;line-height:16px;color:var(--gc-fg);user-select:text}
/* 模拟的网页 */
.wp-nav{height:48px;display:flex;align-items:center;gap:13px;padding:0 34px;border-bottom:1px solid var(--gc-line);background:var(--gc-soft);font-size:13px;color:var(--gc-fg2)}
.wp-nav b{color:var(--gc-fg);font-weight:600}
.wp-h{margin:0;padding:24px 34px 13px;font-size:20px;font-weight:600}
.wp-list{margin:0 34px;border:1px solid var(--gc-line);border-radius:6px;overflow:hidden}
.wp-row{display:flex;align-items:center;gap:13px;padding:11px 13px;border-top:1px solid var(--gc-line);font-size:14px}
.wp-row:first-child{border-top:0}
.wp-row b{font-weight:600}
.wp-row span{margin-left:auto;color:var(--gc-fg2);font-size:12px}
.wp-c{margin:0 34px 13px;border:1px solid var(--gc-line);border-radius:6px;overflow:hidden}
.wp-c header{padding:8px 13px;background:var(--gc-soft);border-bottom:1px solid var(--gc-line);font-size:12.5px;color:var(--gc-fg2)}
.wp-c header b{color:var(--gc-fg);font-weight:600}
.wp-c p{margin:0;padding:11px 13px;line-height:1.5}
.wp-login{width:320px;margin:72px auto 0;display:flex;flex-direction:column;gap:13px}
.wp-login h2{margin:0 0 8px;text-align:center;font-size:21px;font-weight:500}
.wp-login label{display:flex;flex-direction:column;gap:6px;font-size:13px}
.wp-login i{display:block;height:32px;border:1px solid var(--gc-line);border-radius:6px;background:var(--gc-page)}
.wp-login button{height:34px;border:0;border-radius:6px;background:#1f883d;color:#fff;font-size:14px;font-weight:500}
.wp-ext{padding:21px 34px}
.wp-ext h2{margin:0 0 21px;font-size:18px;font-weight:500}
.wp-card{width:420px;display:flex;gap:13px;align-items:flex-start;padding:13px;border-radius:8px;background:var(--gc-soft);box-shadow:0 0 0 .5px var(--gc-line)}
.wp-card img{width:40px;height:40px;flex:none}
.wp-card b{font-weight:500}
.wp-card b span{margin-left:6px;color:var(--gc-fg2);font-weight:400;font-size:12px}
.wp-card p{margin:4px 0 0;font-size:12.5px;line-height:17px;color:var(--gc-fg2)}
.wp-card .sw{margin-left:auto;flex:none}

/* ─────────────── 新增：点扩展图标的弹窗 ─────────────── */
.gc-pop{position:absolute;right:46px;top:80px;z-index:6;width:284px;padding:13px;border-radius:var(--r-lg);background:var(--menu-solid);box-shadow:0 0 0 .5px var(--menu-bd),0 10px 30px rgba(0,0,0,.24);color:var(--l1);display:flex;flex-direction:column;gap:13px}
.gc-pop-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.gc-pop-h img{display:block;width:16px;height:16px}
.gc-pop-h span{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:400;color:var(--l2)}
.gc-pop-b b{display:block;font-size:14px;font-weight:500;line-height:20px}
.gc-pop-b span{display:block;font-size:12.5px;line-height:18px;color:var(--l2)}
.gc-pop-f{display:flex;gap:8px;justify-content:flex-end}
.gc-pop-f .btn{height:28px}
/* 系统通知 */
.d-toast{position:absolute;top:14px;right:14px;z-index:8;width:346px;display:flex;gap:11px;padding:12px 14px;border-radius:16px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);box-shadow:var(--glass-sh),0 12px 34px rgba(0,0,0,.22);color:var(--l1);text-align:left;border:0;animation:d-toast .36s var(--ease-out)}
@keyframes d-toast{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.d-toast img{display:block;width:34px;height:34px;flex:none;border-radius:8px;background:var(--win);padding:5px}
.d-toast b{display:block;font-size:13px;font-weight:600;line-height:18px}
.d-toast span{display:block;font-size:12.5px;line-height:17px;color:var(--l2)}
</style>
</head>
