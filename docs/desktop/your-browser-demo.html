<!doctype html>
<html lang="zh-CN" data-platform="mac" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你的浏览器</title>
<!--
  原型：你的浏览器（Chrome 扩展）在会话里怎么出现，以及它改变了哪些产品体验。
  形式已定：环境卡里的一行，不做独立卡片（2026-11-04）。
  会话页、环境卡、审批卡、菜单的样式是 tokens.css、app.css、composer.css 原样内联的，
  标签结构取自 desktop-web 的真实 DOM。新增的样式都在最后一段，标了「新增」。
  Chrome 窗口、扩展弹窗和系统通知是画出来的，窗口前后切换用来模拟"聚焦到那个窗口"。
  可以用地址带状态直接打开：#mode=new&scene=need&v=gc&theme=dark
-->
<style>
/* tokens.css */
/* Design tokens: the colours, type, spacing and motion every part of the
   window draws with, light and dark. Taken as they are from the baseline
   (hermesh's desktop app); platform differences are tokens too
   (html[data-platform]), never branches in components. */
:root {
  /* The brand's electric blue (assets/brand): --accent fills buttons (white on
     it 4.6:1), --accent-fg is it as text (5.6:1 on white). Then the colours
     of states, and one spacing scale in golden-ratio steps. */
  --accent: #1f6bff;
  --accent-fg: #1a5ce6;
  --ok: #17924f;
  --warn: #d0700a;
  --danger: #d7333f;
  --sp-1: 8px;
  --sp-2: 13px;
  --sp-3: 21px;
  --sp-4: 34px;
  --sp-5: 55px;
  /* Corners, small: the window is square-cut, so nothing is a pill but a switch,
     a dot or a counter. Controls (buttons, segments, fields, menu items) take
     --r-sm; what sits inside a control takes --r-xs. A container's corner is its
     content's plus its padding, so the two curves stay parallel: rows --r-md,
     cards and menus --r-lg, sheets and the composer --r-xl. */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 10px;
  --r-xl: 12px;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --ease-in: cubic-bezier(0.3, 0, 1, 1);
  --ease-in-out: cubic-bezier(0.45, 0, 0.55, 1);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, "JetBrains Mono", Consolas, monospace;
  --fs: 13px;
  /* The window's chrome: the top band, and room for the system's window buttons. */
  --top: 44px;
  --lights: 78px;
  --caption: 0px;

  --win: #ffffff; --win2: #f4f4f7; --win3: #ebebf0;
  --side: #f4f4f7; --side-head: #f4f4f7; --side-tint: rgba(246, 246, 249, .28);
  --l1: rgba(0, 0, 0, .86); --l2: rgba(0, 0, 0, .54); --l3: rgba(0, 0, 0, .32); --l4: rgba(0, 0, 0, .14);
  --sep: rgba(0, 0, 0, .075); --fill: rgba(0, 0, 0, .045); --fill2: rgba(0, 0, 0, .075); --fill3: rgba(0, 0, 0, .12);
  --sel: rgba(31, 107, 255, .12); --sel-fg: #1a56d6; --side-sel: rgba(0, 0, 0, .075);
  --accent-t: var(--accent-fg); --accent-bg: rgba(31, 107, 255, .10);
  --green: var(--ok); --green-bg: rgba(23, 146, 79, .11); --orange: var(--warn); --orange-bg: rgba(230, 126, 10, .12); --red: var(--danger); --red-bg: rgba(215, 51, 63, .10);
  /* The parts of the context, beside the accent, green and orange. */
  --violet: #8a5cf5; --teal: #0e9f9a;
  --btn: #ffffff; --btn-sh: 0 0 0 .5px rgba(0, 0, 0, .14), 0 1px 1.5px rgba(0, 0, 0, .08);
  --seg-on: #ffffff; --seg-bd: rgba(0, 0, 0, .12); --field: #ffffff; --field-bd: rgba(0, 0, 0, .16);
  --menu: rgba(248, 248, 250, .80); --menu-solid: #f8f8fa; --menu-bd: rgba(0, 0, 0, .10);
  --bub: var(--l1); --bub-fg: var(--win); --msg: var(--l1);
  --glass: rgba(255, 255, 255, .72); --glass-sh: 0 0 0 .5px rgba(0, 0, 0, .10), 0 2px 8px rgba(0, 0, 0, .08);
  /* Toolbar buttons, and the tint of the glass bar the conversation scrolls under (glass.tsx). */
  --tb-fg: rgba(0, 0, 0, .72);
  --bar-tint: rgba(255, 255, 255, .7);
  --code: #f6f7fa; --add-bg: rgba(23, 146, 79, .10); --del-bg: rgba(215, 51, 63, .08); --add-fg: #127443; --del-fg: #b0232f;
  --scrim: rgba(0, 0, 0, .18);
  /* The composer's pill and the approval card over it; the tray of waiting messages behind it, a step below the window. */
  --pill: #ffffff; --pill-bd: rgba(0, 0, 0, .12);
  --tray: #f4f4f7;
  color-scheme: light;
}


  html[data-theme="dark"] {
    --accent: #1f6bff;
    --accent-fg: #7ab0ff;
    --ok: #3fcf86;
    --warn: #ffab3d;
    --danger: #ff6670;
    --win: #1e1e21; --win2: #29292d; --win3: #323237;
    --side: #25252a; --side-head: #25252a; --side-tint: rgba(28, 28, 32, .3);
    --l1: rgba(255, 255, 255, .88); --l2: rgba(255, 255, 255, .55); --l3: rgba(255, 255, 255, .32); --l4: rgba(255, 255, 255, .14);
    --sep: rgba(255, 255, 255, .09); --fill: rgba(255, 255, 255, .05); --fill2: rgba(255, 255, 255, .085); --fill3: rgba(255, 255, 255, .14);
    --sel: rgba(46, 128, 255, .24); --sel-fg: #a8c8ff; --side-sel: rgba(255, 255, 255, .1);
    --accent-bg: rgba(46, 128, 255, .16);
    --green-bg: rgba(63, 207, 134, .14); --orange-bg: rgba(255, 171, 61, .14); --red-bg: rgba(255, 102, 112, .13);
    --violet: #a585ff; --teal: #3cc8c0;
    --btn: rgba(255, 255, 255, .12); --btn-sh: 0 0 0 .5px rgba(255, 255, 255, .08);
    --seg-on: rgba(255, 255, 255, .1); --seg-bd: rgba(255, 255, 255, .18); --field: rgba(255, 255, 255, .06); --field-bd: rgba(255, 255, 255, .16);
    --menu: rgba(44, 44, 48, .80); --menu-solid: #2c2c30; --menu-bd: rgba(255, 255, 255, .12);
    /* The owner's messages: a quiet raised grey in the dark, not a white block. */
    --bub: rgba(255, 255, 255, .09); --bub-fg: var(--l1);
    /* The model's words: near white, a step brighter than other text. */
    --msg: rgba(255, 255, 255, .95);
    --glass: rgba(60, 60, 66, .62); --glass-sh: 0 0 0 .5px rgba(255, 255, 255, .10), 0 2px 10px rgba(0, 0, 0, .3);
    --tb-fg: rgba(255, 255, 255, .82);
    --bar-tint: rgba(30, 30, 33, .6);
    --code: #18181b; --add-bg: rgba(63, 207, 134, .12); --del-bg: rgba(255, 102, 112, .11); --add-fg: #5fe0a0; --del-fg: #ff8c94;
    --scrim: rgba(0, 0, 0, .35);
    --pill: #28282c; --pill-bd: rgba(255, 255, 255, .09);
    --tray: #19191c;
    color-scheme: dark;
  }


/* Windows: Segoe, a step larger; the caption buttons sit at the top band's right. */
:root[data-platform="win"] {
  --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  --mono: "Cascadia Mono", Consolas, monospace;
  --fs: 13.5px;
  --lights: 12px;
  --caption: 138px;
}

/* Linux: the desktop's UI font; the system draws the title bar. */
:root[data-platform="linux"] {
  --font: system-ui, "Noto Sans", "Noto Sans CJK SC", "Ubuntu", sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", monospace;
  --fs: 13.5px;
  --lights: 12px;
}

/* A page outside the app (a browser preview): no traffic lights to leave room for. */
:root[data-platform="web"] {
  --lights: 12px;
}

/* app.css */
/* The window's parts, as the baseline draws them (sizes, rhythm, motion);
   what finxwork adds (the composer, the approval panel, thinking) follows
   the same rules. Colours come from tokens.css only. */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--win);color:var(--l1);font-family:var(--font);font-size:var(--fs);line-height:1.38;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;cursor:default;overflow:hidden}
#root{height:100%}
/* macOS: the window's sidebar material shows through the sidebar; everything else stays opaque. */
html.vibrant,html.vibrant body{background:transparent}
html.vibrant .side{background:var(--side-tint)}
html.vibrant .grp-h,html.vibrant .grp-row{position:static;background:transparent}
input,textarea,.sel-text{user-select:text;-webkit-user-select:text}
/* Text that can be selected shows the text cursor, as in a text field; its buttons stay arrows. */
.sel-text{cursor:text}
.sel-text button{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fadein{animation:fadein .35s cubic-bezier(.2,0,0,1)}
/* Scrollbars as macOS overlays draw them: no track, a slim faint rounded thumb that shows while its scroller
   moves (.scrolling, main.tsx) and firms up under the pointer. */
::-webkit-scrollbar{width:10px;height:10px;background:transparent}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background-color:transparent;border-radius:999px;border:3px solid transparent;background-clip:padding-box;min-height:32px}
.scrolling::-webkit-scrollbar-thumb{background-color:var(--l4)}
::-webkit-scrollbar-thumb:hover{background-color:var(--l3)}
::-webkit-scrollbar-thumb:active{background-color:var(--l2)}
/* window chrome: the title bar areas drag the window; controls in them don't */
.drag{-webkit-app-region:drag}
.drag button,.drag input,.drag select,.drag a,.drag .no-drag{-webkit-app-region:no-drag}
button{font:inherit;color:inherit}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic.sm{width:13px;height:13px}
.ic.fill{fill:currentColor;stroke:none}
/* controls */
.btn{height:26px;padding:0 13px;border-radius:var(--r-sm);border:0;background:var(--btn);box-shadow:var(--btn-sh);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--l1);flex:none}
.btn:hover{filter:brightness(.98)}
.btn:active{filter:brightness(.93)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(40,60,200,.3)}
.btn.danger{color:var(--red)}
.btn.primary.danger{background:var(--red);color:#fff;box-shadow:0 1px 2px rgba(200,40,60,.3)}
.btn.lg{height:34px;padding:0 20px;font-size:14px}
.btn.sm{height:22px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.42;pointer-events:none}
.btn .ic{width:14px;height:14px}
/* Pointers, as macOS has them: the pointing hand for text links, the I-beam over what takes text; controls keep the arrow. */
.link,a[href]{cursor:pointer}
input:not([type=checkbox],[type=radio],[type=range],[type=color],[type=file],[type=button],[type=submit]),textarea,[contenteditable=true]{cursor:text}
input:disabled,textarea:disabled{cursor:default}
.link:disabled{cursor:default}
.link{border:0;background:none;padding:0;color:var(--accent-t);font-size:inherit}
.link:hover{text-decoration:underline}
.sw{width:34px;height:20px;border-radius:999px;border:0;background:var(--fill3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.2,0,0,1)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(14px)}
.sw:disabled{opacity:.5}
.cb{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;text-align:left}
.cb .box{width:14px;height:14px;border-radius:var(--r-xs);background:var(--field);box-shadow:inset 0 0 0 1px var(--field-bd);display:flex;align-items:center;justify-content:center;flex:none}
.cb.on .box{background:var(--accent);box-shadow:none;color:#fff}
.cb .box .ic{width:11px;height:11px;stroke-width:2.2}
.cb:not(.on) .box .ic{display:none}
/* A segmented control: a quiet track as tall as its buttons; the one chosen is a raised block
   filling it, with a hairline edge. */
.seg{display:inline-flex;background:var(--fill);border-radius:var(--r-sm);padding:0;gap:0;flex:none}
.seg button{border:0;background:transparent;height:26px;padding:0 12px;border-radius:var(--r-sm);font-size:12.5px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.seg button.on{background:var(--seg-on);box-shadow:inset 0 0 0 .5px var(--seg-bd)}
.field{height:26px;border-radius:var(--r-sm);border:0;box-shadow:inset 0 0 0 1px var(--field-bd);background:var(--field);padding:0 9px;font-size:13px;color:var(--l1);outline:none;width:100%}
.field:focus{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--accent-bg)}
.kbd{font-size:11.5px;color:var(--l3);letter-spacing:.04em}
.dotc{width:7px;height:7px;border-radius:50%;background:var(--l3);flex:none;display:inline-block}
.dotc.on{background:var(--green)}
.dotc.warn{background:var(--orange)}
.mono{font-family:var(--mono)}
.muted{color:var(--l2)}
.faint{color:var(--l3)}
.tnum{font-variant-numeric:tabular-nums}
.av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;flex:none}
.psel{appearance:none;-webkit-appearance:none;border:0;background-color:var(--fill2);color:var(--l1);height:24px;border-radius:var(--r-sm);padding:0 24px 0 9px;font:inherit;font-size:12px;width:100%;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 10px,calc(100% - 9px) 10px;background-size:4px 4px;background-repeat:no-repeat}
/* status glyphs */
.sdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;position:relative}
.sdot.w{background:var(--orange)}.sdot.c{background:var(--red)}.sdot.r{background:var(--green)}
.sdot.r::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--green);animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.45}75%,100%{transform:scale(2.3);opacity:0}}
.sdot.i{background:var(--l4)}
@keyframes spin{to{transform:rotate(360deg)}}
.mini-spin{width:12px;height:12px;border-radius:50%;border:1.6px solid var(--fill3);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}

/* main window */
.mainwrap{position:relative;display:grid;grid-template-columns:272px minmax(0,1fr);height:100%;transition:grid-template-columns .3s cubic-bezier(.2,0,0,1)}
.mainwrap.noside{grid-template-columns:0 minmax(0,1fr)}
/* Edge to edge: the sidebar fills the window from top to bottom and left to its edge, one hairline from the content. */
.side{background:var(--side);border-right:.5px solid var(--sep);display:flex;flex-direction:column;min-height:0;overflow:hidden}
/* Sidebar titles a step brighter than other text in the dark, as small text on the material reads grey. */
html[data-theme="dark"] .side{--l1:rgba(255,255,255,.93)}
.noside .side{opacity:0;pointer-events:none}
.mainwrap>.content{grid-column:2}
/* No room for the sidebar beside the conversation, but asked for: over it, opaque, until a click beside it (layout.ts). */
.mainwrap.peek .side{position:absolute;top:0;left:0;bottom:0;z-index:20;width:272px;opacity:1;pointer-events:auto;background:var(--side);
  box-shadow:10px 0 30px rgba(0,0,0,.14);animation:peek-in .22s cubic-bezier(.2,0,0,1)}
.peek-scrim{position:absolute;inset:0;z-index:19;background:rgba(0,0,0,.08);animation:scrim-in .2s}
@keyframes scrim-in{from{opacity:0}}
@keyframes peek-in{from{transform:translateX(-24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.mainwrap.peek .side{animation:none}}
/* A narrow conversation: less margin beside its column and its composer. */
.mainwrap.narrow .dbody{padding-left:var(--sp-3);padding-right:var(--sp-3)}
.mainwrap.narrow .cmp-zone{padding-left:calc(var(--sp-3) - 12px);padding-right:calc(var(--sp-3) - 12px)}
/* The sidebar toggle sits a step after the traffic lights (which end at x 74); the list's view options end the row. */
.side-top{height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 var(--lights);flex:none}
.tb{height:28px;min-width:28px;border:0;background:transparent;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--tb-fg);gap:5px;padding:0 6px}
.tb .ic{stroke-width:1.45}
.tb:hover{background:var(--fill2);color:var(--l1)}
.tb.on{background:var(--fill2);color:var(--l1)}
/* A toolbar button's tip (tips.tsx): placed by script, shown once placed. */
.tip{position:fixed;left:0;top:0;z-index:1000;visibility:hidden;pointer-events:none;padding:4px 8px;border-radius:var(--r-sm);background:var(--menu-solid);box-shadow:0 0 0 .5px var(--menu-bd),0 2px 8px rgba(0,0,0,.12);font-size:12px;line-height:16px;color:var(--l1);white-space:nowrap;animation:tip-in .1s var(--ease-out)}
.tip kbd{margin-left:6px;font:inherit;color:var(--l2)}
@keyframes tip-in{from{opacity:0}}
/* One rhythm with the list: rows 32 high, 34 apart. */
.side-nav{padding:0 8px 6px;display:flex;flex-direction:column;gap:2px;flex:none}
.nav-i{display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border-radius:var(--r-md);font-size:14px;border:0;background:none;width:100%;text-align:left}
.nav-i .ic{width:18px;height:18px;color:var(--l1)}
/* The shortcut shows on hover only: the menus say it too. */
.nav-i .kbd{margin-left:auto;opacity:0;transition:opacity .12s}
.nav-i:hover .kbd,.nav-i:focus-visible .kbd{opacity:1}
.nav-i:hover{background:var(--fill)}
.nav-i.sel{background:var(--side-sel)}
.nav-i .cnt{margin-left:auto;font-size:11.5px;color:var(--l2);font-variant-numeric:tabular-nums}
.side-list{flex:1;overflow-y:auto;min-height:0;padding:0 8px 8px}
.side-list>[role=group]{display:flex;flex-direction:column;gap:2px}
/* The list's heading, a step below the actions so the list reads as its own part: its name, and ▾ to collapse every group (▸ when all are shut). */
.side-lh{display:flex;align-items:center;padding:12px 8px 4px;flex:none}
.side-lh>.tb{margin:-2px 4px -2px auto}
.side-lh-t{display:flex;align-items:center;gap:4px;height:24px;padding:0 10px;border:0;background:none;font:inherit;font-size:12px;color:var(--l2);border-radius:var(--r-sm)}
.side-lh-t:hover:not(:disabled){color:var(--l1)}
.side-lh-t .ic{width:14px;height:14px;transition:transform .15s var(--ease-out)}
.side-lh-t.shut .ic{transform:rotate(-90deg)}
/* A group's heading: its title, its count, and ▾ (▸ when collapsed); a click collapses or opens it. */
.grp-h{position:sticky;top:0;z-index:2;font:inherit;font-size:12px;font-weight:400;color:var(--l2);padding:24px 10px 6px;margin-bottom:2px;display:flex;align-items:center;gap:6px;background:var(--side-head);border:0;width:100%;text-align:left}
.side-list>[role=group]:first-child .grp-h{padding-top:8px}
.grp-h:hover{color:var(--l1)}
.grp-h .n{font-weight:500;color:var(--l3)}
.grp-h .ic{width:16px;height:16px;color:var(--l2);transition:transform .15s var(--ease-out)}
.grp-h.shut .ic:not(.gi){transform:rotate(-90deg)}
.grp-h .gt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* In the list a heading sits in a row that sticks; a project's row shows + on hover, for a new session there. */
.grp-row{position:sticky;top:0;z-index:2;display:flex;align-items:flex-end;background:var(--side-head)}
.grp-row .grp-h{position:static;background:none;flex:1;min-width:0}
.grp-row .grpact{display:none;flex:none;margin-bottom:2px}
.grp-row:hover .grpact,.grp-row .grpact:focus-visible{display:flex}
/* Grouped by project, a heading is a row like the list's own: the folder, the name in full colour, close to its neighbours. */
.side-list.by-project .grp-h{padding:7px 10px;margin:0;font-size:13.5px;color:var(--l1);gap:8px}
.side-list.by-project>[role=group]:first-child .grp-h{padding-top:7px}
.side-list.by-project .grp-h .gi{width:16px;height:16px;flex:none;color:var(--l2)}
.side-list.by-project .grp-h .ic:not(.gi){color:var(--l3)}
.side-list.by-project .grp-row{border-radius:var(--r-md);align-items:center}
.side-list.by-project .grp-row:hover{background:linear-gradient(var(--fill),var(--fill)),var(--side-head)}
html.vibrant .side-list.by-project .grp-row:hover{background:var(--fill)}
.side-list.by-project .grp-row .grpact{margin:0 4px 0 0}
.side-list.by-project>[role=group]+[role=group]{margin-top:2px}
.srow{display:flex;padding:7px 10px;border-radius:var(--r-md);align-items:flex-start;border:0;background:none;width:100%;text-align:left;font-size:14px}
.srow:hover{background:var(--fill)}
.srow.sel{background:var(--side-sel)}
.srow .sdot{width:6px;height:6px}
.srow.arch .stitle{color:var(--l2)}

/* In a task: a faded band crosses the title left to right every 2.4s at an even speed, like a progress
   bar, the next one entering as the last leaves, until the task ends. The title itself is
   transparent (it keeps the row's layout and its words); two copies draw it, one in its colour seen
   through a mask with a soft hole, one in --l3 seen only through that hole. The masks (three titles wide)
   slide across while the copies slide back by as much, so the copies stay on the title: transforms only,
   which the compositor runs, and translucent colours, so the band fades into any background. */
/* A running title is as wide as its words (the band crosses the words, not the empty row); its right
   margin keeps what follows at the row's right end. */
.stitle.run{position:relative;color:transparent;flex:0 1 auto;margin-right:auto}
.stitle .shine{position:absolute;top:0;bottom:0;left:-100%;width:300%;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,#000 38%,transparent 50%,#000 62%);mask-image:linear-gradient(90deg,#000 38%,transparent 50%,#000 62%);animation:stitle-run 2.4s linear infinite}
.stitle .shine.band{-webkit-mask-image:linear-gradient(90deg,transparent 38%,#000 50%,transparent 62%);mask-image:linear-gradient(90deg,transparent 38%,#000 50%,transparent 62%)}
.stitle .shine::before{content:attr(data-t);position:absolute;top:0;bottom:0;left:calc(100% / 3);width:calc(100% / 3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--l1);animation:stitle-run-back 2.4s linear infinite}
.stitle .shine.band::before{color:var(--l3)}
@keyframes stitle-run{from{transform:translateX(-28.6667%)}to{transform:translateX(28.6667%)}}
@keyframes stitle-run-back{from{transform:translateX(86%)}to{transform:translateX(-86%)}}

/* The same band over anything in progress in the conversation (a step, the working line): there the
   words may be code with its own colours, so the band is a mask over the element instead of copies of
   its text, three times its width and sliding so the band enters at its left edge and leaves at its
   right, in the sidebar's 2.4s, dimming the words to about a third. */
.shimmer{-webkit-mask-image:linear-gradient(90deg,#000 38%,rgba(0,0,0,.36) 50%,#000 62%);mask-image:linear-gradient(90deg,#000 38%,rgba(0,0,0,.36) 50%,#000 62%);-webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;animation:shimmer 2.4s linear infinite}

@media (prefers-reduced-motion:reduce){.shimmer{animation:none;-webkit-mask-image:none;mask-image:none}}
