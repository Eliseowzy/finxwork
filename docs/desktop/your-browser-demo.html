  front: "fw", tab: 1, pop: false, menu: false, phase: "", revoked: false, went: false, loggedIn: false,
  toast: false, ext: false, closedAll: false, info: true, panel: false, peek: false, recovered: false,
};
let timers = [];
const later = (ms, fn) => timers.push(setTimeout(fn, ms));
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
const isNew = () => S.mode === "new";
const V = () => S.variant[S.scene];
const narrow = () => S.scene === "tight" && V() === "narrow";
const waitsLogin = () => isNew() && (S.scene === "need" || (S.scene === "tight" && V() === "need"));

/** Where this demo is: a scene entered afresh. */
function go(scene, variant) {
  clearTimers();
  S.scene = scene;
  if (variant) S.variant[scene] = variant;
  Object.assign(S, { front: "fw", tab: 1, pop: false, menu: false, phase: "", revoked: false, went: false, loggedIn: false, toast: false, ext: false, closedAll: false, info: true, panel: false, peek: false, recovered: false });
  const v = V();
  if (scene === "need") {
    S.tab = 2;
    if (v === "gc") { S.front = "gc"; if (isNew()) S.toast = true; }
  }
  if (scene === "tight") {
    if (v === "panel" || v === "need") S.panel = true;
    if (v === "hidden") S.info = false;
    if (v === "need") S.tab = 2;
  }
  if (scene === "lost" && isNew()) {
    if (v === "auto") { S.phase = "wait"; later(3600, () => { S.phase = "ok"; S.recovered = true; render(); }); }
    if (v === "closed") {
      S.phase = "closed"; S.tab = 0;
      later(1500, () => { S.phase = "opening"; render(); });
      later(3000, () => { S.phase = "ok"; S.recovered = true; render(); });
    }
    if (v === "ext") S.phase = "off";
  }
  render();
}

/** What the row (or card) says about the user's browser; null while the session has nothing there. */
function yours() {
  if (!isNew() || S.scene === "idle" || S.closedAll) return null;
  const v = V();
  if (S.revoked) return { sub: "已收回控制", act: ["允许", "regrant"] };
  if (waitsLogin() && !S.loggedIn) return { sub: "等你登录", dot: "w" };
  if (waitsLogin()) return { sub: "等你确认", dot: "w" };
  if (S.scene === "lost") {
    if (v === "auto" && S.phase === "wait") return { sub: "正在重新连接", run: true, dim: true };
    if (v === "closed" && S.phase === "closed") return { sub: "已关闭", dim: true };
    if (v === "closed" && S.phase === "opening") return { sub: "正在打开", run: true, dim: true };
    if (v === "closed") return { sub: "1 个标签页", run: true };
    if (v === "ext" && S.phase === "off") return { sub: "扩展已停用", dot: "c" };
  }
  if (S.scene === "done") return { sub: "3 个标签页" };
  return { sub: "3 个标签页", run: true };
}

function tabsNow() {
  if (S.closedAll) return [];
  let tabs = [PULLS, PR12, NOTES];
  if (S.scene === "lost" && isNew() && V() === "closed") tabs = [PULLS];
  if ((S.scene === "need" || (S.scene === "tight" && V() === "need")) && !S.loggedIn) tabs = [PULLS, PR12, LOGIN];
  return tabs;
}

const running = () => {
  if (S.revoked) return false;
  if (S.scene === "done") return false;
  if (!isNew() && (S.scene === "need" || S.scene === "lost")) return false;
  return true;
};
const waiting = () => isNew() && !S.revoked && (waitsLogin() || (S.scene === "lost" && V() === "ext" && S.phase === "off"));

// ── The sidebar: the app's own rows ──
function srow(title, time, opts = {}) {
  const run = opts.run;
  const t = run ? `<span class="stitle run" title="${title}">${title}<span class="shine" data-t="${title}" aria-hidden="true"></span><span class="shine band" data-t="${title}" aria-hidden="true"></span></span>` : `<span class="stitle" title="${title}">${title}</span>`;
  const dot = opts.dot ? `<span class="sdot ${opts.dot}" role="img" title="等你批准"></span>` : "";
  return `<div class="srow has-act ${opts.sel ? "sel" : ""}" role="listitem"><div class="smain"><div class="sl1">${t}<span class="smeta">${dot}</span><button class="rowact" title="更多操作">${ic("more", "sm")}</button></div><div class="sl2"><span class="sl2t"></span><span class="stime">${time}</span></div></div></div>`;
}
const grp = (name, rows) => `<div role="group"><div class="grp-row"><button class="grp-h" aria-expanded="true">${ic("folder", "gi")}<span class="gt">${name}</span>${ic("caret", "sm")}</button><button class="tb grpact">${ic("plus")}</button></div>${rows.join("")}</div>`;
function sidebar() {
  const here = srow(SESSION, running() ? "0:38" : "14:14", { sel: true, run: running(), dot: waiting() ? "w" : "" });
  return `<aside class="side" aria-label="边栏">${SIDE.top}${SIDE.nav}${SIDE.lh}<div class="side-list by-project" role="list">
    ${grp("calc-lib", [srow("给 calc 的三个模块补测试", "1 分钟前")])}
    ${grp("finxwork", [here, srow("给 finx-llm 加一个 Gemini 的接入", "1 分钟前"), srow("清理会话的临时输出", "11:03"), srow("评审上下文压缩方案", "41 分钟前"), srow("排查启动慢的原因", "周日")])}
    ${grp("hermesh", [srow("整理 README 的安装说明", "昨天")])}
  </div>${SIDE.acct}</aside>`;
}

// ── The conversation: the app's own markup ──
const user = (text) => `<div class="um"><div class="bub sel-text">${text}</div><div class="msg-act"><span class="msg-meta"><time>14:12</time></span><button class="tb" aria-label="拷贝">${ic("copy", "sm")}</button></div></div>`;
const am = (html, act = "") => `<div class="am ${act ? "act" : ""}"><div class="md sel-text">${html}</div>${act}</div>`;
const step = (verb, obj, mark = false) => `<div class="tool"><button class="th"><span class="vb">${verb}</span><span class="sm2 ${mark ? "mk-new" : ""}">${obj}</span></button></div>`;
const fold = (title, body) => `<div class="tgroup" data-fold><button class="tg-h" data-a="fold" aria-expanded="false"><span>${title}</span>${ic("caret", "chev")}</button><div class="tg-b">${body.join("")}</div></div>`;
const working = (text, meta, shimmer = true) => `<div class="working" role="status"><img src="${A.mark}" alt="" style="display:block;flex:none;width:18px;height:18px;margin-top:2px"><div class="wk-line"><span class="${shimmer ? "shimmer" : ""}">${text}</span><span class="wk-meta">${meta}</span></div></div>`;
const finish = (meta) => `<div class="msg-act"><button class="tb" aria-label="拷贝">${ic("copy", "sm")}</button><span class="msg-meta"><time>14:14</time><span>${meta}</span></span></div>`;

function chat() {
  const n = isNew();
  const open = `<div class="tdiv">今天 14:12</div>` + user("帮我看看 finxwork 仓库里还没处理的 PR 评论，整理成待办。")
    + fold("运行了 2 条命令", [step("已运行", "git branch --show-current"), step("已运行", "git log --oneline -5")])
    + am("<p>先看一下本地分支，再去网页上看评论。</p>");
  if (S.scene === "idle") return open + working("工作中", "· 9 秒 · 18K tokens");
  const visit = n ? step("已访问", "github.com · Chrome", true) : step("已访问", "open github.com in your browser");
  const inChrome = open + visit + am("<p>我在你的 Chrome 里打开了 PR 列表，逐个看评论。</p>") + fold("访问了 2 个网页", [step("已访问", "PR #12"), step("已访问", "PR #9")]);
  const list = `<p>整理好了，一共 5 条没处理的评论：</p><ul><li><code>#12</code> 补一个"替换程序后宿主重连"的场景测试</li><li><code>#12</code> 退出码要区分"被拒"和"正常结束"</li><li><code>#9</code> 最近使用的模型数量是否要可配置（待你回答）</li><li><code>#9</code> 分组标题在深色下对比度偏低</li><li><code>#7</code> 预算单位的文档还没改</li></ul>`;

  switch (S.scene) {
    case "work":
      if (S.revoked) return inChrome + step("已停止", "你在 Chrome 里收回了控制", true) + am("<p>你收回了 Chrome 的控制，我先停在这里。已经看完 2 个 PR，需要的话我可以先把这部分整理出来。</p>", finish(" · 用时 41 秒 · 58K tokens"));
      return inChrome + working("工作中", "· 38 秒 · 52K tokens");
    case "need":
      if (!n) return inChrome + am("<p>打开通知页时跳到了登录页，看起来需要重新登录。请你在浏览器里登录，然后告诉我继续。</p>", finish(" · 用时 44 秒 · 61K tokens"));
      return inChrome + am("<p>打开通知页时跳到了登录页，需要你登录一下。我在这里等着，登录好就继续。</p>") + working("等你登录", "· 12 秒", false);
    case "lost": {
      if (!n) return inChrome + am("<p>FinxWork 扩展没有连上，所以用不了你自己的浏览器。麻烦你在 Chrome 里打开 FinxWork 扩展，或者在 FinxWork 里重新连接，然后告诉我。内置浏览器没有你的登录状态。</p>", finish(" · 用时 46 秒 · 63K tokens"));
      const v = V();
      if (v === "auto") return inChrome + (S.phase === "wait" ? working("等 Chrome 重新连接", "· 3 秒") : step("已重新连接", "Chrome，3 个标签页都还在", true) + working("工作中", "· 52 秒 · 66K tokens"));
      if (v === "closed") return inChrome + (S.phase === "ok" ? step("已打开", "Chrome，上次的标签页随它关了，重新打开", true) + working("工作中", "· 58 秒 · 66K tokens") : working(S.phase === "closed" ? "等 Chrome 打开" : "正在打开 Chrome", "· 2 秒"));
      if (S.phase === "off") return inChrome + working("等你打开扩展", "· 6 秒", false);
      return inChrome + step("已重新连接", "Chrome，3 个标签页都还在", true) + working("工作中", "· 1 分 4 秒 · 66K tokens");
    }
    case "done":
      return inChrome + fold("访问了 3 个网页", [step("已访问", "PR #7"), step("已访问", "Notifications"), step("已访问", "PR #12")]) + am(list + (n ? "<p>这 3 个标签页还开着，可以直接在 Chrome 里回复。</p>" : ""), finish(" · 用时 1 分 42 秒 · 96K tokens"));
    case "tight":
      if (V() === "need") return inChrome + am("<p>打开通知页时跳到了登录页，需要你登录一下。我在这里等着，登录好就继续。</p>") + working("等你登录", "· 12 秒", false);
      return inChrome + working("工作中", "· 38 秒 · 52K tokens");
  }
  return open;
}

  const live = running();

}

function popup() {
  const y = yours();
  const line = (b, s, actions, st = '<i class="dotc on"></i>已连接') => `<div class="gc-pop mk-new"><div class="gc-pop-h"><img src="${A.mark}" alt="">FinxWork<span>${st}</span></div><div class="gc-pop-b"><b>${b}</b><span>${s}</span></div><div class="gc-pop-f">${actions}</div></div>`;
  const back = `<button class="btn" data-a="back">回到对话</button>`;
  if (y && y.dot === "w") return line(SESSION, "在等你登录 github.com", `${back}<button class="btn primary" data-a="loggedin">我处理好了</button>`);
  if (y && y.dim) return line(SESSION, "正在重新连接 FinxWork…", back, '<i class="dotc"></i>连接中');
  if (S.revoked) return line(SESSION, "已收回控制，智能体不再操作这里", `${back}<button class="btn primary" data-a="regrant">允许</button>`);
  if (S.scene === "done") return line(SESSION, "任务已结束 · 3 个标签页留给你", back);
  return line(SESSION, "3 个标签页 · 工作中", `<button class="btn danger" data-a="stopagent">停止</button>${back}`);
}
function chrome() {
  const n = isNew();
  const tabs = tabsNow();
  const page = S.ext ? { t: "扩展程序", u: "chrome://extensions", p: "ext" } : tabs[Math.min(S.tab, tabs.length - 1)] ?? { u: "", p: "" };
  const wait = n && waitsLogin() && !S.loggedIn;
  const group = wait ? "#e8710a" : "#1a73e8";
  const title = n ? (wait ? `等你 · ${SESSION}` : SESSION) : "FinxWork";
  const other = n ? "排查启动慢的原因" : "FinxWork";
  const y = yours();
  const live = n && y && y.run && !y.dim;
  const bar = n
    ? !S.revoked && S.scene !== "done" && !(y && y.dim) && S.phase !== "off"
    : S.scene !== "lost";
  const lostNow = !n && S.scene === "lost";
  const extOff = n && S.scene === "lost" && V() === "ext" && S.phase === "off";
  const badge = wait ? `<span class="gc-badge mk-new">1</span>` : lostNow ? `<span class="gc-badge grey">!</span>` : "";
  return `<div class="d-lights"><i></i><i></i><i></i></div>
    <div class="gc-strip">
      <span class="gc-chip ${n ? "mk-new" : ""}" style="--g:#80868b">${other}</span>
      <span class="gc-chip ${n ? "mk-new" : ""}" style="--g:${group}">${title}</span>
      ${tabs.map((t, i) => {
        const on = !S.ext && i === Math.min(S.tab, tabs.length - 1);
        return `<div class="gc-tab grp ${on ? "on" : ""}" style="--g:${group}" data-a="tab" data-t="${i}">${live && on ? '<span class="mini-spin"></span>' : FAV}<span class="t">${t.t}</span>${ic("x")}</div>`;
      }).join("")}
      ${S.ext ? `<div class="gc-tab on"><span class="t">扩展程序</span>${ic("x")}</div>` : ""}
      <button class="gc-new">${ic("plus")}</button>
    </div>
    <div class="gc-bar">
      <button class="gc-b">${ic("arrowLeft")}</button><button class="gc-b">${ic("arrowRight")}</button><button class="gc-b">${ic("retry")}</button>
      <div class="gc-omni">${page.p === "ext" ? ic("globe") : ic("lock")}<span>${page.u}</span></div>
      ${extOff ? "" : `<button class="gc-b" data-a="pop" title="${lostNow ? "" : "FinxWork"}"><img src="${A.ext}" alt="FinxWork">${badge}</button>`}
      <span class="gc-av">Y</span>
      <button class="gc-b">${ic("more")}</button>
    </div>
    ${bar ? `<div class="gc-info"><span>"FinxWork"已开始调试此浏览器</span><button data-a="revoke">取消</button></div>` : ""}
    <div class="gc-page">${webpage(page)}</div>
    ${S.pop && n ? popup() : ""}
    ${lostNow && S.front === "gc" ? `<div class="gc-tip">FinxWork: the FinxWork service refused the extension: not finx's extension host: process 24626 runs /Users/you/.Trash/FinxWork 11-27-06-674.app/Contents/MacOS/finx, not /Applications/FinxWork.app/Contents/MacOS/finx</div>` : ""}`;
}

// ── What each scene means ──
function note() {
  const n = isNew();
  const v = V();
  switch (S.scene) {
    case "idle": return "<b>智能体还没用到你的 Chrome。</b>界面和今天完全一样，不多一行，也不多一个按钮。";
    case "work": return n
      ? "<b>“环境”卡多一行，操作时这一行有流光。</b>点它，Chrome 到最前，停在正在操作的标签页；不点就不打扰。Chrome 的分组改用对话标题，点扩展图标能回到对话。试试点“取消”收回控制。"
      : "<b>现状：</b>Chrome 窗口在后台打开，应用里只有一行步骤。看不出开了几个标签页，也跳不过去；Chrome 里所有分组都叫 FinxWork，分不清是哪个对话的。";
    case "need": return n
      ? `<b>任务停下来等你，提示在审批的位置。</b>一键跳到登录页，回来点“我处理好了”就继续。${v === "gc" ? "你在 Chrome 里时，靠系统通知、扩展角标和橙色分组告诉你。" : ""}依赖内核新增“等你处理”状态。`
      : "<b>现状：</b>模型说完就结束这一轮。你要自己找到那个窗口，登录完再回来打字说“继续”。";
    case "lost":
      if (!n) return "<b>现状：</b>模型转告一段话，任务结束。切到 Chrome（点右边露出的窗口），叹号的原因只在悬停提示里，还是内部错误。";
      if (v === "auto") return "<b>断线不打扰你，也不算失败。</b>任务等着，连上后接管原来的标签页继续，几秒内恢复。依赖宿主自动重连和标签页重新接管。";
      if (v === "closed") return "<b>Chrome 关了：</b>任务要用时在后台打开，不抢焦点。Chrome 关闭时标签页已经没了，智能体重新打开页面。";
      return "<b>只有这种情况必须你动手。</b>一张卡说清要做什么，按钮直达扩展页。打开开关后任务自己继续（点按钮试试）。";
    case "done": return n
      ? "<b>任务结束，标签页归你。</b>不再自动关，调试提示条收起。这一行还在，随时能跳过去；悬停出现 ⋯，可以逐个跳转或全部关闭。"
      : "<b>现状：</b>调试提示条一直挂着。切到别的对话 15 分钟后，这 3 个标签页会被自动关掉，没有提醒。";
    case "tight": return n
      ? `<b>信息卡不显示时，这一行移到顶栏，只在一个地方出现。</b>和内置浏览器按钮在面板打开时移到面板上是同一个做法。${v === "need" ? "需要你时按钮多一个橙点，提示仍在审批的位置。" : ""}`
      : "<b>现状：</b>信息卡不显示时，也没有别的入口。";
  }
  return "";
}

// ── Drawing ──
function seg(el, items, current, on) {
  el.innerHTML = items.map(([id, label]) => `<button class="${id === current ? "on" : ""}" data-id="${id}">${label}</button>`).join("");
  el.onclick = (e) => { const b = e.target.closest("button"); if (b) { stopPlay(); on(b.dataset.id); } };
}
function render() {
  document.documentElement.dataset.theme = S.theme;
  seg($("mode"), [["now", "现在"], ["new", "新方案"]], S.mode, (m) => { S.mode = m; go(S.scene); });
  seg($("scene"), SCENES, S.scene, (s) => go(s));
  seg($("theme"), [["light", "浅色"], ["dark", "深色"]], S.theme, (t) => { S.theme = t; render(); });
  const vars = isNew() ? VARS[S.scene] : null;
  $("variant").style.display = vars ? "" : "none";
  if (vars) seg($("variant"), vars, V(), (v) => go(S.scene, v));
  $("note").innerHTML = note();
  const scroll = $("scroll");
  const keep = scroll ? scroll.scrollTop : null;
  const fw = $("fw");
  fw.className = `d-win d-fw ${S.front === "fw" ? "front" : ""} ${narrow() ? "narrow" : ""}`;
  fw.innerHTML = page();
  const gc = $("gc");
  const hidden = S.scene === "idle" || S.closedAll || (isNew() && S.scene === "lost" && V() === "closed" && S.phase === "closed");
  gc.className = `d-win d-gc gc ${S.front === "gc" ? "front" : ""} ${hidden ? "off" : ""}`;
  gc.innerHTML = hidden ? "" : chrome();
  $("toast").innerHTML = S.toast ? `<button class="d-toast mk-new" data-a="focus" data-t="2"><img src="${A.mark}" alt=""><div><b>FinxWork · ${SESSION}</b><span>需要你在 Chrome 里登录 github.com</span></div></button>` : "";
  const next = $("scroll");
  if (next) next.scrollTop = next.scrollHeight;
  void keep;
}
function fit() {
  const r = $("wrap").getBoundingClientRect();
  const k = Math.min(1, r.width / 1400, r.height / 850);
  const x = Math.max(0, (r.width - 1400 * k) / 2);
  const y = Math.max(0, (r.height - 850 * k) / 2);
  $("stage").style.transform = `translate(${x}px,${y}px) scale(${k})`;
}
window.addEventListener("resize", fit);

function raise(which) {
  S.front = which;
  S.menu = false;
  if (which === "gc") S.toast = false;
  render();
  const el = $(which);
  el.classList.remove("d-raise");
  void el.offsetWidth;
  el.classList.add("d-raise");
}
function focusChrome(tab) {
  S.ext = false;
  if (tab !== undefined) S.tab = tab;
  raise("gc");
}

// ── What a click does ──
const actions = {
  focus(el) {
    const y = yours();
    if (S.scene === "lost" && V() === "ext" && S.phase === "off") return actions.goext();
    if (y && y.dim && S.phase === "closed") return;
    focusChrome(el.dataset.t !== undefined ? Number(el.dataset.t) : undefined);
  },
  menu() { S.menu = !S.menu; render(); },
  fold(el) { const g = el.closest("[data-fold]"); g.classList.toggle("open"); el.setAttribute("aria-expanded", g.classList.contains("open")); },
  info() {
    if (narrow()) { S.peek = !S.peek; return render(); }
    if (S.panel) { S.panel = false; S.info = true; return render(); }
    S.info = !S.info; render();
  },
  panel() { S.panel = !S.panel; if (S.panel) S.info = true; render(); },
  tab(el) { if (S.ext) S.ext = false; S.tab = Number(el.dataset.t); render(); },
  pop() { if (!isNew()) return; S.pop = !S.pop; render(); },
  back() { S.pop = false; raise("fw"); },
  gologin() { S.went = true; focusChrome(2); },
  signin() { S.loggedIn = true; S.went = true; S.tab = 0; render(); },
  loggedin() { go("work"); },
  skip() { go("done"); },
  goext() { S.ext = true; raise("gc"); },
  exton() { S.phase = "ok"; S.recovered = true; S.ext = true; render(); },
  revoke() { S.revoked = true; S.pop = false; render(); },
  regrant() { S.revoked = false; S.pop = false; render(); },
  stopagent() { S.pop = false; go("done"); },
  closeall() { S.closedAll = true; S.menu = false; S.front = "fw"; render(); },
};
document.addEventListener("click", (e) => {
  const inWin = e.target.closest(".d-win");
  // A click on the window behind brings it forward first, as on a desktop.
  if (inWin && !inWin.classList.contains("front")) {
    stopPlay();
    raise(inWin.id);
    e.preventDefault();
    return;
  }
  const el = e.target.closest("[data-a]");
  if (el && actions[el.dataset.a]) {
    if (!e.target.closest(".d-bar")) stopPlay();
    actions[el.dataset.a](el);
    return;
  }
  if (S.menu && !e.target.closest(".yr-menu")) { S.menu = false; render(); }
  if (S.pop && !e.target.closest(".gc-pop")) { S.pop = false; render(); }
});

// ── "走一遍" ──
let playing = [];
function stopPlay() {
  playing.forEach(clearTimeout);
  playing = [];
  $("play").textContent = "走一遍";
}
function play() {
  if (playing.length) return stopPlay();
  S.mode = "new";
  const seq = [
    [0, () => go("idle")],
    [2600, () => go("work")],
    [5600, () => raise("gc")],
    [8200, () => raise("fw")],
    [9200, () => go("need", "fw")],
    [12400, () => { S.went = true; focusChrome(2); }],
    [14400, () => { actions.signin(); raise("fw"); }],
    [16400, () => go("work")],
    [17600, () => go("lost", "auto")],
    [22800, () => go("done")],
    [26000, () => { S.menu = true; render(); }],
    [28400, () => { S.menu = false; render(); stopPlay(); }],
  ];
  $("play").textContent = "停止";
  playing = seq.map(([t, fn]) => setTimeout(fn, t));
}
$("play").onclick = play;
$("marks").onclick = () => { const on = $("page").classList.toggle("marks"); $("marks").textContent = on ? "隐藏标记" : "标出改动"; };

// ── Start ──
const q = new URLSearchParams(location.hash.slice(1));
S.theme = q.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
if (q.get("mode")) S.mode = q.get("mode");
if (q.get("marks")) $("page").classList.add("marks");
go(q.get("scene") || "work", q.get("v") || undefined);
fit();
</script>
</body>
</html>
