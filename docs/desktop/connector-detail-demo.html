<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>连接器详情页</title>
<style>
/* Tokens: copied from apps/desktop/src/renderer/src/styles/tokens.css. */
:root{
  --accent:#1f6bff;--accent-fg:#1a5ce6;--ok:#17924f;--warn:#d0700a;--danger:#d7333f;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,"JetBrains Mono",Consolas,monospace;
  --sp-1:8px;--sp-2:13px;--sp-3:21px;--sp-4:34px;--sp-5:55px;
  --r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:10px;--r-xl:12px;
  --win:#ffffff;--win2:#f4f4f7;--side:#f4f4f7;
  --l1:rgba(0,0,0,.86);--l2:rgba(0,0,0,.54);--l3:rgba(0,0,0,.32);
  --sep:rgba(0,0,0,.075);--fill:rgba(0,0,0,.04);--fill2:rgba(0,0,0,.075);--fill3:rgba(0,0,0,.12);
  --accent-t:var(--accent-fg);
  --orange-bg:rgba(208,112,10,.09);--red-bg:rgba(215,51,63,.07);
  --btn:#ffffff;--btn-sh:0 0 0 .5px rgba(0,0,0,.14),0 1px 1.5px rgba(0,0,0,.08);
  --menu-solid:#f8f8fa;--menu-bd:rgba(0,0,0,.10);--edge:rgba(0,0,0,.1);--lift:0 1px 2px rgba(0,0,0,.1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --accent-fg:#7ab0ff;--ok:#3fcf86;--warn:#ffab3d;--danger:#ff6670;
  --win:#1e1e21;--win2:#29292d;--side:#25252a;
  --l1:rgba(255,255,255,.88);--l2:rgba(255,255,255,.55);--l3:rgba(255,255,255,.32);
  --sep:rgba(255,255,255,.09);--fill:rgba(255,255,255,.045);--fill2:rgba(255,255,255,.085);--fill3:rgba(255,255,255,.14);
  --orange-bg:rgba(255,171,61,.11);--red-bg:rgba(255,102,112,.1);
  --btn:rgba(255,255,255,.12);--btn-sh:0 0 0 .5px rgba(255,255,255,.08);
  --menu-solid:#2c2c30;--menu-bd:rgba(255,255,255,.12);--edge:rgba(255,255,255,.12);--lift:0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--win);color:var(--l1);font:13px/1.38 var(--font);-webkit-font-smoothing:antialiased;user-select:none;cursor:default;overflow:hidden;font-feature-settings:"tnum" 0}
button{font:inherit;color:inherit;cursor:default}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.btn{height:28px;padding:0 13px;border-radius:var(--r-sm);border:0;background:var(--btn);box-shadow:var(--btn-sh);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;color:var(--l1)}
.btn .ic{width:14px;height:14px}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(40,60,200,.3)}
.link{border:0;background:none;padding:0;color:var(--accent-t);font-size:12.5px;white-space:nowrap}
.link:hover{text-decoration:underline;text-underline-offset:2px}
.badge{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:var(--r-xs);background:var(--fill2);font-size:11px;font-weight:450;color:var(--l2);white-space:nowrap;letter-spacing:0}
.sw{width:32px;height:19px;border-radius:999px;border:0;background:var(--fill3);position:relative;flex:none;transition:background .2s;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.2,0,0,1)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(13px)}
.mono{font-family:var(--mono)}
.l3{color:var(--l3)}

.win{height:100%;display:flex}
.side{width:248px;flex:none;background:var(--side);padding:52px 10px 0}
.side .it{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:var(--r-md);font-size:13.5px}
.side .it.on{background:var(--fill2)}
.main{flex:1;min-width:0;overflow-y:auto}

/* The page: one column, at most 920 wide so a line of text stays readable; 34 to the window's
   sides, as the list page has. Every distance is on the 8 / 13 / 21 / 34 / 55 scale. */
.body{max-width:920px;padding:44px var(--sp-4) 140px}

/* ── The top line: back, alone. The item's controls sit on its title line, at the right. ── */
.bar{display:flex;align-items:center;height:28px}
.back{display:inline-flex;align-items:center;gap:5px;height:28px;margin-left:-8px;padding:0 10px 0 7px;border:0;border-radius:var(--r-sm);background:none;font-size:13px;color:var(--l2);transition:background .15s,color .15s}
.back:hover{color:var(--l1);background:var(--fill)}
.back .ic{width:14px;height:14px}
.acts{display:flex;align-items:center;gap:var(--sp-1);margin-left:auto;padding-left:var(--sp-3)}
.swl{display:inline-flex;align-items:center;gap:var(--sp-1);height:28px;padding:0 var(--sp-1);font-size:13px;color:var(--l2)}
.more{width:28px;height:28px;margin-right:-6px;border:0;border-radius:var(--r-sm);background:none;color:var(--l2);display:grid;place-items:center;transition:background .15s,color .15s}
.more:hover,.more.open{background:var(--fill2);color:var(--l1)}

/* ── The head: the logo, the name large, then one sentence on what it does. ── */
.head{animation:rise .35s cubic-bezier(.2,0,0,1)}
.title{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-3)}
.tile{width:48px;height:48px;border-radius:var(--r-lg);flex:none;position:relative;overflow:hidden;background:var(--fill2);display:grid;place-items:center;font-size:19px;font-weight:600;color:var(--l2);box-shadow:var(--lift);transition:opacity .2s}
.tile img{width:100%;height:100%;display:block}
.tile.logo::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px var(--edge)}
h1{margin:0;font-size:26px;font-weight:650;letter-spacing:-.5px;line-height:32px}
.title .badge{margin-left:-3px;margin-top:2px}
.lede{margin:var(--sp-2) 0 0;max-width:600px;font-size:13.5px;line-height:22px;color:var(--l2)}

/* ── The facts: one row, each a small label over its value; no box, no rule. The value's
   own action (copy, show) waits beside it until the pointer comes. ── */
.facts{display:flex;flex-wrap:wrap;gap:var(--sp-3) var(--sp-4);margin-top:var(--sp-4)}
.fact{min-width:0}
.fact .k{font-size:11.5px;line-height:16px;color:var(--l3)}
.fact .v{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:13px;line-height:22px;white-space:nowrap}
.fact .v .mono{font-size:12.5px}
.fact .v .sub{color:var(--l3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--l3);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--danger)}
.ok-t{color:var(--ok)}.warn-t{color:var(--warn)}.bad-t{color:var(--danger)}
.ghost{width:20px;height:20px;margin-left:-2px;border:0;border-radius:var(--r-xs);background:none;color:var(--l3);display:grid;place-items:center;opacity:0;transition:opacity .15s,background .15s,color .15s}
.fact:hover .ghost{opacity:1}
.ghost:hover{background:var(--fill2);color:var(--l1)}
.ghost .ic{width:12px;height:12px}

/* ── A note, only when something needs the person; its one action at the right. ── */
.note{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-4);padding:var(--sp-2) var(--sp-2) var(--sp-2) 15px;border-radius:var(--r-lg);font-size:13px;line-height:20px;animation:rise .25s cubic-bezier(.2,0,0,1)}
.note>.ic{align-self:flex-start;margin-top:2px;width:15px;height:15px}
.note .tx{flex:1;min-width:0;color:var(--l2)}
.note .tx b{display:block;font-weight:550;color:var(--l1)}
.note .err{display:block;margin-top:3px;font-family:var(--mono);font-size:11.5px;line-height:17px;color:var(--l2);overflow-wrap:anywhere;user-select:text}
.note.warn{background:var(--orange-bg)}.note.warn>.ic{color:var(--warn)}
.note.bad{background:var(--red-bg)}.note.bad>.ic{color:var(--danger)}

/* ── The tools: a heading, then a line each, the names in one column. The line lights up under
   the pointer; a click opens all of what the tool says. ── */
.tools{margin-top:var(--sp-5);animation:rise .45s cubic-bezier(.2,0,0,1)}
.th{display:flex;align-items:baseline;gap:7px;margin-bottom:var(--sp-1)}
.th h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.1px}
.th .n{font-size:13px;color:var(--l3);font-variant-numeric:tabular-nums}
.th .right{margin-left:auto;display:flex;align-items:baseline;gap:var(--sp-1);font-size:12px;color:var(--l3)}
.tool{display:flex;align-items:baseline;gap:var(--sp-3);padding:7px 12px;margin:0 -12px;border-radius:var(--r-md);font-size:13px;line-height:22px;transition:background .12s}
.tool:hover{background:var(--fill)}
.tool .tn{width:172px;flex:none;font-family:var(--mono);font-size:12.5px;color:var(--l1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .td{flex:1;min-width:0;color:var(--l2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool.open{background:var(--fill)}
.tool.open .td{white-space:normal;color:var(--l1);user-select:text}
.empty{margin:var(--sp-1) 0 0;font-size:13px;color:var(--l3)}

/* Off: the page stays readable but steps back; the controls at the top do not. */
.off .head .tile{opacity:.45}
.off .facts,.off .tools .list{opacity:.5}

/* ── The ⋯ menu. ── */
.menu{position:fixed;z-index:20;min-width:208px;padding:5px;border-radius:var(--r-lg);background:var(--menu-solid);box-shadow:0 0 0 .5px var(--menu-bd),0 10px 32px rgba(0,0,0,.22);animation:fade .12s}
.menu .mi{display:flex;align-items:center;gap:9px;width:100%;height:28px;padding:0 9px;border:0;border-radius:var(--r-sm);background:none;font-size:13px;text-align:left}
.menu .mi:hover{background:var(--accent);color:#fff}
.menu .mi.danger{color:var(--danger)}
.menu .mi.danger:hover{background:var(--danger);color:#fff}
.menu .mi .ic{width:14px;height:14px}
.menu .msep{height:.5px;margin:5px 9px;background:var(--sep)}

/* The demo's own controls, not part of the design. */
.demo{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:var(--r-lg);background:rgba(20,20,24,.88);box-shadow:0 6px 24px rgba(0,0,0,.3);backdrop-filter:blur(12px);z-index:30}
.demo button{height:26px;padding:0 10px;border:0;border-radius:var(--r-sm);background:none;color:rgba(255,255,255,.7);font-size:12px;white-space:nowrap}
.demo button.on{background:rgba(255,255,255,.18);color:#fff}
.demo i{width:1px;background:rgba(255,255,255,.15);margin:4px 3px}
</style>
</head>

</svg>

<div class="win">
  <aside class="side">
    <div class="it"><svg class="ic"><use href="#i-plus"/></svg>新会话</div>
    <div class="it"><svg class="ic"><use href="#i-search"/></svg>搜索</div>
    <div class="it on"><svg class="ic"><use href="#i-grid"/></svg>自定义</div>
  </aside>
  <main class="main"><div class="body" id="page"></div></main>
</div>

  ["message_ack", "Acknowledge handled messages by id; the inbox forgets them and their senders see them handled."],
  ["message_contacts", "The user's agents and machines that have inboxes, with their addresses."],
  ["message_list", "List the messages waiting in this connection's inbox, oldest first."],
  ["message_send", "Write a message to a session or to one of the user's agents."],
  ["message_status", "What became of messages, by id: waiting, taken, handled, held, refused or expired."],
  ["message_wake", "Ask the owner to have Hermesh wake this agent by webhook when messages arrive."],
  ["project_list", "The projects on the user's machines that sessions can start in."],
  ["session_answer", "Answer a question a session asked, or approve what it is waiting on."],
  ["session_archive", "Archive a finished session."],
  ["session_diff", "The changes a session made to its project, as a diff."],
  ["session_events", "What happened in a session since a point: messages, tool calls and results."],
  ["session_get", "One session: its state, project, model and last message."],
  ["session_interrupt", "Stop a session's current turn."],
  ["session_list", "The user's sessions, newest first, with their state."],
  ["session_start", "Start a session in a project on one of the user's machines, with a first message."],
  ["session_unarchive", "Bring an archived session back."],
];
const VAULT = [["vault_read", "Read a secret by path."], ["vault_list", "List the secret paths under a prefix."], ["vault_write", "Write a secret at a path."]];
const STATES = { ok: "可用", login: "需要登录", failed: "连接失败", off: "已停用", local: "本地命令", bare: "没有说明" };
let state = "ok", enabled = true, menuAt = null, picked = null;

function render() {
  const local = state === "local";
  const on = state !== "off" && enabled;
  const live = on && (state === "ok" || state === "local" || state === "bare");
  const showTools = live || !on;
  const s = local
    ? { name: "vault", tools: VAULT, lede: "在本机运行，读写团队 Vault 里的密钥。" }
    : { name: "hermesh", logo: true, tools: TOOLS, lede: state === "bare" ? "" : "让 agent 在你的各台机器上开会话、互相发消息，并查看会话的进展和改动。" };

  const status = !on ? [``, "已停用"] : state === "login" ? ["warn", "需要登录"] : state === "failed" ? ["bad", "连接失败"] : ["ok", "可用"];
  const fact = (k, v, action = "") => `<div class="fact"><div class="k">${k}</div><div class="v">${v}${action}</div></div>`;
  const ghost = (name, title) => `<button class="ghost" title="${title}">${icon(name)}</button>`;
  const facts = [
    fact("状态", `<span class="dot ${status[0]}"></span><span class="${status[0] ? status[0] + "-t" : ""}">${status[1]}</span>`),
    local
      ? fact("密钥", `VAULT_TOKEN<span class="sub">在钥匙串里</span>`)
      : fact("账号", state === "login" ? `hermesh.io<span class="sub">未登录</span>` : `hermesh.io<span class="sub">已登录</span>`),
    local
      ? fact("命令", `<span class="mono">npx -y @acme/vault-mcp</span>`, ghost("copy", "复制命令"))
      : fact("地址", `<span class="mono">https://mcp.hermesh.io/mcp</span>`, ghost("copy", "复制地址")),
  ].join("");

  const note = !on ? "" : state === "login"
    ? `<div class="note warn">${icon("warn")}<div class="tx"><b>需要登录才能使用</b>在浏览器里用你的 hermesh.io 账号登录，令牌存进系统钥匙串。</div><button class="btn primary" data-act="signin">在浏览器里登录</button></div>`
    : state === "failed"
      ? `<div class="note bad">${icon("warn")}<div class="tx"><b>没有连上这个服务器</b><span class="err">error sending request for url (https://mcp.hermesh.io/mcp): connection refused</span></div><button class="btn" data-act="retry">${icon("retry")}重试</button></div>`
      : "";

  const tools = showTools
    ? `<div class="list">${s.tools.map(([n, d]) => `<div class="tool ${picked === n ? "open" : ""}" data-tool="${n}"><span class="tn">${n}</span><span class="td">${d}</span></div>`).join("")}</div>`
    : `<p class="empty">${state === "failed" ? "连上之后，这里列出它提供的工具。" : "登录之后，这里列出它提供的工具。"}</p>`;

  document.getElementById("page").innerHTML = `
    <div class="${on ? "" : "off"}">
      <div class="bar">
        <button class="back">${icon("back")}连接器</button>
      </div>
      <div class="head">
        <div class="title">
          <div class="tile ${s.logo ? "logo" : ""}">${s.logo ? `<img src="${LOGO}" alt="">` : s.name[0].toUpperCase()}</div>
          <h1>${s.name}</h1><span class="badge">自定义</span>
          <div class="acts">
            <label class="swl">启用<button class="sw ${on ? "on" : ""}" data-act="toggle" role="switch" aria-checked="${on}"></button></label>
            <button class="more ${menuAt ? "open" : ""}" data-act="menu" title="更多">${icon("more")}</button>
          </div>
        </div>
        ${s.lede ? `<p class="lede">${s.lede}</p>` : ""}
        <div class="facts">${facts}</div>
      </div>
      ${note}
      <section class="tools">
        <div class="th"><h2>工具</h2>${showTools ? `<span class="n">${s.tools.length}</span>` : ""}${live ? `<span class="right">2 分钟前检测<button class="link" data-act="retry">重新检测</button></span>` : ""}</div>
        ${tools}
      </section>
    </div>`;

  document.querySelector(".menu")?.remove();
  if (menuAt) {
    const m = document.createElement("div");
    m.className = "menu";
    m.innerHTML = `
      <button class="mi">${icon("edit")}编辑配置…</button>
      <div class="msep"></div>
      <button class="mi" data-act="retry">${icon("retry")}重新检测</button>
      <button class="mi">${icon("copy")}复制${local ? "命令" : "地址"}</button>
      ${!local && live ? `<button class="mi" data-act="logout">${icon("logout")}退出登录</button>` : ""}
      <div class="msep"></div>
      <button class="mi danger">${icon("trash")}删除连接器…</button>`;
    document.body.append(m);
    m.style.top = `${menuAt.bottom + 6}px`;
    m.style.left = `${Math.max(8, menuAt.right - m.offsetWidth)}px`;
  }

  const theme = document.documentElement.dataset.theme;
  const row = (items, key, cur) => Object.entries(items).map(([k, v]) => `<button class="${cur === k ? "on" : ""}" data-${key}="${k}">${v}</button>`).join("");
  document.getElementById("demo").innerHTML = `${row(STATES, "state", state)}<i></i>${row({ light: "浅色", dark: "深色" }, "theme", theme)}`;
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  const d = b?.dataset ?? {};
  if (d.act === "menu") {
    menuAt = menuAt ? null : b.getBoundingClientRect();
    return render();
  }
  menuAt = null;
  if (d.state) (state = d.state), (enabled = true), (picked = null);
  if (d.theme) document.documentElement.dataset.theme = d.theme;
  const line = !b && e.target.closest("[data-tool]");
  if (line) picked = picked === line.dataset.tool ? null : line.dataset.tool;
  if (d.act === "toggle") state === "off" ? ((state = "ok"), (enabled = true)) : (enabled = !enabled);
  if (d.act === "signin" || (d.act === "retry" && state === "failed")) state = "ok";
  if (d.act === "logout") state = "login";
  render();
});
render();
</script>
</body>
</html>
