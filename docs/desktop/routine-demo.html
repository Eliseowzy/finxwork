   the new session page's middle, and the same form in a sheet and in
   settings. */
.keyform{display:flex;flex-direction:column;gap:10px}
.keyform label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--l2)}
.keyform .field{height:30px;border-radius:var(--r-sm);font-size:13px}
.keyform select.field{appearance:auto}
.keyform .note{margin:0;font-size:11.5px;line-height:1.5;color:var(--l3)}
.keyform .err{margin:0;font-size:12px;color:var(--red)}
.keyform .sheet-foot{margin-top:4px}
.keyform .btn{height:28px}
.keyrow{display:block}
.keyrow .keyform{padding:4px 0}

/* "+" › 连接器 (composer/ConnectorsMenu.tsx, connectors-entry-design §7): browse and manage, a
   line, then the connectors, eight rows high before they scroll; each row is its connector's
   switch, the system ones offer to connect until they are. */
.cn-sub{width:296px}
/* Eight rows, fewer when the window is short (the two rows and line above stay on screen); it scrolls on its own, not the page under it. */
.cn-list{max-height:min(calc(8 * 32px),calc(100vh - 140px));overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:0 4px;scroll-padding-block:24px;--fu:0px;--fd:0px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 var(--fu),#000 calc(100% - var(--fd)),transparent);mask-image:linear-gradient(to bottom,transparent,#000 var(--fu),#000 calc(100% - var(--fd)),transparent)}
.cn-list.more-up{--fu:24px}
.cn-list.more-down{--fd:24px}
.cn-row{height:32px;min-height:32px;gap:9px;cursor:default}
.cn-row .cz-tile{width:18px;height:18px;border-radius:var(--r-xs);font-size:7.5px;font-weight:650;letter-spacing:0}
.cn-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cn-row.off .nm,.cn-row.off .cz-tile,.cn-row.quick.off>.ic{opacity:.5}
.cn-none-row{color:var(--l3);cursor:default}
.cn-none-row:hover{background:none}
.cn-row[aria-disabled=true]{color:var(--l3)}
.cn-row .cn-st{border:0;background:none;padding:2px 0;font-size:11.5px;color:var(--orange)}
.cn-row .cn-st.bad{color:var(--red)}
.cn-row .cn-st:hover{text-decoration:underline;text-underline-offset:2px}
.cn-row .btn.sm{margin-right:-2px;pointer-events:none}
.sw.sm{width:26px;height:16px;pointer-events:none}
.sw.sm::after{width:12px;height:12px}
.sw.sm.on::after{transform:translateX(10px)}

/* A part of a page, opened from its tile: its picture and what it is. */
.wdt{position:fixed;z-index:60;width:340px;max-height:min(520px,calc(100vh - 24px));overflow:auto;padding:10px 12px 8px;border-radius:var(--r-md);background:var(--win);box-shadow:0 8px 28px rgba(0,0,0,.28),0 0 0 .5px var(--sep);color:var(--l1);font-size:12.5px;cursor:default}
.wdt-head{display:flex;align-items:center;gap:6px;height:22px;margin-bottom:8px}
.wdt-head .ic{color:#3294ff}
.wdt-head svg,.wdt-head img{width:14px;height:14px;flex:none}
.wdt-head .site-ic{display:flex}
.wdt-kind{font-weight:600;color:#3294ff;white-space:nowrap}
.wdt-host{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--l3)}
.wdt-x{display:grid;place-items:center;width:22px;height:22px;padding:0;border:0;border-radius:var(--r-xs);background:none;color:var(--l2)}
.wdt-x:hover{background:var(--fill2);color:var(--l1)}
.wdt-x .ic{width:13px;height:13px}
.wdt-shot{display:block;width:100%;padding:0;border:0;border-radius:var(--r-sm);overflow:hidden;background:#fff;box-shadow:0 0 0 .5px var(--sep);cursor:zoom-in}
.wdt-shot img{display:block;width:100%;max-height:220px;object-fit:contain;object-position:top left}
.wdt-comment{margin:10px 0 0;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.wdt-rows{margin:8px 0 0;display:grid;gap:6px}
.wdt-rows>div{display:grid;grid-template-columns:56px 1fr;gap:10px}
.wdt-rows dt{color:var(--l3)}
.wdt-rows dd{margin:0;line-height:1.45;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.wdt-rows dd.mono{font-family:var(--mono);font-size:11px}
.wdt-more{margin-top:8px}
.wdt-more summary{padding:2px 0;color:var(--l2);cursor:pointer;user-select:none}
.wdt-more summary:hover{color:var(--l1)}
.wdt-go{display:block;width:100%;height:28px;margin-top:10px;border:0;border-radius:var(--r-sm);background:var(--fill2);color:var(--l1);font:inherit;font-size:12.5px}
.wdt-go:hover{background:var(--fill3)}

/* Files dragged over the window: the composer lifts and glows, and says it takes them. */
.cmp{transition:box-shadow .18s ease,transform .18s ease}
.cmp.dropping{transform:translateY(-3px);box-shadow:0 0 0 1.5px #3294ff,0 0 0 6px rgba(50,148,255,.16),0 14px 40px rgba(50,148,255,.28);animation:cmp-drop-glow 1.6s ease-in-out infinite}
@keyframes cmp-drop-glow{50%{box-shadow:0 0 0 1.5px #3294ff,0 0 0 10px rgba(50,148,255,.08),0 18px 48px rgba(50,148,255,.34)}}
.cmp-drop{position:absolute;inset:4px;z-index:5;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;border-radius:calc(var(--r-xl) - 4px);border:1.5px dashed rgba(50,148,255,.75);background:color-mix(in srgb,var(--pill) 80%,#3294ff);backdrop-filter:blur(8px);color:var(--l1);font-size:13.5px;pointer-events:none;animation:cmp-drop-in .16s ease-out}
.cmp-drop b{font-weight:600}
.cmp-drop-hint{color:var(--l2);font-size:12px}
.cmp-drop-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#3294ff;color:#fff;box-shadow:0 4px 12px rgba(50,148,255,.45);animation:cmp-drop-bob 1.1s ease-in-out infinite}
.cmp-drop-ic .ic{width:16px;height:16px;stroke-width:2.7}
@keyframes cmp-drop-in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes cmp-drop-bob{50%{transform:translateY(-3px)}}
.drop-veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 100%,rgba(50,148,255,.16),transparent 60%);animation:cmp-drop-in .2s ease-out}
@media (prefers-reduced-motion:reduce){.cmp.dropping,.cmp-drop,.cmp-drop-ic,.drop-veil{animation:none}.cmp.dropping{transform:none}}

/* files.css */
/* The file panel (docs/desktop/file-panel-design.md §3). Its column, strip and tabs are the
   browser panel's (.bgp.brp, .brp-strip, .brp-tab in app.css); below them its own bar, the
   tree beside the editor or the preview, and a note when there is a choice to make. */

/* GitHub's colours, as the conversation's code blocks have them (Shiki's GitHub themes), for the editor (files/Editor.tsx). */
:root {
  --syn-keyword: #cf222e;
  --syn-string: #0a3069;
  --syn-comment: #6e7781;
  --syn-constant: #0550ae;
  --syn-function: #8250df;
  --syn-type: #953800;
  --syn-property: #0550ae;
  --syn-invalid: #82071e;
  /* The lines a link pointed at, and search matches. */
  --target: rgba(255, 196, 0, .22);
}
html[data-theme="dark"]{
    --syn-keyword: #ff7b72;
    --syn-string: #a5d6ff;
    --syn-comment: #8b949e;
    --syn-constant: #79c0ff;
    --syn-function: #d2a8ff;
    --syn-type: #ffa657;
    --syn-property: #79c0ff;
    --syn-invalid: #ffa198;
    --target: rgba(255, 196, 0, .16);
  }


/* Wider than the browser's at first: the tree and the code share it. A width the person dragged to wins. */
.bgp.brp.fpn:not(.sized):not(.max){width:clamp(420px,56%,960px)}
/* Tabs as wide as their names (to a point); the strip scrolls when they do not fit. The tabs take the
   strip's room, so Expand and the Files button keep to the window's right end. */
.fpn .brp-tabs{flex:1}
.fpn-tab{flex:0 0 auto;max-width:200px}

/* A tab with edits not saved: a dot where its × is, the × on hover. */
.fpn-tab.dirty:not(:hover) .brp-tab-x{opacity:1}
.fpn-tab.dirty:not(:hover) .brp-tab-x .ic{display:none}
.fpn-tab.dirty:not(:hover) .brp-tab-x::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--l2)}

/* The file's tools at the strip's end, then Expand and the Files button past a line. Narrow, how the
   edits stand gives way to the tabs (a read-only file's tab shows a lock, an unsaved one its dot). */
.fpn{container-type:inline-size}
.fpn .brp-strip{border-bottom:.5px solid var(--sep)}
.fpn-tools{flex:none;display:flex;align-items:center;gap:2px}
.fpn-tools .tb.on{color:var(--l1)}
.fpn-state{flex:none;margin-right:4px;white-space:nowrap;font-size:12px;color:var(--l3)}
.fpn-state.dirty{color:var(--l1)}
@container (max-width:560px){.fpn-state{display:none}}
.fpn-strip-sep{flex:none;width:.5px;height:16px;margin:0 4px;background:var(--sep)}

.fpn-body{flex:1;min-height:0;display:flex}
.fpn-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--win)}
.fpn-editor{flex:1;min-height:0}
.fpn-editor .cm-editor{height:100%}
.fpn-empty{flex:1;display:grid;place-items:center;font-size:13px;color:var(--l3)}

/* The tree, on the right of the file: rows laid where the virtual list puts them. */
.fpt{width:200px;flex:none;position:relative;overflow:auto;padding:4px 0;border-left:.5px solid var(--sep);outline:none}
.fpt-note{padding:8px 12px;font-size:12px;color:var(--l3)}
.fpt-row{position:absolute;top:0;left:4px;right:4px;height:26px;display:flex;align-items:center;gap:5px;padding-right:8px;border-radius:var(--r-sm);font-size:13px;color:var(--l1);white-space:nowrap;cursor:default;user-select:none}
.fpt-row:hover{background:var(--fill)}
.fpt-row.on{background:var(--sel);color:var(--sel-fg)}
.fpt:focus-visible .fpt-row.focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.fpt-row .ic{flex:none;width:14px;height:14px;color:var(--l2)}
.fpt-row.on .ic{color:inherit}
.fpt-row .chev{width:10px;height:10px;stroke-width:3;transform:rotate(-90deg);transition:transform .12s var(--ease-out)}
.fpt-row .chev.open{transform:none}
.fpt-sp{flex:none;width:10px}
.fpt-name{min-width:0;overflow:hidden;text-overflow:ellipsis}

/* Markdown as a reply shows it, in a page of its own. */
.fpn-md{flex:1;min-height:0;overflow:auto;padding:var(--sp-3) var(--sp-4);font-size:14.5px;line-height:1.7;color:var(--msg)}
.fpn-img{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;padding:var(--sp-3);background:var(--fill)}
.fpn-img img{max-width:100%;max-height:100%;object-fit:contain}

/* Why a file is not shown. */
.fpn-card{margin:auto;max-width:320px;padding:var(--sp-3);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px;color:var(--l2)}
.fpn-card>.ic{width:28px;height:28px;color:var(--l3)}
.fpn-card b{font-weight:500;color:var(--l1);overflow-wrap:anywhere}
.fpn-card p{margin:0}
.fpn-card-b{display:flex;gap:8px;margin-top:5px}

/* A choice to make, under the file. */
.fpn-note{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 13px;border-top:.5px solid var(--sep);font-size:12.5px;color:var(--l1);background:var(--win2)}
.fpn-note>span{flex:1;min-width:0}
.fpn-note>.ic{flex:none;width:15px;height:15px;color:var(--l2)}
.fpn-note.warn{background:var(--orange-bg)}
.fpn-note.warn>.ic{color:var(--orange)}
.fpn-note.bad{background:var(--red-bg)}
.fpn-note.bad>.ic{color:var(--red)}

/* bots.css */
/* Bot mode (docs/desktop/bot-mode-design.md §9): the prototype's styles (docs/desktop/bot-mode-demo.html), in the
   app's own tokens. Radii come from --r-*, never pills; colours from the design variables, except an avatar's own. */

/* The mode switch: the global .seg at the right of the sidebar's top, two icons. The other mode's segment carries a
   dot when something waits there: blue a bot's new message, orange an approval. */
.side-top .mode{margin-left:auto;border-radius:var(--r-md)}
.side-top .mode button{position:relative;width:36px;height:28px;padding:0;justify-content:center;border-radius:var(--r-md);color:var(--l2)}
.side-top .mode button.on{color:var(--l1)}
.side-top .mode .ic{width:18px;height:18px;stroke-width:1.8}
.mdot{position:absolute;top:4px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.mdot.warn{background:var(--orange)}
.side-list.fadein{animation:fadein .28s var(--ease-out)}

/* An avatar: a rounded square, as square as the window, its corner by its size. Its colour is its own, the same in
   both themes, like a photo. */
.bav{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;background:var(--h,#858b95);color:#fff;font-weight:600;line-height:1;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06)}
:root[data-theme="dark"] .bav{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
html[data-theme="dark"] .bav{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
.bav>svg{width:100%;height:100%;display:block}
/* The default bot: the FinxWork α on ink. */
.bav.mark{background:#0e1015}
.bav.mark>img{width:68%;height:68%;display:block}
.bav.pic{background:var(--fill2)}
.bav.pic>img{width:100%;height:100%;object-fit:cover;display:block}
.bav.s22{width:22px;height:22px;border-radius:var(--r-xs);font-size:11.5px}
.bav.s28{width:28px;height:28px;border-radius:var(--r-sm);font-size:13.5px}
.bav.s36{width:36px;height:36px;border-radius:var(--r-md);font-size:16px}
.bav.s64{width:64px;height:64px;border-radius:var(--r-xl);font-size:28px}
.bav.s72{width:72px;height:72px;border-radius:var(--r-xl);font-size:32px}
/* Busy, it moves: a character looks around and blinks; the mark and a letter breathe. No status dot besides. */
.bav .eyes{transform-box:fill-box;transform-origin:center}
.bav.busy .eyes{animation:glance 3.6s var(--ease-in-out) infinite}
@keyframes glance{0%,16%{transform:none}24%,42%{transform:translateX(-1.4px)}50%,68%{transform:translateX(1.4px)}76%,84%{transform:none}88%{transform:scaleY(.15)}92%,100%{transform:none}}
.bav .ch{font-weight:inherit}
.bav.busy.mark>img,.bav.busy .ch{animation:live-breathe 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bav.busy .eyes,.bav.busy.mark>img,.bav.busy .ch{animation:none}}

/* The list: a row per bot, as a chat app's. Its two lines are 36 high, the avatar's height; padding, corners, hover
   and selection are a session row's (.srow). */
.side-list.bots{display:flex;flex-direction:column;gap:2px}
.brow{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:var(--r-md);outline-offset:-2px;cursor:default}
.brow:hover{background:var(--fill)}
.brow.sel{background:var(--side-sel)}
.bmain{flex:1;min-width:0}
.bl1{position:relative;display:flex;align-items:center;gap:5px;height:20px}
.bname{flex:0 1 auto;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bpin{width:12px;height:12px;color:var(--l3);flex:none}
.btime{margin-left:auto;flex:none;padding-left:6px;font-size:11px;color:var(--l3);font-variant-numeric:tabular-nums}
.bl2{display:flex;align-items:center;gap:8px;height:16px;font-size:12px;color:var(--l2)}
.bprev{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bprev .shimmer{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.btag{color:var(--orange)}
.bbadge{flex:none;min-width:16px;height:16px;padding:0 5px;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-size:10.5px;font-weight:600;line-height:16px;text-align:center;font-variant-numeric:tabular-nums}

/* The page's top: avatar and name (a click changes them), then what the bot is doing now. */
/* The top of a bot's page: its avatar and name in the middle, as in a chat app, whatever sits at the bar's ends. They
   open its settings, which a hover shows with an arrow; the arrow takes no room, so they stay centred without it. */
.bhead{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:30px;padding:0 24px 0 24px;max-width:calc(100% - 260px);border:0;background:none;border-radius:var(--r-md);font:inherit;color:var(--l1)}
.bhead:hover,.bhead[aria-expanded="true"]{background:var(--fill)}
.bhead-n{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhead-go{position:absolute;right:6px;width:14px;height:14px;color:var(--l2);opacity:0;transition:opacity .12s var(--ease-out)}
.bhead:hover .bhead-go,.bhead:focus-visible .bhead-go,.bhead[aria-expanded="true"] .bhead-go{opacity:1}
.bhead-gap{flex:1}

/* A bot's settings: the avatar and name over groups of rows, like an iOS or macOS settings page. */
.bgp.bpn{width:340px;animation:bpn-in .18s var(--ease-out)}
@keyframes bpn-in{from{opacity:0;transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){.bgp.bpn{animation:none}}
.bpn-top{height:var(--top);flex:none;display:flex;align-items:center;justify-content:flex-end;padding:0 calc(14px + var(--caption)) 0 14px}
.bpn-body{flex:1;min-height:0;overflow-y:auto;padding:0 16px 24px}
.bpn-hero{display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0 26px}
.bpn-av{position:relative;display:flex;padding:0;border:0;background:none;border-radius:var(--r-xl)}
.bpn-av-edit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:inherit;background:rgba(0,0,0,.42);color:#fff;opacity:0;transition:opacity .12s var(--ease-out)}
.bpn-av-edit .ic{width:20px;height:20px}
.bpn-av:hover .bpn-av-edit,.bpn-av:focus-visible .bpn-av-edit,.bpn-av[aria-expanded="true"] .bpn-av-edit{opacity:1}
.bpn-name,.bpn-rename{width:100%;height:30px;margin:0;font:inherit;font-size:17px;font-weight:600;line-height:30px;text-align:center;color:var(--l1)}
.bpn-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;user-select:none}
.bpn-rename{padding:0 8px;border:0;outline:0;background:var(--fill);border-radius:var(--r-sm)}
.bpn .frow>.fl{width:auto}
.bpn .frow>.fv{flex-wrap:nowrap}
.bpn .mb{margin-right:-7px}
.bpn .mb .lbl{max-width:170px}
.bpn-del{width:100%;border:0;background:none;font:inherit;text-align:left;border-radius:inherit;color:var(--red)}
.bpn-del:hover{background:var(--fill)}
.bpn-pick{align-self:stretch;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:12px 14px}
.bpn-pick .bs-shapes{margin:0}

/* The conversation: bubbles on both sides, as in a chat app; a message shows whole once sent. The owner's bubble is
   a session page's; the bot's sits on the left, a shade off the window, with no avatar, so a run of them reads as one.
   Two bubbles in a row from the same side sit close (6); a change of side puts them apart (21). On hover, the time
   and buttons go beside the bubble, taking no room under it, so a run stays close. */
.tr.bots .um{margin-bottom:var(--sp-1)}
.tr.bots .um:has(+ .um){margin-bottom:0}
.tr.bots .um+.um{margin-top:-7px}
.tr.bots .um .msg-act{top:auto;bottom:0;right:100%;padding:0 6px 0 0}
.tr.bots .um.queued .bub{opacity:.72}
.bm{border-radius:var(--r-md)}
.tr.bots .bm+.bm{margin-top:-7px}
.bm-b{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.bline{position:relative;display:flex;align-items:flex-end;gap:6px;max-width:100%}
.bbub{min-width:0;max-width:min(640px,100%);padding:9px 15px;border-radius:var(--r-xl);background:var(--win2);box-shadow:inset 0 0 0 .5px var(--sep);color:var(--msg);font-size:15px;line-height:21px;overflow-wrap:anywhere}
.bbub .md>*+*{margin-top:8px}
.bbub .md pre{background:var(--win)}
.bbub .md :is(pre,table,.md-table){max-width:100%;overflow-x:auto}
.bline .msg-act{position:static;flex:none;padding:0 0 6px}
.bm:hover .msg-act,.bline .msg-act:focus-within{opacity:1}
.msg-act .tb.on{color:var(--l1);background:var(--fill)}

/* A message's process: the session page's steps, opened under the bubble from its hover button. */
.bm .tg-b.bproc{width:min(640px,100%);margin:6px 0 2px}
.bproc-h{padding:var(--sp-1) var(--sp-2) 2px;font-size:12px;color:var(--l3)}

/* Busy: the last bubble. Three dots while it answers; with sub-agents at work, what they do, opening to each one's
   steps and how long it has worked. */
.wbub{display:flex;flex-direction:column;padding:0}
.wb-h{display:flex;align-items:center;gap:9px;min-height:39px;padding:0 15px;border:0;border-radius:var(--r-xl);background:none;font:inherit;color:inherit;text-align:left;min-width:0}
button.wb-h{cursor:pointer}
.dots{display:inline-flex;align-items:center;gap:4px;height:21px;flex:none}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--l3);animation:dot 1.3s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.16s}
.dots i:nth-child(3){animation-delay:.32s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-3px);opacity:.95}}
.wb-t{min-width:0;font-size:14px;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb-h .chev{width:14px;height:14px;margin-left:-5px;color:var(--l3);transform:rotate(-90deg);transition:transform .15s var(--ease-out)}
.wb-h[aria-expanded="true"] .chev{transform:none}
.wb-l{display:flex;flex-direction:column;gap:2px;padding:0 6px 8px;min-width:280px}
.wb-r{display:flex;align-items:baseline;gap:8px;width:100%;min-width:0;padding:5px 9px;border-radius:var(--r-md);font-size:13px;line-height:19px;color:var(--l1)}
.wb-rl{flex:0 1 auto;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb-ra{flex:1;min-width:0;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb-ra .shimmer{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.wb-rt{flex:none;font-size:12px;color:var(--l3);font-variant-numeric:tabular-nums}
.wb-s{display:flex;align-items:baseline;gap:8px;min-width:0;padding:2px 9px;font-size:13px;line-height:19px;color:var(--l3)}
.wb-s>span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb-s.now{color:var(--l1)}
.wb-s .shimmer{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}

/* A new bot's empty page: its avatar, its name, one line on how to start. */
.bempty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--sp-1);padding-top:14vh}
.bempty h3{margin:var(--sp-2) 0 0;font-size:20px;font-weight:600}
.bempty p{margin:0;max-width:320px;color:var(--l2);font-size:13px;line-height:1.6}

/* Making a bot: a name and an avatar, nothing else. */
.bsheet .sub{margin-bottom:var(--sp-3)}
.bs-top{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.bs-name{flex:1;display:flex;flex-direction:column;gap:var(--sp-1);font-size:12px;color:var(--l2)}
.bs-name .field{height:30px;font-size:14px}
.bs-k{margin:0 0 var(--sp-1);font-size:12px;color:var(--l2)}
.bs-shapes{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-bottom:var(--sp-2)}
.bs-shape{padding:0;border:0;background:none;border-radius:var(--r-md);line-height:0}
.bs-shape.on{box-shadow:0 0 0 2px var(--win),0 0 0 3.5px var(--accent)}
.bs-hues{display:flex;gap:10px;padding:2px}
.bs-hue{width:18px;height:18px;padding:0;border:0;border-radius:50%;background:var(--h)}
.bs-hue.on{box-shadow:0 0 0 2px var(--win),0 0 0 3.5px var(--l1)}


/* customize.css */
/* 自定义 (docs/desktop/customize-design.md §10; the look is docs/desktop/customize-demo.html).
   The page draws on app.css (buttons, switches, segments, menus, sheets); its own parts are
   named cz-. Every distance is a step of the scale 8 / 13 / 21 / 34 / 55, each the one before
   times φ: 8 inside a part, 13 between parts, 21 between groups, 34 to the page's edges.

   The title starts right under the 44 band the window's buttons need, level with the
   sidebar's first row (新会话); the sides are the settings page's 34. The column fills the
   window up to 1120, then stays centred, so a wide window gets wider margins, not longer rows. */

.cz-body.dbody{max-width:1120px;padding:0 var(--sp-4) var(--sp-5)}
/* The page's name: large, at the top of the column. */
.cz-title{margin:0;font-size:28px;font-weight:650;letter-spacing:-.6px;line-height:1.25}
/* What kind, a rule, whose; Add at the end. It stays at the top while the list scrolls. */
.cz-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2);padding:var(--sp-1) 0;background:var(--win)}
.cz-bar.stuck{box-shadow:0 .5px 0 var(--sep)}
.cz-bar .grow{flex:1}
.cz-tabs{display:flex;gap:2px}
.cz-tab{height:26px;padding:0 12px;border:0;border-radius:var(--r-sm);background:none;font-size:14px;color:var(--l1)}
.cz-tab:hover{background:var(--fill)}
.cz-tab.on{background:var(--fill3)}
.cz-vsep{width:1px;height:18px;margin:0 3px;background:var(--fill);flex:none}
.seg.cz-seg button{font-size:14px}
/* Add: the plus large, the chevron greyer, both close to the edges. */
.btn.cz-addbtn{height:26px;padding:0 5px 0 6px;gap:5px;font-size:14px}
.btn.cz-addbtn .ic{width:18px;height:18px}
.btn.cz-addbtn .chev{width:16px;height:16px;opacity:.6}

.cz-sect{animation:fadein .3s cubic-bezier(.2,0,0,1)}
.cz-sect+.cz-sect{margin-top:var(--sp-3)}
.cz-bar+.cz-sect{margin-top:var(--sp-2)}
/* A group's heading: the settings' .fhead, with its count as the sidebar's. */
.cz .fhead{display:flex;align-items:center;gap:6px;font-weight:400;margin:0 0 var(--sp-1)}
.cz .fhead .n{color:var(--l3);font-weight:500;font-variant-numeric:tabular-nums}
.cz .fhead .hint{color:var(--l3);margin-left:2px}
.cz-anote{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--l2);background:var(--fill);border-radius:var(--r-md);padding:8px 13px;margin-bottom:var(--sp-1)}
.cz-anote>.ic{color:var(--orange)}
.cz-anote>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-anote .link{margin-left:auto;flex:none}
.cz-anote code{font-family:var(--mono);font-size:11.5px;color:var(--l1)}
.cz-wait{display:flex;align-items:center;gap:8px;color:var(--l2);font-size:12.5px;padding:var(--sp-3) 4px}

.cz-tile{width:32px;height:32px;border-radius:var(--r-md);background:var(--fill2);color:var(--l2);display:flex;align-items:center;justify-content:center;flex:none;font-weight:650;font-size:12.5px;letter-spacing:-.02em}
.cz-tile .ic{width:17px;height:17px;stroke-width:2.025}
.cz-tile.xl{width:52px;height:52px;border-radius:var(--r-lg);font-size:17px}
.cz-tile.xl .ic{width:26px;height:26px;stroke-width:1.875}
/* A logo (customize-design §10.10). One that is a tile fills the shape, nothing around it, under
   a hairline that keeps a white icon's edge on a light page and a black one's on a dark page;
   one with its own rounded corners keeps them, unlined. A mark sits on the plain plate, which
   turns light under a dark mark in the dark and dark under a light mark in the light. */
.cz-tile.logo{position:relative;overflow:hidden;background:none}
.cz-tile.logo img{position:absolute;display:block;max-width:none}
.cz-tile.logo::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1);pointer-events:none}
.cz-tile.logo.cut::after{content:none}
.cz-tile.glyph img{display:block;object-fit:contain}
.cz-tile.glyph.light{background:#2c2c30}
html[data-theme="dark"] .cz-tile.logo::after{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}html[data-theme="dark"] .cz-tile.glyph.light{background:var(--fill2)}html[data-theme="dark"] .cz-tile.glyph.dark{background:#f2f2f4}


/* 我的: one to a row, as the detail pages list their tools: no panels, a hairline between rows,
   the content flush with the group's heading. The row under the pointer lights up as a rounded
   block reaching 12 past the text, and the lines beside it give way to it. Each row is the mark,
   the name over one line of what it does, then on the right its state, its switch and its menu. */
.cz-rows{display:flex;flex-direction:column}
.cz-row{position:relative;display:flex;align-items:center;gap:var(--sp-2);min-height:58px;margin:0 -12px;padding:9px 8px 9px 12px;border-radius:var(--r-lg);transition:background .12s}
.cz-row+.cz-row::before{content:"";position:absolute;top:0;left:12px;right:12px;height:.5px;background:var(--sep);transition:opacity .12s}
.cz-row:hover{background:var(--fill)}
.cz-row:hover::before,.cz-row:hover+.cz-row::before{opacity:0}
.cz-row.off .cz-tile,.cz-row.off .rt{opacity:.5}
.cz-row .rt{flex:1;min-width:0}
.cz-row .rn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;line-height:18px;min-width:0}
.cz-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-row .rd{font-size:12px;color:var(--l2);margin-top:2px;line-height:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-row .rd.mono{font-family:var(--mono);font-size:11.5px}
.cz-row .ra{display:flex;align-items:center;gap:8px;flex:none;margin-left:var(--sp-1)}
.cz-st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--l2);white-space:nowrap;font-variant-numeric:tabular-nums}
.cz-st.ok{color:var(--green)}
.cz-st.bad{color:var(--red)}
.cz-st.warn{color:var(--orange)}
.cz-st .link{font-size:11.5px}
.cz-st .dotc{width:6px;height:6px}
.cz .dotc.bad{background:var(--red)}
.mini-spin.cz-spin{width:10px;height:10px}
.cz-more{width:26px;height:26px;border-radius:var(--r-sm);border:0;background:none;color:var(--l2);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.cz-more:hover,.cz-more.open{background:var(--fill2);color:var(--l1)}

/* 发现: two to a row, the mark beside the name, what it does in two lines, where it comes from. */
.cz-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-1)}
@media (max-width:860px){.cz-grid{grid-template-columns:minmax(0,1fr)}}
.cz-card{display:grid;grid-template-columns:32px minmax(0,1fr) auto;column-gap:var(--sp-2);padding:var(--sp-2);border-radius:var(--r-lg);background:var(--win2);transition:background .15s}
.cz-card:hover{background:var(--win3)}
.cz-card .cz-tile{grid-row:1/4}
.cz-card .ct{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;font-weight:500;line-height:18px;margin-top:-1px}
.cz-card .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cz-card .cd{grid-column:2/4;font-size:12px;color:var(--l2);line-height:17px;margin-top:3px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:34px}
.cz-card .cm{grid-column:2/4;font-size:11px;color:var(--l3);margin-top:6px}
.cz-card .ca{grid-column:3;grid-row:1;display:flex;align-items:center;margin:-3px 0 -3px 8px}
/* Add: a round + that turns into a spinner, then a check. */
.cz-inst{width:26px;height:26px;border-radius:50%;border:0;padding:0;background:var(--btn);box-shadow:var(--btn-sh);display:flex;align-items:center;justify-content:center;color:var(--l1);transition:background .15s,color .15s}
.cz-inst:hover{background:var(--accent);color:#fff;box-shadow:none}
.cz-inst .ic{width:14px;height:14px;stroke-width:2.4}
.cz-inst.busy{pointer-events:none;background:var(--fill);box-shadow:none}
.cz-inst.done{background:var(--fill);color:var(--l2);box-shadow:none;pointer-events:none}
.cz-inst.done .ic{stroke-width:3}

.cz-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--sp-5) var(--sp-3);border-radius:var(--r-lg);background:var(--win2);color:var(--l2);gap:6px;font-size:12.5px}
.cz-empty>.ic{width:26px;height:26px;color:var(--l3);stroke-width:1.65;margin-bottom:4px}
.cz-empty b{color:var(--l1);font-weight:500;font-size:13px}
.cz-empty .acts{display:flex;gap:8px;margin-top:var(--sp-1)}

/* The add menu's items: what each does under its name. */
.cz-menu .mi.tall{align-items:flex-start;padding:2px 10px 2px 9px;gap:10px}
.cz-menu .mi.tall>.ic{margin-top:7px}
.vmenu.cz-menu .mi .two{padding:6px 0}

/* A card's page: back to the list, the item, tabs on a hairline, then the body. */
.cz-back{display:inline-flex;align-items:center;gap:6px;height:28px;margin:2px 0 0 -6px;padding:0 9px 0 6px;border:0;border-radius:var(--r-sm);background:none;font-size:13.5px;color:var(--l2)}
.cz-back:hover{color:var(--l1);background:var(--fill)}
.cz-back .ic{width:15px;height:15px}
.cz-hero{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2)}
.cz-hero .dt{flex:1;min-width:0}
.cz-hero h1{margin:0;display:flex;align-items:center;gap:8px;font-size:20px;font-weight:650;letter-spacing:-.3px;line-height:1.3}
.cz-meta{display:flex;align-items:center;margin-top:4px;font-size:12.5px;color:var(--l2);white-space:nowrap;flex-wrap:wrap}
.cz-meta-i{display:inline-flex;align-items:center;gap:6px}
.cz-meta i{font-style:normal;color:var(--l3);margin:0 6px 0 0}
.cz-meta .cz-st{font-size:12.5px}
.cz-acts{display:flex;align-items:center;gap:8px;flex:none}
.cz-acts .btn{height:30px;padding:0 15px;font-size:13.5px}
/* A connector's page (customize-design §10.12, docs/desktop/connector-detail-demo.html): one column,
   at most 852 wide so a line stays readable. Back has the top line to itself; then the
   logo and name with the item's controls at the right, one sentence, the facts in a row, a note when one is due, the tools a line each.
   No boxes and no rules; the spacing is the structure, in three steps: 8 within a group (the name
   and its sentence, the facts and their caption, a heading and its list), 21 between the groups of
   the head, 34 between the head and the list. */
.cz-dpage{max-width:852px}
.cz-dbar{display:flex;align-items:center;height:28px}
.cz-dbar .cz-back{margin-top:0;margin-left:-8px;padding:0 10px 0 7px;font-size:13px;gap:5px}
.cz-dbar .cz-back .ic{width:14px;height:14px}
/* On the title line, at its right end; the ⋯ glyph lines up with the tools' 重新检测 below. */
.cz-dacts{display:flex;align-items:center;gap:var(--sp-1);margin-left:auto;padding-left:var(--sp-3)}
.cz-swl{display:inline-flex;align-items:center;gap:var(--sp-1);height:28px;padding:0 var(--sp-1);font-size:13px;color:var(--l2)}
.cz-dacts .cz-more{width:28px;height:28px;margin-right:-6px}
.cz-dhead{animation:fadein .35s cubic-bezier(.2,0,0,1)}
.cz-dtitle{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-3)}
.cz-dtitle .cz-tile.xl{width:48px;height:48px;font-size:19px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.cz-dtitle h1{margin:0;font-size:26px;font-weight:650;letter-spacing:-.5px;line-height:32px}
.cz-dtitle .badge{margin:2px 0 0 -3px}
.cz-facts{display:flex;flex-wrap:wrap;gap:var(--sp-3) var(--sp-4);margin-top:var(--sp-3)}
.cz-fact{min-width:0}
/* The address or command takes the rest of the row and ends in … rather than wrapping alone. */
.cz-fact.grow{flex:1 1 240px}
.cz-fact .k{font-size:11.5px;line-height:16px;color:var(--l3)}
.cz-fact .v{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:13px;line-height:22px;color:var(--l1);white-space:nowrap}
.cz-fact .v.cz-st.ok{color:var(--green)}
.cz-fact .v.cz-st.bad{color:var(--red)}
.cz-fact .v.cz-st.warn{color:var(--orange)}
/* Every value in the one font of the row; a long one (an address, a path) ends in …. */
.cz-fact .v .cut{min-width:0;overflow:hidden;text-overflow:ellipsis;user-select:text;-webkit-user-select:text}
.cz-fact .v .sub{color:var(--l3)}
.cz-ghost{width:20px;height:20px;margin-left:-2px;flex:none;border:0;border-radius:var(--r-xs);background:none;color:var(--l3);display:grid;place-items:center;padding:0;opacity:0;transition:opacity .15s,background .15s,color .15s}
.cz-fact:hover .cz-ghost,.cz-ghost:focus-visible{opacity:1}
.cz-ghost:hover{background:var(--fill2);color:var(--l1)}
.cz-ghost .ic{width:12px;height:12px}
.cz-note{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-3);padding:var(--sp-2) var(--sp-2) var(--sp-2) 15px;border-radius:var(--r-lg);background:var(--fill);font-size:13px;line-height:20px;animation:fadein .25s cubic-bezier(.2,0,0,1)}
.cz-note>.ic{align-self:flex-start;margin-top:2px;width:15px;height:15px;color:var(--l3)}
.cz-note .tx{flex:1;min-width:0;color:var(--l2)}
.cz-note .tx b{display:block;font-weight:550;color:var(--l1)}
.cz-note .tx code{font-family:var(--mono);font-size:12px;background:var(--fill2);padding:1px 5px;border-radius:var(--r-xs);color:var(--l1)}
.cz-note .err{display:block;margin-top:3px;font-family:var(--mono);font-size:11.5px;line-height:17px;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.cz-note.warn{background:var(--orange-bg)}.cz-note.warn>.ic{color:var(--orange)}
.cz-note.bad{background:var(--red-bg)}.cz-note.bad>.ic{color:var(--red)}
.cz-note .btn{flex:none}
.cz-note-wait{display:flex;align-items:center;gap:var(--sp-1);flex:none;font-size:12.5px;color:var(--l2)}
.cz-dtools{margin-top:var(--sp-4);animation:fadein .45s cubic-bezier(.2,0,0,1)}
.cz-th{display:flex;align-items:baseline;gap:7px;margin-bottom:var(--sp-1)}
.cz-th h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.1px}
.cz-th .n{font-size:13px;color:var(--l3);font-variant-numeric:tabular-nums}
.cz-th .right{margin-left:auto;display:flex;align-items:baseline;gap:var(--sp-1);font-size:12px;color:var(--l3)}
.cz-th .link{font-size:12px}
.cz-tool{display:flex;align-items:baseline;gap:var(--sp-3);padding:7px 12px;margin:0 -12px;border-radius:var(--r-md);font-size:13px;line-height:22px;transition:background .12s}
.cz-tool:hover,.cz-tool.open{background:var(--fill)}
.cz-tool .tn{width:172px;flex:none;font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-tool .td{flex:1;min-width:0;color:var(--l2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-tool.open .td{white-space:normal;color:var(--l1);user-select:text;-webkit-user-select:text}
.cz-dempty{margin:var(--sp-1) 0 0;font-size:13px;color:var(--l3)}
/* Off: the page steps back; the controls at the top do not. */
.cz-dpage.off .cz-dtitle .cz-tile{opacity:.45}
.cz-dpage.off .cz-facts,.cz-dpage.off .cz-tlist,.cz-dpage.off .cz-contents{opacity:.5}
@media (prefers-reduced-motion:reduce){.cz-dhead,.cz-note,.cz-dtools,.cz-dfiles{animation:none}}

/* The page's one main action: solid in the text colour, quieter than the accent on a dark window. */
.btn.cz-solid{background:var(--l1);color:var(--win);box-shadow:none}
.mini-spin.cz-spin-solid{width:12px;height:12px;border-color:color-mix(in srgb,var(--win) 35%,transparent);border-top-color:var(--win)}
.btn.primary .mini-spin.cz-spin-solid{border-color:rgba(255,255,255,.35);border-top-color:#fff}
.cz-dtabs{display:flex;gap:var(--sp-3);margin-top:var(--sp-3);border-bottom:.5px solid var(--sep)}
.cz-dtab{position:relative;height:38px;padding:0 1px;border:0;background:none;font-size:13.5px;color:var(--l1)}
.cz-dtab .n{color:var(--l3)}
.cz-dtab.on{font-weight:500}
.cz-dtab.on::after{content:"";position:absolute;left:0;right:0;bottom:-.5px;height:2px;border-radius:1px;background:var(--l1)}
/* What it does and the facts about it, in the golden ratio: the facts take 0.382 of the
   width, kept between 248 and 320 so a value never wraps early nor floats far from its label. */
.cz-cols{display:grid;grid-template-columns:minmax(0,1fr) clamp(248px,calc((100% - var(--sp-4)) * .382),320px);gap:var(--sp-4);margin-top:var(--sp-3);align-items:start}
@media (max-width:900px){.cz-cols{grid-template-columns:minmax(0,1fr)}}
.cz-pane{margin-top:var(--sp-3)}
.cz-dsec+.cz-dsec{margin-top:var(--sp-3)}
.cz-dsec h4{margin:0 0 8px;font-size:12px;font-weight:400;color:var(--l2)}
.cz-dsec p{margin:0;font-size:13.5px;line-height:1.65;user-select:text;-webkit-user-select:text}
.cz-dsec p.hint{margin-top:8px;font-size:12px;color:var(--l3)}
.cz-dsec code,.cz-callout code{font-family:var(--mono);font-size:12px;background:var(--fill2);padding:1px 5px;border-radius:var(--r-xs);color:var(--l1)}
.cz-dsec .field{height:30px}
.cz-side{background:var(--win2);border-radius:var(--r-lg);padding:3px 0}
.cz-kv{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding:8px 13px;font-size:12.5px}
.cz-kv+.cz-kv{border-top:.5px solid var(--sep)}
.cz-kv .k{color:var(--l2);flex:none}
.cz-kv .v{min-width:0;text-align:right;overflow-wrap:anywhere}
.cz-kv .v.mono{font-family:var(--mono);font-size:11.5px;color:var(--l2)}
.cz-kv.stack{flex-direction:column;align-items:flex-start;gap:7px}
.cz-kv.stack .v{text-align:left}
.cz-way{display:flex;align-items:center;gap:6px}
.cz-way+.cz-way{margin-top:5px}
.cz-code{margin:0;font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--l1);background:var(--code);border-radius:var(--r-md);box-shadow:inset 0 0 0 .5px var(--sep);padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.cz-code .fm{color:var(--l2)}
.cz-code.cz-line{padding:10px 14px}
/* 技能简介, 连接器简介 (§10.12, §10.13): what the item does, set as one more fact: the facts' small
   grey label over the text in the facts' size, 21 under the facts (or the note) like the head's
   other groups. */
.cz-dsum{margin-top:var(--sp-3)}
.cz-dsum .k{font-size:11.5px;line-height:16px;color:var(--l3)}
.cz-dsum p{margin:3px 0 0;max-width:680px;font-size:13px;line-height:22px;color:var(--l1);user-select:text;-webkit-user-select:text;cursor:text}
/* A skill's note (§10.13): nothing to act on, so no box. It sits under the facts as their caption,
   in the facts' small grey, as wide as the description. */
.cz-aside{margin:var(--sp-1) 0 0;max-width:600px;font-size:12px;line-height:18px;color:var(--l3)}
.cz-aside code{font-family:var(--mono);font-size:11.5px;color:var(--l2)}
/* A skill's files (§10.13), under the facts as a connector's tools are: a heading, then the folder
   as a tree and the open file side by side in one frame. The frame has a fixed height, about the
   window's once scrolled to, so the tree and the file each scroll inside it and a long file never
   stretches the page. The bar over the file holds its path, preview / source and 在访达中显示. */
.cz-dfiles{margin-top:var(--sp-4);animation:fadein .45s cubic-bezier(.2,0,0,1)}
.cz-contents{display:grid;grid-template-columns:clamp(176px,26%,220px) minmax(0,1fr);height:clamp(320px,calc(100vh - 140px),640px);border-radius:var(--r-lg);box-shadow:inset 0 0 0 .5px var(--sep)}
.cz-contents.single{grid-template-columns:minmax(0,1fr)}
.cz-tree{display:flex;flex-direction:column;gap:1px;min-width:0;min-height:0;overflow-y:auto;padding:var(--sp-1);border-right:.5px solid var(--sep)}
.cz-trow{display:flex;align-items:center;gap:5px;height:28px;flex:none;padding-right:8px;border:0;border-radius:var(--r-sm);background:none;font-size:13px;color:var(--l1);text-align:left;min-width:0}
.cz-trow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-trow .ic{width:12px;height:12px;flex:none;color:var(--l3)}
.cz-tsp{width:12px;flex:none}
.cz-trow:hover{background:var(--fill)}
.cz-trow.on{background:var(--fill2);font-weight:500}
.cz-viewer{display:flex;flex-direction:column;min-width:0;min-height:0}
.cz-vbody{flex:1;min-height:0;overflow:auto}
.cz-vbar{display:flex;align-items:center;flex:none;gap:var(--sp-1);height:44px;padding:0 var(--sp-1) 0 var(--sp-3)}
.cz-vbar .mono{flex:1;min-width:0;font-size:12px;color:var(--l2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-vbar .seg button{padding:0 7px}
.cz-vbar .seg .ic{width:14px;height:14px}
.cz-vbtn{width:26px;height:26px;flex:none;border:0;border-radius:var(--r-sm);background:none;color:var(--l2);display:grid;place-items:center;padding:0}
.cz-vbtn:hover{background:var(--fill);color:var(--l1)}
.cz-vbtn .ic{width:14px;height:14px}
.cz-vmd{padding:0 var(--sp-3) var(--sp-3);font-size:14px;line-height:1.65}
.cz-vbody>.cz-code{background:none;box-shadow:none;border-radius:0;padding:0 var(--sp-3) var(--sp-3)}
.cz-vbody>.cz-wait,.cz-vnote{padding:0 var(--sp-3) var(--sp-3)}
.cz-vnote{font-size:12.5px;color:var(--l2)}
/* An image at its own size, at most the frame's width, on a checkerboard so a transparent one
   still shows its edges; a click shows it over the window. */
.cz-vimg{display:block;max-width:100%;padding:0;border:0;border-radius:var(--r-md);background:repeating-conic-gradient(var(--fill2) 0 25%,transparent 0 50%) 0 0/16px 16px;box-shadow:inset 0 0 0 .5px var(--sep);overflow:hidden;cursor:zoom-in;line-height:0}
.cz-vimg img{display:block;max-width:100%;height:auto}
.cz-vnote.cut{padding-bottom:var(--sp-1);font-size:12px;color:var(--l3)}
@media (max-width:720px){.cz-contents{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.cz-tree{max-height:160px;border-right:0;border-bottom:.5px solid var(--sep)}}
/* Rows of facts in a panel: the label left, the value after it. */
.cz .fgroup .frow{gap:12px;padding:9px 13px}
.cz .fgroup .frow>.fl{width:72px;color:var(--l2);font-size:12.5px}
.cz .fgroup .frow>.fv{justify-content:flex-start;text-align:left;color:var(--l1);overflow-wrap:anywhere}
.cz .fgroup .frow>.fv.mono{font-size:12px}
.cz .fgroup .frow>.ic{color:var(--l2)}
.cz-errbox{font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--red);background:var(--red-bg);border-radius:var(--r-md);padding:9px 13px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
/* A note on a page: why something is read-only, what a choice will do. */
.cz-callout{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--l2);background:var(--fill);border-radius:var(--r-md);padding:9px 13px;line-height:1.55}
.cz-callout>.ic{margin-top:2px;color:var(--l3)}
.cz-callout.warn>.ic{color:var(--orange)}
.cz-callout .btn{margin-left:auto;flex:none;align-self:center}
.seg.cz-segsm button{height:22px;padding:0 11px;font-size:12px}
.field.bad{box-shadow:inset 0 0 0 1px var(--red),0 0 0 3px var(--red-bg)}

/* Sheets: the custom connector, uploading a skill, skills that did not load. */
.sheet.cz-sheet .sheet-in{padding:var(--sp-3)}
.cz-sheet .cz-form{display:flex;flex-direction:column;gap:var(--sp-2)}
.cz-fi{display:flex;flex-direction:column;gap:6px}
.cz-fi>label{font-size:12px;color:var(--l2);display:flex;align-items:center;gap:6px}
.cz-fi>label em{font-style:normal;color:var(--l3)}
.cz-fi>.seg{align-self:flex-start}
.cz-fi .note{font-size:11.5px;color:var(--l3)}
.cz-ferr{font-size:11.5px;color:var(--red)}
.cz-paste{margin-bottom:var(--sp-2)}
.cz-paste textarea.field{height:auto;padding:8px 9px;resize:vertical;line-height:1.5}
.cz-kvs{display:flex;flex-direction:column;gap:6px}
.cz-kvrow{display:grid;grid-template-columns:1fr 1.6fr 24px 24px;gap:6px;align-items:center}
.cz-lock{width:24px;height:24px;border:0;border-radius:var(--r-sm);background:none;color:var(--l3);display:flex;align-items:center;justify-content:center;padding:0}
.cz-lock:hover{background:var(--fill2);color:var(--l1)}
.cz-lock.on{color:var(--accent-t);background:var(--accent-bg)}
.cz-lock .ic{width:13px;height:13px}
.field.saved::placeholder{color:var(--l3)}
.cz-addrow{align-self:flex-start;font-size:12.5px;display:flex;gap:4px;align-items:center}
.cz-addrow .ic{width:12px;height:12px}
.cz-drop{border:1.5px dashed var(--fill3);border-radius:var(--r-lg);padding:34px 21px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--l2);text-align:center;transition:background .15s,border-color .15s}
.cz-drop.over{border-color:var(--accent);background:var(--accent-bg)}
.cz-drop>.ic{width:30px;height:30px;color:var(--l3);stroke-width:1.65}
.cz-drop b{color:var(--l1);font-weight:500;font-size:14px}
.cz-drop small{font-size:12px;color:var(--l3)}
.btn.cz-pick{margin-top:6px}
.cz-parsed{display:flex;gap:12px;align-items:flex-start;background:var(--win2);border-radius:var(--r-lg);padding:var(--sp-2)}
.cz-parsed .pt{flex:1;min-width:0}
.cz-parsed b{font-weight:500}
.cz-parsed p{margin:3px 0 0;font-size:12.5px;color:var(--l2);line-height:1.5}
.cz-parsed .badge{display:inline-flex;align-items:center;gap:4px;flex:none}
.cz-parsed .badge .ic{width:11px;height:11px;stroke-width:3}
.cz-dlabel{font-size:12px;color:var(--l2);margin:var(--sp-3) 0 var(--sp-1)}
.cz-target{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--l2);background:var(--win2);border-radius:var(--r-md);padding:9px 13px}
.cz-target .ic{color:var(--l3)}
.cz-target .mono{font-size:11.5px;color:var(--l1)}
.cz-gap{margin-top:10px}
.cz-broken{display:flex;flex-direction:column;gap:8px}
.cz-sheet .fgroup .frow>.fl{width:72px;color:var(--l2);font-size:12.5px}
.cz-sheet .fgroup .frow>.fv{justify-content:flex-start;text-align:left;color:var(--l1);overflow-wrap:anywhere}
.cz-sheet .fgroup .frow>.fv.mono{font-size:12px}
.cz-sheet .sub .mono{font-size:11.5px}
.sheet.cz-sheet .sub{margin-bottom:var(--sp-3)}
.sheet.cz-sheet .sheet-foot{margin-top:var(--sp-3)}

/* 添加连接器 (§10.9; the look is docs/desktop/connector-add-demo.html). */
/* The title and the buttons stay put; the form between them scrolls when it must. */
.sheet.cz-add{overflow:hidden}
.sheet.cz-add .sheet-in{padding:0;display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.sheet.cz-add h3{margin:0;padding:var(--sp-3) var(--sp-3) var(--sp-2)}
.cz-add-body{flex:1;min-height:0;overflow-y:auto;padding:0 var(--sp-3) var(--sp-3);animation:fadein .25s cubic-bezier(.2,0,0,1)}
.sheet.cz-add .sheet-foot{flex:none;margin:0;padding:var(--sp-2) var(--sp-3);border-top:.5px solid var(--sep)}
/* The settings: a grouped form, a label on the left and its control on the right, rows on a hairline. */
.cz-gh{font-size:12px;color:var(--l2);margin:var(--sp-3) 2px 6px}
.cz-add .fgroup .frow{gap:var(--sp-2);padding:7px 13px;min-height:40px}
.cz-add .frow>.fl{width:96px;color:var(--l1);white-space:nowrap}
.cz-add .fgroup .frow>.fv{flex-wrap:nowrap;justify-content:flex-end;text-align:right}
.cz-add .frow>.fv .field{max-width:260px}
.cz-add .frow.stack{flex-direction:column;align-items:stretch;gap:var(--sp-1);padding:10px 13px}
.cz-add .frow.stack>.fl{width:auto}
.cz-add .cz-two{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:260px}
.cz-advgroup{margin-top:var(--sp-1)}
.cz-fn{margin:7px 2px 0;font-size:11.5px;color:var(--l2);line-height:1.55}
.cz-fn .det{color:var(--accent-t)}
code.cz-code{font-family:var(--mono);font-size:11px;color:var(--l2);background:var(--fill2);padding:1px 5px;border-radius:var(--r-xs);white-space:nowrap}
.cz-trust{margin:var(--sp-3) 2px 0;font-size:11.5px;color:var(--l3);line-height:1.55}
/* A pop-up button: the choice, and the up-down chevrons. */
.cz-pop{height:24px;display:inline-flex;align-items:center;gap:6px;padding:0 5px 0 9px;border:0;border-radius:var(--r-sm);background:var(--btn);box-shadow:var(--btn-sh);font-size:12.5px;color:var(--l1);max-width:280px;white-space:nowrap}
.cz-pop .lbl{overflow:hidden;text-overflow:ellipsis}
.cz-pop .chev{width:13px;height:13px;color:var(--l2)}
.cz-pop .badge{height:17px;padding:0 5px;font-size:10.5px;gap:2px}
.cz-pop .badge .ic{width:10px;height:10px;stroke-width:3.3}
.cz-pop.open{box-shadow:var(--btn-sh),0 0 0 3px var(--accent-bg)}
.cz-menu .mi.tall>.ck{margin-top:8px}
.cz-menu .mi .badge{height:16px;padding:0 5px;font-size:10px}
.cz-menu{max-width:340px}
textarea.field.cz-grow{height:auto;min-height:30px;padding:6px 9px;line-height:18px;resize:none;display:block}
.cz-detect{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--l2);min-height:16px}
.cz-detect .ic{width:13px;height:13px}
.cz-detect.bad{color:var(--red)}
.cz-detect b{font-weight:500;color:var(--l1)}
.cz-summary{display:flex;align-items:center;gap:var(--sp-2);padding:11px var(--sp-2);border-radius:var(--r-lg);background:var(--win2)}
.cz-summary .t{flex:1;min-width:0}
.cz-summary .n{font-weight:500;display:flex;align-items:center;gap:6px}
.cz-summary .a{font-size:11.5px;color:var(--l2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-steps-h{font-size:12.5px;color:var(--l2);margin:var(--sp-3) 0 6px;display:flex;align-items:center;gap:var(--sp-1)}
.cz-steps{border-radius:var(--r-lg);background:var(--win2);padding:2px 0}
.cz-steps .stp{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px var(--sp-2)}
.cz-steps .stp+.stp{border-top:.5px solid var(--sep)}
.cz-steps .si{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center}
.cz-steps .si .mini-spin{width:16px;height:16px}
.cz-steps .ring{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--fill3)}
.cz-steps .done,.cz-steps .fail,.cz-steps .skip{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cz-steps .done{background:var(--green);color:#fff}
.cz-steps .fail{background:var(--red);color:#fff}
.cz-steps .skip{background:var(--fill2);color:var(--l3)}
.cz-steps .si .ic{width:11px;height:11px;stroke-width:3.6}
.cz-steps .st{flex:1;min-width:0}
.cz-steps .st b{font-weight:400;display:block}
.cz-steps .st small{display:block;font-size:11.5px;color:var(--l2);margin-top:2px;overflow-wrap:anywhere}
.cz-steps .stp.wait .st b{color:var(--l3)}
.cz-steps .bs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.cz-fold{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;font-size:12px;color:var(--l2);margin:var(--sp-3) 2px 0}
.cz-fold .ic{width:13px;height:13px;color:var(--l2);transition:transform .15s}
.cz-fold.open .ic{transform:rotate(90deg)}
.cz-fold small{color:var(--l3);font-size:12px}
.cz-fold small::before{content:"·";margin-right:6px}
.cz-cmdline{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--l2)}
.cz-cmdline .tok{background:var(--fill2);border-radius:var(--r-xs);padding:1px 5px}
.cz-cmdline .tok.p{color:var(--l1)}
.cz-center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:var(--sp-4) var(--sp-3) var(--sp-2)}
.cz-center .big{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.cz-center .big.ok{background:var(--green);color:#fff}
.cz-center .big.ok .ic{width:22px;height:22px;stroke-width:3.3}
.cz-center .big .mini-spin{width:30px;height:30px;border-width:2.5px}
.cz-center b{font-size:15px;font-weight:600}
.cz-center p{margin:0;color:var(--l2);font-size:12.5px;line-height:1.55;max-width:420px}
.cz-toolchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:var(--sp-1)}
.cz-toolchips span{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:var(--r-xs);background:var(--fill2);color:var(--l2)}
.sheet.cz-add .sheet-foot .note{font-size:12px;color:var(--l3)}

.cz-managed { padding: 8px 24px 24px; }
.cz-managed .cz-summary { margin-bottom: 20px; }
.cz-managed .cz-summary p { margin: 4px 0 0; font-size: 12px; color: var(--l2); }
.cz-managed > p { line-height: 1.7; }
.cz-managed-status { display: flex; align-items: center; gap: 10px; margin-top: 24px; }
.cz-managed-error { color: var(--red); overflow-wrap: anywhere; }

/* 新增：定时任务的样式。其余都是应用的样式原样内联。间距只用 8/13/21，圆角只用 --r-*。 */

/* 真实的玻璃顶栏按窗口宽度算位移图，原型用普通模糊代替 */
.glassbar{backdrop-filter:blur(18px) saturate(1.5)}

/* 对话里的一行 */
.rtn-line{align-self:center;display:inline-flex;align-items:center;gap:6px;max-width:100%;margin:13px 0;padding:0 8px;height:22px;border:0;border-radius:var(--r-sm);background:none;font-size:12px;line-height:16px;color:var(--l3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.rtn-line:hover{color:var(--l2);background:var(--fill)}
.rtn-line .ic{width:13px;height:13px;flex:none}
.rtn-source{margin:13px 0 -13px}
.rtn-flash .bbub{animation:rtn-flash 1.4s var(--ease-out)}
@keyframes rtn-flash{0%,40%{box-shadow:inset 0 0 0 1.5px var(--accent)}100%{box-shadow:inset 0 0 0 .5px var(--sep)}}

/* 顶栏图标上的小点 */
.tb .rtn-dot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.tb .rtn-dot.run{background:var(--accent)}

/* 右侧面板：同 Bot 设置的位置，宽一点放运行记录 */
.bgp.bpn.rtn{width:400px}
.rtn-top{justify-content:flex-start;gap:4px;padding-left:13px}
.rtn-tt{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--l1)}
.rtn-sub .rtn-tt{font-weight:500}
.bpn-body .form{padding-bottom:21px}

/* 一行任务 */
.fgroup.rtn-g{overflow:hidden}
.frow.rtn-row,.frow.rtn-runrow{gap:13px;cursor:pointer;padding-top:8px;padding-bottom:8px}
.frow.rtn-row:hover,.frow.rtn-runrow:hover{background:var(--fill)}
.rtn-t{flex:1;min-width:0}
.rtn-n{font-size:13px;line-height:18px;font-weight:500;color:var(--l1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtn-d{margin-top:1px;font-size:12px;line-height:16px;color:var(--l3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtn-d.warn{color:var(--orange)}
.rtn-row.dim .rtn-n{color:var(--l3)}
.rtn-empty{margin:55px 13px 0;text-align:center;color:var(--l2);font-size:13px;line-height:1.6}
.rtn-empty b{display:block;margin-bottom:8px;font-size:14px;font-weight:600;color:var(--l1)}
.rtn-empty .btn{margin-top:13px}

/* 任务详情 */
.rtn-prompt{padding:9px 14px;border-radius:var(--r-lg);background:var(--win2);font-size:13px;line-height:20px;color:var(--l1);white-space:pre-wrap;overflow-wrap:anywhere}
.rtn-prompt.md{white-space:normal}
.rtn-prompt.md>*+*{margin-top:8px}
.rtn-acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rtn-acts .set-note{flex-basis:100%;margin:0}
.rtn-head{display:flex;align-items:baseline;gap:8px}
.rtn-head .fhead{flex:1}
.fhead .n{margin-left:6px;font-weight:400;color:var(--l3)}

/* 一行运行记录 */
.rtn-rt{font-size:13px;line-height:18px;color:var(--l1);font-variant-numeric:tabular-nums}
.rtn-res{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--l2)}
.rtn-res.warn{color:var(--orange)}
.rtn-res .dotc{width:6px;height:6px}
.rtn-steps{display:flex;flex-direction:column;gap:2px;padding:9px 14px;border-radius:var(--r-lg);background:var(--win2)}
.rtn-steps .tool .th{cursor:default;font-size:13px}
.frow>.fv .link{margin-left:8px}

/* 第三种入口：侧栏全局页面 */
.rtn-pagewrap{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.rtn-col{display:flex;flex-direction:column;gap:21px}
.rtn-col h1.cz-title{margin-bottom:0}
.rtn-sect>.fhead{display:flex;align-items:center;gap:8px}
.rtn-sect>.fhead .bav{margin-right:0}
.rtn-rows{display:flex;flex-direction:column;gap:8px}
.rtn-pagerow{display:flex;align-items:center;gap:13px;padding:9px 13px;border-radius:var(--r-md);background:var(--win2);cursor:pointer}
.rtn-pagerow:hover{background:var(--fill2)}
.rtn-pagerow.dim .rtn-n{color:var(--l3)}

/* 原型的控制面板，不是产品的一部分 */
.dp{position:fixed;left:13px;bottom:52px;z-index:50;width:260px;padding:13px;border-radius:var(--r-lg);background:var(--menu,var(--win2));box-shadow:0 8px 30px rgba(0,0,0,.28),inset 0 0 0 .5px var(--sep);font-size:12px;line-height:17px;color:var(--l2)}
.dp.min{width:auto;padding:0;background:none;box-shadow:none}
.dp h4{margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--l1)}
.dp .dp-l{margin:13px 0 6px;color:var(--l3)}
.dp button.opt{display:block;width:100%;padding:6px 8px;border:0;border-radius:var(--r-sm);background:none;text-align:left;font-size:12px;color:var(--l1)}
.dp button.opt:hover{background:var(--fill)}
