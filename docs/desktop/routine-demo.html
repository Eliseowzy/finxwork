/* ---------- 显示文字 ---------- */
const RES = {
  quiet: { text: "没有要说的" }, failed: { text: "没做成", warn: true }, skipped: { text: "跳过" }, interrupted: { text: "已停止" },
};
function result(run) {
  if (run.outcome === "reported") return run.delivered ? { text: "发给你了", dot: "on" } : { text: "没有送达", warn: true };
  return RES[run.outcome];
}
function second(r) {
  if (r.running) return `<div class="rtn-d"><span class="shimmer">正在运行…</span></div>`;
  if (r.failed) return `<div class="rtn-d warn">上次没做成 · ${esc(r.failed)}</div>`;
  if (r.state === "paused") return `<div class="rtn-d">已暂停 · ${esc(r.when)}</div>`;
  if (r.state === "finished") return `<div class="rtn-d">已结束 · ${esc(r.when)}</div>`;
  return `<div class="rtn-d">${r.once ? "" : esc(r.when) + " · "}下次 ${esc(r.next)}</div>`;
}
const sw = (r) => r.state === "finished" ? "" : `<button class="sw ${r.state === "active" ? "on" : ""}" role="switch" aria-checked="${r.state === "active"}" aria-label="启用" data-sw="${r.id}"></button>`;

/* ---------- 列表 ---------- */
function rowsOf(list) {
  return list.map((r) => `<div class="frow rtn-row ${r.state !== "active" ? "dim" : ""}" role="button" tabindex="0" data-routine="${r.id}"><div class="rtn-t"><div class="rtn-n">${esc(r.name)}</div>${second(r)}</div>${sw(r)}</div>`).join("");
}
function listBody(list, name) {
  if (list.length === 0) {
    return `<div class="rtn-empty"><b>还没有定时任务</b>跟 ${esc(name)} 说一句就能建，比如"每天早上 8 点给我一份盘前简报"。<br><button class="btn" data-new>${ic("plus")}新建</button></div>`;
  }
  const on = list.filter((r) => r.state === "active");
  const off = list.filter((r) => r.state === "paused");
  const done = list.filter((r) => r.state === "finished");
  const group = (title, rows) => rows.length ? `<section>${title ? `<h3 class="fhead">${title}</h3>` : ""}<div class="fgroup rtn-g">${rowsOf(rows)}</div></section>` : "";
  return `<div class="form">${group("", on)}${group("已暂停", off)}${group("已结束", done)}<p class="set-note">定时任务在这台 Mac 上运行。合盖或关机时不跑，下次开机后补最近一次。退出应用后照跑，但不弹通知。</p></div>`;
}

/* ---------- 任务详情 ---------- */
function runRows(r) {
  const out = [];
  // 连着的几次"没有要说的"先收成一行；点开以后这一段都显示
  let shownUntil = 0;
  for (let i = 0; i < r.runs.length; ) {
    let j = i;
    while (j < r.runs.length && r.runs[j].outcome === "quiet") j++;
    if (s.open.has(`${r.id}:${i}`)) shownUntil = j;
    if (i >= shownUntil && j - i >= 3) {
      out.push(`<div class="frow rtn-runrow" data-expand="${r.id}:${i}"><div class="rtn-t"><div class="rtn-rt">${esc(r.runs[j - 1].t)} 到 ${esc(r.runs[i].t.replace(/^今天 /, ""))}</div><div class="rtn-d">${j - i} 次，点开看每一次</div></div><div class="rtn-res">没有要说的</div></div>`);
      i = j;
      continue;
    }
    const run = r.runs[i];
    const res = result(run);
    const sub = [run.late, run.note].filter(Boolean).join(" · ");
    const open = run.outcome !== "skipped";
    out.push(`<div class="frow rtn-runrow" ${open ? `data-run-open="${r.id}:${run.rid}"` : ""}><div class="rtn-t"><div class="rtn-rt">${esc(run.t)}</div>${sub ? `<div class="rtn-d">${esc(sub)}</div>` : ""}</div><div class="rtn-res ${res.warn ? "warn" : ""}">${res.dot ? `<i class="dotc ${res.dot}"></i>` : ""}${res.text}</div></div>`);
    i++;
  }
  return out.join("");
}
function routineBody(r) {
  const confirm = s.confirm === r.id;
  const running = r.running;
  return `<div class="form">
    <section><div class="fgroup rtn-g">
      ${r.state !== "finished" ? `<div class="frow"><span class="fl">启用</span><div class="fv">${sw(r)}</div></div>` : ""}
      <div class="frow"><span class="fl">时间</span><div class="fv">${esc(r.when)}</div></div>
      ${r.upcoming.length && r.state === "active" ? `<div class="frow"><span class="fl">接下来</span><div class="fv">${esc(r.upcoming.join("、"))}</div></div>` : ""}
    </div></section>
    <section><h3 class="fhead">说明</h3><div class="rtn-prompt sel-text">${esc(r.prompt)}</div></section>
    <section class="rtn-acts">
      ${running ? `<button class="btn" data-stop="${r.id}">${ic("stop")}停止</button>` : `<button class="btn" data-now="${r.id}">${ic("play")}立即运行</button>`}
      <button class="btn" data-edit="${r.id}">在对话里修改</button>
      ${confirm ? `<button class="btn primary danger" data-del-yes="${r.id}">确认删除</button>` : `<button class="btn danger" data-del="${r.id}">删除</button>`}
      <p class="set-note">立即运行会真的去做这件事。</p>
    </section>
    <section><h3 class="fhead">最近运行${r.runs.length ? `<span class="n">${r.runs.length}</span>` : ""}</h3>${r.runs.length ? `<div class="fgroup rtn-g">${runRows(r)}</div>` : `<p class="set-note">还没有运行过。</p>`}</section>
  </div>`;
}

/* ---------- 一次运行 ---------- */
function runBody(r, run) {
  const res = result(run);
  const label = run.outcome === "failed" ? "原因" : "汇报";
  return `<div class="form">
    <section><div class="fgroup rtn-g">
      <div class="frow"><span class="fl">结果</span><div class="fv"><span class="rtn-res ${res.warn ? "warn" : ""}">${res.dot ? `<i class="dotc ${res.dot}"></i>` : ""}${res.text}${run.delivered ? ` ${esc(run.delivered)}` : ""}</span>${run.bubble ? `<button class="link" data-bubble="${run.bubble}">在对话里看</button>` : ""}</div></div>
      ${run.late ? `<div class="frow"><span class="fl">计划时间</span><div class="fv">${esc(run.sched)}（${esc(run.late)}）</div></div>` : ""}
      <div class="frow"><span class="fl">开始</span><div class="fv">${esc(run.started || "—")}</div></div>
      <div class="frow"><span class="fl">用时</span><div class="fv">${esc(run.took || "—")}</div></div>
      <div class="frow"><span class="fl">用量</span><div class="fv">${esc(run.usage || "—")}</div></div>
    </div></section>
    ${run.outcome === "quiet" ? `<section><h3 class="fhead">查到的</h3><div class="rtn-prompt sel-text">${esc(run.note)}</div></section>` : ""}
    ${run.report ? `<section><h3 class="fhead">${label}</h3><div class="rtn-prompt md sel-text">${run.report}</div></section>` : ""}
    ${run.steps && run.steps.length ? `<section><h3 class="fhead">过程</h3><div class="rtn-steps">${run.steps.map(([v, t]) => `<div class="tool"><div class="th"><span class="vb">${esc(v)}</span><span class="sm2">${esc(t)}</span></div></div>`).join("")}</div></section>` : ""}
  </div>`;
}

/* ---------- 三种入口 ---------- */
function titleOf() {
  const { lvl, id } = s.route;
  if (lvl === "routine") return routineOf(id).name;
  if (lvl === "run") return s.route.t;
  return "定时任务";
}
function subBody() {
  const { lvl, id, rid } = s.route;
  return lvl === "routine" ? routineBody(routineOf(id)) : runBody(routineOf(id), runOf(id, rid));
}
function panelHTML() {
  if (s.panel === "routines") {
    const sub = s.route.lvl !== "list";
    return `<aside class="bgp bpn rtn" aria-label="定时任务"><div class="bpn-top drag rtn-top ${sub ? "rtn-sub" : ""}">${sub ? `<button class="tb" title="返回" aria-label="返回" data-back>${ic("chevL")}</button>` : ""}<span class="rtn-tt">${esc(titleOf())}</span>${sub ? "" : `<button class="tb" title="新建" aria-label="新建" data-new>${ic("plus")}</button>`}<button class="tb" title="关闭" aria-label="关闭" data-close>${ic("x")}</button></div><div class="bpn-body">${sub ? subBody() : listBody(ofBot(), bots[s.bot].name)}</div></aside>`;
  }
  if (s.panel === "settings") {
    const tpl = $("#tpl-settings").content.cloneNode(true);
    const aside = tpl.querySelector("aside");
    aside.querySelector('[aria-label="关闭"]').setAttribute("data-close", "");
    const name = aside.querySelector(".bpn-name");
    name.textContent = bots[s.bot].name;
    const av = aside.querySelector(".bpn-av .bav");
    const mine = rowAv().cloneNode(true);
    mine.className = mine.className.replace("s36", "s72");
    av.replaceWith(mine);
    if (s.entry === "settings") {
      if (s.route.lvl !== "list") {
        // 子页：换掉整个面板内容
        const top = aside.querySelector(".bpn-top");
        top.classList.add("rtn-top", "rtn-sub");
        top.innerHTML = `<button class="tb" title="返回" aria-label="返回" data-back>${ic("chevL")}</button><span class="rtn-tt">${esc(titleOf())}</span><button class="tb" title="关闭" aria-label="关闭" data-close>${ic("x")}</button>`;
        aside.querySelector(".bpn-body").innerHTML = subBody();
      } else {
        const list = ofBot();
        const sec = document.createElement("section");
        sec.innerHTML = `<div class="rtn-head"><h3 class="fhead">定时任务${list.length ? `<span class="n">${list.length}</span>` : ""}</h3><button class="link" data-new>新建</button></div>${list.length ? `<div class="fgroup rtn-g">${rowsOf(list)}</div><p class="set-note">在这台 Mac 上运行，合盖或关机时不跑。</p>` : `<p class="set-note">跟 ${esc(bots[s.bot].name)} 说一句就能建。</p>`}`;
        aside.querySelector(".form").prepend(sec);
      }
    }
    const box = document.createElement("div");
    box.append(aside);
    return box.innerHTML;
  }
  return "";
}
function pageHTML() {
  const { lvl } = s.route;
  if (lvl === "list") {
    const by = Object.keys(bots).filter((b) => ofBot(b).length);
    const sects = by.map((b) => {
      const av = $$(".brow").find((r) => r.dataset.bot === b).querySelector(".bav").cloneNode(true);
      av.className = av.className.replace("s36", "s22");
      return `<section class="rtn-sect"><div class="fhead">${av.outerHTML}<span>${esc(bots[b].name)}</span><span class="n">${ofBot(b).length}</span></div><div class="rtn-rows">${ofBot(b).map((r) => `<div class="rtn-pagerow ${r.state !== "active" ? "dim" : ""}" role="button" tabindex="0" data-routine="${r.id}"><div class="rtn-t"><div class="rtn-n">${esc(r.name)}</div>${second(r)}</div>${sw(r)}</div>`).join("")}</div></section>`;
    }).join("");
    return `<div class="rtn-col"><h1 class="cz-title">定时任务</h1>${sects}<p class="set-note">定时任务在这台 Mac 上运行。合盖或关机时不跑，下次开机后补最近一次。退出应用后照跑，但不弹通知。</p></div>`;
  }
  const back = lvl === "routine" ? "定时任务" : routineOf(s.route.id).name;
  return `<div class="rtn-col"><div><button class="cz-back" data-back>${ic("chevL")}${esc(back)}</button><h1 class="cz-title">${esc(titleOf())}</h1></div>${subBody()}</div>`;
}

/* ---------- 对话 ---------- */
function itemHTML(i) {
  const act = (extra = "") => `<div class="msg-act"><span class="msg-meta"><time>${esc(i.time)}</time></span><button class="tb" aria-label="拷贝" title="拷贝">${ic("copy", "sm")}</button>${extra}</div>`;
  switch (i.k) {
    case "time": return `<div class="tdiv">${esc(i.t)}</div>`;
    case "line": return `<button class="rtn-line" data-routine="${i.id}">${esc(i.text)}</button>`;
    case "user": return `<div class="um"><div class="bub sel-text">${esc(i.t)}</div>${act()}</div>`;
    case "working": return `<div class="bm working"><div class="bm-b"><div class="bline"><div class="bbub wbub"><div class="wb-h"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div></div></div></div></div>`;
    case "bot": {
      const run = i.run;
      const r = run && routineOf(run[0]);
      const label = r && runOf(run[0], run[1]);
      const extra = run ? `<button class="tb" aria-label="定时任务" title="来自定时任务「${esc(r.name)}」" data-run-open="${run[0]}:${run[1]}">${ic("clock", "sm")}</button><button class="tb ${i.proc ? "on" : ""}" aria-label="过程" title="过程" data-proc>${ic("list", "sm")}</button>` : "";
      const proc = i.proc && run ? `<div class="tg-b bproc"><div class="bproc-h">用时 3 秒 · 1 步</div><div class="tool"><button class="th" data-run-open="${run[0]}:${run[1]}"><span class="vb">定时任务</span><span class="sm2">${esc(r.name)} · ${esc(label.t)} 的运行</span></button></div></div>` : "";
      const source = run && s.source ? `<button class="rtn-line rtn-source" data-run-open="${run[0]}:${run[1]}">${ic("clock")}来自定时任务「${esc(r.name)}」</button>` : "";
      return `${source}<div class="bm ${i.flash ? "rtn-flash" : ""}" ${i.key ? `data-key="${i.key}"` : ""}><div class="bm-b"><div class="bline"><div class="bbub"><div class="md sel-text">${i.html}</div></div>${act(extra)}</div>${proc}</div></div>`;
    }
  }
  return "";
}
function renderChat() {
  const items = chats[s.bot];
  const body = $(".spage .dbody");
  if (items.length === 0) {
    const av = rowAv().cloneNode(true);
    av.className = av.className.replace("s36", "s64");
    body.innerHTML = `<div class="bempty">${av.outerHTML}<h3>${esc(bots[s.bot].name)}</h3><p>第一句话告诉它要帮你做什么。以后有事随时发，一次发几件也行。</p></div>`;
    return;
  }
  body.innerHTML = `<div class="tr bots" role="log" aria-label="对话">${items.map(itemHTML).join("")}</div>`;
}
function toEnd() {
  const el = $(".spage .cscroll");
  if (el) el.scrollTop = el.scrollHeight;
}

/* ---------- 全部画一遍 ---------- */
function render() {
  document.documentElement.dataset.entry = s.entry;
  // 顶栏
  const head = $(".bhead");
  head.setAttribute("aria-expanded", String(s.panel === "settings"));
  head.querySelector(".bhead-n").textContent = bots[s.bot].name;
  const headAv = head.querySelector(".bav");
  const mine = rowAv().cloneNode(true);
  mine.className = mine.className.replace("s36", "s22");
  headAv.replaceWith(mine);
  // 顶栏图标：只有第一种入口有
  let btn = $("#rtn-btn");
  if (!btn) {
    btn = document.createElement("button");
    btn.id = "rtn-btn";
    btn.className = "tb";
    btn.title = "定时任务";
    btn.setAttribute("aria-label", "定时任务");
    btn.dataset.toggleRoutines = "";
    $(".bhead-gap").after(btn);
  }
  const mineR = ofBot();
  const attention = mineR.some((r) => r.failed);
  const running = mineR.some((r) => r.running);
  btn.style.display = s.entry === "panel" ? "" : "none";
  btn.classList.toggle("on", s.panel === "routines");
  btn.innerHTML = ic("clock") + (attention ? `<i class="rtn-dot"></i>` : running ? `<i class="rtn-dot run"></i>` : "");
  // 右侧面板
  $$(".spage > aside").forEach((a) => a.remove());
  const html = panelHTML();
  $(".spage").classList.toggle("bgopen", !!html);
  if (html) $(".scol").insertAdjacentHTML("afterend", html);
  // 第三种入口
  let nav = $("#rtn-nav");
  if (!nav) {
    nav = document.createElement("button");
    nav.id = "rtn-nav";
    nav.className = "nav-i";
    nav.dataset.page = "";
    nav.innerHTML = `${ic("clock")}<span>定时任务</span>`;
    $(".side-nav").append(nav);
  }
  nav.style.display = s.entry === "page" ? "" : "none";
  nav.classList.toggle("sel", s.page);
  $(".spage").style.display = s.page ? "none" : "";
  let wrap = $("#rtn-page");
  if (!wrap) {
    wrap = document.createElement("div");
    wrap.id = "rtn-page";
    wrap.className = "rtn-pagewrap";
    wrap.innerHTML = `<div class="ctool drag"><div class="ctitle"></div></div><div class="cscroll cz"><div class="dbody cz-body"></div></div>`;
    $("section.content").append(wrap);
  }
  wrap.style.display = s.page ? "" : "none";
  if (s.page) wrap.querySelector(".dbody").innerHTML = pageHTML();
  $$(".brow").forEach((r) => {
    const here = r.dataset.bot === s.bot && !s.page;
    r.classList.toggle("sel", here);
  });
  renderPanelCtl();
}

/* ---------- 去到某处 ---------- */
function openRoutines(route) {
  s.route = route;
  s.confirm = null;
  if (s.entry === "panel") s.panel = "routines";
  if (s.entry === "settings") s.panel = "settings";
  if (s.entry === "page") s.page = true;
  render();
}
function fill(text) {
  s.page = false;
  render();
  const p = $(".cmp-in p");
  p.textContent = text;
  $(".cmp-ph").style.display = "none";
  $(".send").disabled = false;
  $(".cmp-in").focus();
  const sel = getSelection();
  sel.selectAllChildren(p);
  sel.collapseToEnd();
}
function setLog(text) {
  s.log = text;
  const el = $(".dp-log");
  if (el) el.textContent = text;
}

/* ---------- 模拟到点 ---------- */
function fire(kind, id) {
  const r = routineOf(id);
  if (r.running) return;
  r.running = true;
  setLog(`「${r.name}」正在运行：头像不动，没有在忙的气泡。`);
  render();
  const done = (run, say) => {
    r.running = false;
    run.rid = `${id}-fired-${++firedRuns}`;
    r.runs.unshift(run);
    if (say) chats[r.bot].push({ k: "time", t: "刚刚" }, { ...say, k: "bot", time: "刚刚", run: [id, run.rid] });
    if (say?.key) run.bubble = say.key;
    render();
    renderChat();
    toEnd();
  };
  r.timer = setTimeout(() => {
    if (kind === "quiet") {
      done({ t: "刚刚", outcome: "quiet", note: "TSLA 409.7 美元，没有跌破", started: "现在", took: "8 秒", usage: "3,100 token", steps: [["已搜索", "TSLA stock price"]] });
      setLog("没话说：对话里什么都没有，没有未读，只多一条运行记录。");
      return;
    }
    chats[r.bot].push({ k: "working" });
    renderChat();
    toEnd();
    setLog("有话说：汇报交给 Bot，它读着聊天写气泡。");
    r.timer = setTimeout(() => {
      chats[r.bot].pop();
      if (kind === "report") {
        const brief = r.id === "r2";
        done(
          { t: "刚刚", outcome: "reported", delivered: "刚刚", started: "现在", took: "9 秒", usage: "3,400 token", report: brief ? "<p>TSLA 298.4 美元，低于 300。来源：纳斯达克实时报价。这件事结束了。</p>" : `<p>「${esc(r.name)}」这次运行的结果。</p>`, steps: [["已搜索", "示例"]] },
          { key: `fired-${firedRuns + 1}`, html: brief ? "<p>特斯拉刚跌到 298.4 美元，低于你说的 300，来源是纳斯达克实时报价。这件事结束了，我把这个提醒删掉了。</p>" : `<p>「${esc(r.name)}」这次的结果在这里。内容是示例。</p>` },
        );
      } else {
        r.failed = "刚刚";
        done(
          { t: "刚刚", outcome: "failed", note: "搜索服务暂时不可用", started: "现在", took: "6 秒", usage: "2,900 token", report: "<p>Error (network): 搜索服务暂时不可用。</p>", steps: [["已搜索", "TSLA stock price"]] },
          { html: `<p>「${esc(r.name)}」这次没做成：搜索服务暂时不可用。之后连续失败我就不再打扰你，面板上看得到；恢复了会接着跑。</p>` },
        );
        setLog("失败：第一次 Bot 告诉你，任务行和顶栏图标变橙。");
      }
    }, 1400);
  }, 2200);
}

/* ---------- 点击 ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button,[data-routine],[data-run-open],[data-expand],.brow,.bhead");
  if (!t) return;
  const d = t.dataset;
  if (t.closest(".dp")) return;
  if (d.sw) {
    e.stopPropagation();
    const r = routineOf(d.sw);
    r.state = r.state === "active" ? "paused" : "active";
    return render();
  }
  if ("toggleRoutines" in d) {
    if (s.panel === "routines") s.panel = null;
    else { s.panel = "routines"; s.route = { lvl: "list" }; }
    return render();
  }
  if (t.classList.contains("bhead")) {
    if (s.panel === "settings") s.panel = null;
    else { s.panel = "settings"; s.route = { lvl: "list" }; }
    return render();
  }
  if ("close" in d) { s.panel = null; return render(); }
  if ("page" in d) { s.page = true; s.panel = null; s.route = { lvl: "list" }; return render(); }
  if ("back" in d) {
    s.confirm = null;
    s.route = s.route.lvl === "run" ? { lvl: "routine", id: s.route.id } : { lvl: "list" };
    return render();
  }
  if (t.classList.contains("brow")) {
    s.bot = t.dataset.bot;
    s.page = false;
    if (s.route.lvl !== "list") s.route = { lvl: "list" };
    $(".cmp-ph").textContent = `发消息给 ${bots[s.bot].name}`;
    $$(".brow").forEach((r) => r.classList.toggle("sel", r === t));
    render();
    renderChat();
    return toEnd();
  }
  if ("routine" in d) {
    if (routineOf(d.routine).bot !== s.bot) { s.bot = routineOf(d.routine).bot; renderChat(); }
    return openRoutines({ lvl: "routine", id: d.routine });
  }
  if (d.runOpen) {
    const [id, rid] = d.runOpen.split(":");
    return openRoutines({ lvl: "run", id, rid, t: runOf(id, rid).t });
  }
  if (d.expand) { s.open.add(d.expand); return render(); }
  if ("new" in d) return fill("帮我建一个定时任务：");
  if (d.edit) return fill(`把定时任务「${routineOf(d.edit).name}」改成：`);
  if (d.now) {
    const r = routineOf(d.now);
    return fire(r.id === "r2" ? "quiet" : "report", r.id);
  }
  if (d.stop) {
    const r = routineOf(d.stop);
    clearTimeout(r.timer);
    r.running = false;
    r.runs.unshift({ rid: `${r.id}-fired-${++firedRuns}`, t: "刚刚", outcome: "interrupted", started: "现在", took: "2 秒", usage: "—" });
    return render();
  }
  if (d.del) { s.confirm = d.del; return render(); }
  if (d.delYes) {
    routines.splice(routines.findIndex((r) => r.id === d.delYes), 1);
    s.confirm = null;
    s.route = { lvl: "list" };
    return render();
  }
  if (d.bubble) {
    s.page = false;
    const item = chats[s.bot].find((i) => i.key === d.bubble);
    if (item) {
      item.flash = true;
      render();
      renderChat();
      const el = $(`[data-key="${d.bubble}"]`);
      el?.scrollIntoView({ block: "center" });
      setTimeout(() => { item.flash = false; }, 1500);
    }
    return;
  }
  if ("proc" in d) {
    const bm = t.closest(".bm");
    const i = chats[s.bot].filter((x) => x.k === "bot")[$$(".bm:not(.working)").indexOf(bm)];
    i.proc = !i.proc;
    renderChat();
  }
});

/* ---------- 控制面板 ---------- */
const ENTRIES = [
  ["panel", "顶栏图标 + 右侧面板（已选）", "入口一直在，点一下就到；聊天还看得见；和设定分开。代价是顶栏多一个图标。只看这个 Bot 的任务。"],
  ["settings", "Bot 设置里的一组", "不加新入口，和 Bot 有关的都在一处。要先点名字再找，面板 340 宽，放运行记录偏挤。设定和活动混在一起。"],
  ["page", "侧栏里的全局页面", "所有 Bot 的任务放在一页，地方大。但要离开对话，侧栏多一项；只有一两个 Bot 时用处不大。"],
];
function renderPanelCtl() {
  const dp = $(".dp");
  if (s.min) {
    dp.className = "dp min";
    dp.innerHTML = `<button class="btn sm" data-dp="open">demo 面板</button>`;
    return;
  }
  dp.className = "dp";
  const entry = ENTRIES.find((x) => x[0] === s.entry);
  dp.innerHTML = `<h4>定时任务 demo<button class="btn sm" data-dp="min">收起</button></h4>
    <div class="dp-l" style="margin-top:0">管理入口放哪</div>
    ${ENTRIES.map(([k, n], i) => `<button class="opt ${k === s.entry ? "on" : ""}" data-dp-entry="${k}">${i + 1}. ${n}</button>`).join("")}
    <div class="dp-why">${entry[2]}</div>
    <div class="dp-l">气泡怎么看出来自定时任务</div>
    <label><input type="checkbox" ${s.source ? "checked" : ""} data-dp="source">气泡上方显示来源行</label>
    <div class="dp-why">不勾时：悬停气泡，旁边有时钟图标；"过程"里也有入口。</div>
    <div class="dp-l">模拟到点（特斯拉那个任务）</div>
    <div class="dp-row"><button class="btn sm" data-dp="quiet">没话说</button><button class="btn sm" data-dp="report">有话说</button><button class="btn sm" data-dp="fail">失败</button></div>
    <div class="dp-log">${esc(s.log)}</div>
    <div class="dp-l">外观</div>
    <div class="dp-row"><button class="btn sm" data-dp="light">浅色</button><button class="btn sm" data-dp="dark">深色</button><button class="btn sm" data-dp="reset">重来</button></div>`;
}
document.addEventListener("click", (e) => {
  const t = e.target.closest(".dp [data-dp],.dp [data-dp-entry]");
  if (!t) return;
  const v = t.dataset.dp;
  if (t.dataset.dpEntry) {
    s.entry = t.dataset.dpEntry;
    s.panel = null;
    s.page = false;
    s.route = { lvl: "list" };
    return render();
  }
  if (v === "min") { s.min = true; return renderPanelCtl(); }
  if (v === "open") { s.min = false; return renderPanelCtl(); }
  if (v === "source") { s.source = t.checked; renderChat(); return; }
  if (v === "light" || v === "dark") { document.documentElement.dataset.theme = v; return; }
  if (v === "reset") { location.hash = ""; location.reload(); return; }
  if (v === "quiet" || v === "report" || v === "fail") {
    s.bot = "finx";
    render();
    renderChat();
    if (routineOf("r2")) fire(v, "r2");
  }
});
$(".cmp-in")?.addEventListener("input", (e) => {
  const empty = e.target.textContent.trim() === "";
  $(".cmp-ph").style.display = empty ? "" : "none";
  $(".send").disabled = empty;
});

/* ---------- 起步：地址可以带状态，比如 #entry=page&view=r2&theme=dark ---------- */
const BOT_OF_ROW = { 运维: "ops", 写作助手: "writer", FinxBot: "finx", 研究员: "research", 记账: "ledger" };
$$(".brow").forEach((r) => { r.dataset.bot = BOT_OF_ROW[r.querySelector(".bname").textContent]; });
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get("entry")) s.entry = hash.get("entry");
if (hash.get("theme")) document.documentElement.dataset.theme = hash.get("theme");
if (hash.get("source")) s.source = true;
if (hash.get("min")) s.min = true;
if (hash.get("bot")) { s.bot = hash.get("bot"); }
$(".cmp-ph").textContent = `发消息给 ${bots[s.bot].name}`;
$$(".brow").forEach((r) => r.classList.toggle("sel", r.dataset.bot === s.bot));
render();
renderChat();
toEnd();
const view = hash.get("view");
if (view === "list") {
  if (s.entry === "panel") s.panel = "routines";
  if (s.entry === "settings") s.panel = "settings";
  if (s.entry === "page") s.page = true;
  render();
} else if (view) {
  const [id, i] = view.split(":");
  openRoutines(i === undefined ? { lvl: "routine", id } : { lvl: "run", id, rid: `${id}-${i}`, t: runOf(id, `${id}-${i}`).t });
}

</script>
</body>
