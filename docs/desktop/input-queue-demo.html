<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插话与排队</title>
<!--
  原型：任务运行中发出的消息（插话、排队）在会话页上怎么显示、怎么改。
  设计见 docs/kernel/input-queue-design.md。会话页的部分照 app.css、composer.css 抄，
  新增的只有「排队托盘」一段（.cq*）和 --tray 色值，标了「新增」。
  页面里的任务是脚本模拟的：工具调用之间是「下一步」，插话在那里送达；
  任务本来要结束时，排队的消息一条一条送达。
-->
<style>
/* Tokens: copied from apps/desktop/src/renderer/src/styles/tokens.css. */
:root{
  --accent:#1f6bff;--accent-fg:#1a5ce6;--ok:#17924f;--warn:#d0700a;--danger:#d7333f;
  --sp-1:8px;--sp-2:13px;--sp-3:21px;--sp-4:34px;--sp-5:55px;
  --r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:10px;--r-xl:12px;
  --ease-out:cubic-bezier(.2,0,0,1);--ease-in:cubic-bezier(.3,0,1,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,"JetBrains Mono",Consolas,monospace;
  --fs:13px;--top:44px;--lights:78px;
  --win:#ffffff;--win2:#f4f4f7;--win3:#ebebf0;
  --side:#f4f4f7;--side-head:#f4f4f7;
  --l1:rgba(0,0,0,.86);--l2:rgba(0,0,0,.54);--l3:rgba(0,0,0,.32);--l4:rgba(0,0,0,.14);
  --sep:rgba(0,0,0,.075);--fill:rgba(0,0,0,.045);--fill2:rgba(0,0,0,.075);--fill3:rgba(0,0,0,.12);
  --side-sel:rgba(0,0,0,.075);
  --accent-t:var(--accent-fg);--accent-bg:rgba(31,107,255,.10);
  --green:var(--ok);--orange:var(--warn);--red:var(--danger);--red-bg:rgba(215,51,63,.10);
  --btn:#ffffff;--btn-sh:0 0 0 .5px rgba(0,0,0,.14),0 1px 1.5px rgba(0,0,0,.08);
  --menu:rgba(248,248,250,.80);--menu-solid:#f8f8fa;--menu-bd:rgba(0,0,0,.10);
  --bub:var(--l1);--bub-fg:var(--win);--msg:var(--l1);
  --code:#f6f7fa;
  --pill:#ffffff;--pill-bd:rgba(0,0,0,.12);
  /* 新增：排队托盘的底色。两套主题里都比窗口暗一级，像凹下去的一格，输入框浮在它上面。 */
  --tray:#f4f4f7;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --accent-fg:#7ab0ff;--ok:#3fcf86;--warn:#ffab3d;--danger:#ff6670;
  --win:#1e1e21;--win2:#29292d;--win3:#323237;
  --side:#25252a;--side-head:#25252a;
  --l1:rgba(255,255,255,.88);--l2:rgba(255,255,255,.55);--l3:rgba(255,255,255,.32);--l4:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.09);--fill:rgba(255,255,255,.05);--fill2:rgba(255,255,255,.085);--fill3:rgba(255,255,255,.14);
  --side-sel:rgba(255,255,255,.1);
  --accent-bg:rgba(46,128,255,.16);--red-bg:rgba(255,102,112,.13);
  --btn:rgba(255,255,255,.12);--btn-sh:0 0 0 .5px rgba(255,255,255,.08);
  --menu:rgba(44,44,48,.80);--menu-solid:#2c2c30;--menu-bd:rgba(255,255,255,.12);
  --bub:rgba(255,255,255,.09);--bub-fg:var(--l1);--msg:rgba(255,255,255,.95);
  --code:#18181b;
  --pill:#28282c;--pill-bd:rgba(255,255,255,.09);
  --tray:#19191c;
  color-scheme:dark;
}

/* Base and controls, as app.css. */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--win);color:var(--l1);font-family:var(--font);font-size:var(--fs);line-height:1.38;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;cursor:default;overflow:hidden}
button{font:inherit;color:inherit;cursor:default}
textarea{font:inherit}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic.sm{width:13px;height:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.btn{height:26px;padding:0 13px;border-radius:var(--r-sm);border:0;background:var(--btn);box-shadow:var(--btn-sh);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--l1);flex:none}
.btn.sm{height:22px;padding:0 10px;font-size:12px}
.tb{height:28px;min-width:28px;border:0;background:transparent;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--l2);gap:5px;padding:0 6px}
.tb:hover{background:var(--fill2);color:var(--l1)}
.seg{display:inline-flex;background:var(--fill2);border-radius:var(--r-sm);padding:2px;gap:1px;flex:none}
.seg button{border:0;background:transparent;height:22px;padding:0 10px;border-radius:var(--r-xs);font-size:12px}
.seg button.on{background:var(--btn);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.shimmer{-webkit-mask-image:linear-gradient(90deg,#000 38%,rgba(0,0,0,.36) 50%,#000 62%);mask-image:linear-gradient(90deg,#000 38%,rgba(0,0,0,.36) 50%,#000 62%);-webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;animation:shimmer 2.4s linear infinite}
@keyframes shimmer{from{-webkit-mask-position:93% 0;mask-position:93% 0}to{-webkit-mask-position:7% 0;mask-position:7% 0}}

/* The window: sidebar and content, as app.css. */
.mainwrap{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%}
.side{background:var(--side);border-right:.5px solid var(--sep);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-top{height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 var(--lights);flex:none}
.side-nav{padding:0 8px 6px;display:flex;flex-direction:column;gap:2px;flex:none}
.nav-i{display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border-radius:var(--r-md);font-size:14px;border:0;background:none;width:100%;text-align:left}
.nav-i .ic{width:18px;height:18px;color:var(--l1)}
.nav-i:hover{background:var(--fill)}
.side-list{flex:1;overflow-y:auto;min-height:0;padding:0 8px 8px}
.grp{display:flex;flex-direction:column;gap:2px}
.grp-h{font-size:12px;color:var(--l2);padding:24px 10px 6px;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.grp:first-child .grp-h{padding-top:20px}
.grp-h .n{font-weight:500;color:var(--l3)}
.srow{display:flex;padding:7px 10px;border-radius:var(--r-md);align-items:flex-start;border:0;background:none;width:100%;text-align:left;font-size:14px}
.srow:hover{background:var(--fill)}
.srow.sel{background:var(--side-sel)}
.smain{min-width:0;flex:1}
.sl1{display:flex;gap:8px;align-items:center;line-height:18px}
.stitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smeta{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--l2);flex:none;font-variant-numeric:tabular-nums}
.sl2{display:flex;align-items:center;gap:3px;font-size:11px;color:color-mix(in srgb,var(--l2) 78%,transparent);margin-top:2px}
.sl2 .ic{width:11px;height:11px}
.content{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--win)}
.ctool{height:var(--top);flex:none;display:flex;align-items:center;gap:10px;padding:0 14px 0 22px}
.ctitle{flex:1;min-width:0}
.ctitle h2{margin:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dwrap{flex:1;min-height:0;display:flex;position:relative;border-top:.5px solid var(--sep)}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;position:relative}
.cscroll{flex:1;overflow-y:auto;min-height:0}

/* The conversation, as app.css. */
.dbody{max-width:798px;margin:0 auto;padding:var(--sp-3) var(--sp-4) 40px}
.tr{display:flex;flex-direction:column;gap:var(--sp-2)}
.tdiv{align-self:center;font-size:11.5px;color:var(--l3);margin:10px 0 2px}
.um{position:relative;align-self:flex-end;max-width:78%;margin:var(--sp-1) 0 var(--sp-3)}
.um .bub{background:var(--bub);color:var(--bub-fg);border-radius:var(--r-xl);padding:9px 15px;font-size:15px;line-height:21px;white-space:pre-wrap;overflow-wrap:anywhere}
.am{position:relative;font-size:15px;line-height:21px;color:var(--msg)}
.md>*{margin:0}
.md code{font-family:var(--mono);font-size:13px;background:var(--fill2);padding:1px 5px;border-radius:var(--r-xs)}
.tool{border-radius:var(--r-md);font-size:14px}
.tool .th{display:flex;align-items:center;gap:6px;padding:2px 0;border-radius:var(--r-sm);border:0;background:none;max-width:100%;text-align:left;color:var(--l2)}
.tool .th:hover{color:var(--l1)}
.tool .th .vb{flex:none}
.tool .th .sm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tool .th .cmd{font-family:var(--mono);font-size:12.5px;opacity:.9}
.tgroup{font-size:14px}
.tg-h{display:flex;align-items:center;gap:6px;padding:2px 0;border:0;background:none;color:var(--l2);text-align:left}
.tg-h:hover{color:var(--l1)}
.tg-h .chev,.tool .th .chev{width:14px;height:14px;margin-left:-3px;color:var(--l3);transform:rotate(-90deg)}
.working{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--l2)}
.working .mk{width:18px;height:18px;margin-top:2px;flex:none;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.5}}
.wk-now{flex:1;min-width:0;display:flex;flex-direction:column}
.wk-line{display:flex;align-items:baseline;gap:4px;padding:2px 0;line-height:19px}
.wk-meta,.wk-time{flex:none;font-size:12.5px;color:var(--l3);font-variant-numeric:tabular-nums}
.wk-time{margin-left:2px}
.tnote{align-self:center;font-size:12px;color:var(--l2);background:var(--fill);padding:5px 12px;border-radius:var(--r-sm);text-align:center;max-width:100%}
.donebar{align-self:center;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--l3);margin:-4px 0 6px}
.donebar .ic{color:var(--green)}
.add-anim{animation:fadein .4s var(--ease-out)}
/* A failure, as app.css's .fcard: the provider, what happened, one way out. */
.fcard{display:flex;align-items:center;gap:12px;padding:11px 10px 11px 12px;border:1px solid var(--sep);border-radius:var(--r-xl);max-width:560px;margin-top:6px;animation:fadein .3s var(--ease-out)}
.fc-av{position:relative;flex:none;width:36px;height:36px;border-radius:var(--r-md);background:var(--fill);display:grid;place-items:center;color:var(--l2);font-weight:600;font-size:14px}
.fc-badge{position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border-radius:50%;background:var(--win);display:grid;place-items:center}
.fc-badge i{width:13px;height:13px;border-radius:50%;background:var(--red)}
.fc-tx{flex:1;min-width:0}
.fc-tx b{display:block;font-size:13.5px;font-weight:600;line-height:19px}
.fc-tx span{display:block;font-size:12px;line-height:17px;color:var(--l2);margin-top:1px}

/* The composer's zone and the composer, as composer.css. */
.cmp-zone{position:absolute;left:0;right:0;bottom:0;z-index:4;pointer-events:none;padding:28px calc(var(--sp-4) - 12px) 12px;background:linear-gradient(to bottom,transparent,var(--win) 28px)}
.cmp-col{pointer-events:auto;max-width:754px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.cmp{cursor:text;background:var(--pill);border-radius:var(--r-xl);box-shadow:0 0 0 .5px var(--pill-bd),0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);padding:6px;display:flex;flex-direction:column;gap:6px}
.cmp-row{display:flex;align-items:flex-end;gap:4px}
.cmp-ed{position:relative;flex:1;min-width:0}
.cmp-in{display:block;width:100%;resize:none;border:0;outline:none;background:none;font-size:15px;line-height:21px;color:var(--l1);padding:5.5px 4px;height:32px;max-height:220px;overflow-y:auto;caret-color:var(--l1);user-select:text;-webkit-user-select:text;cursor:text}
.cmp-ph{position:absolute;top:5.5px;left:4px;right:4px;font-size:15px;line-height:21px;color:var(--l3);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-plus{width:32px;height:32px;border-radius:var(--r-sm);border:0;background:none;color:var(--l2);display:flex;align-items:center;justify-content:center;flex:none}
.cmp-plus:hover{background:var(--fill2);color:var(--l1)}
.cmp-plus .ic{width:18px;height:18px;stroke-width:1.5}
.send{width:32px;height:32px;border-radius:var(--r-sm);border:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 1px 2px rgba(40,60,200,.3);transition:background .15s}
.send:disabled{background:var(--fill3);color:var(--win);box-shadow:none}
.send.stop{background:var(--red);color:#fff;box-shadow:0 1px 2px rgba(200,40,60,.3)}
.send .ic{width:16px;height:16px;stroke-width:1.9}
.send.stop .ic{width:12px;height:12px}
.cmp-meta{display:flex;align-items:center;gap:2px;padding:0 12px;margin-top:-4px;min-width:0}
.cmp-meta .sp{flex:1}
.mb{height:26px;border:0;border-radius:var(--r-sm);background:none;padding:0 7px;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--l2);white-space:nowrap}
.mb:hover{background:var(--fill);color:var(--l1)}
.mb .ic{width:14px;height:14px}
.mb .strong{color:var(--l1)}
.mb .sub{color:var(--l3)}

/* ———— 新增：排队托盘（拟加入 composer.css） ————
   任务运行中发出、还没送达的消息。它贴在输入框上方，从输入框后面露出来：
   与输入框同宽，下沿压在输入框下面 12 px。一条一行，图标列、文字列与输入框里的
   「+」和正文对齐；右侧是送达时机，悬停时换成动作。按送达的先后排：插话在前，
   排队的在后；送达的从上面离开，进到对话里。 */
.cmp{position:relative;z-index:1}
.cq{margin-bottom:-22px;padding:4px 6px 16px;border-radius:var(--r-xl) var(--r-xl) 0 0;background:var(--tray);box-shadow:0 0 0 .5px var(--pill-bd);max-height:184px;overflow-y:auto;scrollbar-width:thin;animation:cqup .3s var(--ease-out)}
.cq[hidden]{display:none}
.cq.out{opacity:0;transform:translateY(14px);transition:opacity .2s var(--ease-in),transform .2s var(--ease-in)}
@keyframes cqup{from{opacity:0;transform:translateY(14px)}}
.cq-row{display:flex;align-items:center;gap:4px;height:30px;border-radius:var(--r-md);overflow:hidden;transition:height .22s var(--ease-out),opacity .18s,transform .24s var(--ease-out),background .12s}
.cq-row:hover,.cq-row:focus-within{background:var(--fill)}
.cq-row.in,.cq-row.out{height:0;opacity:0}
.cq-i{width:32px;flex:none;display:flex;justify-content:center;color:var(--l3)}
.cq-i .ic{width:15px;height:15px}
.cq-t{flex:1;min-width:0;padding:0 4px;font-size:14px;color:var(--l1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cq-when{flex:none;padding:0 10px 0 6px;font-size:12px;color:var(--l3);white-space:nowrap}
.cq-acts{display:none;flex:none;align-items:center;gap:2px;padding-right:4px}
.cq-row:hover .cq-when,.cq-row:focus-within .cq-when{display:none}
.cq-row:hover .cq-acts,.cq-row:focus-within .cq-acts{display:flex}
.cq-b{height:24px;padding:0 8px;border:0;border-radius:var(--r-sm);background:none;font-size:12.5px;color:var(--l1);white-space:nowrap}
.cq-b:hover{background:var(--fill2)}
.cq-ib{width:24px;height:24px;border:0;border-radius:var(--r-sm);background:none;color:var(--l2);display:inline-flex;align-items:center;justify-content:center}
.cq-ib:hover{background:var(--fill2);color:var(--l1)}
.cq-ib .ic{width:14px;height:14px}
/* 送达时：消息从托盘离开，同时在对话里从下面升起来。 */
.um.land{animation:land .42s var(--ease-out)}
@keyframes land{from{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion:reduce){.cq,.cq.out,.cq-row,.um.land{animation:none;transition:none}}
/* ———— 新增结束 ———— */

/* A toast, as app.css. */
.toast{position:absolute;left:50%;top:calc(var(--top) + 12px);transform:translateX(-50%);background:var(--menu);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 0 0 .5px var(--menu-bd),0 10px 30px rgba(0,0,0,.2);border-radius:var(--r-xl);padding:8px 10px 8px 16px;display:flex;align-items:center;gap:12px;font-size:13px;z-index:60;animation:pop2 .25s var(--ease-out);width:max-content;max-width:min(560px,calc(100% - 32px))}
.toast[hidden]{display:none}
.toast .ic{color:var(--green)}
@keyframes pop2{from{opacity:0;transform:translate(-50%,-8px)}}

/* The prototype's own controls, over the sidebar's bottom (not part of the design). */
.demo{position:fixed;left:8px;bottom:8px;z-index:70;width:256px;display:flex;flex-direction:column;gap:6px;background:var(--menu);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 0 0 .5px var(--menu-bd),0 6px 20px rgba(0,0,0,.14);border-radius:var(--r-lg);padding:10px;font-size:11.5px;color:var(--l2)}
.demo b{font-weight:600;color:var(--l1);font-size:12px}
.demo .keys{line-height:1.6}
.demo .keys span{color:var(--l1)}
.demo .row{display:flex;flex-wrap:wrap;gap:4px}
.demo .row .btn{height:24px;padding:0 9px;font-size:12px}
.demo .row .btn.on{background:var(--accent);color:#fff;box-shadow:none}
@media (max-width:900px){.mainwrap{grid-template-columns:0 minmax(0,1fr)}.side{visibility:hidden}.demo{left:auto;right:8px;top:52px;bottom:auto;width:228px}}
</style>
</head>
<body>
<div class="mainwrap">
  <aside class="side">
    <div class="side-top"><span></span><button class="tb" title="过滤" id="sideFilter"></button></div>
    <nav class="side-nav">
      <button class="nav-i" data-icon="plus">新会话</button>
      <button class="nav-i" data-icon="search">搜索</button>
      <button class="nav-i" data-icon="grid">自定义</button>
    </nav>
    <div class="side-list">
      <div class="grp">
        <div class="grp-h">进行中 <span class="n">1</span></div>
        <button class="srow sel"><div class="smain"><div class="sl1"><span class="stitle">把登录页的表单校验改成实时提示</span><span class="smeta" id="sideTime">0:42</span></div><div class="sl2" data-folder>calc-lib</div></div></button>
      </div>
      <div class="grp">
        <div class="grp-h">已完成</div>
        <button class="srow"><div class="smain"><div class="sl1"><span class="stitle">给 calc 的三个模块补测试</span><span class="smeta">刚刚</span></div><div class="sl2" data-folder>calc-lib</div></div></button>
        <button class="srow"><div class="smain"><div class="sl1"><span class="stitle">整理 README 的安装说明</span><span class="smeta">昨天</span></div><div class="sl2" data-folder>hermesh</div></div></button>
        <button class="srow"><div class="smain"><div class="sl1"><span class="stitle">排查启动慢的原因</span><span class="smeta">周五</span></div><div class="sl2" data-folder>finxwork</div></div></button>
      </div>
    </div>
  </aside>
  <section class="content">
    <header class="ctool"><div class="ctitle"><h2>把登录页的表单校验改成实时提示</h2></div><button class="tb" title="信息卡片" data-icon="infoCard"></button></header>
    <div class="dwrap"><div class="dmain">
      <div class="cscroll" id="scroll"><div class="dbody" id="dbody"><div class="tr" id="tr" role="log" aria-label="对话"></div></div></div>
      <div class="cmp-zone"><div class="cmp-col" id="col">

/* ———— time: the simulation's own clock, so Pause stops everything ———— */

}, 50);

  const end = now + ms;

    if (R.dead) return done("dead");
    if (R.stop) return done("stop");

    if (R.fail && R.model) return done("fail");

});

};
const clock = (ms) => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

function add(html, cls = "") {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  const el = t.content.firstElementChild;
  if (cls) el.classList.add(...cls.split(" "));
  tr.insertBefore(el, working.isConnected ? working : null);
  follow();

}

  if (tools.length === 1) {
    const t = tools[0];
    return add(`<div class="tool"><button class="th"><span class="vb">${t.state === "cancelled" ? "未执行" : VERB[t.cat][1]}</span>${objOf(t)}${icon("caret", "chev")}</button></div>`);
  }
  const counts = new Map();
  for (const t of tools) counts.set(t.cat, (counts.get(t.cat) ?? 0) + 1);
  const title = [...counts].map(([c, n]) => VERB[c][2].replace("{n}", n)).join("，");
  return add(`<div class="tgroup"><button class="tg-h"><span>${title}</span>${icon("caret", "chev")}</button></div>`);
}

/* The working line at the conversation's end, redrawn every frame while a task runs. */
let live = null;
function frame() {
  if (live) {
    if (live.model && !paused) live.tokens += 14 + Math.random() * 10;
    const meta = `· ${secs(now - live.started)}${live.tokens > 0 ? ` · ${kilo(live.tokens)} tokens` : ""}`;
    working.innerHTML = MARK + (live.tools.length
      ? `<div class="wk-now">${live.tools.map((t) => `<div class="tool"><button class="th ${t.state === "running" ? "shimmer" : ""}"><span class="vb">${t.state === "running" ? VERB[t.cat][0] : VERB[t.cat][1]}</span>${objOf(t)}<span class="wk-time">${secs((t.end ?? now) - t.since)}</span></button></div>`).join("")}</div>`
      : `<div class="wk-line"><span class="shimmer">${live.writing ? "生成中" : "思考中"}</span><span class="wk-meta">${meta}</span></div>`);
    $("#sideTime").textContent = clock(now - live.started);
  }
}

/* ———— the queue: what was sent while the task runs and is not in the conversation yet ———— */
let Q = [], seq = 0;
const order = () => [...Q].sort((a, b) => (a.mode === b.mode ? a.seq - b.seq : a.mode === "steer" ? -1 : 1));
const rows = new Map();
function rowHtml(it) {
  const steer = it.mode === "steer";
  return `<span class="cq-i" title="${steer ? "插话" : "排队"}">${icon(steer ? "steer" : "clock")}</span>
    <span class="cq-t">${esc(it.text.split("\n")[0])}</span>
    <span class="cq-when">${steer ? "下一步送达" : "完成后送达"}</span>
    <span class="cq-acts">${steer
      ? `<button class="cq-b" data-a="now" title="结束当前这一步，马上送达（正在运行的命令会被停下）">立即送达</button>`
      : `<button class="cq-b" data-a="promote" title="下一步就送达，不等任务完成">改成插话</button>`}
      <button class="cq-ib" data-a="edit" title="编辑：放回输入框">${icon("edit")}</button>
      <button class="cq-ib" data-a="del" title="删除">${icon("x")}</button></span>`;
}
function renderQueue() {
  const box = $("#cq");
  const items = order();
  const before = new Map([...rows].map(([id, el]) => [id, el.getBoundingClientRect().top]));
  if (items.length && box.hidden) {
    box.hidden = false;
    box.classList.remove("out");
  }
  for (const [id, el] of rows) {
    if (items.some((it) => it.id === id)) continue;
    rows.delete(id);
    el.classList.add("out");
    setTimeout(() => el.remove(), 260);
  }
  let prev = null;
  const added = [];
  for (const it of items) {
    let el = rows.get(it.id);
    if (!el) {
      el = document.createElement("div");
      el.className = "cq-row in";
      el.setAttribute("role", "listitem");
      el.dataset.id = it.id;
      rows.set(it.id, el);
      added.push(el);
    }
    const sig = it.mode + it.text;
    if (el.dataset.sig !== sig) {
      el.dataset.sig = sig;
      el.innerHTML = rowHtml(it);
    }
    const ref = prev ? prev.nextSibling : box.firstChild;
    if (el !== ref) box.insertBefore(el, ref);
    prev = el;
  }
  // Rows that moved (a follow-up made a steer) slide to their new place; new rows open up.
  const moved = [];
  for (const [id, el] of rows) {
    const top = before.get(id);
    if (top === undefined) continue;
    const d = top - el.getBoundingClientRect().top;
    if (Math.abs(d) < 1) continue;
    el.style.transition = "none";
    el.style.transform = `translateY(${d}px)`;
    moved.push(el);
  }
  box.offsetHeight;
  for (const el of added) el.classList.remove("in");
  for (const el of moved) {
    el.style.transition = "";
    el.style.transform = "";
  }
  if (!items.length && !box.hidden) {
    setTimeout(() => {
      if (Q.length) return;
      box.classList.add("out");
      setTimeout(() => !Q.length && (box.hidden = true), 200);
    }, 200);
  }
}
const enqueue = (mode, text) => {
  Q.push({ id: `q${++seq}`, seq, mode, text });
  renderQueue();
};

function composer() {
  const empty = ed.value.trim() === "";
  ph.textContent = live ? "插话：下一步送达（⌥↩ 任务完成后再发）" : "回复 finx…";
  ph.hidden = !empty;
  const stop = live && empty;
  send.className = `send ${stop ? "stop" : ""}`;
  send.disabled = !stop && empty;
  send.innerHTML = icon(stop ? "stopFill" : "arrowUp");
  send.title = stop ? "停止 ⌘." : "发送 ↩";
}
/* What comes back (a stop, a failure, an edit) goes before what is being written, a blank line between. */
function putBack(texts) {
  ed.value = [...texts, ed.value.trim()].filter(Boolean).join("\n\n");
  grow();
  composer();
  ed.focus();
  ed.setSelectionRange(ed.value.length, ed.value.length);
}
function submit(followUp) {
  const text = ed.value.trim();
  if (!text) return;
  ed.value = "";
  grow();
  if (live) enqueue(followUp ? "follow" : "steer", text);
  else start(text);
  composer();
}
ed.addEventListener("input", () => (grow(), composer()));
ed.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    submit(e.altKey);
  } else if (e.key === "ArrowUp" && ed.value === "" && Q.length) {
    e.preventDefault();
    edit(order().at(-1).id);
  }
});
send.addEventListener("click", () => (send.classList.contains("stop") ? stop() : submit(false)));
$("#cmp").addEventListener("mousedown", (e) => {
  if (e.target === e.currentTarget || e.target.classList.contains("cmp-row")) (e.preventDefault(), ed.focus());
});
document.addEventListener("keydown", (e) => {
  if (e.metaKey && e.key === ".") (e.preventDefault(), stop());
});

/* ———— a row's actions ———— */
function take(id) {
  const it = Q.find((x) => x.id === id);
  Q = Q.filter((x) => x.id !== id);
  renderQueue();
  return it;
}
function edit(id) {
  const it = take(id);
  if (it) putBack([it.text]);
}
$("#cq").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-a]");
  if (!b) return;
  const id = b.closest(".cq-row").dataset.id;
  const it = Q.find((x) => x.id === id);
  if (!it) return;
  if (b.dataset.a === "promote") {
    it.mode = "steer";
    it.seq = ++seq;
    renderQueue();
  } else if (b.dataset.a === "now") {
    if (run) run.cut = true;
  } else if (b.dataset.a === "edit") {
    edit(id);
  } else if (b.dataset.a === "del") {
    take(id);
    toast("已删除一条排队的消息", () => enqueue(it.mode, it.text));
  }
});

let toastTimer = 0;
function toast(text, undo) {
  const el = $("#toast");
  el.hidden = false;
  el.innerHTML = `${icon("check")}<span>${esc(text)}</span>${undo ? '<button class="btn sm">撤销</button>' : ""}`;
  el.style.animation = "none";
  el.offsetHeight;
  el.style.animation = "";
  if (undo) el.querySelector("button").onclick = () => ((el.hidden = true), undo());
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.hidden = true), 3600);
}

/* ———— the agent: a script of steps; between two steps is where steers go in ———— */
const ORANGE = /橙/;
const short = (s) => (s.length > 18 ? `${s.slice(0, 18)}…` : s);
function ackSteers(items) {
  if (items.length === 1 && ORANGE.test(items[0].text)) {
    return { think: "错误提示要改成橙色：改样式里的颜色变量就行。", text: "好的，错误提示改用橙色。", tools: [{ cat: "edit", obj: "src/pages/Login.css", ms: 2400 }] };
  }
  const what = items.length === 1 ? `「${short(items[0].text)}」` : `这 ${items.length} 条补充`;
  return { text: `收到${what}，我在接下来的步骤里一并处理。`, tools: [{ cat: "read", obj: "src/pages/Login.tsx", ms: 1800 }] };
}
function followSteps(it) {
  if (/测试/.test(it.text)) {
    return [{ think: "跑一遍全部测试，看有没有回归。", tools: [{ cat: "execute", obj: "pnpm test", ms: 5200 }] }, { text: "全部 148 个测试都通过了，没有回归。" }];
  }
  return [{ text: `好的，接着做：${short(it.text)}`, tools: [{ cat: "edit", obj: "NOTES.md", ms: 2600 }] }, { text: "做完了。" }];
}
const PLAN = () => [
  { tools: [{ cat: "edit", obj: "src/pages/Login.tsx", ms: 7000 }] },
  { text: "输入时就会校验了。再把规则抽到一处，表单和接口共用。", tools: [{ cat: "edit", obj: "src/lib/validate.ts", ms: 3400 }, { cat: "edit", obj: "src/lib/validate.test.ts", ms: 2800 }] },
  { think: "规则抽出来了，跑一下登录相关的测试。", tools: [{ cat: "execute", obj: "pnpm test login", ms: 5600 }] },
  { text: "改好了：登录页现在边输入边提示，规则在 `src/lib/validate.ts`，登录相关的 12 个测试都通过了。" },
];

let run = null, plan = [];
async function step(s, R) {
  if (s.think) {
    live.model = R.model = true;
    live.writing = false;
    const r = await sleep(1300, R);
    if (r !== "ok") return r;
    thought(s.think);
  }
  if (s.text) {
    live.model = R.model = true;
    live.writing = true;
    const el = add('<div class="am"><div class="md sel-text"><p></p></div></div>');
    const p = el.querySelector("p");
    for (let i = 1; i <= s.text.length; i += 2) {
      const r = await sleep(30, R);
      if (r === "dead") return r;
      p.textContent = s.text.slice(0, i);
      follow();
      if (r !== "ok") return r;
    }
    p.innerHTML = inline(s.text);
  }
  live.model = R.model = false;
  if (s.tools) {
    live.tools = s.tools.map((t) => ({ ...t, since: now, state: "running" }));
    for (;;) {
      const r = await sleep(100, R);
      if (r === "dead") return r;
      for (const t of live.tools) {
        if (t.state === "running" && now - t.since >= (R.fail ? Math.min(t.ms, 700) : t.ms)) (t.state = "done"), (t.end = now);
      }
      if (r === "stop" || r === "cut") {
        for (const t of live.tools) if (t.state === "running") t.state = "cancelled";
        doneTools(live.tools);
        live.tools = [];
        return r;
      }
      if (live.tools.every((t) => t.state !== "running")) break;
    }
    doneTools(live.tools);
    live.tools = [];
  }
  return "ok";
}
/* `current`: a step already under way when the scene opens; the first boundary comes after it. */
async function work(current) {
  const R = (run = { stop: false, cut: false, fail: false, model: false });
  composer();
  if (current) {
    const r = await step(current, R);
    if (r === "dead") return;
    if (r === "stop") return stopped();
    if (r === "fail") return failed();
  }
  for (;;) {
    // The boundary between two steps: every steer goes in, in the order sent.
    const steers = order().filter((x) => x.mode === "steer");
    if (steers.length) {
      Q = Q.filter((x) => x.mode !== "steer");
      renderQueue();
      for (const it of steers) user(it.text, true);
      plan.unshift(ackSteers(steers));
    }
    R.cut = false;
    if (R.fail) return failed();
    let s = plan.shift();
    if (!s) {
      // The task would end here: a follow-up goes in, and the same task goes on.
      const fu = order().find((x) => x.mode === "follow");
      if (!fu) return finished();
      take(fu.id);
      user(fu.text, true);
      plan.push(...followSteps(fu));
      continue;
    }
    const r = await step(s, R);
    if (r === "dead") return;
    if (r === "stop") return stopped();
    if (r === "fail") return failed();
  }
}
function begin(current) {
  live = { started: now, tokens: 0, tools: [], model: false, writing: false };
  tr.append(working);
  composer();
  work(current);
}
function end() {
  live = null;
  run = null;
  working.remove();
  composer();
}
function start(text) {
  user(text, false);
  plan = [{ think: "看一下要从哪里改。", text: `好的，${short(text)}`, tools: [{ cat: "read", obj: "src/pages/Login.tsx", ms: 2000 }] }, ...(plan.length ? plan : [{ text: "做完了。" }])];
  begin();
}
function finished() {
  const took = now - live.started, tokens = live.tokens;
  end();
  add(`<div class="donebar">${icon("check", "sm")}<span>完成 · 用时 ${secs(took)} · ${kilo(tokens)} tokens</span></div>`, "add-anim");
}
/* A stop and a failure hand what is queued back to the composer, never drop it. */
function handBack() {
  const items = order();
  Q = [];
  renderQueue();
  if (items.length) {
    putBack(items.map((x) => x.text));
    toast(`排队的 ${items.length} 条消息已放回输入框`);
  }
}
function stopped() {
  end();
  add('<div class="tnote">你打断了这个任务。再发一条消息就会接着做。</div>', "add-anim");
  handBack();
}
function failed() {
  end();
  const card = add(`<div class="fcard"><div class="fc-av">D<span class="fc-badge"><i></i></span></div><div class="fc-tx"><b>连不上 DeepSeek</b><span>网络错误。检查网络后重试。</span></div><button class="btn">重试</button></div>`);
  card.querySelector("button").onclick = () => {
    card.querySelector("button").disabled = true;
    begin();
  };
  handBack();
}
function stop() {
  if (run) run.stop = true;
}

/* ———— the scene, and the prototype's controls ———— */
function reset() {
  // The old run stops where it is and touches nothing more.
  if (run) run.dead = true;
  run = null;
  live = null;
  Q = [];
  for (const el of rows.values()) el.remove();
  rows.clear();
  $("#cq").hidden = true;
  tr.innerHTML = "";
  ed.value = "";
  grow();
  add('<div class="tdiv">今天 14:36</div>');
  user("把登录页的表单校验改成实时提示");
  thought("先看看登录页现在怎么校验，再决定改法。");
  add('<div class="am"><div class="md sel-text"><p>好的，我先看一下登录页现在的校验逻辑。</p></div></div>');
  doneTools([{ cat: "read", obj: "a" }, { cat: "read", obj: "b" }, { cat: "read", obj: "c" }, { cat: "search", obj: "d" }]);
  add(`<div class="am"><div class="md sel-text"><p>${inline("现在只在提交时校验。我把校验挪到输入时，并把规则抽到 `validate.ts`。")}</p></div></div>`);
  plan = PLAN();
  // The first edit is under way; two messages were sent a moment ago and wait for their turn.
  enqueue("steer", "顺便把错误提示的颜色改成橙色");
  enqueue("follow", "最后跑一遍全部测试，确认没有回归");
  begin(plan.shift());
  live.started = now - 42_000;
  live.tokens = 31_000;
}
const SAMPLES = {
  steer: ["顺便把错误提示的颜色改成橙色", "密码框也加上长度提示", "别动接口那边的校验，只改前端"],
  follow: ["最后跑一遍全部测试，确认没有回归", "做完更新一下 CHANGELOG", "把这次改动写成一段提交说明"],
};
const used = { steer: 0, follow: 0 };
$("#demo").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const d = b.dataset.d;
  if (d === "steer" || d === "follow") {
    if (!live) return toast("任务已经结束：现在发出的消息会直接开始新任务");
    enqueue(d, SAMPLES[d][used[d]++ % 3]);
  } else if (d === "fail") {
    if (run) run.fail = true;
  } else if (d === "pause") {
    paused = !paused;
    b.classList.toggle("on", paused);
    b.textContent = paused ? "继续" : "暂停";
  } else if (d === "reset") {
    reset();
  }
  if (b.dataset.t) theme(b.dataset.t);
});
function theme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll("#theme button").forEach((x) => x.classList.toggle("on", x.dataset.t === t));
}
theme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
// The conversation keeps clear of the composer's zone, as Chat.tsx does with the dock's height.
new ResizeObserver(() => {
  $("#dbody").style.paddingBottom = `${$("#col").offsetHeight + 40}px`;
  follow();
}).observe($("#col"));
grow();
reset();
</script>
</body>
