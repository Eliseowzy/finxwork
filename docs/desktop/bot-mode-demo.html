// 随手发的话：寒暄、提醒和能顺口答的问题马上回；别的都当成一件要花时间的事。
function guess(x) {
  if (/提醒|谢谢|好的|收到|在吗|你好|^hi|^hello|^ok/i.test(x)) return { quick: /提醒/.test(x) ? "<p>好，到时提醒你。</p>" : /谢/.test(x) ? "<p>不客气。</p>" : /好的|收到|ok/i.test(x) ? "<p>👌</p>" : "<p>在，你说。</p>" };
  if (x.length <= 24 && /(吗|呢|么|[?？])$|^(为什么|怎么|是不是|能不能)/.test(x)) return { quick: "<p>（原型）这种顺口就能答的问题，Bot 直接回答。</p>" };
  const label = x.replace(/^(帮我|麻烦|请|再|顺便|对了)[，, ]*/, "").replace(/[，。,.!！?？].*$/, "").slice(0, 16) || "这件事";
  return { work: { label, ms: [2400, 3800, 2800], steps: [["理解", "你要的是什么"], ["查找", "相关资料"], ["整理", "答复"]],
    h: `<p>（原型）这里是「${esc(label)}」的结果。真实的 Bot 做完一件事，会像这样带着引用回给你。</p>` } };
}
// 每来一句：要花时间的，一秒内在你的气泡上放一只眼睛、开始做；能马上答的，记下来。
// 有要回的话就“正在输入”。回复写好之前又来了新的，就把写了一半的作废，等你停下来再一起回（不流式，所以看不出来被顶掉过）。
function respond(b, m) {
  const plan = SCRIPT[m.x] || guess(m.x);
  if (plan.work) later(900, () => take(b, m, plan.work));
  else (b.answers ||= []).push({ id: m.id, h: plan.quick });
  if (b.answers && b.answers.length) {
    b.typing = true;
    clearTimeout(b.replyT);
    b.replyT = later(1800, () => reply(b));
  }
  changed(b, true);
}
// 回话：一件一个气泡，中间隔一拍，像人连着发几条。
function reply(b) {
  const items = b.answers.splice(0);
  const next = () => {
    const x = items.shift();
    b.typing = items.length > 0;
    say(b, x.h, [x.id]);
    if (items.length) later(800, next);
  };
  next();
}
function take(b, m, spec) {
  m.rx = "seen";
  const w = { id: nid("w"), label: spec.label, re: [m.id], steps: spec.steps, ms: spec.ms, i: 0, start: Date.now(), h: spec.h };
  b.work.push(w);
  changed(b);
  step(b, w);
}
function step(b, w) {
  w.timer = later(w.ms[w.i] ?? 3000, () => {
    if (!b.work.includes(w)) return;
    if (w.i < w.steps.length - 1) {
      w.i++;
      if (viewing(b) && S.wopen) refreshWorking(b);
      step(b, w);
    } else finish(b, w);
  });
}
// 做完一件：交代它的那句换成对勾，结果作为一个新气泡回来，不是紧挨着就带引用。
function finish(b, w) {
  clearTimeout(w.timer);
  b.work = b.work.filter((x) => x !== w);
  for (const id of w.re) { const m = b.msgs.find((x) => x.id === id); if (m && m.me) m.rx = "done"; }
  say(b, w.h, w.re, { proc: { sec: (Date.now() - w.start) / 1000, steps: w.steps } });
}
function answer(b, id, v) {
  const m = b.msgs.find((x) => x.id === id), w = b.work.find((x) => x.ask === id);
  m.ask.st = v;
  if (v === "no") {
    b.work = b.work.filter((x) => x !== w);
    for (const r of w ? w.re : []) delete b.msgs.find((x) => x.id === r).rx;
    b.typing = true;
    changed(b);
    return later(1200, () => { b.typing = false; say(b, "<p>好，先不动它。要重启的时候再叫我。</p>", w ? w.re : undefined); });
  }
  Object.assign(w, { wait: false, i: 0, start: Date.now(), ms: [2200, 2600], steps: [["运行", "ssh dmit-us sudo systemctl restart nginx"], ["检查", "最近 1 分钟的错误日志"]],
    h: "<p>重启好了。nginx 已恢复，最近 1 分钟没有新的超时。</p>" });
  changed(b);
  step(b, w);
}

let menuEl = null;
function closeMenu() { if (!menuEl) return; menuEl.remove(); menuEl = null; $$(".brow.menu-open").forEach((r) => r.classList.remove("menu-open")); }
// 行的 ⋯ 只在悬停或菜单开着时显示，所以先把行标成开着，再量按钮的位置。
function openMenu(anchor, items, row) {
  closeMenu();
  if (row) row.classList.add("menu-open");
  const r = anchor.getBoundingClientRect();
  menuEl = document.createElement("div");
  menuEl.className = "vmenu";
  menuEl.setAttribute("role", "menu");
  menuEl.innerHTML = items.map((it, k) => (it
    ? `<button class="mi${it.danger ? " danger" : ""}" role="menuitem" data-k="${k}"${it.off ? " disabled" : ""}><span>${it.label}</span>${it.hint ? `<span class="val">${it.hint}</span>` : ""}</button>`
    : '<div class="msep" role="separator"></div>')).join("");
  document.body.appendChild(menuEl);
  const w = menuEl.offsetWidth, h = menuEl.offsetHeight;
  menuEl.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  menuEl.style.top = (r.bottom + 4 + h > innerHeight - 8 ? r.top - h - 4 : r.bottom + 4) + "px";
  menuEl.addEventListener("click", (e) => { const it = e.target.closest(".mi"); if (!it) return; closeMenu(); items[+it.dataset.k].run(); });
}
function botMenu(b, fromList) {
  return [
    { label: "改名字、换头像", run: () => openSheet(b) },
    { label: b.pinned ? "取消置顶" : "置顶", run: () => { b.pinned = !b.pinned; renderList(); } },
    fromList && !viewing(b) ? { label: b.unread ? "标为已读" : "标为未读", run: () => { b.unread = b.unread ? 0 : 1; renderList(); } } : null,
    null,
    { label: "清空聊天记录", run: () => confirmDo(`清空和「${b.name}」的聊天记录？`, "清空以后它不再记得之前聊过的内容，聊天记录也找不回来。", "清空", () => { b.msgs = []; changed(b, true); toast("已清空"); }) },
    { label: "删除 Bot", danger: true, off: b.id === "finx", hint: b.id === "finx" ? "默认 Bot" : "", run: () => confirmDo(`删除「${b.name}」？`, "它的聊天记录和手上的事都会一起删除，找不回来。", "删除", () => removeBot(b)) },
  ].filter((x, k, a) => x !== null || (a[k - 1] && a[k + 1]));
}
function removeBot(b) {
  b.work.forEach((w) => clearTimeout(w.timer));
  bots.splice(bots.indexOf(b), 1);
  if (S.sel === b.id) { S.sel = "finx"; renderMain(); }
  renderList();
  toast(`已删除「${b.name}」`);
}
function confirmDo(title, sub, ok, run) {
  $("#c-title").textContent = title;
  $("#c-sub").textContent = sub;
  $("#c-ok").textContent = ok;
  const d = $("#confirm");

}
let toastT = 0;
function toast(text) {
  const t = $("#toast");
  if (!t) return;
  t.innerHTML = `${ic("check")}<span>${esc(text)}</span>`;
  t.hidden = false;
  clearTimeout(toastT);

}
function flash(id) {

let SH = null;
function openSheet(b) {

function sheetAv() {

}
function renderSheet() {

document.addEventListener("click", (e) => {
  const t = e.target;
  if (menuEl && !menuEl.contains(t) && !t.closest("[data-more],#bmore")) closeMenu();
  const mode = t.closest(".mode button");
  if (mode) return setMode(mode.dataset.mode);
  const nav = t.closest(".nav-i");
  if (nav) return nav.dataset.nav === "new" ? openSheet() : toast("原型里没有做这一页");
  const more = t.closest("[data-more]");
  if (more) {
    const row = more.closest(".brow");
    if (menuEl && row.classList.contains("menu-open")) return closeMenu();
    return openMenu(more, botMenu(bot(more.dataset.more), true), row);
  }
  const row = t.closest(".brow");
  if (row) return row.dataset.bot !== S.sel && select(row.dataset.bot);
  if (t.closest("#bmore")) return menuEl ? closeMenu() : openMenu($("#bmore"), botMenu(bot(S.sel), false));
  if (t.closest("#bhead")) return openSheet(bot(S.sel));
  const b = S.mode === "bot" && bot(S.sel);
  if (!b) return;
  const go = t.closest("[data-go]");
  if (go && go.closest("#tl")) return flash(go.dataset.go);
  const pr = t.closest("[data-proc]");
  if (pr) { const m = b.msgs.find((x) => x.id === pr.dataset.proc); m.open = !m.open; return renderTimeline(); }
  const ask = t.closest("[data-ask]");
  if (ask) return answer(b, ask.dataset.ask, ask.dataset.v);
  const q = t.closest("[data-quote]");
  if (q) { S.quote = q.dataset.quote; renderQuote(); return $("#in").focus(); }
  if (t.closest("#unquote")) { S.quote = null; renderQuote(); return $("#in").focus(); }
  const cp = t.closest("[data-copy]");
  if (cp) { navigator.clipboard?.writeText(plain(b.msgs.find((x) => x.id === cp.dataset.copy))).catch(() => {}); return toast("已拷贝"); }
  if (t.closest("[data-wopen]")) { S.wopen = !S.wopen; return renderTimeline(); }
  const wg = t.closest("[data-wgo]");
  if (wg) return flash(b.work.find((x) => x.id === wg.dataset.wgo).re[0]);
  if (t.closest("#send")) return submit();
  if (t.closest("#plus")) return toast("原型里没有做“添加”菜单");

});

/* ———— 原型面板 ———— */
const THREE = ["帮我看看 finxwork 的 CI 这周挂了几次，都是什么原因", "明天下午 3 点提醒我给王工回电话", "再把仓库里 TODO 最多的 5 个文件列一下"];
const POEMS = ["写一首春天的诗", "写一首夏天的诗", "写一首秋天的诗", "写一首冬天的诗"];
// 像人打字那样一句一句发出去。
function burst(lines, gaps) {
  setMode("bot");
  if (S.sel !== "finx") select("finx");
  lines.forEach((x, k) => later(gaps[k], () => post(bot("finx"), x)));
}
$("#d-three").addEventListener("click", () => burst(THREE, [200, 1500, 2900]));
$("#d-poems").addEventListener("click", () => burst(POEMS, [200, 1300, 2400, 3500]));
$("#d-deliver").addEventListener("click", () => {
  const b = bot("res"), w = b && b.work[0];
  if (w) finish(b, w);
});
$("#d-new").addEventListener("click", () => openSheet());
$("#d-reset").addEventListener("click", () => location.reload());
$("#fold").addEventListener("click", () => { const d = $("#demo"); d.classList.toggle("folded"); $("#fold").textContent = d.classList.contains("folded") ? "+" : "–"; });
$("#theme").addEventListener("click", (e) => {
  const t = e.target.closest("[data-t]");
  if (!t) return;
  document.documentElement.dataset.theme = t.dataset.t;
  $$("#theme button").forEach((x) => x.classList.toggle("on", x === t));
});
$("#hide").innerHTML = ic("sidebar");

// 每秒只改“它在忙”里的时长，别的不动（重画会让点和流光从头再来）。
setInterval(() => {
  const b = S.mode === "bot" && bot(S.sel);
  if (!b) return;
  for (const w of b.work) { const el = $(`[data-el="${w.id}"]`); if (el) el.textContent = dur((Date.now() - w.start) / 1000); }
}, 1000);
addEventListener("resize", padBottom);

renderSide();
renderMain();
for (const b of bots) for (const w of b.work) if (!w.wait) step(b, w);
</script>
</body>
</html>
