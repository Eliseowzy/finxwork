.content{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--win)}
.ctool{height:var(--top);flex:none;display:flex;align-items:center;gap:10px;padding:0 calc(14px + var(--caption)) 0 22px}
.noside .ctool{padding-left:30px}
.ctitle{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.ctitle h2{margin:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctitle .sub{font-size:12px;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cscroll{flex:1;overflow-y:auto;min-height:0;scrollbar-gutter:stable both-edges}

/* session page */
.dwrap{flex:1;min-height:0;display:flex;position:relative;border-top:.5px solid var(--sep)}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;position:relative}
/* The bar over the conversation's bottom edge: what the running task does, and Interrupt. */
.cbar{border-radius:var(--r-lg);background:var(--win);box-shadow:0 0 0 .5px var(--menu-bd),0 10px 30px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.06);font-size:12.5px;align-self:center;max-width:100%}
@keyframes cbarup{from{opacity:0;transform:translateY(10px) scale(.98)}}
.cbar-row{display:flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 16px;white-space:nowrap}
.cbar-row b{font-weight:600}
.cbar-row .ph{color:var(--l2);overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:300px}
.cbar-row .el{color:var(--l2);font-variant-numeric:tabular-nums}
.qx-tag{height:18px;padding:0 8px;border-radius:var(--r-xs);background:var(--fill2);font-size:11px;display:inline-flex;align-items:center}
.kret{opacity:.7;font-size:12px;margin-left:2px}
.ctl-sep{width:1px;height:20px;background:var(--sep);flex:none}
.ctl-btn{height:32px;border:0;border-radius:var(--r-sm);padding:0 12px 0 10px;display:flex;align-items:center;gap:6px;background:var(--fill2);font-size:12.5px;font-weight:500;flex:none}
.ctl-btn:hover{background:var(--fill3)}
.ctl-btn .ic{width:14px;height:14px}
/* The working mark: breathing while finx works. */
.live-logo{display:inline-flex;animation:live-breathe 2.4s ease-in-out infinite}
@keyframes live-breathe{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.live-logo{animation:none}}
/* The session's card: it floats over the conversation's top right (the conversation keeps clear of it), set off by a hairline, without a shadow (on a dark window a shadow only darkens the ring around it). */
/* The cards, one under the other. Spacing goes up the scale from inside out: 8 within a card, 13 between cards, 21 to the
   window's edges (the same above as on the right, so the stack sits square in its corner). */
.insp-stack{position:absolute;top:var(--sp-3);right:var(--sp-3);z-index:4;width:252px;display:flex;flex-direction:column;gap:var(--sp-2)}
.insp{background:color-mix(in srgb,var(--win) 86%,transparent);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
  border-radius:var(--r-xl);box-shadow:0 0 0 .5px var(--sep);padding:8px}
/* The scroller itself ends before the card, so its scrollbar runs beside the conversation, not under the card. */
.dwrap.dock .cscroll{margin-right:calc(252px + var(--sp-3) + var(--sp-1))}
/* The composer centres under the conversation too. */
.dwrap.dock .cmp-zone{right:calc(252px + var(--sp-3) + var(--sp-1))}
/* Back to the end of the conversation, above the composer in the column's middle, while the person is
   scrolled well up: glass like the bars, fading in. --dock is the composer column's height; 12px is its
   zone's bottom padding (composer.css). */
.tobottom{position:absolute;left:50%;bottom:calc(var(--dock, 0px) + 12px + var(--sp-3));z-index:5;width:30px;height:30px;margin-left:-15px;border:0;border-radius:var(--r-lg);background:var(--glass);box-shadow:var(--glass-sh);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);color:var(--l1);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .18s var(--ease-out),transform .18s var(--ease-out)}
.tobottom.on{opacity:1;transform:none;pointer-events:auto}
.tobottom:hover{background:var(--menu-solid)}
.tobottom .ic{width:15px;height:15px}
.dwrap.dock .tobottom{left:calc(50% - (252px + var(--sp-3) + var(--sp-1)) / 2)}
/* Inside, the sidebar's measures: a group's heading (.grp-h), then rows as its own (.nav-i), the heading's text in line with the rows' icons. */
.insp h3{margin:0;padding:6px 9px;font-size:12px;line-height:16px;font-weight:400;color:var(--l2)}
.insp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.insp-row{box-sizing:border-box;display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 9px;border-radius:var(--r-md);font-size:14px;color:var(--l1);white-space:nowrap;min-width:0}
button.insp-row{border:0;background:none;font-family:inherit;text-align:left;cursor:pointer}
button.insp-row:hover,button.insp-row[aria-expanded="true"]{background:var(--fill)}
button.insp-row:active{background:var(--fill2)}
.insp-row .ic{flex:none;width:18px;height:18px;color:var(--l2)}
/* When room runs short, the folder's path gives way first, then the name. */
.insp-where{display:flex;min-width:0}
.insp-t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.insp-sub{flex-shrink:1000;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:pre;color:var(--l2)}
/* The context card: a heading that opens it, the share used beside it while closed. */
.insp-h{box-sizing:border-box;display:flex;align-items:center;gap:2px;width:100%;height:28px;padding:0 9px;border:0;border-radius:var(--r-md);background:none;font-family:inherit;color:var(--l2);text-align:left;cursor:pointer}
.insp-h:hover{background:var(--fill)}
.insp .insp-h h3{padding:0}
.insp-h .ic{flex:none;width:16px;height:16px;transition:transform .15s var(--ease-out)}
.insp-h .ic.shut{transform:rotate(-90deg)}
.insp-glance{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
.ctx-mini{width:36px;height:6px;border-radius:3px;background:var(--fill2);overflow:hidden}
.ctx-mini i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.ctx-body{padding:4px 9px 0}
.ctx-sum{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:14px;color:var(--l1)}
.ctx-of{font-size:12px;color:var(--l2);font-variant-numeric:tabular-nums}
/* The window, left to right: the parts, the free room (the track), the kept room at the end. */
.ctx-bar{display:flex;gap:1px;height:6px;margin:8px 0 6px;border-radius:3px;background:var(--fill2);overflow:hidden}
.ctx-bar i{display:block;flex:none;min-width:2px;height:100%}
.ctx-bar .ctx-reserved{margin-left:auto}
.ctx-rows{list-style:none;margin:0;padding:0}
.ctx-rows li{display:grid;grid-template-columns:10px minmax(0,1fr) auto 44px;align-items:center;gap:9px;height:26px;font-size:13px}
.ctx-sw{width:10px;height:10px;border-radius:3px}
.ctx-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--l2)}
.ctx-n{color:var(--l2);text-align:right;font-variant-numeric:tabular-nums}
.ctx-p{color:var(--l1);text-align:right;font-variant-numeric:tabular-nums}
.ctx-messages{background:var(--accent)}
.ctx-system_prompt{background:var(--orange)}
.ctx-tools{background:var(--green)}
.ctx-skills{background:var(--violet)}
.ctx-mcp{background:var(--teal)}
.ctx-other{background:var(--l2)}
.ctx-reserved{background:var(--l3)}
.ctx-free{background:var(--fill2);box-shadow:inset 0 0 0 .5px var(--l4)}
/* The conversation: a 730-wide column, at least 34 from the edges; lines close together, blocks apart. */
.dbody{max-width:798px;margin:0 auto;padding:var(--sp-3) var(--sp-4) 40px}
.tr{display:flex;flex-direction:column;gap:var(--sp-2)}
/* A time line before a message, only after a pause: centred, no rule. */
.tdiv{align-self:center;font-size:11.5px;color:var(--l3);margin:10px 0 2px}
/* Earlier history: the link, or while it comes the spinner, in the same height so nothing below moves. */
.tdiv.earlier{display:flex;align-items:center;justify-content:center;height:16px}
/* The owner speaks in a dark bubble on the right; the model writes plain text across the page. */
.um{position:relative;align-self:flex-end;max-width:78%;margin-top:var(--sp-1)}
.um .bub{background:var(--bub);color:var(--bub-fg);border-radius:var(--r-xl);padding:9px 15px;font-size:15px;line-height:21px;white-space:pre-wrap;overflow-wrap:anywhere}
/* What the message carried, above its bubble: images as thumbnails, files and folders as chips. */
.um-att{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-bottom:8px}
.am{position:relative;font-size:15px;line-height:21px;color:var(--msg)}
/* A message with time and Copy keeps room below it for them, shown on hover under the bubble's right edge or the
   text's left; the model's words between tool calls have none, so they sit as far from the work above as below. */
.um,.am.act{margin-bottom:var(--sp-3)}
.msg-act{position:absolute;top:100%;padding-top:3px;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .15s}
.um .msg-act{right:2px}
.am .msg-act{left:-2px}
.um:hover .msg-act,.am:hover .msg-act,.msg-act:focus-within{opacity:1}
.msg-act .tb{height:26px;min-width:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--l3)}
.msg-act .tb:hover{color:var(--l1)}
.msg-act .ic.sm{width:15px;height:15px}
.msg-act .tb:hover{background:var(--fill)}
.msg-meta{font-size:12px;line-height:26px;color:var(--l3);white-space:nowrap;padding:0 2px;font-variant-numeric:tabular-nums}
.md{overflow-wrap:anywhere}
.md>*{margin:0}
.md>*+*{margin-top:12px}
.md :is(h1,h2,h3,h4,h5,h6){font-weight:600;line-height:1.4}
.md h1{font-size:18px}.md h2{font-size:16.5px}.md :is(h3,h4,h5,h6){font-size:15px}
.md ul,.md ol{padding-left:20px}
.md li+li,.md li>:is(ul,ol){margin-top:4px}
.md li>p{margin:0}
.md li>p+p{margin-top:6px}
.md li.task-list-item{list-style:none;margin-left:-18px}
.md li.task-list-item input{margin:0 6px 0 0;vertical-align:-1px}
.md hr{border:0;border-top:.5px solid var(--sep)}
.md-table{overflow-x:auto}
.md table{border-collapse:collapse;font-size:14px;line-height:20px}
.md :is(th,td){padding:6px 14px 6px 0;border-bottom:.5px solid var(--sep);text-align:left;vertical-align:top}
.md th{font-weight:600}
.md li::marker{color:var(--l3)}
.md blockquote{border-left:2px solid var(--fill3);padding-left:12px;color:var(--l2)}
.md code{font-family:var(--mono);font-size:13px;background:var(--fill2);padding:1px 5px;border-radius:var(--r-xs)}
.md pre{background:var(--code);border-radius:var(--r-md);padding:10px 12px;overflow-x:auto;box-shadow:inset 0 0 0 .5px var(--sep)}
.md pre code{background:none;padding:0;font-size:12.5px;line-height:1.55;white-space:pre}
/* Shiki's tokens carry both themes' colours; the app's colour scheme picks one. */
.hl span{color:light-dark(var(--shiki-light),var(--shiki-dark))}
.md a{color:var(--accent-t);text-decoration:none}
.md a:hover{text-decoration:underline}
/* Steps: a grey line in the body's size, no icon; a small caret after it opens it. */
.tool{border-radius:var(--r-md);font-size:14px}
.tool .th{display:flex;align-items:center;gap:6px;padding:2px 0;border-radius:var(--r-sm);border:0;background:none;max-width:100%;text-align:left;color:var(--l2)}
.tool .th:hover{color:var(--l1)}
.tool-shots{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.tool-shot{padding:0;border:.5px solid var(--sep);border-radius:var(--r-sm);background:none;overflow:hidden;cursor:zoom-in;line-height:0}
.tool-shot img{display:block;max-width:240px;max-height:150px;object-fit:contain}
.tool-shots.big .tool-shot{cursor:zoom-out}
.tool-shots.big .tool-shot img{max-width:100%;max-height:none}
.tool .th .vb{flex:none}
.tool .th .sm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* A command reads as code: the mono face a size down, a little quieter until hovered. */
.tool .th .cmd{font-family:var(--mono);font-size:12.5px;opacity:.9}
.tool .th:hover .cmd{opacity:1}
.tool .th .chev{flex:none}
.tgroup{font-size:14px}
.tg-h{display:flex;align-items:center;gap:6px;padding:2px 0;border:0;background:none;color:var(--l2);text-align:left}
.tg-h:hover{color:var(--l1)}
/* While a task runs, the last line of the conversation: the mark written over and over, beside the calls
   that run (centred on the first one's line, each with how long it has run) or what the model is at, how
   long the task has run and its tokens. */
.working{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--l2)}
.working canvas{margin-top:2px}
.wk-now{flex:1;min-width:0;display:flex;flex-direction:column}
.wk-line{display:flex;align-items:baseline;gap:4px;padding:2px 0;line-height:19px}
.wk-meta,.wk-time{flex:none;font-size:12.5px;color:var(--l3);font-variant-numeric:tabular-nums}
.wk-time{margin-left:2px}
.tg-h .chev,.tool .th .chev{width:14px;height:14px;margin-left:-3px;color:var(--l3);transform:rotate(-90deg);transition:transform .15s}
.tgroup.open .tg-h .chev,.tool.open .th .chev{transform:none}
.tool .out{display:none;margin:4px 0 6px;background:var(--code);border-radius:var(--r-md);padding:8px 10px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;color:var(--l2);line-height:1.5;max-height:360px;overflow:auto}
.tool.open .out{display:block}
/* Thinking reads as the model's own quieter voice, not as code. */
.tool.think .out{font-family:var(--font);font-size:13px;line-height:1.6;white-space:pre-wrap}
/* Opened, a group is a hairline card a size down: one row per step, its output opening inside the card. */
.tg-b{display:flex;flex-direction:column;margin:var(--sp-1) 0 2px;border:1px solid var(--sep);border-radius:var(--r-md);overflow:hidden}
.tg-b .tool{border-radius:0;font-size:13px}
.tg-b .tool+.tool{border-top:1px solid var(--sep)}
.tg-b .tool .th{width:100%;gap:5px;padding:var(--sp-1) var(--sp-2);border-radius:0}
.tg-b .tool .th[aria-expanded]:hover,.tg-b .tool.open .th{background:var(--fill)}
.tg-b .tool .out{margin:0;border-radius:0;padding:var(--sp-1) var(--sp-2) 10px;background:var(--fill);color:var(--l2);max-height:320px;overflow:auto}
.tool.err .th .vb{color:var(--red)}
.tool.denied .th .vb{color:var(--orange)}
.tnote{align-self:center;font-size:12px;color:var(--l2);background:var(--fill);padding:5px 12px;border-radius:var(--r-sm);text-align:center;max-width:100%}
.tnote.warn{color:var(--orange);background:var(--orange-bg)}
.add-anim{animation:fadein .4s cubic-bezier(.2,0,0,1)}
/* A failure as one row: the provider's mark with a badge in the tone of what it asks (set
   something up, wait it out, change the request), what happened, one way out, the rest in a
   menu. While finx retries by itself the row drains a line along its bottom. */
.fail-wrap{display:flex;flex-direction:column;gap:6px;margin-top:6px;max-width:560px}
.f-setup{--tc:var(--accent-t)}.f-wait{--tc:var(--orange)}.f-fail{--tc:var(--red)}
.fcard{position:relative;display:flex;align-items:center;gap:12px;padding:11px 10px 11px 12px;border:1px solid var(--sep);border-radius:var(--r-xl);animation:fadein .3s cubic-bezier(.2,0,0,1)}
.fc-av{position:relative;flex:none;width:36px;height:36px;border-radius:var(--r-md);background:var(--fill);display:grid;place-items:center;color:var(--l2)}
.fc-av .provider-brand{width:22px;height:22px}
.fc-av .brand-initial{width:36px;height:36px;border-radius:var(--r-md);font-size:15px}
.fc-badge{position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border-radius:50%;background:var(--win);display:grid;place-items:center}
.fc-badge i{width:13px;height:13px;border-radius:50%;background:var(--tc);color:var(--win);display:grid;place-items:center}
.fc-badge .ic{width:9px;height:9px;stroke-width:2.2}
.fc-tx{flex:1;min-width:0}
.fc-tx b{display:block;font-size:13.5px;font-weight:600;line-height:19px}
.fc-tx span{display:block;font-size:12px;line-height:17px;color:var(--l2);margin-top:1px}
.fc-side{display:flex;align-items:center;gap:4px;flex:none}
.fc-more{width:24px;height:24px;border-radius:var(--r-sm);border:0;background:none;color:var(--l2);display:grid;place-items:center}
.fc-more:hover,.fc-more[aria-expanded=true]{background:var(--fill);color:var(--l1)}
.fc-clip{position:absolute;inset:-1px;border-radius:inherit;overflow:hidden;pointer-events:none}
.fc-clip i{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--tc);transform-origin:left;animation:fcdrain linear forwards}
@keyframes fcdrain{from{transform:scaleX(var(--from,1))}to{transform:scaleX(0)}}
.fc-raw{font-family:var(--mono);font-size:11.5px;color:var(--l2);background:var(--code);border-radius:var(--r-md);padding:8px 10px;box-shadow:inset 0 0 0 .5px var(--sep);white-space:pre-wrap;overflow-wrap:anywhere}
.fpast{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--l3);border:0;background:none;padding:2px 0;text-align:left}
.fpast:hover{color:var(--l2)}
.fpast>i{width:6px;height:6px;border-radius:50%;background:var(--tc);flex:none}
.fpast .chev{width:12px;height:12px;transition:transform .15s}
.fpast .chev.open{transform:rotate(90deg)}
.livebar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--l2);padding:8px 2px 0}
.donebar{align-self:center;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--l3);margin:-4px 0 6px}
.donebar .ic{color:var(--green)}
/* Sub-agents in the conversation (session/Agents.tsx). What spawn_agent started: a hairline card, one live row per agent. */
.agc{border:1px solid var(--sep);border-radius:var(--r-lg);overflow:hidden;margin:2px 0 6px}
.agc-h{display:flex;align-items:center;gap:7px;padding:8px 13px;font-size:12.5px;color:var(--l2);border-bottom:1px solid var(--sep);background:var(--fill)}
.agc-h .ic{width:14px;height:14px}
.agc-r{display:flex;align-items:center;gap:10px;width:100%;padding:9px 13px;border:0;background:none;text-align:left;font-size:13.5px;line-height:19px}
.agc-r+.agc-r{border-top:1px solid var(--sep)}
.agc-r:hover{background:var(--fill)}
.agc-n{flex:none;font-weight:500;font-family:var(--mono);font-size:12.5px}
.agc-g{flex:1;min-width:0;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agc-s{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--l2);font-variant-numeric:tabular-nums}
.agc-s.ok{color:var(--green)}.agc-s.int{color:var(--orange)}.agc-s.bad{color:var(--red)}
.agc-s .tm{color:var(--l3)}
.agc-r .go{color:var(--l3);width:14px;height:14px;opacity:0;transition:opacity .12s}
.agc-r:hover .go{opacity:1}
/* An agent's state: a spinner while it works, a check when done, a pause when stopped. */
.gl{width:16px;height:16px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.gl.ok{color:var(--green)}.gl.int{color:var(--orange)}.gl.bad{color:var(--red)}
/* A report: who sent it and how it went, its first lines, the rest on request. */
.rpc{border:1px solid var(--sep);border-radius:var(--r-lg);margin:2px 0 4px}
.rpc-h{display:flex;align-items:center;gap:8px;padding:10px 14px 0;font-size:13px;color:var(--l2)}
.rpc-h .who{color:var(--l1);font-weight:500;font-family:var(--mono);font-size:12.5px}
.rpc-h .meta{margin-left:auto;font-size:12px;color:var(--l3);font-variant-numeric:tabular-nums}
.chip{height:18px;padding:0 7px;border-radius:var(--r-xs);font-size:11px;font-weight:500;display:inline-flex;align-items:center;flex:none}
.chip.ok{color:var(--green);background:var(--green-bg)}.chip.int{color:var(--orange);background:var(--orange-bg)}.chip.bad{color:var(--red);background:var(--red-bg)}
.rpc-b{padding:6px 14px 0;color:var(--msg)}
.rpc-b .md{font-size:14px;line-height:21px}
.rpc-b .md :is(h1,h2,h3,h4,h5,h6){font-size:14px;line-height:21px}
.rpc-none{margin:0;font-size:14px;line-height:21px;color:var(--l3)}
.rpc-b .md>*+*{margin-top:6px}
.rpc-b.clamp{max-height:52px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 40%,transparent);mask-image:linear-gradient(to bottom,#000 40%,transparent)}
.rpc-f{display:flex;align-items:center;gap:16px;padding:6px 14px 10px;font-size:12.5px}
.rpc-f .link{display:inline-flex;align-items:center;gap:2px}
.rpc-f .link.quiet{color:var(--l2)}
.rpc-f .link .ic{width:12px;height:12px}
/* At the conversation's end: how many background tasks still work, as a link that opens the panel. */
/* On the conversation's left edge (its padding hangs out), flush with the working line's mark, close under it. */
.bgind{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;margin-left:-8px;border:0;background:none;padding:4px 8px;border-radius:var(--r-sm);font-size:13px;color:var(--accent-t);cursor:pointer}
.bgind:hover{text-decoration:underline;text-underline-offset:3px}
.bgind .ic{width:13px;height:13px}
.bgind.int{color:var(--orange)}
.bgind.on{background:var(--accent-bg);text-decoration:none}
.working+.bgind{margin-top:-9px}
.tb{position:relative}
.tb-badge{position:absolute;top:1px;right:0;min-width:15px;height:15px;padding:0 4px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;line-height:15px;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--win)}
/* A session page: the conversation's column, and the background panel beside it when open. */
.spage{flex:1;min-height:0;display:flex;position:relative}
.scol{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
/* On a session page the bar floats over the conversation as liquid glass (glass.tsx): the conversation
   scrolls under it and shows through, blurred, bending at the bar's bottom edge; a hairline closes it.
   The bending is its inline backdrop-filter once measured; until then, and where SVG backdrops don't
   work, it is frosted. */
.scol>.ctool{position:absolute;top:0;left:0;right:0;z-index:5;background:var(--bar-tint);box-shadow:inset 0 -.5px 0 var(--sep);
  backdrop-filter:blur(18px) saturate(1.8);-webkit-backdrop-filter:blur(18px) saturate(1.8)}
.glass-defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.scol .dwrap{border-top:0}
.scol .dbody{padding-top:calc(var(--top) + var(--sp-3))}
.scol .insp-stack{top:calc(var(--top) + var(--sp-3))}
/* Reduce transparency (System Settings › Accessibility › Display): a solid bar. */
@media (prefers-reduced-transparency:reduce){.scol>.ctool{backdrop-filter:none !important;background:var(--win)}}
/* The system's window buttons sit over the panel's top then, not the conversation's. */
.spage.bgopen .ctool{padding-right:14px}
/* The background panel (session/Background.tsx): a column of the window on the right, flush with its
   top, on the content's own ground; rows like the sidebar's and group lines instead of dividers,
   with the selected agent's work opened under its row. */
.bgp{flex:none;width:340px;display:flex;flex-direction:column;min-height:0;background:var(--win);border-left:.5px solid var(--sep)}
.bgp-top{height:var(--top);flex:none;display:flex;align-items:center;gap:2px;padding:0 calc(10px + var(--caption)) 0 18px}
.bgp-top h3{flex:1;min-width:0;margin:0;font-size:13px;font-weight:600}
.qb{height:24px;border:0;border-radius:var(--r-sm);background:none;padding:0 8px;font-size:12px;color:var(--l2);display:inline-flex;align-items:center;white-space:nowrap}
.qb:hover{background:var(--fill2);color:var(--l1)}
.qb.danger:hover{color:var(--red)}
.bgp .grp-h{position:static;background:none;padding:12px 10px 6px;margin:0;font-variant-numeric:tabular-nums;cursor:default}
.bgp .grp-h:hover{color:var(--l2)}
.bgp .grp-h .sp{flex:1}
.bgp .grp-h .n{font-weight:400}
.bgp-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:0 8px 4px}
/* The embedded browser's panel: wider than the background panel; the tab's own view is laid over .brp-view by the main process. */
.bgp.brp{position:relative;width:clamp(380px,44%,760px)}
.bgp.brp.sized{width:var(--brp-w)}
/* Drag to resize; while dragging the page's own view steps aside (it would take the pointer). */
.brp-grip{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:2}
.brp-grip:hover,.brp.resizing .brp-grip{background:var(--sel)}
/* Under the tab's view: the window's own ground, so nothing flashes white in the dark. */
.brp-view{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--win)}
/* The tab's picture while a dialog is over the window. */
.brp-still{position:absolute;left:0;top:0;display:block;max-width:none;height:auto;pointer-events:none;user-select:none}
/* A blank tab's page: the web servers on this machine, as cards. */
.ntp{position:absolute;inset:0;overflow:auto;padding:48px 32px}
.ntp-sec{max-width:640px;margin:0 auto}
.ntp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ntp-head h2{margin:0;font-size:12px;font-weight:500;color:var(--l3);letter-spacing:.02em}
.ntp-rescan{height:22px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:12px;color:var(--l3);cursor:default}
.ntp-rescan:hover:not(:disabled){background:var(--fill);color:var(--l1)}
.ntp-rescan:disabled{opacity:.5}
.ntp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.ntp-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;height:76px;padding:10px 12px;border:1px solid var(--sep);border-radius:var(--r-lg);background:var(--fill);color:var(--l1);text-align:left;cursor:default}
.ntp-card:hover{background:var(--fill2)}
.ntp-card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ntp-card.ghost{border-color:transparent;animation:ntp-pulse 1.2s ease-in-out infinite alternate}
@keyframes ntp-pulse{from{opacity:.4}to{opacity:.8}}
.ntp-port{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--l2)}
.ntp-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.ntp-title,.ntp-meta{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntp-title{font-size:13px}
.ntp-meta{font-size:11px;color:var(--l3)}
.ntp-empty{margin:0;font-size:13px;color:var(--l3)}
/* Tabs on top, like a browser's: the shown one raised; a tab's close button shows on hover and on the shown one. */
.brp-strip{height:var(--top);flex:none;display:flex;align-items:center;gap:4px;padding:0 calc(8px + var(--caption)) 0 10px;min-width:0}
.brp-more{margin-left:auto}
.brp-tabs{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.brp-tab{flex:0 1 180px;min-width:72px;height:30px;display:flex;align-items:center;gap:6px;padding:0 4px 0 12px;border-radius:8px;font-size:13px;color:var(--l2);cursor:default;user-select:none}
.brp-tab:hover{background:var(--fill);color:var(--l1)}
.brp-tab.on{background:var(--fill2);color:var(--l1)}
.brp-tab .mini-spin{flex:none}
.brp-tab-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brp-tab-x{flex:none;width:20px;height:20px;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:none;color:var(--l2);opacity:0}
.brp-tab:hover .brp-tab-x,.brp-tab.on .brp-tab-x,.brp-tab-x:focus-visible{opacity:1}
.brp-tab-x:hover{background:var(--l4);color:var(--l1)}
.brp-tab-x .ic{width:12px;height:12px}
/* Back, forward, reload and the address, under a line. */
.brp-bar{flex:none;display:flex;align-items:center;gap:2px;padding:6px 10px;border-top:.5px solid var(--sep);border-bottom:.5px solid var(--sep)}
.brp-bar .tb:disabled{opacity:.35}
.brp-annotate{display:grid;place-items:center;flex:none;width:30px;height:30px;padding:0;border:0;border-radius:15px;background:transparent;color:var(--l2);cursor:pointer}
.brp-annotate.on{background:color-mix(in srgb,#3294ff 18%,transparent);color:#3294ff}
.brp-annotate:hover:not(:disabled){color:#3294ff}
.brp-annotate:focus-visible{outline:2px solid #3294ff;outline-offset:2px}
.brp-annotate:disabled{opacity:.35;cursor:default}
.brp-addr{flex:1;min-width:0;margin-left:6px;position:relative;display:flex;align-items:center;height:30px;border-radius:8px;background:var(--fill2)}
.brp-addr:focus-within{box-shadow:0 0 0 2px var(--sel)}
.brp-addr .brp-url,.brp-addr .brp-url:focus{background:none;box-shadow:none}
.engine-icon{width:20px;height:20px;flex:none;border-radius:5px;object-fit:contain}
.engine-initial{display:grid;place-items:center;background:var(--fill2);color:var(--l2);font-size:11px;font-weight:600}
.brp-keyword{display:inline-flex;align-items:center;gap:6px;flex:none;height:22px;margin-left:4px;padding:0 8px 0 5px;border-radius:6px;background:var(--accent-bg);color:var(--accent-t);font-size:12px;white-space:nowrap}
.brp-keyword .engine-icon{width:14px;height:14px;border-radius:3px}
.brp-keyword .engine-initial{font-size:9px}
.brp-keyword+.brp-url{padding-left:8px}
.brp-hint{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:11.5px;color:var(--l3);padding-left:8px;white-space:nowrap}
.brp-url{width:100%;height:30px;padding:0 12px;border:0;border-radius:8px;background:var(--fill2);color:var(--l1);font:inherit;font-size:13px;outline:none}
.brp-url::placeholder{color:var(--l3)}
.brp-url:focus{box-shadow:0 0 0 2px var(--sel)}
.bgp .srow{align-items:center}
.bgp .sl2{font-size:12px;color:var(--l2)}
.bgp .sl2t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgp .smeta.w{color:var(--orange)}
.bgp .smeta.c{color:var(--red)}
/* The selected agent's work, under its row: its own conversation, read-only, following its end while it
   works; a long one scrolls inside, so the rows after it stay in reach. */
.bgp-work{flex:none;display:flex;flex-direction:column;padding:0 0 10px}
.bgp-work .grp-h{padding-top:8px}
.bgp-log{flex:none;max-height:min(480px,60vh);overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px 10px 20px}
.bgp-said{margin:0 0 6px}
.bgp-cap{display:block;font-size:11px;color:var(--l3);margin-bottom:3px}
.bgp-said p{margin:0;font-size:13px;line-height:19px;color:var(--l2);white-space:pre-wrap;overflow-wrap:anywhere}
.bgp-said p.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.bgp-said .link{font-size:12px;margin-top:3px}
.bgp-log .tool{font-size:13px}
.bgp-log .tool .th .cmd{font-size:11.5px}
.bgp-log .am{font-size:13.5px;line-height:20px;margin:2px 0 0}
.bgp-log .am .md{font-size:13.5px;line-height:20px}
.bgp-log .am .md :is(h1,h2,h3,h4,h5,h6){font-size:13.5px;line-height:20px}
.bgp-log .am .md>*+*{margin-top:6px}
.bgp-done{margin:4px 0 0;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--l3);font-variant-numeric:tabular-nums}
.bgp-done .ic{color:var(--green)}
.bgp-note{margin:4px 0 0;font-size:12px;color:var(--l2)}
.bgp-note.int{color:var(--orange)}
.bgp-note.bad{color:var(--red)}
/* No room for a column beside the conversation (layout.ts): the panel covers its right side. */
.spage.bgover .bgp{position:absolute;top:0;right:0;bottom:0;z-index:6;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.spage.bgover .ctool{padding-right:calc(14px + var(--caption))}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--l2);height:100%;text-align:center;padding:40px}
.empty b{color:var(--l1);font-size:15px}
/* forms */
.form{display:flex;flex-direction:column;gap:18px}
.fgroup{background:var(--win2);border-radius:var(--r-lg)}
.frow{display:flex;align-items:center;gap:16px;padding:9px 14px;min-height:38px;border-top:.5px solid var(--sep)}
.frow:first-child{border-top:0}
.frow>label,.frow>.fl{flex:none;width:120px;color:var(--l1)}
.frow>.fv{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:flex-end;color:var(--l2);text-align:right;flex-wrap:wrap}
.frow .fdesc{font-size:11.5px;color:var(--l2);margin-top:2px}
.fhead{font-size:12px;font-weight:600;color:var(--l2);margin:0 0 6px 4px}
/* palette */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:40;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.pal{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:min(660px,calc(100% - 48px));background:var(--menu);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);border-radius:var(--r-xl);box-shadow:0 0 0 .5px var(--menu-bd),0 24px 70px rgba(0,0,0,.35);z-index:41;overflow:hidden;animation:pop .16s cubic-bezier(.2,0,0,1)}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.97)}}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-bottom:.5px solid var(--sep)}
.pal-in .ic{width:18px;height:18px;color:var(--l2)}
.pal-in input{flex:1;border:0;background:none;outline:none;font-size:17px;color:var(--l1)}
.pal-f{display:flex;gap:6px;padding:8px 12px;border-bottom:.5px solid var(--sep);flex-wrap:wrap;align-items:center}
.pal-f select{appearance:none;-webkit-appearance:none;border:0;background:var(--fill2);color:var(--l1);height:24px;border-radius:var(--r-sm);padding:0 24px 0 10px;font:inherit;font-size:12px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) 10px,calc(100% - 8px) 10px;background-size:4px 4px;background-repeat:no-repeat}
.pal-f select.on{background-color:var(--accent-bg);color:var(--accent-t)}
.pal-r{max-height:420px;overflow-y:auto;padding:6px}
.pal-h{font-size:11.5px;font-weight:600;color:var(--l2);padding:8px 10px 4px}
.pr{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);border:0;background:none;width:100%;text-align:left}
.pr.on{background:var(--accent);color:#fff}
.pr.on .muted,.pr.on .kbd{color:rgba(255,255,255,.8)}
.pr .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .muted{font-size:12px;flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-foot{display:flex;gap:14px;padding:8px 16px;border-top:.5px solid var(--sep);font-size:11.5px;color:var(--l3)}
/* toast */
.toast{position:absolute;left:50%;top:calc(var(--top) + 12px);transform:translateX(-50%);background:var(--menu);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 0 0 .5px var(--menu-bd),0 10px 30px rgba(0,0,0,.2);border-radius:var(--r-xl);padding:8px 10px 8px 16px;display:flex;align-items:center;gap:12px;font-size:13px;z-index:60;animation:pop2 .25s cubic-bezier(.2,0,0,1);width:max-content;max-width:min(560px,calc(100% - 32px))}
/* A long message wraps inside the content, three lines at most; the icon and the button keep their size. */
.toast>span{min-width:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.toast>.ic,.toast>.btn{flex:none}
@keyframes pop2{from{opacity:0;transform:translate(-50%,-8px)}}
.toast .ic{color:var(--green)}
.toast.bad .ic{color:var(--red)}
/* sheets */
.sheet{margin:auto;border:0;padding:0;max-width:calc(100vw - 48px);max-height:calc(100vh - 80px);overflow-y:auto;color:var(--l1);background:var(--win);border-radius:var(--r-xl);box-shadow:0 0 0 .5px var(--menu-bd),0 20px 60px rgba(0,0,0,.35);animation:sheet .22s cubic-bezier(.2,0,0,1)}
/* The main window while the settings window is open: dimmed as under a dialog. */
.settings-dim{position:fixed;inset:0;z-index:100;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.sheet::backdrop{background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.sheet-in{padding:22px 24px 18px}
@keyframes sheet{from{opacity:0;transform:scale(.97)}}
.sheet h3{margin:0 0 4px;font-size:15px;font-weight:600}
.sheet .sub{margin:0 0 14px;color:var(--l2);font-size:12.5px;line-height:1.55}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;align-items:center}
.sheet-foot .left{margin-right:auto}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* A found version, above the sidebar's foot (renderer/src/updates.tsx). */
.upd{flex:none;display:grid;grid-template-columns:16px minmax(0,1fr) auto;align-items:center;gap:3px 8px;margin:4px 8px 6px;padding:9px 8px 9px 11px;border-radius:var(--r-lg);background:var(--accent-bg);color:var(--accent-t)}
.upd>.ic{width:15px;height:15px}
.upd b{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upd-x{grid-column:3;justify-self:end;width:20px;height:20px;border:0;border-radius:var(--r-sm);background:none;color:var(--l2);display:flex;align-items:center;justify-content:center;padding:0}
.upd-x:hover{background:var(--fill)}
.upd-x .ic{width:12px;height:12px}
.upd-h{grid-column:2;font-size:11.5px;line-height:1.35;color:var(--l2)}
.upd .btn{grid-column:3}
.upd-busy{display:inline-flex;align-items:center;gap:6px}
.upd-details{margin-top:4px}
.upd-details summary{cursor:pointer;color:var(--l2)}
.upd-raw{margin-top:6px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--l2)}

/* apps/desktop/src/renderer/src/styles/composer.css */
/* The composer's zone: the bottom of a session's page, as wide as the
   conversation's column. The conversation scrolls under it and fades out
   above it; the composer, the row of what the message goes with, and an
   approval when one waits sit there. (Not ".dock": that is the session
   page's state with the info card shown, .dwrap.dock.) The composer stands
   12 px out past the column on each side: a filled box as wide as the text
   above it reads narrower than the text. */
.cmp-zone{position:absolute;left:0;right:0;bottom:0;z-index:4;pointer-events:none;padding:28px calc(var(--sp-4) - 12px) 12px;background:linear-gradient(to bottom,transparent,var(--win) 28px)}
.cmp-col{pointer-events:auto;max-width:754px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

/* An approval (session/Approval.tsx), above the composer and in its shape:
   a line on what and why, the command or change itself, the answers as
   buttons on one row. */
.appr{background:var(--pill);border-radius:var(--r-lg);box-shadow:0 0 0 .5px var(--pill-bd),0 10px 30px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.06);padding:14px 14px 12px 16px;display:flex;flex-direction:column;gap:10px;animation:cbarup .32s cubic-bezier(.2,0,0,1)}
.appr-h{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;line-height:20px}
.appr-h b{font-weight:600;flex:none;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appr-h .why{flex:1;min-width:0;color:var(--l2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appr-h .qx-tag{margin-left:auto;flex:none}
.appr-app{flex:none;display:inline-flex;align-items:center;gap:5px;max-width:30%;padding:1px 8px 1px 4px;border-radius:999px;background:var(--code);box-shadow:inset 0 0 0 .5px var(--sep);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appr-app img{width:16px;height:16px;flex:none}
/* A website's question: why it asks, when the mode would not, and the address, under the title. */
.appr-site{display:flex;flex-direction:column;gap:2px;margin:-4px 0 0 24px;min-width:0;font-size:12.5px;line-height:18px;color:var(--l2)}
.appr-site code{font-family:var(--mono);font-size:12px;color:var(--l3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appr-warn{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 11px;border-radius:var(--r-md);background:var(--orange-bg);color:var(--l1);font-size:12.5px;line-height:18px}
.appr-warn span{flex:1;min-width:0}
.appr-warn .btn{height:26px;padding:0 12px;flex:none}
.appr-pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--l1);background:var(--code);box-shadow:inset 0 0 0 .5px var(--sep);border-radius:var(--r-md);padding:8px 11px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:132px;overflow-y:auto}
.appr-pre.diff{padding:6px 0}
.appr-pre.diff>span{display:block;padding:0 11px}
.appr-pre .add{background:var(--add-bg);color:var(--add-fg)}
.appr-pre .del{background:var(--del-bg);color:var(--del-fg)}
.appr-pre .more{display:block;color:var(--l3)}
.appr-f{display:flex;align-items:center;gap:8px}
.appr-f .btn{height:30px;padding:0 14px}

.cmp-att{display:flex;flex-wrap:wrap;gap:8px;padding:4px 4px 0}

/* Under the composer, outside it: what the message goes with, as quiet buttons. */

/** What a system connector needs from the person, if anything: [text, class]. */
function need(k) {
  const c = S[k];
  if (!c.connected) return null;
  if (k === "yours" && c.lost) return ["扩展没连上", "warn"];
  if (k === "desktop" && !c.ax) return ["需要授权", "warn"];
  return null;
}
const enabledCount = () => ["yours", "desktop"].filter((k) => S[k].connected && S[k].on).length + Object.values(S.mcp).filter(Boolean).length;

// ———— Toast: in the content, under its title bar, as ToastView ————
let toastTimer;
function toast(text, bad = false) {
  const host = $("section.content") ?? $(".set-main");
  if (!host) return;
  $(".toast")?.remove();
  const el = html(`<div class="toast ${bad ? "bad" : ""}" role="status">${icon(bad ? "warn" : "check")}<span>${esc(text)}</span></div>`);
  host.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3200);
}

// ———— Switching ————
function toggleSystem(k) {
  const c = S[k];
  c.on = !c.on;
  toast(k === "yours"
    ? c.on ? "已打开你的浏览器，所有对话从下一步起可以用它" : "已关闭你的浏览器，所有对话从下一步起只用内置浏览器"

}

  S.mcp[name] = !S.mcp[name];
  const on = S.mcp[name];
  toast(m.repo ? (on ? `已对你重新打开 ${name}` : `已对你关闭 ${name}：写在你的个人项目配置里，不影响队友`) : on ? `已启用 ${name}，新会话起可用` : `已停用 ${name}，新会话起生效`);
}

// ———— Menus ————
function closeMenus() {
  $$(".vmenu").forEach((m) => m.remove());
  $$("[aria-expanded=true]").forEach((b) => b.setAttribute("aria-expanded", "false"));
}
function place(menu, at) {
  document.body.appendChild(menu);
  Object.assign(menu.style, at);
  const r = menu.getBoundingClientRect();
  if (r.right > innerWidth - 8) menu.style.left = `${Math.max(8, innerWidth - 8 - r.width)}px`;
  return menu;
}
document.addEventListener("mousedown", (e) => {
  if (!(e.target instanceof Element) || !e.target.closest(".vmenu, .cmp-plus, .cz-pop, .cz-more, .demo")) closeMenus();
});
document.addEventListener("keydown", (e) => e.key === "Escape" && !$("dialog[open]") && closeMenus());

/** "+": the files as before, a line, then 连接器 with its submenu. */
function openPlus(btn) {
  if ($(".vmenu.plus")) return closeMenus();
  closeMenus();
  btn.setAttribute("aria-expanded", "true");
  const r = btn.getBoundingClientRect();
  const menu = html(`<div class="vmenu plus" role="menu" aria-label="添加" tabindex="-1">
    <button class="mi" role="menuitem" tabindex="-1">${icon("paperclip")}<span>添加文件和图片</span><span class="kbd">⌘U</span></button>
    <button class="mi" role="menuitem" tabindex="-1">${icon("folder")}<span>添加文件夹</span></button>
    <div class="msep" role="separator"></div>
    <button class="mi cn-open" role="menuitem" aria-haspopup="menu" aria-expanded="false" tabindex="-1">${icon("plug")}<span>连接器</span><span class="val">${enabledCount()}</span>${icon("chevR", "sm")}</button>
  </div>`);
  place(menu, { left: `${r.left}px`, bottom: `${innerHeight - r.top + 6}px` });
  const row = $(".cn-open", menu);
  row.addEventListener("mousemove", () => openSub(menu, row));
  row.addEventListener("click", () => openSub(menu, row));
  $$(".mi:not(.cn-open)", menu).forEach((m) => m.addEventListener("mousemove", () => { $(".vmenu.cn-sub")?.remove(); row.classList.remove("open"); row.setAttribute("aria-expanded", "false"); }));
  $$(".mi:not(.cn-open)", menu).forEach((m) => m.addEventListener("click", () => closeMenus()));
}

/** The connectors, the person's own: system ones first, then MCP by name. The built-in browser is not one. */
function subRows() {
  const sys = ["yours", "desktop"].map((k) => {
    const c = S[k];
    const n = need(k);
    const right = !c.connected
      ? `<button class="btn sm cn-connect" tabindex="-1">连接</button>`
      : `${n ? `<span class="cn-st ${n[1]}" title="去处理">${n[0]}</span>` : ""}<button class="sw sm ${c.on ? "on" : ""}" role="switch" aria-checked="${c.on}" tabindex="-1"></button>`;
    return `<div class="mi cn-row ${c.connected && !c.on ? "off" : ""}" role="menuitemcheckbox" aria-checked="${c.on}" tabindex="-1" data-k="${k}">
      <span class="cz-tile sys">${icon(SYS[k].glyph)}</span><span class="nm">${SYS[k].name}</span>${right}</div>`;
  });
  const mcp = [...SNAP.mcp].sort((a, b) => a.name.localeCompare(b.name)).map((m) => {
    const on = S.mcp[m.name];
    const st = m.need && on ? `<span class="cn-st ${m.needCls === "bad" ? "bad" : ""}" title="去处理">${m.need}</span>` : "";
    return `<div class="mi cn-row ${on ? "" : "off"}" role="menuitemcheckbox" aria-checked="${on}" tabindex="-1" data-name="${esc(m.name)}">
      ${m.tile}<span class="nm">${esc(m.name)}</span>${st}<button class="sw sm ${on ? "on" : ""}" role="switch" aria-checked="${on}" tabindex="-1"></button></div>`;
  });
  return sys.join("") + mcp.join("");
}

function openSub(menu, row) {
  if ($(".vmenu.cn-sub")) return;
  row.classList.add("open");
  row.setAttribute("aria-expanded", "true");
  const sub = html(`<div class="vmenu cn-sub" role="menu" aria-label="连接器" tabindex="-1">
    <button class="mi" role="menuitem" tabindex="-1" data-act="discover">${icon("search")}<span>浏览连接器</span></button>
    <button class="mi" role="menuitem" tabindex="-1" data-act="mine">${icon("gear")}<span>管理连接器</span></button>
    <div class="msep" role="separator"></div>
    <div class="cn-list">${subRows()}</div>
  </div>`);
  sub.style.visibility = "hidden";
  document.body.appendChild(sub);
  const m = menu.getBoundingClientRect();
  const r = row.getBoundingClientRect();
  const { offsetWidth: w, offsetHeight: h } = sub;
  sub.style.left = `${m.right + w + 4 > innerWidth ? m.left - w - 2 : m.right + 2}px`;
  sub.style.top = `${Math.max(8, Math.min(r.top - 5, innerHeight - 8 - h))}px`;
  sub.style.visibility = "";
  sub.addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act) return closeMenus(), go(act);
    const line = e.target.closest(".cn-row");
    if (!line) return;
    const k = line.dataset.k;
    if (e.target.closest(".cn-st")) return closeMenus(), go(k ?? "mine");
    if (k && !S[k].connected) return closeMenus(), connect(k);
    if (k) toggleSystem(k);
    else toggleMcp(line.dataset.name);
    // The menu stays: several can be changed in a row.
    const top = $(".cn-list", sub).scrollTop;
    $(".cn-list", sub).innerHTML = subRows();
    $(".cn-list", sub).scrollTop = top;
    $(".cn-open .val", menu).textContent = enabledCount();
    if (S.screen === "mine") render();
  });
}

/** A pop-up menu of choices under a button (PopUp in customize/parts.tsx); 移除 under a line when it can be removed. */
function popup(btn, choices, value, pick, remove) {
  closeMenus();
  btn.setAttribute("aria-expanded", "true");
  const r = btn.getBoundingClientRect();
  const menu = html(`<div class="vmenu cz-menu" role="menu" tabindex="-1">${Object.entries(choices)
    .map(([id, label]) => `<button class="mi" role="menuitemradio" aria-checked="${id === value}" tabindex="-1" data-id="${id}"><span class="ck">${id === value ? icon("check") : ""}</span><span>${label}</span></button>`)
    .join("")}${remove ? `<div class="msep" role="separator"></div><button class="mi danger" role="menuitem" tabindex="-1" data-remove><span class="ck"></span><span>移除</span></button>` : ""}</div>`);
  place(menu, { left: `${r.right - Math.max(r.width, 160)}px`, top: `${r.bottom + 4}px`, minWidth: `${Math.max(r.width, 160)}px` });
  menu.addEventListener("click", (e) => {
    if (e.target.closest("[data-remove]")) return closeMenus(), remove();
    const id = e.target.closest("[data-id]")?.dataset.id;
    if (!id) return;
    closeMenus();
    pick(id);
  });
}

function popupMenu(btn, items) {
  closeMenus();
  btn.setAttribute("aria-expanded", "true");
  const r = btn.getBoundingClientRect();
  const menu = html(`<div class="vmenu cz-menu" role="menu" tabindex="-1">${items.map(([l], i) => `<button class="mi" role="menuitem" tabindex="-1" data-i="${i}"><span>${l}</span></button>`).join("")}</div>`);
  place(menu, { left: `${r.right - 180}px`, top: `${r.bottom + 4}px`, minWidth: "180px" });
  menu.addEventListener("click", (e) => {
    const i = e.target.closest("[data-i]")?.dataset.i;
    if (i === undefined) return;
    closeMenus();
    items[+i][1]();
  });
}

// ———— Connect flows: each system connector its own ————
function sheet(inner, width = 480) {
  $("dialog.sheet")?.remove();
  const d = html(`<dialog class="sheet cz-sheet cn-sheet" style="width:${width}px"><div class="sheet-in">${inner}</div></dialog>`);
  document.body.appendChild(d);
  d.addEventListener("cancel", (e) => (e.preventDefault(), d.remove()));
  d.addEventListener("click", (e) => e.target === d && d.remove());
  d.showModal();
  return d;
}
const connect = (k) => (k === "yours" ? connectYours() : connectDesktop());

/** 你的浏览器: the existing guide (settings/BrowserSettings.tsx), moved here as it is: pick, prepare, add the extension, wait. */
function connectYours() {
  let pick = "chrome";
  const d = sheet(`<h3>连接你的浏览器</h3>
    <p class="sub">连接后，需要你的账号的网站，智能体会在你自己的浏览器里打开；其他的仍然用内置浏览器。每个网站第一次都会先问你。</p>
    <div class="cn-choices" role="radiogroup" aria-label="选择要连接的浏览器">
      <button class="cn-choice" role="radio" data-v="chrome"><span class="cz-tile sys">${icon("globe")}</span><span class="ct"><b>Google Chrome</b><span>正在运行</span></span><span class="rd"></span></button>
      <button class="cn-choice" role="radio" data-v="edge"><span class="cz-tile sys">${icon("globe")}</span><span class="ct"><b>Microsoft Edge</b><span>没有打开</span></span><span class="rd"></span></button>
    </div>

function guideSteps(name) {
  const d = sheet(`<h3>连接你的浏览器</h3>

function connectDesktop() {
  const row = (kind, name, tag, desc) => {

    <p class="sub">让 finx 查看和操作这台 Mac 上的其他应用。每个应用第一次用到时会先问你；发消息、付款、删除之前，它也会先停下来问你。</p>

/** As layout.ts: the conversation keeps 560; the info card gives way first, then the sidebar. */
function fit() {
  const wrap = $(".mainwrap");
  if (!wrap) return;
  const sidebar = innerWidth >= 272 + 560;
  const content = innerWidth - (sidebar ? 272 : 0);
  wrap.classList.toggle("noside", !sidebar);
  wrap.classList.toggle("narrow", content < 640);
  const card = content >= 560 + 270;
  $(".dwrap")?.classList.toggle("dock", card);
  const insp = $(".insp-stack");
  if (insp) insp.style.display = card ? "" : "none";
}
addEventListener("resize", fit);

function mainWindow(content) {
  $("#root").innerHTML = `<div class="mainwrap">${SNAP.side}${content}</div>`;
  fit();
  const nav = $$(".side-nav .nav-i");
  const customize = S.screen !== "conv";
  nav.forEach((n) => n.classList.toggle("sel", customize && n.textContent.includes("自定义")));
  if (customize) $$(".srow.sel").forEach((r) => r.classList.remove("sel"));
  nav.forEach((n) => n.addEventListener("click", () => go(n.textContent.includes("自定义") ? "mine" : "conv")));
  $$(".srow").forEach((r) => r.addEventListener("click", () => go("conv")));
}

  });

const moreItems = (k) => k === "yours" ? [["更换浏览器…", () => connectYours()], ["查看详情", () => go("yours")]] : [["打开系统设置", () => connectDesktop()], ["查看详情", () => go("desktop")]];

function onListClick(e) {
  const t = e.target;
  const connectK = t.closest("[data-connect]")?.dataset.connect;
  if (connectK) return e.stopPropagation(), connect(connectK);
  const fix = t.closest("[data-fix]")?.dataset.fix;
  if (fix) return e.stopPropagation(), fix === "yours" ? guideSteps("Google Chrome") : connectDesktop();
  const more = t.closest("[data-more]");
  if (more) return e.stopPropagation(), popupMenu(more, moreItems(more.dataset.more));
  const sw = t.closest(".sw");
  const row = t.closest(".cz-row");
  if (sw && row) {
    e.stopPropagation();
    if (row.dataset.k) toggleSystem(row.dataset.k);
    else toggleMcp(row.dataset.name);
    return render();
  }
  if (row?.dataset.k) return go(row.dataset.k);
  const card = t.closest(".cz-card");
  if (card) {
    const k = card.dataset.k;
    if (t.closest(".cz-inst:not(.done)")) return e.stopPropagation(), connect(k);
    return go(k);
  }
}

  const head = `<div class="cz-dhead"><div class="cz-dtitle"><div class="cz-tile sys xl">${icon(SYS[k].glyph)}</div><h1>${SYS[k].name}</h1><span class="badge">系统</span>
      <div class="cz-dacts">${c.connected
        ? `<label class="cz-swl">启用<button class="sw ${c.on ? "on" : ""}" role="switch" aria-checked="${c.on}" data-sw="${k}"></button></label><button class="cz-more" title="更多" aria-label="更多" aria-haspopup="menu" aria-expanded="false" data-more="${k}">${icon("more")}</button>`
        : `<button class="btn primary" data-connect="${k}">连接</button>`}</div></div>
    <div class="cz-facts">${facts}</div></div>`;
  const note = n
    ? `<div class="cz-note warn">${icon("warn")}<div class="tx"><b>${k === "yours" ? "扩展没有连上" : "还没有辅助功能权限"}</b>${k === "yours" ? "浏览器里的 FinxWork 扩展可能被停用了，或者浏览器没有打开。在这之前，需要你账号的网站打不开；其他网页照常用内置浏览器。" : "授权之前，桌面控制用不了。"}</div><button class="btn" data-fix="${k}">${k === "yours" ? "重新连接" : "去授权"}</button></div>`
    : "";
  return `<section class="content"><div class="ctool drag"><div class="ctitle"></div></div><div class="cscroll cz"><div class="dbody cz-body"><div class="cz-dpage ${c.connected && !c.on ? "off" : ""}">${SNAP.dbar}${head}${note}${sections}</div></div></div></section>`;
}
const fact = (k, v, cls = "") => `<div class="cz-fact"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`;
const tools = (list, right = "") => `<section class="cz-dtools cn-ds"><div class="cz-th"><h2>工具</h2><span class="n">${list.length}</span>${right ? `<span class="right">${right}</span>` : ""}</div><div class="cz-tlist">${list.map(([n, d]) => `<div class="cz-tool"><span class="tn">${n}</span><span class="td">${d}</span></div>`).join("")}</div></section>`;
const status = (k) => {
  const c = S[k];
  const n = need(k);
  return fact("状态", n ? `<i class="dotc warn"></i>${n[0]}` : c.on ? `<i class="dotc on"></i>可用` : "已停用", n ? "cz-st warn" : c.on ? "cz-st ok" : "");
};
const BROWSER_TOOLS = () => [
  ["browser_navigate", "打开一个网址，或者在历史记录里前进、后退；可以选在哪个浏览器里打开"],
  ["browser_snapshot", "读取页面上的文字和可以操作的元素"],
  ["browser_act", "在页面上点击、输入、选择、上传文件"],
  ["browser_screenshot", "给页面截图，用来核对看到的样子"],
  ["browser_wait", "等页面加载完，或者等某段文字出现"],
  ["browser_tabs", "列出、切换和关闭这个对话打开的标签页，标出每个在哪个浏览器里"],
  ["browser_console", "读取页面的控制台消息和报错"],
  ["browser_batch", "一次执行多个步骤"],
  ...(S.script ? [["browser_eval", "在页面里运行一段脚本"]] : []),
];

function renderYoursDetail() {
  const c = S.yours;
  const facts = !c.connected
    ? fact("状态", "未连接") + fact("什么时候用", "需要你的账号，或者你点名时")
    : status("yours") + fact("浏览器", MY_BROWSER) + fact("什么时候用", "需要你的账号，或者你点名时");
  const perms = `<section class="cz-dtools cn-ds"><div class="cz-th"><h2>网站权限</h2></div>
    <div class="cn-line"><span class="td">两个浏览器共用一份网站权限。在你的浏览器里，每个网站第一次都会先问你，绕过权限也一样。</span><span class="acts"><button class="btn" data-go-settings>在设置里管理</button></span></div></section>`;
  mainWindow(detailPage("yours", perms + tools(BROWSER_TOOLS(), "与内置浏览器共用"), facts));
  wireDetail("yours");
}

function renderDesktopDetail() {
  const c = S.desktop;
  const facts = !c.connected
    ? fact("状态", "未连接")
    : status("desktop") + fact("辅助功能", c.ax ? "已授权" : "未授权") + fact("屏幕录制", c.screen ? "已授权" : `未授权<span class="sub">· 截图时需要</span>`);
  const perm = (kind, name, desc) => `<div class="cn-line"><span class="tn">${name}</span><span class="td">${desc}</span><span class="acts">${S.desktop[kind] ? `<span class="cz-st ok"><i class="dotc on"></i>已授权</span>` : `<button class="btn" data-grant="${kind}">打开系统设置</button>`}</span></div>`;
  const perms = `<section class="cz-dtools cn-ds"><div class="cz-th"><h2>系统权限</h2></div><div class="cn-lines">${perm("ax", "辅助功能", "读取窗口内容，并执行点击、输入；必需")}${perm("screen", "屏幕录制", "给窗口截图时需要；不打开也能读取和操作窗口")}</div></section>`;
  const apps = `<section class="cz-dtools cn-ds"><div class="cz-th"><h2>应用权限</h2><span class="n">${S.apps.length}</span><span class="right">没列在这里的应用，第一次用到时会先问你</span></div>
    <div class="cn-lines">${S.apps.map((a, i) => `<div class="cn-line"><span class="tn">${a.name}</span><span class="td mono">${a.id}</span><span class="acts"><button class="cz-pop" aria-haspopup="menu" data-app="${i}"><span class="lbl">${APP_LEVELS[a.lv]}</span>${icon("updown", "chev")}</button></span></div>`).join("")}</div>
    <button class="btn cn-add">${icon("plus")}添加应用…</button></section>`;
  const list = [
    ["desktop_apps", "列出打开的应用和它们的窗口"],
    ["desktop_launch", "打开一个应用，或者切到它"],
    ["desktop_snapshot", "读取一个窗口里的文字和可以操作的元素"],
    ["desktop_act", "在窗口里点击、输入、按键、滚动"],
    ["desktop_screenshot", "给窗口截图"],
  ];
  mainWindow(detailPage("desktop", c.connected ? perms + apps + tools(list) : tools(list), facts));
  wireDetail("desktop");
}

function wireDetail(k) {
  $(".cz-back").addEventListener("click", () => go("mine"));
  $(".cz-dpage").addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest("[data-connect]")) return connect(k);
    if (t.closest("[data-fix]")) return k === "yours" ? guideSteps("Google Chrome") : connectDesktop();
    if (t.closest("[data-sw]")) return toggleSystem(k), render();
    if (t.closest("[data-go-settings]")) return go("set-browser");
    const more = t.closest("[data-more]");
    if (more) return popupMenu(more, moreItems(k).filter(([l]) => l !== "查看详情"));
    const grant = t.closest("[data-grant]");
    if (grant) {
      grant.disabled = true;
      grant.textContent = "等待授权…";
      return setTimeout(() => ((S.desktop[grant.dataset.grant] = true), render()), 1200);
    }
    const app = t.closest("[data-app]");
    if (app) {
      const i = +app.dataset.app;
      return popup(app, APP_LEVELS, S.apps[i].lv, (lv) => ((S.apps[i].lv = lv), render()), () => {
        const [a] = S.apps.splice(i, 1);
        render();
        toast(`已移除 ${a.name}，下次用到时会先问你`);
      });
    }
    const tool = t.closest(".cz-tool");
    if (tool) tool.classList.toggle("open");
  });
}

// ———— The settings window ————
function settingsWindow(which) {
  $("#root").innerHTML = which === "browser" ? SNAP.setBrowser : SNAP.setDesktop;
  if (which === "browser") browserSettings();
  else {
    $(".set-body").innerHTML = `<div class="form"><section><h3 class="fhead">桌面控制</h3><div class="fgroup"><div class="frow mrow"><span class="mtile">${icon("plug")}</span><div class="ft"><div class="fn">在连接器里设置</div><div class="fdesc">系统权限、应用权限和开关，都在 自定义 › 连接器 › 桌面控制 里。</div></div><button class="btn" data-open>打开</button></div></div></section></div>`;
    $("[data-open]").addEventListener("click", () => go("desktop"));
  }
  $$(".set-side .nav-i").forEach((n) => n.addEventListener("click", () => {
    if (n.textContent.includes("浏览器")) go("set-browser");
    else if (n.textContent.includes("桌面")) go("set-desktop");
  }));
}

/** 设置 › 浏览器: what both browsers share; the address bar's own settings stay at the bottom. */
function browserSettings() {
  const form = $(".set-body .form");
  const [first, addressBar] = $$(":scope > section", form);
  const y = S.yours;
  const yoursRow = `<div class="frow mrow"><span class="mtile">${icon("globe")}</span><div class="ft"><div class="fn">你的浏览器 ${!y.connected ? `<span class="badge">未连接</span>` : y.lost ? `<span class="badge warn">未连接</span>` : y.on ? `<span class="badge ok">使用中</span>` : `<span class="badge">已停用</span>`}</div>
    <div class="fdesc">${y.connected ? `${MY_BROWSER} · 需要你的账号时用它。在连接器里开关。` : "连接后，需要你的账号的网站在你自己的浏览器里打开。"}</div></div><button class="btn" data-yours>${y.connected ? "管理" : "连接"}</button></div>`;
  const agent = html(`<section><h3 class="fhead">智能体用的浏览器</h3><div class="fgroup">
    <div class="frow"><div class="ft"><div class="fn">内置浏览器</div><div class="fdesc">打开本地页面、文件和不需要登录的网页。登录状态是它自己的。</div></div><button class="sw ${S.builtin ? "on" : ""}" role="switch" aria-checked="${S.builtin}" aria-label="内置浏览器" data-builtin></button></div>
    ${yoursRow}
  </div></section>`);
  const sites = html(`<section><h3 class="fhead">网站权限</h3><div class="fgroup">${S.sites.map((s, i) => `<div class="frow"><div class="ft"><div class="fn ${s.o === "*" ? "" : "mono"}">${s.o === "*" ? "所有网站" : s.o}</div>${s.o === "*" ? `<div class="fdesc">内网地址不包括在内</div>` : ""}</div>
      <select class="psel" aria-label="${s.o === "*" ? "所有网站" : s.o} 的权限" data-site="${i}">${Object.entries(LEVELS).map(([id, l]) => `<option value="${id}" ${id === s.lv ? "selected" : ""}>${l}</option>`).join("")}</select>
      <button class="btn" data-unsite="${i}">移除</button></div>`).join("")}</div>
    <p class="set-note">两个浏览器共用。没列在这里的网站，第一次用到时会先问你；在你的浏览器里，绕过权限也会先问。智能体询问时选“始终允许”，网站也会出现在这里。</p></section>`);
  const script = html(`<section><h3 class="fhead">脚本</h3><div class="fgroup"><div class="frow"><div class="ft"><div class="fn">允许运行页面脚本</div><div class="fdesc">智能体可以在网页里运行脚本，每次运行前都会先问你。</div></div><button class="sw ${S.script ? "on" : ""}" role="switch" aria-checked="${S.script}" aria-label="允许运行页面脚本" data-script></button></div></div></section>`);
  first.replaceWith(agent);
  agent.after(sites);
  sites.after(script);
  // The address bar is the person's own browser pane: its section keeps its rows, under its own name.
  $("h3.fhead", addressBar).textContent = "地址栏";
  form.addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest("[data-builtin]")) {
      S.builtin = !S.builtin;
      render();
      return toast(S.builtin ? "已打开内置浏览器，所有对话从下一步起可以用它" : "已关闭内置浏览器，所有对话从下一步起不再使用");
    }
    if (t.closest("[data-yours]")) return S.yours.connected ? go("yours") : connectYours();
    if (t.closest("[data-script]")) return (S.script = !S.script), render();
    const un = t.closest("[data-unsite]");
    if (un) {
      const [s] = S.sites.splice(+un.dataset.unsite, 1);
      render();
      return toast(s.o === "*" ? "已收回“允许所有网站”。所有对话从下一步起，按网站先问你" : `已移除 ${s.o}，下次用到时会先问你`);
    }
  });
  form.addEventListener("change", (e) => {
    const sel = e.target.closest("[data-site]");
    if (sel) S.sites[+sel.dataset.site].lv = sel.value;
  });
}

// ———— Routing ————
const RENDER = {
  conv: renderConv,
  mine: renderMine,
  discover: renderDiscover,
  yours: renderYoursDetail,
  desktop: renderDesktopDetail,
  "set-browser": () => settingsWindow("browser"),
  "set-desktop": () => settingsWindow("desktop"),
};
function render() {
  closeMenus();
  RENDER[S.screen]();
  $$("#pages button").forEach((b) => b.classList.toggle("on", b.dataset.go === S.screen));
}
function go(screen) {
  S.screen = screen;
  render();
  $(".cscroll")?.scrollTo(0, 0);
}

$$("#pages button[data-go]").forEach((b) => b.addEventListener("click", () => go(b.dataset.go)));
$("#ask").addEventListener("click", () => {
  asking = true;
  if (S.screen !== "conv") go("conv");
  else showApproval();
});
$$("#scene button").forEach((b) => b.addEventListener("click", () => {
  $$("#scene button").forEach((x) => x.classList.toggle("on", x === b));
  Object.assign(S, SCENES[b.dataset.s]());
  render();
}));
$$("#theme button").forEach((b) => b.addEventListener("click", () => {
  $$("#theme button").forEach((x) => x.classList.toggle("on", x === b));
  document.documentElement.dataset.theme = b.dataset.t;
}));
$("#fold").addEventListener("click", () => {
  const d = $("#demo");
  d.classList.toggle("folded");
  $("#fold").textContent = d.classList.contains("folded") ? "+" : "–";
});
render();
</script>
</body>
</html>
