/* The provider tiles and the key form (settings/ProviderConnections.tsx). */
.provider-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:11px}
/* Tiles: the mark above the name, so four fit a row with whole names. */

.key-actions{display:flex;gap:8px}
/* The close button: no inherited button padding, so the cross sits in the middle of its circle. */
.provider-icon-button{padding:0;color:var(--l2);transition:background .15s,color .15s}

/* apps/desktop/src/renderer/src/styles/onboarding.css */
/* The first-run page: the whole window. The brand on ink black on the left (the
   brand's dark ground, in both appearances), the steps on the window's own
   ground on the right, drawn as Settings › Models draws them (connections.css,
   providers.css). */
.onb{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:minmax(320px,40%) minmax(0,1fr);background:var(--win);color:var(--l1)}

.onb-brand{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:var(--top) 52px 44px;background:#0a0b0f;color:#f4f6fa}
.onb-glow{position:absolute;left:50%;top:36%;width:620px;height:620px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(31,107,255,.30),rgba(46,184,255,.08) 58%,transparent);animation:onb-breathe 7s var(--ease-in-out) infinite}
@keyframes onb-breathe{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(.95)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
.onb-mark{position:relative;display:block;width:min(300px,72%);aspect-ratio:1;margin:0 auto 30px;animation:onb-in 1.1s var(--ease-out) both}
@keyframes onb-in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.onb-copy{position:relative;animation:onb-in 1.1s .15s var(--ease-out) both}
.onb-kicker{font-size:11px;font-weight:650;letter-spacing:2.6px;color:#2eb8ff}
.onb-copy h1{margin:10px 0 8px;font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.onb-copy p{margin:0;color:rgba(244,246,250,.6);font-size:14px;line-height:1.7}
.onb-steps{position:relative;list-style:none;margin:38px 0 0;padding:0;display:flex;flex-direction:column;gap:13px;font-size:13px;color:rgba(244,246,250,.42)}
.onb-steps li{display:flex;align-items:center;gap:11px}
.onb-steps i{width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(244,246,250,.22);font-style:normal;font-size:11px;font-weight:600}
.onb-steps .ic{width:12px;height:12px}
.onb-steps li.on{color:#f4f6fa}
.onb-steps li.on i{background:var(--accent);border-color:var(--accent);color:#fff}
.onb-steps li.done{color:rgba(244,246,250,.72)}
.onb-steps li.done i{border-color:#2eb8ff;color:#2eb8ff}

.onb-main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.onb-top{height:var(--top);flex:none}
.onb-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.onb .onb-body{width:100%;max-width:700px;margin:auto 0;padding:12px 56px 32px}
.onb-api{margin-top:34px}
.onb-start{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 16px}
.onb-arrow{transform:rotate(90deg)}
.onb-start .ic{width:13px;height:13px}
.onb-foot{flex:none;display:flex;justify-content:flex-end;padding:12px 56px 22px}
.onb-foot .link{border:0;background:none;padding:5px 8px;border-radius:var(--r-sm);font-size:12px;color:var(--l2)}
.onb-foot .link:hover{color:var(--l1);background:var(--fill)}

@media (max-width:1080px){.onb{grid-template-columns:300px minmax(0,1fr)}.onb-brand{padding:var(--top) 36px 36px}.onb .onb-body{padding:12px 36px 28px}.onb-foot{padding:12px 36px 20px}}
@media (prefers-reduced-motion:reduce){.onb-glow,.onb-mark,.onb-copy{animation:none}}

/* The local applications (settings/LocalApplicationConnection.tsx): Settings › Models'
   rows a step larger, and the one line the applications not installed fold into. */
.onb-local .mrow{min-height:60px;padding:10px 16px;gap:14px}
.onb-local .ft{flex:1;min-width:0}
.onb-local .fn{font-size:14px;font-weight:550}
.onb-local .fdesc.ok{color:var(--green)}
.onb-local .fdesc.warn{color:var(--orange)}
.onb-local .mrow .mlogo{width:36px;height:36px;border-radius:var(--r-md);font-size:19px}
.onb-local .mrow .btn{height:26px;padding:0 12px;font-size:12px}
.onb-local .mrow-err{margin:0;padding:0 16px 10px 66px}
.onb-fold{width:100%;border:0;border-top:.5px solid var(--sep);background:none;font:inherit;font-size:12px;color:var(--l2);text-align:left;cursor:pointer;gap:10px;padding:10px 16px}
.onb-fold:last-child{border-radius:0 0 var(--r-lg) var(--r-lg)}
.onb-fold:first-child:last-child{border-radius:var(--r-lg)}
.onb-fold:hover{background:var(--fill)}
.onb-fold-marks{display:flex;gap:4px;flex:none}
.onb-fold-marks .mlogo{width:20px;height:20px;border-radius:var(--r-xs);font-size:11px;opacity:.6}
.onb-fold-marks .mlogo:not(.source-icon){background:var(--fill2);color:var(--l2)}
.onb-fold-marks .mlogo i{display:none}
.onb-fold>.ic{width:12px;height:12px;flex:none;color:var(--l3);transition:transform .15s var(--ease-out)}
.onb-fold.open>.ic{transform:rotate(90deg)}

/* apps/desktop/src/renderer/src/styles/customize.css */
/* 自定义 (docs/desktop/customize-design.md §10; the look is docs/desktop/customize-demo.html).
   The page draws on app.css (buttons, switches, segments, menus, sheets); its own parts are
   named cz-. Every distance is a step of the scale 8 / 13 / 21 / 34 / 55, each the one before
   times φ: 8 inside a part, 13 between parts, 21 between groups, 34 to the page's edges.

   The title starts right under the 44 band the window's buttons need, level with the
   sidebar's first row (新会话); the sides are the settings page's 34. The column fills the
   window up to 1120, then stays centred, so a wide window gets wider margins, not longer rows. */

.cz-body.dbody{max-width:1120px;padding:0 var(--sp-4) var(--sp-5)}
/* The page's name: large, at the top of the column. */
.cz-title{margin:0;font-size:28px;font-weight:650;letter-spacing:-.6px;line-height:1.25}
/* What kind, a rule, whose; Add at the end. It stays at the top while the list scrolls. */
.cz-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2);padding:var(--sp-1) 0;background:var(--win)}
.cz-bar.stuck{box-shadow:0 .5px 0 var(--sep)}
.cz-bar .grow{flex:1}
.cz-tabs{display:flex;gap:2px}
.cz-tab{height:30px;padding:0 13px;border:0;border-radius:var(--r-sm);background:none;font-size:14px;color:var(--l1)}
.cz-tab:hover{background:var(--fill)}
.cz-tab.on{background:var(--fill2)}
.cz-vsep{width:1px;height:18px;background:var(--sep);flex:none}
.seg.cz-seg button{height:26px;padding:0 13px;font-size:14px}
.btn.cz-addbtn{height:30px;padding:0 12px 0 11px;font-size:13.5px}
.btn.cz-addbtn .chev{width:12px;height:12px;opacity:.6;margin-right:-3px}

.cz-sect{animation:fadein .3s cubic-bezier(.2,0,0,1)}
.cz-sect+.cz-sect{margin-top:var(--sp-3)}
.cz-bar+.cz-sect{margin-top:var(--sp-2)}
/* A group's heading: the settings' .fhead, with its count as the sidebar's. */
.cz .fhead{display:flex;align-items:center;gap:6px;font-weight:400;margin:0 0 var(--sp-1)}
.cz .fhead .n{color:var(--l3);font-weight:500;font-variant-numeric:tabular-nums}
.cz .fhead .hint{color:var(--l3);margin-left:2px}
.cz-anote{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--l2);background:var(--fill);border-radius:var(--r-md);padding:8px 13px;margin-bottom:var(--sp-1)}
.cz-anote>.ic{color:var(--orange)}
.cz-anote>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-anote .link{margin-left:auto;flex:none}
.cz-anote code{font-family:var(--mono);font-size:11.5px;color:var(--l1)}
.cz-wait{display:flex;align-items:center;gap:8px;color:var(--l2);font-size:12.5px;padding:var(--sp-3) 4px}

.cz-tile{width:32px;height:32px;border-radius:var(--r-md);background:var(--fill2);color:var(--l2);display:flex;align-items:center;justify-content:center;flex:none;font-weight:650;font-size:12.5px;letter-spacing:-.02em}
.cz-tile .ic{width:17px;height:17px;stroke-width:1.35}
.cz-tile.xl{width:52px;height:52px;border-radius:var(--r-lg);font-size:17px}
.cz-tile.xl .ic{width:26px;height:26px;stroke-width:1.25}
/* A logo (customize-design §10.10). One that is a tile fills the shape, nothing around it, under
   a hairline that keeps a white icon's edge on a light page and a black one's on a dark page;
   one with its own rounded corners keeps them, unlined. A mark sits on the plain plate, which
   turns light under a dark mark in the dark and dark under a light mark in the light. */
.cz-tile.logo{position:relative;overflow:hidden;background:none}
.cz-tile.logo img{position:absolute;display:block;max-width:none}
.cz-tile.logo::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1);pointer-events:none}
.cz-tile.logo.cut::after{content:none}
.cz-tile.glyph img{display:block;object-fit:contain}
.cz-tile.glyph.light{background:#2c2c30}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cz-tile.logo::after{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}:root:not([data-theme="light"]) .cz-tile.glyph.light{background:var(--fill2)}:root:not([data-theme="light"]) .cz-tile.glyph.dark{background:#f2f2f4}}

/* 我的: one to a row, each its own rounded panel (not a table): the mark, the name over one
   line of what it does, then on the right its state, its switch and its menu. */
.cz-rows{display:flex;flex-direction:column;gap:var(--sp-1)}
.cz-row{display:flex;align-items:center;gap:var(--sp-2);min-height:58px;padding:9px 8px 9px 13px;border-radius:var(--r-lg);background:var(--win2);transition:background .15s}
.cz-row:hover{background:var(--win3)}
.cz-row.off .cz-tile,.cz-row.off .rt{opacity:.5}
.cz-row .rt{flex:1;min-width:0}
.cz-row .rn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;line-height:18px;min-width:0}
.cz-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-row .rd{font-size:12px;color:var(--l2);margin-top:2px;line-height:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-row .rd.mono{font-family:var(--mono);font-size:11.5px}
.cz-row .ra{display:flex;align-items:center;gap:8px;flex:none;margin-left:var(--sp-1)}
.cz-st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--l2);white-space:nowrap;font-variant-numeric:tabular-nums}
.cz-st.ok{color:var(--green)}
.cz-st.bad{color:var(--red)}
.cz-st.warn{color:var(--orange)}
.cz-st .link{font-size:11.5px}
.cz-st .dotc{width:6px;height:6px}
.cz .dotc.bad{background:var(--red)}
.mini-spin.cz-spin{width:10px;height:10px}
.cz-more{width:26px;height:26px;border-radius:var(--r-sm);border:0;background:none;color:var(--l2);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.cz-more:hover,.cz-more.open{background:var(--fill2);color:var(--l1)}

/* 发现: two to a row, the mark beside the name, what it does in two lines, where it comes from. */
.cz-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-1)}
@media (max-width:860px){.cz-grid{grid-template-columns:minmax(0,1fr)}}
.cz-card{display:grid;grid-template-columns:32px minmax(0,1fr) auto;column-gap:var(--sp-2);padding:var(--sp-2);border-radius:var(--r-lg);background:var(--win2);transition:background .15s}
.cz-card:hover{background:var(--win3)}
.cz-card .cz-tile{grid-row:1/4}
.cz-card .ct{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;font-weight:500;line-height:18px;margin-top:-1px}
.cz-card .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cz-card .cd{grid-column:2/4;font-size:12px;color:var(--l2);line-height:17px;margin-top:3px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:34px}
.cz-card .cm{grid-column:2/4;font-size:11px;color:var(--l3);margin-top:6px}
.cz-card .ca{grid-column:3;grid-row:1;display:flex;align-items:center;margin:-3px 0 -3px 8px}
/* Add: a round + that turns into a spinner, then a check. */
.cz-inst{width:26px;height:26px;border-radius:50%;border:0;padding:0;background:var(--btn);box-shadow:var(--btn-sh);display:flex;align-items:center;justify-content:center;color:var(--l1);transition:background .15s,color .15s}
.cz-inst:hover{background:var(--accent);color:#fff;box-shadow:none}
.cz-inst .ic{width:14px;height:14px;stroke-width:1.6}
.cz-inst.busy{pointer-events:none;background:var(--fill);box-shadow:none}
.cz-inst.done{background:var(--fill);color:var(--l2);box-shadow:none;pointer-events:none}
.cz-inst.done .ic{stroke-width:2}

.cz-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--sp-5) var(--sp-3);border-radius:var(--r-lg);background:var(--win2);color:var(--l2);gap:6px;font-size:12.5px}
.cz-empty>.ic{width:26px;height:26px;color:var(--l3);stroke-width:1.1;margin-bottom:4px}
.cz-empty b{color:var(--l1);font-weight:500;font-size:13px}
.cz-empty .acts{display:flex;gap:8px;margin-top:var(--sp-1)}

/* The add menu's items: what each does under its name. */
.cz-menu .mi.tall{align-items:flex-start;padding:2px 10px 2px 9px;gap:10px}
.cz-menu .mi.tall>.ic{margin-top:7px}
.vmenu.cz-menu .mi .two{padding:6px 0}

/* A card's page: back to the list, the item, tabs on a hairline, then the body. */
.cz-back{display:inline-flex;align-items:center;gap:6px;height:28px;margin:2px 0 0 -6px;padding:0 9px 0 6px;border:0;border-radius:var(--r-sm);background:none;font-size:13.5px;color:var(--l2)}
.cz-back:hover{color:var(--l1);background:var(--fill)}
.cz-back .ic{width:15px;height:15px}
.cz-hero{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2)}
.cz-hero .dt{flex:1;min-width:0}
.cz-hero h1{margin:0;display:flex;align-items:center;gap:8px;font-size:20px;font-weight:650;letter-spacing:-.3px;line-height:1.3}
.cz-meta{display:flex;align-items:center;margin-top:4px;font-size:12.5px;color:var(--l2);white-space:nowrap;flex-wrap:wrap}
.cz-meta-i{display:inline-flex;align-items:center;gap:6px}
.cz-meta i{font-style:normal;color:var(--l3);margin:0 6px 0 0}
.cz-meta .cz-st{font-size:12.5px}
.cz-acts{display:flex;align-items:center;gap:8px;flex:none}
.cz-acts .btn{height:30px;padding:0 15px;font-size:13.5px}
/* A connector's page (customize-design §10.12, docs/desktop/connector-detail-demo.html): one column,
   at most 852 wide so a line stays readable. Back has the top line to itself; then the
   logo and name with the item's controls at the right, one sentence, the facts in a row, a note when one is due, the tools a line each.
   No boxes and no rules: 21 under the top line, 34 to the facts, 55 to the tools. */
.cz-dpage{max-width:852px}
.cz-dbar{display:flex;align-items:center;height:28px}
.cz-dbar .cz-back{margin-top:0;margin-left:-8px;padding:0 10px 0 7px;font-size:13px;gap:5px}
.cz-dbar .cz-back .ic{width:14px;height:14px}
/* On the title line, at its right end; the ⋯ glyph lines up with the tools' 重新检测 below. */
.cz-dacts{display:flex;align-items:center;gap:var(--sp-1);margin-left:auto;padding-left:var(--sp-3)}
.cz-swl{display:inline-flex;align-items:center;gap:var(--sp-1);height:28px;padding:0 var(--sp-1);font-size:13px;color:var(--l2)}
.cz-dacts .cz-more{width:28px;height:28px;margin-right:-6px}
.cz-dhead{animation:fadein .35s cubic-bezier(.2,0,0,1)}
.cz-dtitle{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-3)}
.cz-dtitle .cz-tile.xl{width:48px;height:48px;font-size:19px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.cz-dtitle h1{margin:0;font-size:26px;font-weight:650;letter-spacing:-.5px;line-height:32px}
.cz-dtitle .badge{margin:2px 0 0 -3px}
.cz-lede{margin:var(--sp-2) 0 0;max-width:600px;font-size:13.5px;line-height:22px;color:var(--l2);user-select:text;-webkit-user-select:text}
.cz-facts{display:flex;flex-wrap:wrap;gap:var(--sp-3) var(--sp-4);margin-top:var(--sp-4)}
.cz-fact{min-width:0}
/* The address or command takes the rest of the row and ends in … rather than wrapping alone. */
.cz-fact.grow{flex:1 1 240px}
.cz-fact.grow .v .mono{min-width:0}
.cz-fact .k{font-size:11.5px;line-height:16px;color:var(--l3)}
.cz-fact .v{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:13px;line-height:22px;color:var(--l1);white-space:nowrap}
.cz-fact .v.cz-st.ok{color:var(--green)}
.cz-fact .v.cz-st.bad{color:var(--red)}
.cz-fact .v.cz-st.warn{color:var(--orange)}
.cz-fact .v .mono{font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;user-select:text;-webkit-user-select:text}
.cz-fact .v .sub{color:var(--l3)}
.cz-ghost{width:20px;height:20px;margin-left:-2px;flex:none;border:0;border-radius:var(--r-xs);background:none;color:var(--l3);display:grid;place-items:center;padding:0;opacity:0;transition:opacity .15s,background .15s,color .15s}
.cz-fact:hover .cz-ghost,.cz-ghost:focus-visible{opacity:1}
.cz-ghost:hover{background:var(--fill2);color:var(--l1)}
.cz-ghost .ic{width:12px;height:12px}
.cz-note{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-4);padding:var(--sp-2) var(--sp-2) var(--sp-2) 15px;border-radius:var(--r-lg);background:var(--fill);font-size:13px;line-height:20px;animation:fadein .25s cubic-bezier(.2,0,0,1)}
.cz-note>.ic{align-self:flex-start;margin-top:2px;width:15px;height:15px;color:var(--l3)}
.cz-note .tx{flex:1;min-width:0;color:var(--l2)}
.cz-note .tx b{display:block;font-weight:550;color:var(--l1)}
.cz-note .tx code{font-family:var(--mono);font-size:12px;background:var(--fill2);padding:1px 5px;border-radius:var(--r-xs);color:var(--l1)}
.cz-note .err{display:block;margin-top:3px;font-family:var(--mono);font-size:11.5px;line-height:17px;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.cz-note.warn{background:var(--orange-bg)}.cz-note.warn>.ic{color:var(--orange)}
.cz-note.bad{background:var(--red-bg)}.cz-note.bad>.ic{color:var(--red)}
.cz-note .btn{flex:none}
.cz-note-wait{display:flex;align-items:center;gap:var(--sp-1);flex:none;font-size:12.5px;color:var(--l2)}
.cz-dtools{margin-top:var(--sp-5);animation:fadein .45s cubic-bezier(.2,0,0,1)}
.cz-th{display:flex;align-items:baseline;gap:7px;margin-bottom:var(--sp-1)}
.cz-th h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.1px}
.cz-th .n{font-size:13px;color:var(--l3);font-variant-numeric:tabular-nums}
.cz-th .right{margin-left:auto;display:flex;align-items:baseline;gap:var(--sp-1);font-size:12px;color:var(--l3)}
.cz-th .link{font-size:12px}
.cz-tool{display:flex;align-items:baseline;gap:var(--sp-3);padding:7px 12px;margin:0 -12px;border-radius:var(--r-md);font-size:13px;line-height:22px;transition:background .12s}
.cz-tool:hover,.cz-tool.open{background:var(--fill)}
.cz-tool .tn{width:172px;flex:none;font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-tool .td{flex:1;min-width:0;color:var(--l2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-tool.open .td{white-space:normal;color:var(--l1);user-select:text;-webkit-user-select:text}
.cz-dempty{margin:var(--sp-1) 0 0;font-size:13px;color:var(--l3)}
/* Off: the page steps back; the controls at the top do not. */
.cz-dpage.off .cz-dtitle .cz-tile{opacity:.45}
.cz-dpage.off .cz-facts,.cz-dpage.off .cz-tlist{opacity:.5}
@media (prefers-reduced-motion:reduce){.cz-dhead,.cz-note,.cz-dtools{animation:none}}

/* The page's one main action: solid in the text colour, quieter than the accent on a dark window. */
.btn.cz-solid{background:var(--l1);color:var(--win);box-shadow:none}
.mini-spin.cz-spin-solid{width:12px;height:12px;border-color:color-mix(in srgb,var(--win) 35%,transparent);border-top-color:var(--win)}
.btn.primary .mini-spin.cz-spin-solid{border-color:rgba(255,255,255,.35);border-top-color:#fff}
.cz-dtabs{display:flex;gap:var(--sp-3);margin-top:var(--sp-3);border-bottom:.5px solid var(--sep)}
.cz-dtab{position:relative;height:38px;padding:0 1px;border:0;background:none;font-size:13.5px;color:var(--l1)}
.cz-dtab .n{color:var(--l3)}
.cz-dtab.on{font-weight:500}
.cz-dtab.on::after{content:"";position:absolute;left:0;right:0;bottom:-.5px;height:2px;border-radius:1px;background:var(--l1)}
/* What it does and the facts about it, in the golden ratio: the facts take 0.382 of the
   width, kept between 248 and 320 so a value never wraps early nor floats far from its label. */
.cz-cols{display:grid;grid-template-columns:minmax(0,1fr) clamp(248px,calc((100% - var(--sp-4)) * .382),320px);gap:var(--sp-4);margin-top:var(--sp-3);align-items:start}
@media (max-width:900px){.cz-cols{grid-template-columns:minmax(0,1fr)}}
.cz-pane{margin-top:var(--sp-3)}
.cz-dsec+.cz-dsec{margin-top:var(--sp-3)}
.cz-dsec h4{margin:0 0 8px;font-size:12px;font-weight:400;color:var(--l2)}
.cz-dsec p{margin:0;font-size:13.5px;line-height:1.65;user-select:text;-webkit-user-select:text}
.cz-dsec p.hint{margin-top:8px;font-size:12px;color:var(--l3)}
.cz-dsec code,.cz-callout code{font-family:var(--mono);font-size:12px;background:var(--fill2);padding:1px 5px;border-radius:var(--r-xs);color:var(--l1)}
.cz-dsec .field{height:30px}
.cz-side{background:var(--win2);border-radius:var(--r-lg);padding:3px 0}
.cz-kv{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding:8px 13px;font-size:12.5px}
.cz-kv+.cz-kv{border-top:.5px solid var(--sep)}
.cz-kv .k{color:var(--l2);flex:none}
.cz-kv .v{min-width:0;text-align:right;overflow-wrap:anywhere}
.cz-kv .v.mono{font-family:var(--mono);font-size:11.5px;color:var(--l2)}
.cz-kv.stack{flex-direction:column;align-items:flex-start;gap:7px}
.cz-kv.stack .v{text-align:left}
.cz-filebar{display:flex;align-items:center;gap:7px;margin-bottom:var(--sp-1);font-size:12px;color:var(--l2);min-width:0}
.cz-filebar .ic{width:14px;height:14px}
.cz-filebar .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-filebar .link{margin-left:auto;font-size:12px;flex:none}
.cz-code{margin:0;font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--l1);background:var(--code);border-radius:var(--r-md);box-shadow:inset 0 0 0 .5px var(--sep);padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.cz-code .fm{color:var(--l2)}
.cz-code.cz-line{padding:10px 14px}
/* Rows of facts in a panel: the label left, the value after it. */
.cz .fgroup .frow{gap:12px;padding:9px 13px}
.cz .fgroup .frow>.fl{width:72px;color:var(--l2);font-size:12.5px}
.cz .fgroup .frow>.fv{justify-content:flex-start;text-align:left;color:var(--l1);overflow-wrap:anywhere}
.cz .fgroup .frow>.fv.mono{font-size:12px}
.cz .fgroup .frow>.ic{color:var(--l2)}
.cz-files .frow{min-height:34px;padding:6px 13px;gap:9px}
.cz-files .frow .mono{font-size:12px}
.cz-files .sz{margin-left:auto;color:var(--l3);font-size:11.5px;font-variant-numeric:tabular-nums}
.cz-errbox{font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--red);background:var(--red-bg);border-radius:var(--r-md);padding:9px 13px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
/* A note on a page: why something is read-only, what a choice will do. */
.cz-callout{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--l2);background:var(--fill);border-radius:var(--r-md);padding:9px 13px;line-height:1.55}
.cz-callout>.ic{margin-top:2px;color:var(--l3)}
.cz-callout.warn>.ic{color:var(--orange)}
.cz-callout .btn{margin-left:auto;flex:none;align-self:center}
.seg.cz-segsm button{height:22px;padding:0 11px;font-size:12px}
.field.bad{box-shadow:inset 0 0 0 1px var(--red),0 0 0 3px var(--red-bg)}

/* Sheets: the custom connector, uploading a skill, skills that did not load. */
.sheet.cz-sheet .sheet-in{padding:var(--sp-3)}
.cz-sheet .cz-form{display:flex;flex-direction:column;gap:var(--sp-2)}
.cz-fi{display:flex;flex-direction:column;gap:6px}
.cz-fi>label{font-size:12px;color:var(--l2);display:flex;align-items:center;gap:6px}
.cz-fi>label em{font-style:normal;color:var(--l3)}
.cz-fi>.seg{align-self:flex-start}
.cz-fi .note{font-size:11.5px;color:var(--l3)}
.cz-ferr{font-size:11.5px;color:var(--red)}
.cz-paste{margin-bottom:var(--sp-2)}
.cz-paste textarea.field{height:auto;padding:8px 9px;resize:vertical;line-height:1.5}
.cz-kvs{display:flex;flex-direction:column;gap:6px}
.cz-kvrow{display:grid;grid-template-columns:1fr 1.6fr 24px 24px;gap:6px;align-items:center}
.cz-lock{width:24px;height:24px;border:0;border-radius:var(--r-sm);background:none;color:var(--l3);display:flex;align-items:center;justify-content:center;padding:0}
.cz-lock:hover{background:var(--fill2);color:var(--l1)}
.cz-lock.on{color:var(--accent-t);background:var(--accent-bg)}
.cz-lock .ic{width:13px;height:13px}
.field.saved::placeholder{color:var(--l3)}
.cz-addrow{align-self:flex-start;font-size:12.5px;display:flex;gap:4px;align-items:center}
.cz-addrow .ic{width:12px;height:12px}
.cz-drop{border:1.5px dashed var(--fill3);border-radius:var(--r-lg);padding:34px 21px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--l2);text-align:center;transition:background .15s,border-color .15s}
.cz-drop.over{border-color:var(--accent);background:var(--accent-bg)}
.cz-drop>.ic{width:30px;height:30px;color:var(--l3);stroke-width:1.1}
.cz-drop b{color:var(--l1);font-weight:500;font-size:14px}
.cz-drop small{font-size:12px;color:var(--l3)}
.btn.cz-pick{margin-top:6px}
.cz-parsed{display:flex;gap:12px;align-items:flex-start;background:var(--win2);border-radius:var(--r-lg);padding:var(--sp-2)}
.cz-parsed .pt{flex:1;min-width:0}
.cz-parsed b{font-weight:500}
.cz-parsed p{margin:3px 0 0;font-size:12.5px;color:var(--l2);line-height:1.5}
.cz-parsed .badge{display:inline-flex;align-items:center;gap:4px;flex:none}
.cz-parsed .badge .ic{width:11px;height:11px;stroke-width:2}
.cz-dlabel{font-size:12px;color:var(--l2);margin:var(--sp-3) 0 var(--sp-1)}
.cz-target{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--l2);background:var(--win2);border-radius:var(--r-md);padding:9px 13px}
.cz-target .ic{color:var(--l3)}
.cz-target .mono{font-size:11.5px;color:var(--l1)}
.cz-gap{margin-top:10px}
.cz-broken{display:flex;flex-direction:column;gap:8px}
.cz-sheet .fgroup .frow>.fl{width:72px;color:var(--l2);font-size:12.5px}
.cz-sheet .fgroup .frow>.fv{justify-content:flex-start;text-align:left;color:var(--l1);overflow-wrap:anywhere}
.cz-sheet .fgroup .frow>.fv.mono{font-size:12px}
.cz-sheet .sub .mono{font-size:11.5px}
.sheet.cz-sheet .sub{margin-bottom:var(--sp-3)}
.sheet.cz-sheet .sheet-foot{margin-top:var(--sp-3)}

/* 添加连接器 (§10.9; the look is docs/desktop/connector-add-demo.html). */
/* The title and the buttons stay put; the form between them scrolls when it must. */
.sheet.cz-add{overflow:hidden}
.sheet.cz-add .sheet-in{padding:0;display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.sheet.cz-add h3{margin:0;padding:var(--sp-3) var(--sp-3) var(--sp-2)}
.cz-add-body{flex:1;min-height:0;overflow-y:auto;padding:0 var(--sp-3) var(--sp-3);animation:fadein .25s cubic-bezier(.2,0,0,1)}
.sheet.cz-add .sheet-foot{flex:none;margin:0;padding:var(--sp-2) var(--sp-3);border-top:.5px solid var(--sep)}
/* The settings: a grouped form, a label on the left and its control on the right, rows on a hairline. */
.cz-gh{font-size:12px;color:var(--l2);margin:var(--sp-3) 2px 6px}
.cz-add .fgroup .frow{gap:var(--sp-2);padding:7px 13px;min-height:40px}
.cz-add .frow>.fl{width:96px;color:var(--l1);white-space:nowrap}

.cz-add .frow>.fv .field{max-width:260px}

.cz-fn .det{color:var(--accent-t)}

.cz-trust{margin:var(--sp-3) 2px 0;font-size:11.5px;color:var(--l3);line-height:1.55}
/* A pop-up button: the choice, and the up-down chevrons. */
.cz-pop{height:24px;display:inline-flex;align-items:center;gap:6px;padding:0 5px 0 9px;border:0;border-radius:var(--r-sm);background:var(--btn);box-shadow:var(--btn-sh);font-size:12.5px;color:var(--l1);max-width:280px;white-space:nowrap}

textarea.field.cz-grow{height:auto;min-height:30px;padding:6px 9px;line-height:18px;resize:none;display:block}

.cz-summary{display:flex;align-items:center;gap:var(--sp-2);padding:11px var(--sp-2);border-radius:var(--r-lg);background:var(--win2)}

.cz-steps .done{background:var(--green);color:#fff}
.cz-steps .fail{background:var(--red);color:#fff}

/* apps/desktop/src/renderer/src/styles/settings.css */

.settings{display:grid;grid-template-columns:200px minmax(0,1fr);height:100%;position:relative}

.set-body{flex:1;min-height:0;overflow-y:auto;padding:21px 34px 34px}

.settings .fv-side{display:inline-flex;align-items:center;gap:6px;flex:none;color:var(--l2);font-size:12.5px}

/* apps/desktop/src/renderer/src/styles/tokens.css */
/* Design tokens: the colours, type, spacing and motion every part of the
   window draws with, light and dark. Taken as they are from the baseline
   (hermesh's desktop app); platform differences are tokens too
   (html[data-platform]), never branches in components. */
:root {
  /* The brand's electric blue (assets/brand): --accent fills buttons (white on
     it 4.6:1), --accent-fg is it as text (5.6:1 on white). Then the colours
     of states, and one spacing scale in golden-ratio steps. */
  --accent: #1f6bff;
  --accent-fg: #1a5ce6;
  --ok: #17924f;
  --warn: #d0700a;
  --danger: #d7333f;
  --sp-1: 8px;
  --sp-2: 13px;
  --sp-3: 21px;
  --sp-4: 34px;
  --sp-5: 55px;
  /* Corners, small: the window is square-cut, so nothing is a pill but a switch,
     a dot or a counter. Controls (buttons, segments, fields, menu items) take
     --r-sm; what sits inside a control takes --r-xs. A container's corner is its
     content's plus its padding, so the two curves stay parallel: rows --r-md,
     cards and menus --r-lg, sheets and the composer --r-xl. */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 10px;
  --r-xl: 12px;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --ease-in: cubic-bezier(0.3, 0, 1, 1);
  --ease-in-out: cubic-bezier(0.45, 0, 0.55, 1);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, "JetBrains Mono", Consolas, monospace;
  --fs: 13px;
  /* The window's chrome: the top band, and room for the system's window buttons. */
  --top: 44px;
  --lights: 78px;
  --caption: 0px;

  --win: #ffffff; --win2: #f4f4f7; --win3: #ebebf0;
  --side: #f4f4f7; --side-head: #f4f4f7; --side-tint: rgba(246, 246, 249, .28);
  --l1: rgba(0, 0, 0, .86); --l2: rgba(0, 0, 0, .54); --l3: rgba(0, 0, 0, .32); --l4: rgba(0, 0, 0, .14);
  --sep: rgba(0, 0, 0, .075); --fill: rgba(0, 0, 0, .045); --fill2: rgba(0, 0, 0, .075); --fill3: rgba(0, 0, 0, .12);
  --sel: rgba(31, 107, 255, .12); --sel-fg: #1a56d6; --side-sel: rgba(0, 0, 0, .075);
  --accent-t: var(--accent-fg); --accent-bg: rgba(31, 107, 255, .10);
  --green: var(--ok); --green-bg: rgba(23, 146, 79, .11); --orange: var(--warn); --orange-bg: rgba(230, 126, 10, .12); --red: var(--danger); --red-bg: rgba(215, 51, 63, .10);
  /* The parts of the context, beside the accent, green and orange. */
  --violet: #8a5cf5; --teal: #0e9f9a;
  --btn: #ffffff; --btn-sh: 0 0 0 .5px rgba(0, 0, 0, .14), 0 1px 1.5px rgba(0, 0, 0, .08);
  --seg-on: #ffffff; --field: #ffffff; --field-bd: rgba(0, 0, 0, .16);
  --menu: rgba(248, 248, 250, .80); --menu-solid: #f8f8fa; --menu-bd: rgba(0, 0, 0, .10);
  --bub: var(--l1); --bub-fg: var(--win); --msg: var(--l1);
  --glass: rgba(255, 255, 255, .72); --glass-sh: 0 0 0 .5px rgba(0, 0, 0, .10), 0 2px 8px rgba(0, 0, 0, .08);
  /* Toolbar buttons, and the tint of the glass bar the conversation scrolls under (glass.tsx). */
  --tb-fg: rgba(0, 0, 0, .72);
  --bar-tint: rgba(255, 255, 255, .7);
  --code: #f6f7fa; --add-bg: rgba(23, 146, 79, .10); --del-bg: rgba(215, 51, 63, .08); --add-fg: #127443; --del-fg: #b0232f;
  --scrim: rgba(0, 0, 0, .18);
  /* The composer's pill and the approval card over it; the tray of waiting messages behind it, a step below the window. */
  --pill: #ffffff; --pill-bd: rgba(0, 0, 0, .12);
  --tray: #f4f4f7;
  color-scheme: light;
}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --accent: #1f6bff;
    --accent-fg: #7ab0ff;
    --ok: #3fcf86;
    --warn: #ffab3d;
    --danger: #ff6670;
    --win: #1e1e21; --win2: #29292d; --win3: #323237;
    --side: #25252a; --side-head: #25252a; --side-tint: rgba(28, 28, 32, .3);
    --l1: rgba(255, 255, 255, .88); --l2: rgba(255, 255, 255, .55); --l3: rgba(255, 255, 255, .32); --l4: rgba(255, 255, 255, .14);
    --sep: rgba(255, 255, 255, .09); --fill: rgba(255, 255, 255, .05); --fill2: rgba(255, 255, 255, .085); --fill3: rgba(255, 255, 255, .14);
    --sel: rgba(46, 128, 255, .24); --sel-fg: #a8c8ff; --side-sel: rgba(255, 255, 255, .1);
    --accent-bg: rgba(46, 128, 255, .16);
    --green-bg: rgba(63, 207, 134, .14); --orange-bg: rgba(255, 171, 61, .14); --red-bg: rgba(255, 102, 112, .13);
    --violet: #a585ff; --teal: #3cc8c0;
    --btn: rgba(255, 255, 255, .12); --btn-sh: 0 0 0 .5px rgba(255, 255, 255, .08);
    --seg-on: rgba(255, 255, 255, .22); --field: rgba(255, 255, 255, .06); --field-bd: rgba(255, 255, 255, .16);
    --menu: rgba(44, 44, 48, .80); --menu-solid: #2c2c30; --menu-bd: rgba(255, 255, 255, .12);
    /* The owner's messages: a quiet raised grey in the dark, not a white block. */
    --bub: rgba(255, 255, 255, .09); --bub-fg: var(--l1);
    /* The model's words: near white, a step brighter than other text. */
    --msg: rgba(255, 255, 255, .95);
    --glass: rgba(60, 60, 66, .62); --glass-sh: 0 0 0 .5px rgba(255, 255, 255, .10), 0 2px 10px rgba(0, 0, 0, .3);
    --tb-fg: rgba(255, 255, 255, .82);
    --bar-tint: rgba(30, 30, 33, .6);
    --code: #18181b; --add-bg: rgba(63, 207, 134, .12); --del-bg: rgba(255, 102, 112, .11); --add-fg: #5fe0a0; --del-fg: #ff8c94;
    --scrim: rgba(0, 0, 0, .35);
    --pill: #28282c; --pill-bd: rgba(255, 255, 255, .09);
    --tray: #19191c;
    color-scheme: dark;
  }}

/* Windows: Segoe, a step larger; the caption buttons sit at the top band's right. */
:root[data-platform="win"] {
  --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  --mono: "Cascadia Mono", Consolas, monospace;
  --fs: 13.5px;
  --lights: 12px;
  --caption: 138px;
}

/* Linux: the desktop's UI font; the system draws the title bar. */
:root[data-platform="linux"] {
  --font: system-ui, "Noto Sans", "Noto Sans CJK SC", "Ubuntu", sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", monospace;
  --fs: 13.5px;
  --lights: 12px;
}

/* A page outside the app (a browser preview): no traffic lights to leave room for. */
:root[data-platform="web"] {
  --lights: 12px;
}

/* apps/desktop/src/renderer/src/styles/app.css */
/* The window's parts, as the baseline draws them (sizes, rhythm, motion);
   what finxwork adds (the composer, the approval panel, thinking) follows
   the same rules. Colours come from tokens.css only. */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--win);color:var(--l1);font-family:var(--font);font-size:var(--fs);line-height:1.38;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;cursor:default;overflow:hidden}
#root{height:100%}
/* macOS: the window's sidebar material shows through the sidebar; everything else stays opaque. */
html.vibrant,html.vibrant body{background:transparent}
html.vibrant .side{background:var(--side-tint)}
html.vibrant .grp-h,html.vibrant .grp-row{position:static;background:transparent}
input,textarea,.sel-text{user-select:text;-webkit-user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fadein{animation:fadein .35s cubic-bezier(.2,0,0,1)}
/* Scrollbars as macOS overlays draw them: no track, a slim faint rounded thumb that firms up under the pointer. */
::-webkit-scrollbar{width:10px;height:10px;background:transparent}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background-color:var(--l4);border-radius:999px;border:3px solid transparent;background-clip:padding-box;min-height:32px}
::-webkit-scrollbar-thumb:hover{background-color:var(--l3)}
::-webkit-scrollbar-thumb:active{background-color:var(--l2)}
/* window chrome: the title bar areas drag the window; controls in them don't */
.drag{-webkit-app-region:drag}
.drag button,.drag input,.drag select,.drag a,.drag .no-drag{-webkit-app-region:no-drag}
button{font:inherit;color:inherit}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic.sm{width:13px;height:13px}
.ic.fill{fill:currentColor;stroke:none}
/* controls */
.btn{height:26px;padding:0 13px;border-radius:var(--r-sm);border:0;background:var(--btn);box-shadow:var(--btn-sh);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--l1);flex:none}
.btn:hover{filter:brightness(.98)}
.btn:active{filter:brightness(.93)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(40,60,200,.3)}
.btn.danger{color:var(--red)}
.btn.primary.danger{background:var(--red);color:#fff;box-shadow:0 1px 2px rgba(200,40,60,.3)}
.btn.lg{height:34px;padding:0 20px;font-size:14px}
.btn.sm{height:22px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.42;pointer-events:none}
.btn .ic{width:14px;height:14px}
/* Pointers, as macOS has them: the pointing hand for text links, the I-beam over what takes text; controls keep the arrow. */
.link,a[href]{cursor:pointer}
input:not([type=checkbox],[type=radio],[type=range],[type=color],[type=file],[type=button],[type=submit]),textarea,[contenteditable=true]{cursor:text}
input:disabled,textarea:disabled{cursor:default}
.link:disabled{cursor:default}
.link{border:0;background:none;padding:0;color:var(--accent-t);font-size:inherit}
.link:hover{text-decoration:underline}
.sw{width:34px;height:20px;border-radius:999px;border:0;background:var(--fill3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.2,0,0,1)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(14px)}
.sw:disabled{opacity:.5}
.cb{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;text-align:left}
.cb .box{width:14px;height:14px;border-radius:var(--r-xs);background:var(--field);box-shadow:inset 0 0 0 1px var(--field-bd);display:flex;align-items:center;justify-content:center;flex:none}
.cb.on .box{background:var(--accent);box-shadow:none;color:#fff}
.cb .box .ic{width:11px;height:11px;stroke-width:2.2}
.cb:not(.on) .box .ic{display:none}
.seg{display:inline-flex;background:var(--fill2);border-radius:var(--r-sm);padding:2px;gap:1px;flex:none}
.seg button{border:0;background:transparent;height:24px;padding:0 13px;border-radius:var(--r-xs);font-size:12.5px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.seg button.on{background:var(--seg-on);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.field{height:26px;border-radius:var(--r-sm);border:0;box-shadow:inset 0 0 0 1px var(--field-bd);background:var(--field);padding:0 9px;font-size:13px;color:var(--l1);outline:none;width:100%}
.field:focus{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--accent-bg)}
.kbd{font-size:11.5px;color:var(--l3);letter-spacing:.04em}
.dotc{width:7px;height:7px;border-radius:50%;background:var(--l3);flex:none;display:inline-block}
.dotc.on{background:var(--green)}
.dotc.warn{background:var(--orange)}
.mono{font-family:var(--mono)}
.muted{color:var(--l2)}
.faint{color:var(--l3)}
.tnum{font-variant-numeric:tabular-nums}
.av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;flex:none}
.psel{appearance:none;-webkit-appearance:none;border:0;background-color:var(--fill2);color:var(--l1);height:24px;border-radius:var(--r-sm);padding:0 24px 0 9px;font:inherit;font-size:12px;width:100%;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 10px,calc(100% - 9px) 10px;background-size:4px 4px;background-repeat:no-repeat}
/* status glyphs */
.sdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;position:relative}
.sdot.w{background:var(--orange)}.sdot.c{background:var(--red)}.sdot.r{background:var(--green)}
.sdot.r::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--green);animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.45}75%,100%{transform:scale(2.3);opacity:0}}
.sdot.i{background:var(--l4)}
@keyframes spin{to{transform:rotate(360deg)}}
.mini-spin{width:12px;height:12px;border-radius:50%;border:1.6px solid var(--fill3);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}

/* main window */
.mainwrap{position:relative;display:grid;grid-template-columns:272px minmax(0,1fr);height:100%;transition:grid-template-columns .3s cubic-bezier(.2,0,0,1)}
.mainwrap.noside{grid-template-columns:0 minmax(0,1fr)}
/* Edge to edge: the sidebar fills the window from top to bottom and left to its edge, one hairline from the content. */
.side{background:var(--side);border-right:.5px solid var(--sep);display:flex;flex-direction:column;min-height:0;overflow:hidden}
/* Sidebar titles a step brighter than other text in the dark, as small text on the material reads grey. */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .side{--l1:rgba(255,255,255,.93)}}
.noside .side{opacity:0;pointer-events:none}
.mainwrap>.content{grid-column:2}
/* No room for the sidebar beside the conversation, but asked for: over it, opaque, until a click beside it (layout.ts). */
.mainwrap.peek .side{position:absolute;top:0;left:0;bottom:0;z-index:20;width:272px;opacity:1;pointer-events:auto;background:var(--side);
  box-shadow:10px 0 30px rgba(0,0,0,.14);animation:peek-in .22s cubic-bezier(.2,0,0,1)}
.peek-scrim{position:absolute;inset:0;z-index:19;background:rgba(0,0,0,.08);animation:scrim-in .2s}
@keyframes scrim-in{from{opacity:0}}
@keyframes peek-in{from{transform:translateX(-24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.mainwrap.peek .side{animation:none}}
/* A narrow conversation: less margin beside its column and its composer. */
.mainwrap.narrow .dbody{padding-left:var(--sp-3);padding-right:var(--sp-3)}
.mainwrap.narrow .cmp-zone{padding-left:calc(var(--sp-3) - 12px);padding-right:calc(var(--sp-3) - 12px)}
/* The sidebar toggle sits a step after the traffic lights (which end at x 74); the list's view options end the row. */
.side-top{height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 var(--lights);flex:none}
.tb{height:28px;min-width:28px;border:0;background:transparent;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--tb-fg);gap:5px;padding:0 6px}
.tb .ic{stroke-width:1.45}
.tb:hover{background:var(--fill2);color:var(--l1)}
.tb.on{background:var(--fill2);color:var(--l1)}
/* One rhythm with the list: rows 32 high, 34 apart. */
.side-nav{padding:0 8px 6px;display:flex;flex-direction:column;gap:2px;flex:none}
.nav-i{display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border-radius:var(--r-md);font-size:14px;border:0;background:none;width:100%;text-align:left}
.nav-i .ic{width:18px;height:18px;color:var(--l1)}
/* The shortcut shows on hover only: the menus say it too. */
.nav-i .kbd{margin-left:auto;opacity:0;transition:opacity .12s}
.nav-i:hover .kbd,.nav-i:focus-visible .kbd{opacity:1}
.nav-i:hover{background:var(--fill)}
.nav-i.sel{background:var(--side-sel)}
.nav-i .cnt{margin-left:auto;font-size:11.5px;color:var(--l2);font-variant-numeric:tabular-nums}
.side-list{flex:1;overflow-y:auto;min-height:0;padding:0 8px 8px}
.side-list>[role=group]{display:flex;flex-direction:column;gap:2px}
/* A group's heading: its title, its count, and ▾ (▸ when collapsed); a click collapses or opens it. */
.grp-h{position:sticky;top:0;z-index:2;font:inherit;font-size:12px;font-weight:400;color:var(--l2);padding:24px 10px 6px;margin-bottom:2px;display:flex;align-items:center;gap:6px;background:var(--side-head);border:0;width:100%;text-align:left}
.side-list>[role=group]:first-child .grp-h{padding-top:20px}
.grp-h:hover{color:var(--l1)}
.grp-h .n{font-weight:500;color:var(--l3)}

.grp-h.shut .ic{transform:rotate(-90deg)}
.grp-h .gt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* In the list a heading sits in a row that sticks; a project's row shows + on hover, for a new session there. */
.grp-row{position:sticky;top:0;z-index:2;display:flex;align-items:flex-end;background:var(--side-head)}
.grp-row .grp-h{position:static;background:none;flex:1;min-width:0}
.grp-row .grpact{display:none;flex:none;margin-bottom:2px}
.grp-row:hover .grpact,.grp-row .grpact:focus-visible{display:flex}
.srow{display:flex;padding:7px 10px;border-radius:var(--r-md);align-items:flex-start;border:0;background:none;width:100%;text-align:left;font-size:14px}
.srow:hover{background:var(--fill)}
.srow.sel{background:var(--side-sel)}
.srow .sdot{width:6px;height:6px}

.rowact{display:none;border:0;background:none;width:20px;height:18px;border-radius:var(--r-xs);align-items:center;justify-content:center;color:var(--l2);padding:0;flex:none;margin:-2px -4px -2px 0}
.rowact:hover{background:var(--fill2);color:var(--l1)}
.srow.has-act:hover .smeta{display:none}
.srow.has-act:hover .rowact{display:flex}
.srow.menu-open .smeta{display:none}
.srow.menu-open .rowact{display:flex;background:var(--fill2);color:var(--l1)}
.srename{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--l1);background:var(--field);border:0;border-radius:var(--r-xs);outline:none;box-shadow:0 0 0 1.5px var(--accent);padding:0 5px;margin:-1px 0 -1px -5px}
.anote{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--l2);background:var(--fill);border-radius:var(--r-md);padding:8px 12px;margin-bottom:16px}
.anote .link{margin-left:auto}
.smain{min-width:0;flex:1}
.sl1{display:flex;gap:8px;align-items:center;line-height:18px}
.stitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* In a task: a faded band crosses the title left to right every 2.4s at an even speed, like a progress
   bar, the next one entering as the last leaves, until the task ends. The title itself is
   transparent (it keeps the row's layout and its words); two copies draw it, one in its colour seen
   through a mask with a soft hole, one in --l3 seen only through that hole. The masks (three titles wide)
   slide across while the copies slide back by as much, so the copies stay on the title: transforms only,
   which the compositor runs, and translucent colours, so the band fades into any background. */
/* A running title is as wide as its words (the band crosses the words, not the empty row); its right
   margin keeps what follows at the row's right end. */
.stitle.run{position:relative;color:transparent;flex:0 1 auto;margin-right:auto}
.stitle .shine{position:absolute;top:0;bottom:0;left:-100%;width:300%;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,#000 38%,transparent 50%,#000 62%);mask-image:linear-gradient(90deg,#000 38%,transparent 50%,#000 62%);animation:stitle-run 2.4s linear infinite}
.stitle .shine.band{-webkit-mask-image:linear-gradient(90deg,transparent 38%,#000 50%,transparent 62%);mask-image:linear-gradient(90deg,transparent 38%,#000 50%,transparent 62%)}
.stitle .shine::before{content:attr(data-t);position:absolute;top:0;bottom:0;left:calc(100% / 3);width:calc(100% / 3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--l1);animation:stitle-run-back 2.4s linear infinite}
.stitle .shine.band::before{color:var(--l3)}
@keyframes stitle-run{from{transform:translateX(-28.6667%)}to{transform:translateX(28.6667%)}}
@keyframes stitle-run-back{from{transform:translateX(86%)}to{transform:translateX(-86%)}}
@media (prefers-reduced-motion:reduce){.stitle.run{color:inherit}.stitle .shine{display:none}}
/* The same band over anything in progress in the conversation (a step, the working line): there the
   words may be code with its own colours, so the band is a mask over the element instead of copies of
   its text, three times its width and sliding so the band enters at its left edge and leaves at its
   right, in the sidebar's 2.4s, dimming the words to about a third. */
.shimmer{-webkit-mask-image:linear-gradient(90deg,#000 38%,rgba(0,0,0,.36) 50%,#000 62%);mask-image:linear-gradient(90deg,#000 38%,rgba(0,0,0,.36) 50%,#000 62%);-webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;animation:shimmer 2.4s linear infinite}
@keyframes shimmer{from{-webkit-mask-position:93% 0;mask-position:93% 0}to{-webkit-mask-position:7% 0;mask-position:7% 0}}
@media (prefers-reduced-motion:reduce){.shimmer{animation:none;-webkit-mask-image:none;mask-image:none}}
.smeta{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--l2);flex:none;font-variant-numeric:tabular-nums}
.sl2{display:flex;align-items:baseline;gap:8px;font-size:11px;color:color-mix(in srgb,var(--l2) 78%,transparent);margin-top:2px}
.sl2t{flex:1;min-width:0;display:flex;align-items:center;gap:9px;overflow:hidden}

.sl2i{display:inline-flex;align-items:center;gap:3px;min-width:0;flex:0 1 auto}
.sl2i+.sl2i{flex-shrink:1000}
.sl2i>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl2i .ic{width:11px;height:11px;stroke-width:1.35}
.stime{flex:none;font-size:11px;font-variant-numeric:tabular-nums}
.loadrow{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;color:var(--l2);font-size:12px}
.endrow{text-align:center;color:var(--l3);font-size:11.5px;padding:14px 0 6px}
/* finx did not start: why, and its last words. */
.endrow .kfail{margin:6px 12px 0;color:var(--l2);text-wrap:balance}
.endrow .kfail-out{margin:8px 10px 0;text-align:left;font-family:var(--mono);font-size:10.5px;line-height:1.45;color:var(--l2);background:var(--fill);border-radius:var(--r-sm);padding:6px 8px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:140px;overflow-y:auto}
.side-foot{flex:none;height:52px;display:flex;align-items:center;gap:9px;margin:0 6px 6px;padding:0 10px 0 8px;border:0;border-radius:var(--r-md);background:none;text-align:left;width:calc(100% - 12px)}
.side-foot:hover{background:var(--fill)}

.side-foot>.dotc{flex:none}

.side-foot[aria-expanded="true"] .chev{transform:none}

.acct{position:relative;flex:none;border-top:.5px solid var(--sep);padding-top:6px}
.acct-menu{position:absolute;left:6px;right:6px;bottom:calc(100% + 6px);z-index:10;background:var(--menu-solid);border-radius:var(--r-lg);box-shadow:0 0 0 .5px var(--menu-bd),0 12px 32px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.08);padding:4px;transform-origin:50% 100%;animation:menuup .18s cubic-bezier(.2,0,0,1);outline:none}
@keyframes menuup{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.acct-menu .mi{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 9px;border:0;border-radius:var(--r-sm);background:none;text-align:left;outline:none}

.vmenu{position:fixed;z-index:30;min-width:176px;max-height:calc(100vh - 24px);overflow-y:auto;background:var(--menu-solid);border-radius:var(--r-lg);box-shadow:0 0 0 .5px var(--menu-bd),0 12px 32px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.08);padding:4px;outline:none;animation:fadein .14s cubic-bezier(.2,0,0,1)}
