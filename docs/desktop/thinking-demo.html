<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思考过程</title>
<!--
  原型：模型思考时，会话页怎么把思考的内容露出来。
  会话页的部分照 app.css、composer.css 抄；新增的只有「运行行里的思考」一段（.tk-*），标了「新增」。
  页面里的任务是脚本模拟的：三次模型调用，中间读两个文件、跑一条命令，最后写回答。
  「现在」照 Steps.tsx、Chat.tsx 现在的做法画；A、B、C 是三种改法，共同点是：正在进行的思考
  不再留在步骤列表里，而像运行中的工具调用一样移到最下面的运行行；想完回到步骤列表。
-->
<style>
/* Tokens: copied from apps/desktop/src/renderer/src/styles/tokens.css. */
:root{
  --accent:#1f6bff;--accent-fg:#1a5ce6;--ok:#17924f;--warn:#d0700a;--danger:#d7333f;
  --sp-1:8px;--sp-2:13px;--sp-3:21px;--sp-4:34px;--sp-5:55px;
  --r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:10px;--r-xl:12px;
  --ease-out:cubic-bezier(.2,0,0,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,"JetBrains Mono",Consolas,monospace;
  --fs:13px;--top:44px;
  --win:#ffffff;--win2:#f4f4f7;
  --l1:rgba(0,0,0,.86);--l2:rgba(0,0,0,.54);--l3:rgba(0,0,0,.32);--l4:rgba(0,0,0,.14);
  --sep:rgba(0,0,0,.075);--fill:rgba(0,0,0,.045);--fill2:rgba(0,0,0,.075);--fill3:rgba(0,0,0,.12);
  --red:var(--danger);
  --btn:#ffffff;--btn-sh:0 0 0 .5px rgba(0,0,0,.14),0 1px 1.5px rgba(0,0,0,.08);
  --bub:var(--l1);--bub-fg:var(--win);--msg:var(--l1);
  --code:#f6f7fa;
  --pill:#ffffff;--pill-bd:rgba(0,0,0,.12);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --accent-fg:#7ab0ff;--ok:#3fcf86;--warn:#ffab3d;--danger:#ff6670;
  --win:#1e1e21;--win2:#29292d;
  --l1:rgba(255,255,255,.88);--l2:rgba(255,255,255,.55);--l3:rgba(255,255,255,.32);--l4:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.09);--fill:rgba(255,255,255,.05);--fill2:rgba(255,255,255,.085);--fill3:rgba(255,255,255,.14);
  --btn:rgba(255,255,255,.12);--btn-sh:0 0 0 .5px rgba(255,255,255,.08);
  --bub:rgba(255,255,255,.09);--bub-fg:var(--l1);--msg:rgba(255,255,255,.95);
  --code:#18181b;
  --pill:#28282c;--pill-bd:rgba(255,255,255,.09);
  color-scheme:dark;
}

/* Base and controls, as app.css. */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--win);color:var(--l1);font-family:var(--font);font-size:var(--fs);line-height:1.38;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;cursor:default;overflow:hidden}
button{font:inherit;color:inherit;cursor:default}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{height:26px;padding:0 13px;border-radius:var(--r-sm);border:0;background:var(--btn);box-shadow:var(--btn-sh);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--l1);flex:none}
.seg{display:inline-flex;background:var(--fill2);border-radius:var(--r-sm);padding:2px;gap:1px;flex:none}
.seg button{border:0;background:transparent;height:22px;padding:0 10px;border-radius:var(--r-xs);font-size:12px;color:var(--l1)}
.seg button.on{background:var(--btn);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.shimmer{-webkit-mask-image:linear-gradient(90deg,#000 38%,rgba(0,0,0,.36) 50%,#000 62%);mask-image:linear-gradient(90deg,#000 38%,rgba(0,0,0,.36) 50%,#000 62%);-webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;animation:shimmer 2.4s linear infinite}
@keyframes shimmer{from{-webkit-mask-position:93% 0;mask-position:93% 0}to{-webkit-mask-position:7% 0;mask-position:7% 0}}
@media (prefers-reduced-motion:reduce){.shimmer{animation:none;-webkit-mask-image:none;mask-image:none}}

/* The prototype's own bar: which way to show it, and the clock. Not part of the app. */
.page{display:flex;flex-direction:column;height:100%}
.pbar{height:var(--top);flex:none;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-4);border-bottom:.5px solid var(--sep)}
.pbar h1{margin:0;font-size:14px;font-weight:500;flex:none}
.pbar .sp{flex:1}
.pnote{flex:none;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--sp-4);border-bottom:.5px solid var(--sep);font-size:12.5px;line-height:18px;color:var(--l2)}
.pnote p{margin:0;flex:1;min-width:0}
.pnote input{flex:none;width:160px;accent-color:var(--accent)}
.pnote .clock{flex:none;width:44px;text-align:right;color:var(--l3);font-variant-numeric:tabular-nums}

/* The conversation, as app.css. */
.content{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.cscroll{flex:1;overflow-y:auto;min-height:0}
.dbody{max-width:798px;margin:0 auto;padding:var(--sp-3) var(--sp-4) 160px}
.tr{display:flex;flex-direction:column;gap:var(--sp-2)}
.um{position:relative;align-self:flex-end;max-width:78%;margin:var(--sp-1) 0 var(--sp-3)}
.um .bub{background:var(--bub);color:var(--bub-fg);border-radius:var(--r-xl);padding:9px 15px;font-size:15px;line-height:21px;white-space:pre-wrap;overflow-wrap:anywhere}
.am{position:relative;font-size:15px;line-height:21px;color:var(--msg);user-select:text;-webkit-user-select:text}
.md{overflow-wrap:anywhere}
.md>*{margin:0}
.md>*+*{margin-top:12px}
.md ul{padding-left:20px}
.md li+li{margin-top:4px}
.md li::marker{color:var(--l3)}
.md code{font-family:var(--mono);font-size:13px;background:var(--fill2);padding:1px 5px;border-radius:var(--r-xs)}
.tool{border-radius:var(--r-md);font-size:14px}
.tool .th{display:flex;align-items:center;gap:6px;padding:2px 0;border-radius:var(--r-sm);border:0;background:none;max-width:100%;text-align:left;color:var(--l2)}
.tool .th:hover{color:var(--l1)}
.tool .th .vb{flex:none}
.tool .th .sm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tool .th .cmd{font-family:var(--mono);font-size:12.5px;opacity:.9}
.tool .th .chev{flex:none}
.tgroup{font-size:14px}
.tg-h{display:flex;align-items:center;gap:6px;padding:2px 0;border:0;background:none;color:var(--l2);text-align:left}
.tg-h:hover{color:var(--l1)}
.working{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--l2)}
.working .mk{width:18px;height:18px;margin-top:2px;flex:none;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.5}}
.wk-now{flex:1;min-width:0;display:flex;flex-direction:column}
.wk-line{display:flex;align-items:baseline;gap:4px;padding:2px 0;line-height:19px}
.wk-meta,.wk-time{flex:none;font-size:12.5px;color:var(--l3);font-variant-numeric:tabular-nums}
.wk-time{margin-left:2px}
.tg-h .chev,.tool .th .chev{width:14px;height:14px;margin-left:-3px;color:var(--l3);transform:rotate(-90deg);transition:transform .15s}
.tgroup.open .tg-h .chev,.tool.open .th .chev{transform:none}
.tool .out{display:none;margin:4px 0 6px;background:var(--code);border-radius:var(--r-md);padding:8px 10px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;color:var(--l2);line-height:1.5;max-height:360px;overflow:auto}
.tool.open .out{display:block}
.tool.think .out{font-family:var(--font);font-size:13px;line-height:1.6;white-space:pre-wrap}
.tgroup .tg-b{display:none}
.tgroup.open .tg-b{display:flex}
.tg-b{flex-direction:column;margin:var(--sp-1) 0 2px;border:1px solid var(--sep);border-radius:var(--r-md);overflow:hidden}
.tg-b .tool{border-radius:0;font-size:13px}
.tg-b .tool+.tool{border-top:1px solid var(--sep)}
.tg-b .tool .th{width:100%;gap:5px;padding:var(--sp-1) var(--sp-2);border-radius:0}
.tg-b .tool .th[aria-expanded]:hover,.tg-b .tool.open .th{background:var(--fill)}
.tg-b .tool .out{margin:0;border-radius:0;padding:var(--sp-1) var(--sp-2) 10px;background:var(--fill);color:var(--l2);max-height:320px;overflow:auto}

/* ———— 新增：运行行里的思考（拟加入 app.css） ————
   正在进行的思考移到运行行：标记右边是「思考中 · 时间 · tokens」，下面是它正写到哪儿。
   字号、行高、颜色与展开后的思考全文（.tool.think .out）一致：13 px、行高 20、--l2。 */
.wk-line.tk-h{border:0;background:none;padding:2px 0;color:inherit;text-align:left;font:inherit;width:max-content;max-width:100%}
.wk-line.tk-h:hover{color:var(--l1)}
.wk-line.tk-h .chev{width:14px;height:14px;margin-left:-3px;align-self:center;color:var(--l3);transform:rotate(-90deg);transition:transform .15s}
.wk-line.tk-h[aria-expanded="true"] .chev{transform:none}
.tk-text{font-size:13px;line-height:20px;color:var(--l2);white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
/* A：三行小窗。新字从底部出来，旧的往上推出去，顶部渐隐；点「思考中」展开全文。 */
.tk-peek{margin-top:2px;max-height:60px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.tk-peek.over{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 24px);mask-image:linear-gradient(to bottom,transparent,#000 24px)}
.tk-peek.open{max-height:320px;overflow-y:auto;display:block;-webkit-mask-image:none;mask-image:none}
/* B：只露出正在写的这一句，句尾一直看得见，前面渐隐。 */
.tk-one{margin-top:2px;display:flex;justify-content:flex-end;overflow:hidden;white-space:nowrap}
.tk-one>span{flex:none;white-space:nowrap}
.tk-one.over{justify-content:flex-start;direction:rtl;-webkit-mask-image:linear-gradient(to right,transparent,#000 34px);mask-image:linear-gradient(to right,transparent,#000 34px)}
.tk-one.over>span{direction:ltr;unicode-bidi:isolate}
/* C：全文直接展开，最高 12 行，跟着滚到底。 */
.tk-full{margin:4px 0 2px;max-height:240px;overflow-y:auto;padding-left:var(--sp-2);border-left:2px solid var(--fill3)}

/* The composer, as composer.css (static here). */
.cmp-zone{position:absolute;left:0;right:0;bottom:0;z-index:4;pointer-events:none;padding:28px calc(var(--sp-4) - 12px) 12px;background:linear-gradient(to bottom,transparent,var(--win) 28px)}
.cmp-col{pointer-events:auto;max-width:754px;margin:0 auto}
.cmp{background:var(--pill);border-radius:var(--r-xl);box-shadow:0 0 0 .5px var(--pill-bd),0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);padding:6px;display:flex;align-items:flex-end;gap:4px}
.cmp-plus{width:32px;height:32px;border-radius:var(--r-sm);border:0;background:none;color:var(--l2);display:flex;align-items:center;justify-content:center;flex:none}
.cmp-plus .ic{width:18px;height:18px;stroke-width:1.5}
.cmp-ph{flex:1;min-width:0;font-size:15px;line-height:21px;color:var(--l3);padding:5.5px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send{width:32px;height:32px;border-radius:var(--r-sm);border:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.send:disabled{background:var(--fill3);color:var(--win)}
.send.stop{background:var(--red)}
.send .ic{width:16px;height:16px;stroke-width:1.9}
.send.stop .ic{width:12px;height:12px}
</style>
</head>
<body>
<div class="page">
  <div class="pbar">
    <h1>思考过程</h1>
    <div class="seg" id="ways"></div>
    <div class="sp"></div>
    <div class="seg" id="speed"></div>
    <div class="seg" id="theme"></div>
    <button class="btn" id="replay">重放</button>
  </div>
  <div class="pnote"><p id="note"></p><input type="range" id="scrub" min="0" step="0.1" aria-label="时间"><span class="clock" id="clock"></span></div>
  <div class="content">
    <div class="cscroll" id="scroll"><div class="dbody"><div class="tr" id="tr"></div></div></div>
    <div class="cmp-zone"><div class="cmp-col"><div class="cmp">
      <button class="cmp-plus" aria-label="添加"><svg class="ic" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
      <div class="cmp-ph">要求后续变更</div>
      <button class="send" id="send" aria-label="发送"></button>
    </div></div></div>
  </div>
</div>

/** Everything on the page at time t: the steps, what is live, and the tokens of finished calls. */
function stateAt(t) {

    } else if (s.kind === "args") {
      for (const it of items) if (it.kind === "thinking") it.live = false;
      for (const x of s.tools) items.push({ kind: "tool", key: x.id, tool: x, state: on ? "streaming" : "done" });

      if (!on) tokens += s.call + callOutput(s);

      for (const it of items) if (it.kind === "tool" && s.tools.includes(it.tool)) it.state = on ? "running" : "done";
      streaming = false;
    } else if (s.kind === "text") {
      for (const it of items) if (it.kind === "thinking") it.live = false;
      const n = on ? Math.floor((t - s.t0) * TEXT_RATE) : s.text.length;
      text = { text: s.text.slice(0, n), live: on };

}

  const has = live.text.trim() !== "";
  let peek = "";
  if (has && way === "a") peek = `<div class="tk-peek tk-text ${open.has("peek") ? "open" : ""}" data-keep="peek"><div>${esc(live.text.trim())}</div></div>`;
  if (has && way === "b") peek = `<div class="tk-one tk-text" data-fit><span>${esc(sentence(live.text))}</span></div>`;
  if (has && way === "c") peek = `<div class="tk-full tk-text" data-keep="full">${esc(live.text.trim())}</div>`;
  const toggle = way === "a" && has;
  const head = toggle
    ? `<button class="wk-line tk-h" data-open="peek" aria-expanded="${open.has("peek")}"><span class="shimmer">思考中</span>${meta}${CARET}</button>`
    : `<div class="wk-line"><span class="shimmer">思考中</span>${meta}</div>`;
  return `<div class="working">${MARK}<div class="wk-now">${head}${peek}</div></div>`;
}
/** The sentence it is writing; the last one it finished when it is between two. */
function sentence(text) {
  const parts = text.trim().split(/(?<=[。！？!?\n])/).map((s) => s.trim()).filter(Boolean);
  return parts.at(-1) ?? "";
}

let way = WAYS.some((w) => `#${w.id}` === location.hash) ? location.hash.slice(1) : "a";
let speed = 1, t = 0, playing = true;

function render() {
  const st = stateAt(t);
  const tr = document.getElementById("tr");
  const sc = document.getElementById("scroll");
  const stick = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 40;
  const keep = {};
  tr.querySelectorAll("[data-keep]").forEach((el) => { keep[el.dataset.keep] = { top: el.scrollTop, bottom: el.scrollHeight - el.scrollTop - el.clientHeight < 8 }; });
  // In A, B and C the thinking in progress leaves the steps for the line at the bottom.
  const live = way === "now" ? null : st.items.find((it) => it.kind === "thinking" && it.live);
  const shown = st.items.filter((it) => !(it.kind === "tool" && it.state === "running") && it !== live);
  let h = `<div class="um"><div class="bub">设置页的模型列表有时候不刷新，帮我看看是什么原因</div></div>`;
  h += work(shown);
  // A 放在上面：正在进行的思考跟在步骤后面，一个三行小窗；运行行照旧。
  if (way === "top" && live && live.text.trim() !== "") h += `<div class="tk-peek tk-text tk-top ${open.has("peek") ? "open" : ""}" data-keep="peek" data-open="peek" aria-expanded="${open.has("peek")}"><div>${esc(live.text.trim())}</div></div>`;
  if (st.text && st.text.text) h += `<div class="am"><div class="md">${md(st.text.text)}</div></div>`;
  if (st.running) h += working(way, st, t, way === "top" ? null : live);
  tr.innerHTML = h;
  tr.querySelectorAll("[data-keep]").forEach((el) => {
    const k = keep[el.dataset.keep];
    el.scrollTop = !k || k.bottom ? el.scrollHeight : k.top;
  });
  // Text pushed out at the top is not in scrollHeight: measure what is inside.
  tr.querySelectorAll(".tk-peek").forEach((el) => el.classList.toggle("over", el.firstChild.offsetHeight > el.clientHeight + 1));
  tr.querySelectorAll("[data-fit]").forEach((el) => el.classList.toggle("over", el.firstChild.offsetWidth > el.clientWidth));
  if (stick) sc.scrollTop = sc.scrollHeight;
  const send = document.getElementById("send");
  send.className = `send ${st.running ? "stop" : ""}`;
  send.innerHTML = st.running ? STOP : SEND;
  send.disabled = !st.running;
  document.getElementById("scrub").value = t;
  document.getElementById("clock").textContent = `${t.toFixed(1)} s`;
}

// pointerdown: the page redraws ten times a second, so a click's button may be gone by mouseup.
document.getElementById("tr").addEventListener("pointerdown", (e) => {
  const b = e.target.closest("[data-open]");
  if (!b || !b.hasAttribute("aria-expanded")) return;
  const k = b.dataset.open;
  open.has(k) ? open.delete(k) : open.add(k);
  render();
});

function segs(id, list, get, set) {
  const el = document.getElementById(id);
  el.innerHTML = list.map(([v, l]) => `<button data-v="${v}">${l}</button>`).join("");
  const mark = () => el.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === String(get())));
  el.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { set(b.dataset.v); mark(); } });
  mark();
}
const note = () => (document.getElementById("note").textContent = WAYS.find((w) => w.id === way).note);
segs("ways", WAYS.map((w) => [w.id, w.label]), () => way, (v) => { way = v; history.replaceState(null, "", `#${v}`); note(); render(); });
segs("speed", SPEEDS.map((s) => [s, `${s}×`]), () => speed, (v) => (speed = Number(v)));
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
document.documentElement.dataset.theme = dark ? "dark" : "light";
segs("theme", [["light", "浅色"], ["dark", "深色"]], () => document.documentElement.dataset.theme, (v) => (document.documentElement.dataset.theme = v));
note();

const scrub = document.getElementById("scrub");
scrub.max = TOTAL.toFixed(1);
scrub.addEventListener("input", () => { t = Number(scrub.value); playing = true; render(); });
document.getElementById("replay").addEventListener("click", () => { t = 0; playing = true; open.clear(); render(); });
// setInterval, not requestAnimationFrame: a hidden preview pane runs no frames.
setInterval(() => {
  if (!playing) return;
  t = Math.min(TOTAL, t + 0.1 * speed);
  if (t >= TOTAL) playing = false;
  render();
}, 100);
render();
</script>
</body>
</html>
