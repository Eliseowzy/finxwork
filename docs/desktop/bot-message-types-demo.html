<style>
/* ---- New for this round: what would go into styles/bots.css ---- */

/* type: attachment. One call is one message: its images together, then its files together, a run's distance apart.
   Every block has a bubble's corners, so a message of any kind sits in a run with the others. */
.batt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;max-width:100%}

/* The images. One keeps its own proportions (at most 480 wide and 420 tall, never enlarged). Several take a bubble's
   full width, up to three in a row; in a row they share one height and keep their proportions, so a chart's axes stay
   in view, and only a shape past 3:4 or 2:1 is cut. Its outer corners are a bubble's, the inner ones a step off square,
   so the group reads as one thing with its pictures still apart. */
.bims{display:flex;flex-direction:column;gap:2px;width:640px;max-width:100%}
.bims.one{width:min(480px,calc(420px*var(--r)),var(--w))}
.bims-r{display:flex;gap:2px}
.bim{position:relative;flex:var(--r) 1 0;min-width:0;aspect-ratio:var(--r);padding:0;border:0;border-radius:var(--r-xs);background:var(--fill);overflow:hidden;cursor:zoom-in;outline-offset:-2px}
.bims.one .bim{flex:1}
.bim img{display:block;width:100%;height:100%;object-fit:cover;object-position:left top}
.bim:hover img{opacity:.88}
.bim::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px var(--sep);pointer-events:none}
.bims-r:first-child .bim:first-child{border-top-left-radius:var(--r-xl)}
.bims-r:first-child .bim:last-child{border-top-right-radius:var(--r-xl)}
.bims-r:last-child .bim:first-child{border-bottom-left-radius:var(--r-xl)}
.bims-r:last-child .bim:last-child{border-bottom-right-radius:var(--r-xl)}

/* The files. A bubble with a row per file; one file is a bubble with one row. The hairline between rows starts where
   the names do. A long name gives way before its extension. */
.bfiles{display:flex;flex-direction:column;width:320px;max-width:100%;border-radius:var(--r-xl);background:var(--win2);box-shadow:inset 0 0 0 .5px var(--sep);overflow:hidden}
.bfiles .tile.file{width:100%;height:52px}
.bfiles .tile.file .tile-open{background:none;box-shadow:none;border-radius:0;outline-offset:-2px}
.bfiles .tile.file .tile-open:hover{background:var(--fill)}
.bfiles .tile+.tile::before{content:"";position:absolute;z-index:1;top:0;left:53px;right:0;height:.5px;background:var(--sep)}
.bfiles .tile.file .tile-name{display:flex;font-size:13.5px;line-height:18px}
.tile-stem{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tile-ext{flex:none}
.bfiles .tile.file .tile-kind{font-size:11.5px;font-weight:400;line-height:15px;letter-spacing:0;font-variant-numeric:tabular-nums}
.bfiles .tile.gone .tile-open{cursor:default}
.bfiles .tile.gone .tile-open:hover{background:none}
.bfiles .tile.gone .tile-badge{filter:grayscale(1);opacity:.5}
.bfiles .tile.gone .tile-name{color:var(--l2)}
.bfiles .tile.gone .tile-kind{color:var(--l3)}

/* The large view with several images: step through them; which one it is, under it. */
.lightbox.many{padding:40px 55px 48px}
.lb-cap{position:absolute;left:0;right:0;bottom:13px;text-align:center;font-size:12.5px;line-height:18px;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums;pointer-events:none}
.lb-go{position:absolute;top:50%;width:34px;height:34px;margin-top:-17px;padding:0;border:0;border-radius:var(--r-sm);background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}
.lb-go:hover{background:rgba(255,255,255,.24)}
.lb-go.prev{left:13px}
.lb-go.next{right:13px}
.lb-go .ic{width:18px;height:18px}

/* type: question. The question, with the answers as rows in the same bubble. Once answered, or once the owner wrote
   something else, the rows fold away and it reads as an ordinary exchange. */
.bbub.bq{min-width:320px;padding:0;overflow:hidden;transition:min-width .22s var(--ease-out)}
.bbub.bq.done{min-width:0}
.bq-q{padding:9px 15px}
.bq-fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s var(--ease-out)}
.bq-fold.shut{grid-template-rows:0fr}
.bq-opts{min-height:0;overflow:hidden;display:flex;flex-direction:column}
.bq-opt{display:block;width:100%;padding:8px 15px;border:0;border-top:.5px solid var(--sep);background:none;font:inherit;font-size:14px;line-height:20px;color:var(--l1);text-align:left;overflow-wrap:anywhere;outline-offset:-2px}

.bq-opt:active{background:var(--fill2)}
@media (prefers-reduced-motion:reduce){.bbub.bq,.bq-fold{transition:none}}

    { who: "bot", think: 1500, time: "09:43", call: { type: "attachment", text: "三季度毛利率 38.6%，比二季度低 2.6 个百分点。主要是原材料涨价，销售费用基本没变。", files: [A, B, PDF, XLSX].map((path) => ({ path })) } },
    QUESTION,
  ];
  const REPLIES = {
    先留给我看: "好，先放着。要发的时候跟我说。",
    发给财务组: "发到财务组的群里了，有人提问我转给你。",
    发给全部门: "发到部门群了，有人提问我转给你。",
  };

  // ---- The explanation panel's content. ----
  const TYPES = {
    text: {
      lead: "一条文字气泡。不写 type 时就是它，已有的调用和历史记录都不变。",
      params: [
        { n: "text", t: "string", r: "必填", d: "消息内容，按 Markdown 显示。" },
        { n: "end_turn", t: "boolean", r: "可选", d: "这一轮说完了，发完就结束。和现在一样。" },
      ],
      rules: ["调用一开始就显示，不等结果（和现在一样）：授权窗口之前的那句话要先让你看到。"],
    },
    attachment: {
      lead: "一条消息发一个或多个文件和图片，可以带文字，文字在上面的气泡里。",
      params: [
        { n: "files", t: "array", r: "必填", d: "要发的文件和图片，至少一个，按顺序显示。" },
        { n: "files[].path", t: "string", r: "必填", d: "这台电脑上的文件。绝对路径，或相对 Bot 自己的文件夹；也认 <code>~/</code> 和 <code>file://</code>。不收网址。" },
        { n: "text", t: "string", r: "可选", d: "和文件一起发的文字。" },
        { n: "end_turn", t: "boolean", r: "可选", d: "同 text。" },
      ],
      rules: [
        "一次调用是一条消息，未读只加一。没写 type 时，带了 files 就是它。",
        "图片（PNG、JPEG、GIF、WebP，不超过 10 MB）排成一组在上，其他文件排成一组在下，各自保持 <code>files</code> 里的顺序。",
        "一张图：原比例，最宽 480、最高 420，不放大。",
        "多张图：占 640 宽，每行 2 或 3 张，2 张的行在前，不会有 1 张单独一行。同一行等高、保持比例；窄于 3:4 或宽于 2:1 的才裁切，留下左上角。点开能左右翻。",
        "文件：一个气泡，一个文件一行；一个文件就是只有一行。第二行是大小。文件名太长时省略，保留扩展名。",
        "有一个路径不对，整条报错给模型，不显示；所以等执行成功才显示。",
        "只存路径，不复制文件。文件被删了，那一行写“文件已不在”；图片也一样，不留空位。",
      ],
    },
    question: {
      lead: "要你拿主意时发：一句问题，答案列得出来时下面是可以点的回答。前因后果先用一条 text 发。",
      params: [
        { n: "text", t: "string", r: "必填", d: "问题，一句话。" },
        { n: "options", t: "array", r: "可选", d: "可以点的回答，不能重名。答案列不出来时不写，就是一个普通的问题。" },
        { n: "options[].label", t: "string", r: "必填", d: "读起来像你会回的话，点了就以它发出。" },
      ],
      rules: [
        "发出后这一轮结束，不用写 <code>end_turn</code>。",
        "点选项就是发一条普通消息，内核不需要等待状态；模型看到的就是你回了这句。",
        "你点了或直接写了别的，选项都收起，读起来就是一问一答。只有最新一条没回的问题能点。",
      ],
    },
  };

  // ---- Page parts. ----
  const log = $("#log");
  const body = $("#body");
  const scroller = $(".cscroll");
  const wrap = $(".mainwrap");
  const zone = $(".cmp-zone");
  const toBottom = $(".tobottom");
  const panel = $(".d-panel");
  const opener = $(".d-open");
  const preview = $("#fb-prev");
  const previewTime = $("#fb-time");

  // ---- Messages, in the same markup as bots/BotPage.tsx and composer/Tile.tsx. ----
  const isImage = (p) => /\.(png|jpe?g|gif|webp)$/i.test(p);
  const baseName = (p) => p.split("/").pop();
  const extOf = (p) => (/\.([A-Za-z0-9]{1,6})$/.exec(p)?.[1] ?? "").toLowerCase();
  const FAMILIES = [
    ["pdf", /^pdf$/],
    ["word", /^(docx?|rtf|odt|pages)$/],
    ["sheet", /^(xlsx?|xlsm|csv|tsv|ods|numbers)$/],
    ["slide", /^(pptx?|odp|key)$/],
    ["image", /^(png|jpe?g|gif|webp|svg|heic|bmp|ico|tiff?)$/],
  ];
  const familyOf = (ext) => FAMILIES.find(([, re]) => re.test(ext))?.[0] ?? "other";
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const fullPath = (p) => `~/.finx/bots/finxbot/files/${p}`;

  let gone = false;
  let open = null; // The question that can still be answered.
  let busy = null;
  let run = 0;
  let scene = "styles";

  function copyButton(text) {
    const b = el("button", "tb", ICON.copy);
    b.setAttribute("aria-label", "拷贝");
    b.title = "拷贝";
    b.onclick = () => {
      navigator.clipboard?.writeText(text).catch(() => {});
      b.innerHTML = ICON.check;
      setTimeout(() => (b.innerHTML = ICON.copy), 1500);
    };
    return b;
  }

  function actions(time, copy) {
    const a = el("div", "msg-act", `<span class="msg-meta"><time>${esc(time)}</time></span>`);
    if (copy) a.append(copyButton(copy));
    return a;
  }

  /** How many images each row of a group holds: two or three, never one alone; the rows of two, larger, come first. */
  function rowsOf(n) {
    const twos = n % 3 === 0 ? 0 : n % 3 === 2 ? 1 : 2;
    const threes = (n - twos * 2) / 3;
    return [...Array(twos).fill(2), ...Array(threes).fill(3)];
  }

  function imageCell(list, i, ratio) {
    const path = list[i];
    const m = MEDIA[path];
    const b = el("button", "bim", `<img src="${m.src}" alt="${esc(baseName(path))}" draggable="false">`);
    b.style.setProperty("--r", ratio);
    b.title = fullPath(path);
    b.setAttribute("aria-label", `看大图：${baseName(path)}`);
    b.onclick = () => lightbox(list, i);
    $("img", b).addEventListener("load", follow);
    return b;
  }

  function imageGroup(list) {
    const group = el("div", "bims");
    if (list.length === 1) {
      const { w, h } = MEDIA[list[0]];
      const r = clamp(w / h, 0.5, 4);
      group.classList.add("one");
      group.style.setProperty("--r", r);
      group.style.setProperty("--w", `${w}px`);
      const row = el("div", "bims-r");
      row.append(imageCell(list, 0, r));
      group.append(row);
      return group;
    }
    let i = 0;
    for (const count of rowsOf(list.length)) {
      const row = el("div", "bims-r");
      for (let k = 0; k < count; k++, i++) {
        const { w, h } = MEDIA[list[i]];
        row.append(imageCell(list, i, clamp(w / h, 0.75, 2)));
      }
      group.append(row);
    }
    return group;
  }

  function fileRow(path, isGone) {
    const name = baseName(path);
    const ext = extOf(path);
    const dot = name.lastIndexOf(".");
    const t = el("div", `tile doc file ${isGone ? "gone" : ""}`);
    t.title = isGone ? "" : fullPath(path);
    const b = el(
      "button",
      "tile-open",
      `<span class="tile-badge f-${familyOf(ext)}" aria-hidden="true">${ICON.file}<b>${esc(ext.slice(0, 4) || "file")}</b></span>` +
        `<span class="tile-text"><span class="tile-name"><span class="tile-stem">${esc(name.slice(0, dot))}</span><span class="tile-ext">${esc(name.slice(dot))}</span></span>` +
        `<span class="tile-kind">${isGone ? "文件已不在" : esc(SIZES[path] ?? ext.toUpperCase())}</span></span>`,
    );
    b.setAttribute("aria-label", isGone ? `${name}，文件已不在` : `打开 ${name}`);
    b.onclick = () => {
      if (isGone) return;
      toast(/^(docx?|xlsx?|pptx?)$/.test(ext) ? `真实应用里：用系统应用打开 ${name}` : `真实应用里：在文件面板打开 ${name}`);
    };
    t.append(b);
    return t;
  }

  /** Which of a message's files the demo's "deleted" state takes: a lone one, or the second. */
  function deleted(files) {
    if (!gone) return new Set();
    return new Set(files.length === 1 ? files : [files[1]]);
  }

  function attachmentContent(m) {
    const files = m.call.files.map((f) => f.path);
    const missing = deleted(files);
    const images = files.filter((p) => isImage(p) && !missing.has(p));
    const rows = files.filter((p) => !images.includes(p));
    const col = el("div", "batt");
    if (m.call.text) col.append(textBubble(m.call.text));
    if (images.length) col.append(imageGroup(images));
    if (rows.length) {
      const group = el("div", "bfiles");
      for (const p of rows) group.append(fileRow(p, missing.has(p)));
      col.append(group);
    }
    return col;
  }

  function shell(m, content, copy) {
    const row = el("div", `bm ${m.fresh ? "add-anim" : ""}`);
    const b = el("div", "bm-b");
    const line = el("div", "bline");
    line.append(content, actions(m.time, copy));
    b.append(line);
    row.append(b);
    return row;
  }

  function textBubble(text) {
    return el("div", "bbub", `<div class="md sel-text"><p>${esc(text)}</p></div>`);
  }

  function questionBubble(m) {
    const bub = el("div", "bbub bq", `<div class="bq-q md sel-text"><p>${esc(m.call.text)}</p></div>`);
    const fold = el("div", "bq-fold");
    const opts = el("div", "bq-opts");
    for (const o of m.call.options) {
      const b = el("button", "bq-opt");
      b.textContent = o.label;
      b.onclick = () => send(o.label, true);
      opts.append(b);
    }
    fold.append(opts);
    bub.append(fold);
    open = { bub, fold };
    return bub;
  }

  function closeQuestion() {
    if (!open) return;
    const { bub, fold } = open;
    open = null;
    for (const b of fold.querySelectorAll("button")) b.disabled = true;
    fold.classList.add("shut");
    bub.classList.add("done");
    setTimeout(() => fold.remove(), 260);
  }

  function render(m) {
    if (m.caption) return el("div", "tdiv", esc(m.caption));
    if (m.who === "user") {
      const row = el("div", `um ${m.fresh ? "add-anim" : ""}`, `<div class="bub sel-text">${esc(m.text)}</div>`);
      row.append(actions(m.time, m.text));
      return row;
    }
    const type = m.call.type ?? "text";
    if (type === "attachment") return shell(m, attachmentContent(m));
    if (type === "question") {
      closeQuestion();
      return shell(m, questionBubble(m), m.call.text);
    }
    return shell(m, textBubble(m.call.text), m.call.text);
  }

  /** The list's second line, by the strings the list already has for a last message. */
  function setPreview(m) {
    if (m.caption) return;
    const type = m.who === "bot" ? (m.call.type ?? "text") : "user";
    if (type === "user") preview.textContent = m.text;
    else if (type === "attachment") {
      const first = m.call.files[0].path;
      preview.textContent = m.call.text || (isImage(first) ? "[图片]" : `[文件] ${baseName(first)}`);
    } else preview.textContent = m.call.text;
    previewTime.textContent = m.time;
  }

  function add(m, fresh) {
    m.fresh = fresh;
    const row = render(m);
    row._m = m;
    log.append(row);
    setPreview(m);
    follow();
    return row;
  }

  function showBusy() {
    hideBusy();
    busy = el(
      "div",
      "bm working add-anim",
      `<div class="bm-b"><div class="bline"><div class="bbub wbub"><div class="wb-h" title="正在输入…"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div></div></div></div>`,
    );
    log.append(busy);
    follow();
  }
  function hideBusy() {
    busy?.remove();
    busy = null;
  }

  // ---- Following the end, and the composer's height. ----
  let atEnd = true;
  function follow() {
    if (atEnd) scroller.scrollTop = scroller.scrollHeight;
  }
  scroller.addEventListener("scroll", () => {
    const below = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight;
    atEnd = below < 80;
    toBottom.classList.toggle("on", below > 240);
    toBottom.tabIndex = below > 240 ? 0 : -1;
    toBottom.setAttribute("aria-hidden", String(below <= 240));
  });
  toBottom.onclick = () => {
    atEnd = true;
    scroller.scrollTo({ top: scroller.scrollHeight, behavior: "smooth" });
  };
  function dock() {
    const h = zone.offsetHeight;
    body.style.paddingBottom = `${h + 40}px`;
    toBottom.style.setProperty("--dock", `${h}px`);
    follow();
  }
  new ResizeObserver(dock).observe(zone);

  // ---- Sending: a tapped answer and a typed line are the same ordinary message. ----
  function send(text, picked) {
    closeQuestion();
    const me = run;
    atEnd = true;
    add({ who: "user", text, picked, time: "刚刚" }, true);
    showBusy();
    setTimeout(() => {
      if (me !== run) return;
      hideBusy();
      add({ who: "bot", call: { text: REPLIES[text] ?? "好，按你说的来。", end_turn: true }, time: "刚刚" }, true);
    }, 1100);
  }

  const input = $(".cmp-in");
  const placeholder = $(".cmp-ph");
  const sendButton = $(".send");
  const typed = () => input.innerText.trim();
  function syncComposer() {
    placeholder.style.display = typed() ? "none" : "";
    sendButton.disabled = !typed();
  }
  function submit() {
    const text = typed();
    if (!text) return;
    input.innerHTML = '<p class="cmp-p" dir="auto"><br></p>';
    syncComposer();
    send(text, false);
  }
  input.addEventListener("input", syncComposer);
  input.addEventListener("keydown", (e) => {
    if (e.isComposing) return;
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });
  sendButton.onclick = submit;

  // ---- The large view: one image, or all of a message's to step through. ----
  function lightbox(list, start) {
    let i = start;
    const many = list.length > 1;
    const box = el("div", `lightbox ${many ? "many" : ""}`);
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-modal", "true");
    const img = el("img");
    img.alt = "";
    const cap = el("div", "lb-cap");
    const show = () => {
      const name = baseName(list[i]);
      img.src = MEDIA[list[i]].src;
      img.alt = name;
      cap.textContent = many ? `${i + 1} / ${list.length}  ·  ${name}` : name;
    };
    const step = (d) => {
      i = (i + d + list.length) % list.length;
      show();
    };
    const close = () => {
      box.remove();
      document.removeEventListener("keydown", onKey);
    };
    const onKey = (e) => {
      if (e.key === "Escape") close();
      else if (many && e.key === "ArrowLeft") step(-1);
      else if (many && e.key === "ArrowRight") step(1);
    };
    box.onclick = close;
    box.append(img, cap);
    if (many) {
      for (const [cls, label, icon, d] of [["prev", "上一张", ICON.left, -1], ["next", "下一张", ICON.right, 1]]) {
        const b = el("button", `lb-go ${cls}`, icon);
        b.setAttribute("aria-label", label);
        b.title = label;
        b.onclick = (e) => {
          e.stopPropagation();
          step(d);
        };
        box.append(b);
      }
    }
    document.addEventListener("keydown", onKey);
    document.body.append(box);
    show();
  }

  const toastEl = el("div", "d-toast");
  document.body.append(toastEl);
  let toastTimer = 0;
  function toast(text) {
    toastEl.textContent = text;
    const r = $(".content").getBoundingClientRect();
    toastEl.style.left = `${r.left + 21}px`;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2200);
  }

  // ---- The explanation panel. ----
  const leadEl = $("#d-lead");
  const paramsEl = $("#d-params");
  const rulesEl = $("#d-rules");
  const codeEl = $("#d-code");
  const codeLabel = $("#d-code-label");
  const segButtons = [...document.querySelectorAll(".d-seg.types button")];
  let shownType = null;

  function showType(type) {
    if (type === shownType) return;
    shownType = type;
    for (const b of segButtons) {
      const on = b.dataset.type === type;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", String(on));
    }
    const t = TYPES[type];
    leadEl.textContent = t.lead;
    paramsEl.innerHTML = t.params.map((p) => `<div class="d-p"><dt><code>${p.n}</code><span>${p.t} · ${p.r}</span></dt><dd>${p.d}</dd></div>`).join("");
    rulesEl.innerHTML = t.rules.map((r) => `<li>${r}</li>`).join("");
  }
  function showCode(label, value) {
    codeLabel.textContent = label;
    // An option, a file or an input block on one line: the shape reads better than the indentation.
    const text = JSON.stringify(value, null, 2).replace(/\{\s+("[^"]+": "[^"]*"(?:,\s+"[^"]+": "[^"]*")*)\s+\}/g, (_, inner) => `{ ${inner.replace(/,\s+/g, ", ")} }`);
    codeEl.innerHTML = esc(text).replace(/"([^"\n]+)":/g, '<i>"$1":</i>');
  }
  function showMessage(m) {
    if (m.who === "bot") {
      showType(m.call.type ?? "text");
      showCode("这条消息的调用：send_to_user", m.call);
    } else {
      showCode(m.picked ? "点选项发出的：一条普通消息，不是 send_to_user" : "你发的：一条普通消息，不是 send_to_user", { type: "prompt", input: [{ type: "text", text: m.text }] });
    }
  }
  log.addEventListener("mouseover", (e) => {
    const row = e.target.closest?.(".bm,.um");
    if (row?._m) showMessage(row._m);
  });
  for (const b of segButtons) {
    b.onclick = () => {
      const type = b.dataset.type;
      showMessage([...STYLES, ...CONVERSATION].find((m) => m.who === "bot" && (m.call.type ?? "text") === type));
    };
  }

  // ---- Scenes and the panel's buttons. ----
  const sceneButtons = [...document.querySelectorAll(".d-seg.scenes button")];
  const replayButton = $("#d-replay");
  function reset() {
    log.innerHTML = scene === "chat" ? '<div class="tdiv">今天 09:41</div>' : "";
    open = null;
    busy = null;
  }
  function openScene(name) {
    run++;
    scene = name;
    for (const b of sceneButtons) {
      const on = b.dataset.scene === name;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", String(on));
    }
    replayButton.style.display = name === "chat" ? "" : "none";
    reset();
    atEnd = name === "chat";
    const list = name === "chat" ? CONVERSATION : STYLES;
    for (const m of list) add(m, false);
    if (name === "chat") {
      scroller.scrollTop = scroller.scrollHeight;
      showMessage(CONVERSATION.at(-1));
    } else {
      scroller.scrollTop = 0;
      showMessage(STYLES[1]);
    }
  }
  for (const b of sceneButtons) b.onclick = () => openScene(b.dataset.scene);

  replayButton.onclick = async () => {
    const me = ++run;
    reset();
    atEnd = true;
    for (const m of CONVERSATION) {
      if (m.think) {
        showBusy();
        await wait(m.think);
        if (me !== run) return;
        hideBusy();
      }
      add(m, true);
      await wait(380);
      if (me !== run) return;
    }
    showMessage(CONVERSATION.at(-1));
  };

  const goneButton = $("#d-gone");
  goneButton.onclick = () => {
    gone = !gone;
    goneButton.textContent = gone ? "恢复文件" : "模拟文件被删";
    for (const row of log.querySelectorAll(".bm")) {
      const m = row._m;
      if (!m || m.call?.type !== "attachment") continue;
      $(".bline", row).firstElementChild.replaceWith(attachmentContent(m));
    }
  };

  const themeButton = $("#d-theme");
  const root = document.documentElement;
  const syncTheme = () => (themeButton.textContent = root.dataset.theme === "dark" ? "浅色" : "深色");
  themeButton.onclick = () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    syncTheme();
  };
  syncTheme();

  // ---- The window: the sidebar goes when there is no room, or when asked; the panel can be put away. ----
  let sideChoice = null;
  const showSide = $('.ctool .tb[aria-label="显示边栏"]');
  const lightsGap = showSide.previousElementSibling;
  function layout() {
    const room = innerWidth - (panel.classList.contains("off") ? 0 : 372);
    const noside = sideChoice === null ? room < 900 : !sideChoice;
    wrap.classList.toggle("noside", noside);
    wrap.classList.toggle("narrow", room - (noside ? 0 : 272) < 640);
    showSide.style.display = noside ? "" : "none";
    lightsGap.style.display = noside ? "" : "none";
    follow();
  }
  showSide.onclick = () => ((sideChoice = true), layout());
  $('.side-top .tb[aria-label="隐藏边栏"]').onclick = () => ((sideChoice = false), layout());
  $("#d-close").onclick = () => {
    panel.classList.add("off");
    opener.classList.remove("off");
    layout();
  };
  opener.onclick = () => {
    panel.classList.remove("off");
    opener.classList.add("off");
    layout();
  };
  addEventListener("resize", layout);

  // ---- Open on the styles of this round. ----
  layout();
  dock();
  openScene(location.hash === "#chat" ? "chat" : "styles");
})();

</script>
