<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自定义 · 原型</title>
<style>
/* Tokens: copied from apps/desktop/src/renderer/src/styles/tokens.css. */
:root{
  --accent:#1f6bff;--accent-fg:#1a5ce6;--ok:#17924f;--warn:#d0700a;--danger:#d7333f;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,"JetBrains Mono",Consolas,monospace;
  --fs:13px;--top:44px;--lights:78px;
  --sp-1:8px;--sp-2:13px;--sp-3:21px;--sp-4:34px;--sp-5:55px;
  --r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:10px;--r-xl:12px;
  --win:#ffffff;--win2:#f4f4f7;--win3:#ebebf0;--side:#f4f4f7;
  --l1:rgba(0,0,0,.86);--l2:rgba(0,0,0,.54);--l3:rgba(0,0,0,.32);--l4:rgba(0,0,0,.14);
  --sep:rgba(0,0,0,.075);--fill:rgba(0,0,0,.045);--fill2:rgba(0,0,0,.075);--fill3:rgba(0,0,0,.12);
  --side-sel:rgba(0,0,0,.075);--accent-t:var(--accent-fg);--accent-bg:rgba(31,107,255,.10);
  --green:var(--ok);--green-bg:rgba(23,146,79,.11);--orange:var(--warn);--orange-bg:rgba(230,126,10,.12);--red:var(--danger);--red-bg:rgba(215,51,63,.10);
  --violet:#8a5cf5;--violet-bg:rgba(138,92,245,.11);--teal:#0e9f9a;--teal-bg:rgba(14,159,154,.11);
  --btn:#ffffff;--btn-sh:0 0 0 .5px rgba(0,0,0,.14),0 1px 1.5px rgba(0,0,0,.08);
  --seg-on:#ffffff;--field:#ffffff;--field-bd:rgba(0,0,0,.16);
  --menu:rgba(248,248,250,.80);--menu-solid:#f8f8fa;--menu-bd:rgba(0,0,0,.10);
  --tb-fg:rgba(0,0,0,.72);--bar-tint:rgba(255,255,255,.72);--code:#f6f7fa;--scrim:rgba(0,0,0,.18);
  --card:#f6f6f9;--card-h:#efeff3;--pill:#ffffff;--pill-bd:rgba(0,0,0,.12);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --accent-fg:#7ab0ff;--ok:#3fcf86;--warn:#ffab3d;--danger:#ff6670;
  --win:#1e1e21;--win2:#29292d;--win3:#323237;--side:#25252a;
  --l1:rgba(255,255,255,.88);--l2:rgba(255,255,255,.55);--l3:rgba(255,255,255,.32);--l4:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.09);--fill:rgba(255,255,255,.05);--fill2:rgba(255,255,255,.085);--fill3:rgba(255,255,255,.14);
  --side-sel:rgba(255,255,255,.1);--accent-bg:rgba(46,128,255,.16);
  --green-bg:rgba(63,207,134,.14);--orange-bg:rgba(255,171,61,.14);--red-bg:rgba(255,102,112,.13);
  --violet:#a585ff;--violet-bg:rgba(165,133,255,.15);--teal:#3cc8c0;--teal-bg:rgba(60,200,192,.14);
  --btn:rgba(255,255,255,.12);--btn-sh:0 0 0 .5px rgba(255,255,255,.08);
  --seg-on:rgba(255,255,255,.22);--field:rgba(255,255,255,.06);--field-bd:rgba(255,255,255,.16);
  --menu:rgba(44,44,48,.80);--menu-solid:#2c2c30;--menu-bd:rgba(255,255,255,.12);
  --tb-fg:rgba(255,255,255,.82);--bar-tint:rgba(30,30,33,.62);--code:#18181b;--scrim:rgba(0,0,0,.35);
  --card:#26262a;--card-h:#2c2c31;--pill:#28282c;--pill-bd:rgba(255,255,255,.09);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--win);color:var(--l1);font-family:var(--font);font-size:var(--fs);line-height:1.38;-webkit-font-smoothing:antialiased;user-select:none;cursor:default;overflow:hidden}
button{font:inherit;color:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic.sm{width:13px;height:13px}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
.mini-spin{width:13px;height:13px;border-radius:50%;border:1.6px solid var(--fill3);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}

/* controls (app.css) */
.btn{height:26px;padding:0 13px;border-radius:var(--r-sm);border:0;background:var(--btn);box-shadow:var(--btn-sh);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--l1);flex:none}
.btn:hover{filter:brightness(.98)}
.btn:active{filter:brightness(.93)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(40,60,200,.3)}
.btn.danger{color:var(--red)}
/* The page's one main action: solid in the text colour, quieter than the accent on a dark window. */
.btn.solid{background:var(--l1);color:var(--win);box-shadow:none}
.btn.lg{height:30px;padding:0 15px}
.btn .ic{width:14px;height:14px}
.btn:disabled{opacity:.42;pointer-events:none}
.link{border:0;background:none;padding:0;color:var(--accent-t);font-size:inherit;cursor:pointer}
.link:hover{text-decoration:underline}
.link.danger{color:var(--red)}
.sw{width:34px;height:20px;border-radius:999px;border:0;background:var(--fill3);position:relative;flex:none;transition:background .2s;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.2,0,0,1)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(14px)}
.seg{display:inline-flex;background:var(--fill2);border-radius:var(--r-sm);padding:2px;gap:1px;flex:none}
.seg button{border:0;background:transparent;height:24px;padding:0 13px;border-radius:var(--r-xs);font-size:12.5px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.seg button.on{background:var(--seg-on);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg.sm button{height:22px;padding:0 11px;font-size:12px}
.field{height:26px;border-radius:var(--r-sm);border:0;box-shadow:inset 0 0 0 1px var(--field-bd);background:var(--field);padding:0 9px;font-size:13px;color:var(--l1);outline:none;width:100%}
.field:focus{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--accent-bg)}
.field.mono{font-family:var(--mono);font-size:12px}
.kbd{font-size:11.5px;color:var(--l3);letter-spacing:.04em}
.badge{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:var(--r-xs);background:var(--fill2);font-size:11px;color:var(--l2);white-space:nowrap;flex:none}
.badge.ok{background:var(--green-bg);color:var(--green)}
.badge.warn{background:var(--orange-bg);color:var(--orange)}
.badge.bad{background:var(--red-bg);color:var(--red)}
.badge.acc{background:var(--accent-bg);color:var(--accent-t)}
.badge .ic{width:11px;height:11px;stroke-width:2}
.dotc{width:6px;height:6px;border-radius:50%;background:var(--l3);flex:none;display:inline-block}
.dotc.ok{background:var(--green)}.dotc.bad{background:var(--red)}.dotc.warn{background:var(--orange)}
.mono{font-family:var(--mono)}

/* window */
.mainwrap{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%}
.side{background:var(--side);border-right:.5px solid var(--sep);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-top{height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 var(--lights);flex:none;position:relative}
.lights{position:absolute;left:20px;top:16px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.tb{height:28px;min-width:28px;border:0;background:transparent;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--tb-fg);gap:5px;padding:0 6px}
.tb .ic{stroke-width:1.45}
.tb:hover{background:var(--fill2);color:var(--l1)}
.side-nav{padding:0 8px 6px;display:flex;flex-direction:column;gap:2px;flex:none}
.nav-i{display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border-radius:var(--r-md);font-size:14px;border:0;background:none;width:100%;text-align:left}
.nav-i .ic{width:18px;height:18px;color:var(--l1)}
.nav-i .kbd{margin-left:auto;opacity:0;transition:opacity .12s}
.nav-i:hover .kbd{opacity:1}
.nav-i:hover{background:var(--fill)}
.nav-i.sel{background:var(--side-sel)}
.side-list{flex:1;overflow-y:auto;min-height:0;padding:0 8px 8px}
.grp-h{font-size:12px;color:var(--l2);padding:20px 10px 6px;display:flex;align-items:center;gap:6px}
.grp-h .ic{width:16px;height:16px}
.srow{display:flex;flex-direction:column;padding:7px 10px;border-radius:var(--r-md);font-size:14px;margin-bottom:2px}
.srow:hover{background:var(--fill)}
.srow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow small{font-size:11px;color:var(--l2);margin-top:2px;display:flex;gap:4px;align-items:center}
.srow small .ic{width:11px;height:11px}
.side-foot{flex:none;height:52px;display:flex;align-items:center;gap:9px;margin:0 6px 6px;padding:0 10px 0 8px;border-radius:var(--r-md);border-top:.5px solid var(--sep)}
.av{width:24px;height:24px;border-radius:50%;background:var(--fill2);color:var(--l2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.side-foot b{font-weight:500}
.side-foot span{font-size:11.5px;color:var(--l2);display:block}

/* The page, as the session page draws its parts: the title in the 44 px band (.ctool, .ctitle h2),
   a hairline, then a column 798 wide (.dbody) on the spacing scale 8 / 13 / 21 / 34 / 55. */
.content{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--win)}
.ctop{height:var(--top);flex:none}
.ctool{height:var(--top);flex:none;display:flex;align-items:center;gap:10px;padding:0 14px 0 22px;border-bottom:.5px solid var(--sep)}
.ctool h2{flex:1;margin:0;font-size:14px;font-weight:500}
.cscroll{flex:1;overflow-y:auto;min-height:0}
.dbody{max-width:1120px;margin:0 auto;padding:0 var(--sp-4) var(--sp-5)}
/* The page's name, large, with room above it: this is a place of its own, not a conversation. */
.ptitle{margin:0;font-size:28px;font-weight:650;letter-spacing:-.6px;line-height:1.25}
/* What kind, a rule, whose; Add at the end. All 30 high. It stays at the top while the list scrolls. */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2);padding:var(--sp-1) 0;background:var(--win)}
.bar.stuck{box-shadow:0 .5px 0 var(--sep)}
.bar .grow{flex:1}
.tabs{display:flex;gap:2px}
.tab{height:30px;padding:0 13px;border:0;border-radius:var(--r-sm);background:none;font-size:14px;color:var(--l1)}
.tab:hover{background:var(--fill)}
.tab.on{background:var(--fill2)}
.vsep{width:1px;height:18px;background:var(--sep);flex:none}
.bar .seg button{height:26px;padding:0 13px;font-size:14px}
.bar .seg button.on{color:var(--l1)}
.addbtn{height:30px;padding:0 12px 0 11px;font-size:13.5px}
.addbtn .chev{width:12px;height:12px;opacity:.6;margin-right:-3px}

.sect{animation:fadein .3s cubic-bezier(.2,0,0,1)}
.sect+.sect{margin-top:var(--sp-3)}
.bar+.sect{margin-top:var(--sp-2)}
/* A group's heading: the settings' .fhead, with its count as the sidebar's. */
.fhead{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--l2);margin:0 0 var(--sp-1)}
.fhead .n{color:var(--l3);font-weight:500;font-variant-numeric:tabular-nums}
.anote{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--l2);background:var(--fill);border-radius:var(--r-md);padding:8px 13px;margin-bottom:var(--sp-1)}
.anote .ic{color:var(--orange)}
.anote .link{margin-left:auto;flex:none}
.anote code{font-family:var(--mono);font-size:11.5px;color:var(--l1)}

.tile{width:32px;height:32px;border-radius:var(--r-md);background:var(--fill2);color:var(--l2);display:flex;align-items:center;justify-content:center;flex:none;font-weight:650;font-size:12.5px;letter-spacing:-.02em}
.tile .ic{width:17px;height:17px;stroke-width:1.35}

/* Mine: one to a row, each its own rounded panel (not a table): the mark, the name over one line
   of what it does, then on the right its state, its switch and its menu. */
.rows{display:flex;flex-direction:column;gap:var(--sp-1)}
.row{display:flex;align-items:center;gap:var(--sp-2);min-height:58px;padding:9px 8px 9px 13px;border-radius:var(--r-lg);background:var(--win2);transition:background .15s}
.row:hover{background:var(--win3)}
.row.off .tile,.row.off .rt{opacity:.5}
.rt{flex:1;min-width:0}
.rn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;line-height:18px;min-width:0}
.rn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd{font-size:12px;color:var(--l2);margin-top:2px;line-height:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd.mono{font-family:var(--mono);font-size:11.5px}
.ra{display:flex;align-items:center;gap:8px;flex:none;margin-left:var(--sp-1)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--l2);white-space:nowrap;font-variant-numeric:tabular-nums}
.st.ok{color:var(--green)}.st.bad{color:var(--red)}
.st .link{font-size:11.5px}
.more{width:26px;height:26px;border-radius:var(--r-sm);border:0;background:none;color:var(--l2);display:flex;align-items:center;justify-content:center;padding:0}
.more:hover,.more.open{background:var(--fill2);color:var(--l1)}

/* Discover: two to a row, the mark beside the name, what it does in two lines, where it comes from. */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-1)}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{display:grid;grid-template-columns:32px minmax(0,1fr) auto;column-gap:var(--sp-2);padding:var(--sp-2);border-radius:var(--r-lg);background:var(--win2);transition:background .15s}
.card:hover{background:var(--win3)}
.card .tile{grid-row:1/4}
.ct{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;font-weight:500;line-height:18px;margin-top:-1px}
.ct .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{grid-column:2/4;font-size:12px;color:var(--l2);line-height:17px;margin-top:3px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:34px}
.cm{grid-column:2/4;font-size:11px;color:var(--l3);margin-top:6px}
.ca{grid-column:3;grid-row:1;display:flex;align-items:center;margin:-3px 0 -3px 8px}
/* Add: a round + that turns into a spinner, then a check. */
.inst{width:26px;height:26px;border-radius:50%;border:0;padding:0;background:var(--btn);box-shadow:var(--btn-sh);display:flex;align-items:center;justify-content:center;color:var(--l1);transition:background .15s,color .15s}
.inst:hover{background:var(--accent);color:#fff;box-shadow:none}
.inst .ic{width:14px;height:14px;stroke-width:1.6}
.inst.busy{pointer-events:none;background:var(--fill);box-shadow:none}
.inst.done{background:var(--fill);color:var(--l2);box-shadow:none;pointer-events:none}
.inst.done .ic{stroke-width:2}
.inst-wait{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--l2);height:26px}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--sp-5) var(--sp-3);border-radius:var(--r-lg);background:var(--win2);color:var(--l2);gap:6px;font-size:12.5px}
.empty .ic{width:26px;height:26px;color:var(--l3);stroke-width:1.1;margin-bottom:4px}
.empty b{color:var(--l1);font-weight:500;font-size:13px}
.empty .acts{display:flex;gap:8px;margin-top:var(--sp-1)}

/* menus */
.vmenu{position:fixed;z-index:30;min-width:176px;background:var(--menu-solid);border-radius:var(--r-lg);box-shadow:0 0 0 .5px var(--menu-bd),0 12px 32px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.08);padding:4px;animation:menudown .14s cubic-bezier(.2,0,0,1)}
@keyframes menudown{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.vmenu .mh{font-size:11.5px;color:var(--l3);padding:6px 9px 3px}
.vmenu .mi{display:flex;align-items:center;gap:9px;width:100%;min-height:30px;padding:0 9px;border:0;border-radius:var(--r-sm);background:none;text-align:left;white-space:nowrap}
.vmenu .mi:hover{background:var(--fill2)}
.vmenu .mi>.ic{color:var(--l2)}
.vmenu .mi.danger,.vmenu .mi.danger>.ic{color:var(--red)}
.vmenu .mi.two{align-items:flex-start;padding:7px 10px 7px 9px;gap:10px}
.vmenu .mi.two>.ic{margin-top:1px}
.vmenu .mi.two b{display:block;font-weight:400}
.vmenu .mi.two small{display:block;font-size:11.5px;color:var(--l2);margin-top:1px}
.vmenu .msep{height:.5px;background:var(--sep);margin:5px 9px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;animation:fade .2s}
.sheet{width:560px;max-width:calc(100vw - 48px);max-height:calc(100vh - 80px);overflow-y:auto;background:var(--win);border-radius:var(--r-xl);box-shadow:0 0 0 .5px var(--menu-bd),0 20px 60px rgba(0,0,0,.35);animation:sheet .22s cubic-bezier(.2,0,0,1)}
@keyframes sheet{from{opacity:0;transform:scale(.97)}}
.sheet-in{padding:22px 24px 18px}
.sheet h3{margin:0 0 4px;font-size:15px;font-weight:600}
.sheet .sub{margin:0 0 16px;color:var(--l2);font-size:12.5px;line-height:1.55}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;align-items:center}
.sheet-foot .left{margin-right:auto;display:flex;gap:14px;align-items:center}
.dlabel{font-size:12px;color:var(--l2);margin:var(--sp-3) 0 var(--sp-1)}
.fgroup{background:var(--win2);border-radius:var(--r-lg)}
.frow{display:flex;align-items:center;gap:12px;padding:8px 13px;min-height:38px;border-top:.5px solid var(--sep)}
.frow:first-child{border-top:0}
.frow>.fl{flex:none;width:72px;color:var(--l2);font-size:12.5px}
.frow>.fv{flex:1;min-width:0;display:flex;align-items:center;gap:8px;color:var(--l1)}
.frow>.fv.mono{font-size:12px}
.frow .ic{color:var(--l2)}
.frow .fdesc{font-size:12px;color:var(--l2);margin-top:2px}
.frow.tool{padding:9px 13px}
.frow.tool .mono{font-size:12.5px}
.files .frow{min-height:34px;padding:6px 13px;gap:9px}
.files .frow span.sz{margin-left:auto;color:var(--l3);font-size:11.5px;font-variant-numeric:tabular-nums}
.errbox{font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--red);background:var(--red-bg);border-radius:var(--r-md);padding:9px 13px;white-space:pre-wrap}
.field.bad{box-shadow:inset 0 0 0 1px var(--red),0 0 0 3px var(--red-bg)}

/* A card's page: back to the list, the item (mark, name, what it is, its actions), tabs on a hairline,
   then the body: what it does on the left, the facts about it in a panel on the right. */
.dback{display:inline-flex;align-items:center;gap:6px;height:28px;margin:2px 0 0 -6px;padding:0 9px 0 6px;border:0;border-radius:var(--r-sm);background:none;font-size:13.5px;color:var(--l2)}
.dback:hover{color:var(--l1);background:var(--fill)}
.dback .ic{width:15px;height:15px}
.dhero{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2)}
.tile.xl{width:52px;height:52px;border-radius:var(--r-lg);font-size:17px}
.tile.xl .ic{width:26px;height:26px;stroke-width:1.25}
.dhero .dt{flex:1;min-width:0}
.dhero h1{margin:0;display:flex;align-items:center;gap:8px;font-size:20px;font-weight:650;letter-spacing:-.3px;line-height:1.3}

.code{margin:0;font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--l1);background:var(--code);border-radius:var(--r-md);box-shadow:inset 0 0 0 .5px var(--sep);padding:14px 16px;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.code .fm{color:var(--l2)}

.form{display:flex;flex-direction:column;gap:14px}
.fi{display:flex;flex-direction:column;gap:6px}
.fi>label{font-size:12px;color:var(--l2);display:flex;align-items:center;gap:6px}
.fi>label em{font-style:normal;color:var(--l3)}
.fi>.seg{align-self:flex-start}
.fi .note{font-size:11.5px;color:var(--l3)}
.kv{display:grid;grid-template-columns:1fr 1.6fr 24px;gap:6px;align-items:center}
.kv .x{width:24px;height:24px;border:0;background:none;border-radius:var(--r-sm);color:var(--l3);display:flex;align-items:center;justify-content:center}
.kv .x:hover{background:var(--fill2);color:var(--l1)}
.addrow{align-self:flex-start;font-size:12.5px;display:flex;gap:4px;align-items:center}
.addrow .ic{width:12px;height:12px}
.drop{border:1.5px dashed var(--fill3);border-radius:var(--r-lg);padding:34px 21px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--l2);text-align:center;transition:background .15s,border-color .15s}
.drop.over{border-color:var(--accent);background:var(--accent-bg)}

.st.warn{color:var(--orange)}

.callout{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--l2);background:var(--fill);border-radius:var(--r-md);padding:9px 13px;line-height:1.55}

.target .ic{color:var(--l3)}

.pill .send{border:0;padding:0;cursor:default}

const mineSkill = (id) => S.skills.find((s) => s.id === id);
function addPersonal(skill) {
  const i = S.skills.findIndex((s) => s.layer !== 'user');
  if (i < 0) S.skills.push(skill); else S.skills.splice(i, 0, skill);
}
const mineConn = (id) => S.connectors.find((c) => c.id === id);
const catSkill = (id) => S.skillCatalog.find((s) => s.id === id);
const catConn = (id) => S.connectorCatalog.find((c) => c.id === id);
const skillTile = (s, size = '') => `<div class="tile ${size}">${ic('skill')}</div>`;
const connTile = (c, size = '') => `<div class="tile ${size}">${c.icon ? ic(c.icon) : esc(c.mono)}</div>`;
// Only skills in ~/.finx/skills can be removed from the page (DD-35, DD-36, DD-46).
const removable = (s) => s.layer === 'user' && !s.from;
const skillScope = (s) => ({ system: '内置', user: '个人', project: `随仓库共享 · ${PROJECT}` }[s.layer]);
const skillSource = (s) => s.layer === 'system' ? 'finx 内置' : s.from ? `与 ${s.from} 共用` : s.layer === 'project' ? '仓库'
  : ({ catalog: 'finx 精选', upload: '上传', chat: '在对话中创建' }[s.source] || '本地');
// Only connectors in the user's own files are editable (DD-46).
const editable = (c) => c.layer === 'user' || c.layer === 'user_project';
const connScope = (layer) => ({ user: '所有项目', user_project: `仅 ${PROJECT}`, project: `随仓库共享 · ${PROJECT}` }[layer]);
const authText = (c) => c.auth === 'credential' ? '令牌 · 已保存在钥匙串' : c.auth === 'oauth' ? (c.authState === 'logged_in' ? 'OAuth · 已登录' : 'OAuth · 未登录') : '无';
const srcText = (c) => c.status.source === 'session' ? `${c.status.sessions} 个打开的会话正在使用` : c.status.ago ? `${c.status.ago}检测` : '还没有连接过';

// The status a row shows (design §4.3): an open conversation's connection first, then the cache.
function connStatus(c) {
  if (!c.on) return { label: c.layer === 'project' ? '只对你关闭' : '已停用', off: true };
  const s = c.status;
  switch (s.state) {
    case 'checking': return { label: '正在检测…', spin: true };
    case 'authorizing': return { label: '等待授权…', spin: true };
    case 'ok': return { cls: 'ok', label: `可用 · ${s.tools} 个工具`, title: srcText(c) };
    case 'failed': return { cls: 'bad', label: '连接失败', act: ['重试', 'check'] };
    case 'needs_login': return { cls: 'warn', label: '需要登录', act: ['登录', 'login'] };
    default: return { label: '未检测', act: ['检测', 'check'] };
  }
}
function statusHtml(c, withAction = true) {
  const st = connStatus(c);
  if (st.off) return `<span class="st">${st.label}</span>`;
  const lead = st.spin ? '<span class="mini-spin" style="width:10px;height:10px"></span>' : `<i class="dotc ${st.cls || ''}"></i>`;
  const act = withAction && st.act ? ` · <button class="link" data-act="${st.act[1]}" data-id="${c.id}">${st.act[0]}</button>` : '';
  return `<span class="st ${st.cls || ''}" title="${esc(st.title || '')}">${lead}${st.label}${act}</span>`;
}

/* ---------- render ---------- */
const content = document.getElementById('content');
function render() {
  document.querySelectorAll('[data-nav]').forEach((b) => b.classList.toggle('sel', b.dataset.nav === S.view));
  if (S.view === 'new') { content.innerHTML = newPage() + (S.toast ? toastHtml() : ''); return; }
  const scrollTop = content.querySelector('.cscroll')?.scrollTop ?? 0;
  if (S.detail) {
    content.innerHTML = detailPage() + (S.toast ? toastHtml() : '');
    content.querySelector('.cscroll').scrollTop = scrollTop;
    return;
  }
  content.innerHTML = `
    <div class="ctop"></div>
    <div class="cscroll"><div class="dbody">
      <h1 class="ptitle">自定义</h1>
      <div class="bar">
        <div class="tabs">
          <button class="tab ${S.tab === 'skills' ? 'on' : ''}" data-tab="skills">技能</button>
          <button class="tab ${S.tab === 'connectors' ? 'on' : ''}" data-tab="connectors">连接器</button>
        </div>
        <div class="vsep"></div>
        <div class="seg">
          <button class="${S.scope === 'mine' ? 'on' : ''}" data-scope="mine">我的</button>
          <button class="${S.scope === 'discover' ? 'on' : ''}" data-scope="discover">发现</button>
        </div>
        <div class="grow"></div>
        <button class="btn solid addbtn" data-act="add-menu">${ic('plus')}添加${ic('chevD', 'chev')}</button>
      </div>
      ${S.tab === 'skills' ? (S.scope === 'mine' ? mySkills() : discoverSkills()) : (S.scope === 'mine' ? myConnectors() : discoverConnectors())}
    </div></div>
    ${S.toast ? toastHtml() : ''}`;
  const body = content.querySelector('.cscroll');
  body.scrollTop = scrollTop;
  const bar = content.querySelector('.bar');
  const stick = () => bar.classList.toggle('stuck', body.scrollTop > 8);
  body.addEventListener('scroll', stick);
  stick();
}

function section(title, n, inner, extra = '', hint = '') {
  return `<section class="sect"><div class="fhead">${title}${n != null ? `<span class="n">${n}</span>` : ''}${hint ? `<span class="hint">· ${hint}</span>` : ''}</div>${extra}${inner}</section>`;
}
const rows = (items, f) => `<div class="rows">${items.map(f).join('')}</div>`;
const grid = (cards) => `<div class="grid">${cards}</div>`;
const moreBtn = (id) => `<button class="more ${S.menu?.for === id ? 'open' : ''}" data-act="card-menu" data-id="${id}" title="更多" aria-label="更多">${ic('more')}</button>`;

function mySkills() {
  const user = S.skills.filter((s) => s.layer === 'user');
  const proj = S.skills.filter((s) => s.layer === 'project');
  const sys = S.skills.filter((s) => s.layer === 'system');
  const issues = S.skillIssues.length
    ? `<div class="anote">${ic('warn')}<span>${S.skillIssues.length} 个技能没有加载：<code>${esc(S.skillIssues[0].path)}</code> ${esc(S.skillIssues[0].why)}</span><button class="link" data-act="issue">查看</button></div>` : '';
  let out = section('个人', user.length, user.length ? rows(user, skillRow)
    : `<div class="empty">${ic('skill')}<b>还没有自己的技能</b><span>上传一个，或者让 finx 在对话里帮你写。</span><div class="acts"><button class="btn" data-act="upload-skill">${ic('upload')}上传技能</button><button class="btn" data-act="create-skill">${ic('chat')}在对话中创建</button></div></div>`, issues);
  if (proj.length) out += section(`随仓库共享 · ${PROJECT}`, proj.length, rows(proj, skillRow), '', '仓库里的技能，这里只能停用');
  if (sys.length) out += section('内置', sys.length, rows(sys, skillRow), '', '随 finx 一起更新');
  return out;
}
function skillRow(s) {
  return `<div class="row ${s.on ? '' : 'off'}" role="button" tabindex="0" data-open="skill:${s.id}">
    ${skillTile(s)}
    <div class="rt">
      <div class="rn"><span class="nm">${esc(s.name)}</span>${s.from ? `<span class="badge">与 ${s.from} 共用</span>` : ''}</div>
      <div class="rd">${esc(s.desc)}</div>
    </div>
    <div class="ra">${s.on ? '' : '<span class="st">已停用</span>'}<button class="sw ${s.on ? 'on' : ''}" data-act="toggle-skill" data-id="${s.id}" title="${s.on ? '停用' : '启用'}"></button>${moreBtn('skill:' + s.id)}</div>
  </div>`;
}

function discoverSkills() {
  return section('精选技能', S.skillCatalog.length, grid(S.skillCatalog.map((s) => catalogCard('skill', s, skillTile(s), !!mineSkill(s.id))).join('')));
}
function catalogCard(kind, item, tile, added) {
  const b = S.busy[item.id];
  let act;
  if (added) act = `<span class="inst done" title="已添加">${ic('check')}</span>`;
  else if (b === 'oauth') act = `<span class="inst-wait"><span class="mini-spin"></span>等待授权…</span>`;
  else if (b) act = `<span class="inst busy"><span class="mini-spin"></span></span>`;
  else act = `<button class="inst" data-act="install-${kind}" data-id="${item.id}" title="添加" aria-label="添加 ${esc(item.name)}">${ic('plus')}</button>`;
  return `<div class="card" role="button" tabindex="0" data-open="${kind}-cat:${item.id}">
    ${tile}
    <div class="ct"><span class="nm">${esc(item.name)}</span>${added ? '<span class="badge">已添加</span>' : ''}</div>
    <div class="ca">${act}</div>
    <div class="cd">${esc(item.desc)}</div>
    <div class="cm">${esc(item.by)}</div>
  </div>`;
}

function myConnectors() {
  if (!S.connectors.length) return `<section class="sect"><div class="empty">${ic('plug')}<b>还没有连接器</b><span>连接器是一个 MCP 服务器：一条本地命令，或者一个远程地址。</span><div class="acts"><button class="btn" data-scope="discover">看看推荐的</button><button class="btn" data-act="custom-connector">${ic('plus')}添加自定义连接器</button></div></div></section>`;
  const by = (layer) => S.connectors.filter((c) => c.layer === layer);
  let out = '';
  if (by('user').length) out += section('所有项目', by('user').length, rows(by('user'), connRow));
  if (by('user_project').length) out += section(`仅 ${PROJECT}`, by('user_project').length, rows(by('user_project'), connRow), '', '只对你');
  if (by('project').length) out += section(`随仓库共享 · ${PROJECT}`, by('project').length, rows(by('project'), connRow), '', '仓库里的配置，这里只读');
  return out;
}

}
function discoverConnectors() {

/* ---------- menus ---------- */
let menuEl = null;
function closeMenu() { menuEl?.remove(); menuEl = null; if (S.menu) { S.menu = null; render(); } }
function openMenu(anchor, html, forId, alignRight = true) {
  menuEl?.remove();
  S.menu = { for: forId };
  render();
  const a = (forId ? document.querySelector(`[data-act="card-menu"][data-id="${forId}"]`) : document.querySelector('[data-act="add-menu"]')) || anchor;
  const r = a.getBoundingClientRect();
  menuEl = document.createElement('div');
  menuEl.className = 'vmenu';
  menuEl.innerHTML = html;
  document.body.appendChild(menuEl);
  const w = menuEl.offsetWidth;
  menuEl.style.top = r.bottom + 6 + 'px';
  menuEl.style.left = (alignRight ? r.right - w : r.left) + 'px';
}
function addMenu(btn) {
  openMenu(btn, `
    <div class="mh">技能</div>
    <button class="mi two" data-act="upload-skill">${ic('upload')}<span><b>上传技能…</b><small>文件夹、.zip 或单个 SKILL.md，只给你自己用</small></span></button>
    <button class="mi two" data-act="create-skill">${ic('chat')}<span><b>在对话中创建</b><small>说说你要什么，finx 帮你写成技能</small></span></button>

}
function cardMenu(btn, id) {
  const [kind, key] = id.split(':');
  const view = S.detail ? '' : `<button class="mi" data-act="open" data-id="${id}">${ic('info')}查看详情</button>`;
  let html;
  if (kind === 'skill') {
    const s = mineSkill(key);
    html = `${view}
      <button class="mi" data-act="try-skill" data-id="${key}">${ic('chat')}在对话中使用</button>
      <button class="mi" data-act="reveal" data-path="${esc(s.path)}">${ic('folder')}在访达中显示</button>
      ${removable(s) ? `<div class="msep"></div><button class="mi danger" data-act="remove-skill" data-id="${key}">${ic('trash')}删除</button>` : ''}`;
  } else {
    const c = mineConn(key);
    const login = c.auth !== 'oauth' ? '' : c.authState === 'logged_in'
      ? `<button class="mi" data-act="logout" data-id="${key}">${ic('ext')}退出登录</button>`
      : `<button class="mi" data-act="login" data-id="${key}">${ic('ext')}登录…</button>`;
    html = `${view}
      ${editable(c) && !S.detail ? `<button class="mi" data-act="edit-conn" data-id="${key}">${ic('edit')}编辑配置…</button>` : ''}
      ${login}

// What config/write would answer with config_validation_error: the key path's field gets the message.
function fieldError(id, msg) {
  const el = sheetEl.querySelector(`#${id}-err`);
  el.textContent = msg;
  sheetEl.querySelector(`#${id}`).classList.toggle('bad', !!msg);
}
function saveConnector(editId) {
  ['cf-name', 'cf-cmd', 'cf-url'].forEach((f) => fieldError(f, ''));
  const name = editId || sheetEl.querySelector('#cf-name').value.trim();
  const http = sheetEl.querySelector('#cf-kind .on').dataset.v === 'http';
  const where = sheetEl.querySelector(http ? '#cf-url' : '#cf-cmd').value.trim();
  const layer = sheetEl.querySelector('#cf-scope .on').dataset.v;
  const box = sheetEl.querySelector(http ? '#cf-headers' : '#cf-env');
  const secret = [...box.querySelectorAll('.kv')].some((r) => r.querySelector('.lockbtn.on') && (r.querySelectorAll('input')[1].value || r.querySelectorAll('input')[1].classList.contains('saved')));
  let bad = false;
  if (!editId) {
    const dup = mineConn(name);
    if (!name) { fieldError('cf-name', '要填一个名字'); bad = true; }
    else if (!/^[A-Za-z0-9_-]{1,32}$/.test(name)) { fieldError('cf-name', '只能用字母、数字、- 和 _，最长 32 个字符'); bad = true; }
    else if (dup) { fieldError('cf-name', `已经有一个叫 ${name} 的连接器（写在 ${FILES[dup.layer]}）`); bad = true; }
  }
  if (!where) { fieldError(http ? 'cf-url' : 'cf-cmd', http ? '要填服务器的地址' : '要填启动它的命令'); bad = true; }
  else if (http && !/^https?:\/\//.test(where)) { fieldError('cf-url', '地址要以 http:// 或 https:// 开头'); bad = true; }
  if (bad) return;
  closeSheet();
  let c = editId && mineConn(editId);
  if (c) Object.assign(c, { where, layer, kind: http ? 'http' : 'stdio', fixed: true });
  else {
    c = { id: name, name, mono: name.slice(0, 2).toUpperCase(), layer, kind: http ? 'http' : 'stdio', where, custom: true, on: true,
      auth: secret ? 'credential' : 'none', detectOAuth: http && !secret, status: { state: 'unknown' } };
    S.connectors.push(c);
  }
  S.tab = 'connectors'; S.scope = 'mine'; S.detail = null;
  check(c);
  toast(editId ? `已保存 ${esc(name)}，正在检测` : `已添加 ${esc(name)}，写进了 ${FILES[layer]}`, { action: applyAction() });
}

  const html = stage === 'drop'
    ? `<h3>上传技能</h3><p class="sub">技能是一个含 SKILL.md 的文件夹。finx 先检查它的头部，再复制到 <span class="mono">~/.finx/skills</span>。</p>
       <div class="drop" id="drop">${ic('upload')}<b>把技能拖到这里</b><small>文件夹、.zip、.skill 或单个 SKILL.md</small>
         <button class="btn" data-act="pick-file" style="margin-top:6px">选择文件…</button></div>
       <div class="sheet-foot"><button class="btn" data-act="close">取消</button></div>`
    : `<h3>上传技能</h3><p class="sub">读到了一个技能，确认一下：</p>
       <div class="parsed">${skillTile({})}<div style="flex:1;min-width:0"><b class="mono">csv-cleaner</b>
         <p>清理和规范化 CSV：统一编码和分隔符、修正日期格式、去掉重复行。处理杂乱的表格数据时使用。</p></div><span class="badge ok">${ic('check')}格式正确</span></div>
       <div class="dlabel">将复制到</div>
       <div class="target">${ic('person')}个人 · <span class="mono">~/.finx/skills/csv-cleaner</span></div>
       ${exists ? `<div class="callout warn" style="margin-top:10px">${ic('warn')}<span>已经有一个同名的技能。替换会先把旧的移到废纸篓。</span></div>` : ''}
       <div class="sheet-foot"><div class="left"><button class="link" data-act="upload-skill">换一个</button></div><button class="btn" data-act="close">取消</button><button class="btn primary" data-act="upload-confirm">${exists ? '替换' : '添加'}</button></div>`;
  openSheet(html, 520);
  const drop = sheetEl.querySelector('#drop');
  if (drop) {
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => { e.preventDefault(); uploadSheet('parsed'); });
  }
}

/* ---------- actions: each stands for one call of the design's methods ---------- */
let toastTimer;
function toast(text, opts = {}) {
  S.toast = { text, ...opts };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; render(); }, opts.undo || opts.action ? 6000 : 2800);
  render();
}
const applyAction = () => (OPEN_SESSIONS ? { label: '让打开的会话也用上', act: 'apply-sessions' } : null);
// mcp/check: connect once, list tools, write the cache.
function check(c, ms = 1100) {
  c.status = { ...c.status, state: 'checking' }; render();
  setTimeout(() => {
    if (c.id === 'postgres-dev' && !c.fixed) c.status = { state: 'failed', ago: '刚刚', error: 'connection refused: localhost:5432\n进程退出，代码 1' };
    else if ((c.auth === 'oauth' || c.detectOAuth) && c.authState !== 'logged_in') { c.auth = 'oauth'; c.status = { state: 'needs_login' }; }
    else c.status = { state: 'ok', source: 'cache', ago: '刚刚', tools: c.status.tools || TOOL_COUNT[c.id] || 7 };
    render();
  }, ms);
}
// mcp/login: the kernel returns a URL, the app opens the browser, the kernel takes the callback.
function login(c) {
  c.status = { state: 'authorizing' }; render();
  setTimeout(() => { c.authState = 'logged_in'; toast(`已登录 ${esc(c.name)}，令牌存进了钥匙串`); check(c, 700); }, 1800);
}
// skills/install with the bundled files of a catalog entry.
function installSkill(id) {
  const c = catSkill(id);
  S.busy[id] = 'install'; render();
  setTimeout(() => {
    delete S.busy[id];
    addPersonal({ ...c, layer: 'user', source: 'catalog', on: true, path: `~/.finx/skills/${id}` });
    toast(`已添加 ${c.name}，新会话起可用`);
  }, 900);
}
// credentials/set (for a token), then config/write, then mcp/check.
function installConnector(id, fromPage) {
  const cat = catConn(id);
  if (!fromPage && cat.auth === 'token') { openCard('connector-cat:' + id); content.querySelector('#token')?.focus(); return; }
  if (cat.auth === 'token') {
    const f = content.querySelector('#token');
    if (!f.value.trim()) { f.classList.add('bad'); f.focus(); return; }
  }
  const layer = (fromPage && S.picks.scope) || 'user';
  S.busy[id] = cat.auth === 'oauth' ? 'oauth' : 'install'; render();
  setTimeout(() => {
    delete S.busy[id];
    S.connectors.push({ id, name: cat.name, mono: cat.mono, icon: cat.icon, by: cat.by, desc: cat.desc, layer, kind: cat.url ? 'http' : 'stdio', where: cat.url || cat.command,
      auth: cat.auth === 'token' ? 'credential' : cat.auth, authState: cat.auth === 'oauth' ? 'logged_in' : undefined, on: true,
      status: { state: 'ok', source: 'cache', ago: '刚刚', tools: TOOL_COUNT[id] || 7 } });
    toast(`已添加 ${cat.name} · ${TOOL_COUNT[id] || 7} 个工具，新会话起可用`, { action: applyAction() });
  }, cat.auth === 'oauth' ? 2200 : 1100);
}
let lastRemoved = null;

function onAct(el, e) {
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'add-menu': e.stopPropagation(); S.menu ? closeMenu() : addMenu(el); return;
    case 'card-menu': e.stopPropagation(); S.menu?.for === id ? closeMenu() : cardMenu(el, id); return;
    case 'toggle-skill': {
      // skills/set_enabled: always the user's config, path form (DD-34).
      e.stopPropagation(); const s = mineSkill(id); s.on = !s.on;
      toast(s.on ? `已启用 ${s.name}，新会话起生效` : s.layer === 'project' ? `已停用 ${s.name}：写在你的个人配置里，不改仓库` : `已停用 ${s.name}，新会话起生效`);
      return;
    }
    case 'toggle-conn': {
      // config/write: mcp_servers.<name>.enabled, in the file that defines it, or the personal project layer for the repo's (DD-33).
      e.stopPropagation(); const c = mineConn(id); c.on = !c.on;
      if (c.on && c.status.state !== 'ok') check(c, 900);
      if (c.layer === 'project') toast(c.on ? `已对你重新打开 ${c.name}` : `已对你关闭 ${c.name}：写在你的个人项目配置里，不影响队友`, { action: applyAction() });
      else toast(c.on ? `已启用 ${c.name}，新会话起可用` : `已停用 ${c.name}，新会话起生效`, { action: applyAction() });
      return;
    }
    case 'install-skill': e.stopPropagation(); installSkill(id); return;
    case 'install-connector': e.stopPropagation(); installConnector(id, el.dataset.detail); return;
    case 'check': { e.stopPropagation(); closeMenu(); const c = mineConn(id); if (c.id === 'postgres-dev') { c.fixed = c.retried; c.retried = true; } check(c); return; }
    case 'login': e.stopPropagation(); closeMenu(); login(mineConn(id)); return;
    case 'logout': { closeMenu(); const c = mineConn(id); c.authState = 'needs_login'; c.status = { state: 'needs_login' }; toast(`已退出 ${esc(c.name)} 的登录，令牌已从钥匙串删除`); return; }
    case 'apply-sessions': toast(`已推送到 ${OPEN_SESSIONS} 个打开的会话，各自在下一次模型请求前生效`); return;
    case 'back': S.detail = null; S.picks = {}; render(); return;
    case 'open': closeMenu(); openCard(id); return;
    case 'upload-skill': closeMenu(); uploadSheet(); return;
    case 'pick-file': uploadSheet('parsed'); return;
    case 'upload-confirm': {
      closeSheet();
      const old = mineSkill('csv-cleaner');
      if (!old) addPersonal({ id: 'csv-cleaner', name: 'csv-cleaner', layer: 'user', source: 'upload', on: true, path: '~/.finx/skills/csv-cleaner',
        desc: '清理和规范化 CSV：统一编码和分隔符、修正日期格式、去掉重复行。处理杂乱的表格数据时使用。', files: [['SKILL.md', '1.7 KB'], ['scripts/clean.py', '4.0 KB']] });
      S.tab = 'skills'; S.scope = 'mine'; S.detail = null;
      toast(old ? '已替换 csv-cleaner，旧的在废纸篓里' : '已添加 csv-cleaner，新会话起可用'); return;
    }
    case 'create-skill': closeMenu(); closeSheet(); S.view = 'new'; S.newMode = 'create'; S.detail = null; render(); return;
    case 'try-skill': closeMenu(); closeSheet(); S.view = 'new'; S.newMode = 'use'; S.newSkill = id; render(); return;
    case 'send-create': {
      // The model writes ~/.finx/skills/weekly-report after an approval; the kernel's watcher sends skills/changed.
      addPersonal({ id: 'weekly-report', name: 'weekly-report', layer: 'user', source: 'chat', on: true, path: '~/.finx/skills/weekly-report',
        desc: '按固定格式整理一周的工作记录：完成了什么、遇到什么问题、下周计划。', files: [['SKILL.md', '1.8 KB']] });
      S.view = 'custom'; S.tab = 'skills'; S.scope = 'mine';
      toast('weekly-report 写进了 ~/.finx/skills，列表自动更新了'); return;
    }
    case 'custom-connector': closeMenu(); customConnectorSheet(); return;
    case 'edit-conn': closeMenu(); customConnectorSheet(id); return;
    case 'save-connector': saveConnector(id); return;
    case 'add-row': { const box = sheetEl.querySelector('#' + el.dataset.to); box.insertAdjacentHTML('beforeend', kvRow()); return; }
    case 'drop-row': { const row = el.closest('.kv'); if (row.parentElement.children.length > 1) row.remove(); else row.querySelectorAll('input').forEach((i) => (i.value = '')); return; }
    case 'lock': {
      el.classList.toggle('on');
      const on = el.classList.contains('on');
      el.innerHTML = ic(on ? 'lock' : 'unlock');
      el.title = on ? '存进钥匙串' : '写进配置文件';
      el.closest('.kv').querySelectorAll('input')[1].type = on ? 'password' : 'text';
      return;
    }
    case 'paste-json': {
      // A pasted mcpServers snippet becomes form fields; its token goes to a locked row, never the file.
      sheetEl.querySelector('#cf-name').value = 'internal-wiki';
      sheetEl.querySelector('#cf-kind [data-v="http"]').click();
      sheetEl.querySelector('#cf-url').value = 'https://wiki.internal.example/mcp';
      sheetEl.querySelector('#cf-headers').innerHTML = kvRow('Authorization', 'Bearer wk_9f2c41d8', true);
      return;
    }
    case 'remove-skill': case 'remove-conn': {
      // Delayed commit: the call (skills/remove, or config/write with null) goes out only when the toast ends.
      closeMenu(); closeSheet();
      const list = act === 'remove-skill' ? S.skills : S.connectors;
      const i = list.findIndex((x) => x.id === id);
      lastRemoved = { list, i, item: list[i] };
      list.splice(i, 1);
      if (S.detail?.id === id) S.detail = null;
      toast(act === 'remove-skill' ? `已删除 ${lastRemoved.item.name}，移到了废纸篓` : `已删除 ${lastRemoved.item.name}，它的令牌一并删除`, { undo: true }); return;
    }
    case 'undo': if (lastRemoved) { lastRemoved.list.splice(lastRemoved.i, 0, lastRemoved.item); lastRemoved = null; } S.toast = null; render(); return;
    case 'reveal': closeMenu(); toast(`（Demo）会在访达中显示 ${esc(el.dataset.path || '')}`, { icon: 'info' }); return;
    case 'issue': openSheet(`<h3>1 个技能没有加载</h3><p class="sub">finx 跳过了它，其他技能不受影响。改好之后，列表会自动更新。</p>
        <div class="fgroup"><div class="frow">${ic('file')}<span class="fv mono" style="font-size:12px">${esc(S.skillIssues[0].path)}</span></div>
        <div class="frow"><span class="fl">原因</span><span class="fv">头部缺少 description，模型不知道什么时候该用它</span></div></div>
        <div class="sheet-foot"><button class="btn" data-act="close">关闭</button><button class="btn primary" data-act="reveal" data-path="${esc(S.skillIssues[0].path)}">${ic('edit')}打开 SKILL.md</button></div>`, 520); return;
    case 'close': closeSheet(); return;
  }
}
function openCard(key) {
  const [kind, id] = key.split(':');
  closeMenu();
  S.detail = { kind: kind.startsWith('skill') ? 'skill' : 'conn', id, tab: 'overview' };
  S.picks = {};
  content.querySelector('.cscroll')?.scrollTo(0, 0);
  render();
}

function wire(root) {
  root.addEventListener('click', (e) => {
    const pick = e.target.closest('[data-pick] button');
    if (pick) {
      pick.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === pick));
      S.picks[pick.parentElement.dataset.pick] = pick.dataset.v;
      if (root === content && S.detail) render();
      return;
    }
    const a = e.target.closest('[data-act]');
    if (a) return onAct(a, e);
  });
}
wire(content);
document.addEventListener('click', (e) => {
  if (menuEl && menuEl.contains(e.target)) { const a = e.target.closest('[data-act]'); if (a) onAct(a, e); return; }
  if (menuEl && !e.target.closest('[data-act="add-menu"],[data-act="card-menu"]')) closeMenu();
  if (e.target.closest('#content')) {
    const t = e.target.closest('[data-tab]'); if (t) { S.tab = t.dataset.tab; render(); return; }
    const sc = e.target.closest('[data-scope]'); if (sc) { S.scope = sc.dataset.scope; render(); return; }
    const dt = e.target.closest('[data-dtab]'); if (dt) { S.detail.tab = dt.dataset.dtab; render(); return; }
    const card = e.target.closest('[data-open]');
    if (card && !e.target.closest('[data-act]')) openCard(card.dataset.open);
  }
  const nav = e.target.closest('[data-nav]');
  if (nav) { S.view = nav.dataset.nav; S.detail = null; render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!menuEl && !sheetEl && S.detail) { S.detail = null; render(); } closeMenu(); closeSheet(); }
  if (e.key === 'Enter' && e.target.matches('[data-open]')) openCard(e.target.dataset.open);
});
document.getElementById('theme').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#theme button').forEach((x) => x.classList.toggle('on', x === b));
  document.documentElement.dataset.theme = b.dataset.t;
});
if (matchMedia('(prefers-color-scheme: dark)').matches) document.querySelector('#theme [data-t="dark"]').click();
render();
</script>
